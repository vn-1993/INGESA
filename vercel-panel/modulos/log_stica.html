  const saveNotes = async () => { setBusy('notes'); try { await setHelpNotes(draftNotes); alert('Notas guardadas.'); } finally { setBusy(''); } };
  const handlePurge = async (order) => {
    const detail = getOrderActionSummary(order);
    const confirmation = `¿Eliminar SOLO esta orden archivada?\n\nModelo: ${detail.model}\nPartida: ${detail.partida}\nColor: ${detail.color}\nDiámetro: Ø ${detail.diameter}\nTallas: ${detail.sizes.join(' · ') || 'Sin talla registrada'}\nPiezas: ${detail.pieces.join(' · ') || 'Sin cantidades registradas'}\nTotal: ${detail.totalPieces} piezas · ${detail.totalPackages} paquetes (${detail.finishedPackages} tejidos)\n\nSe limpia esta orden y se devuelve al inventario el material registrado. No se afectarán otras órdenes aunque compartan O.C.`;
    if (!window.confirm(confirmation)) return;
    setBusy(order.id);
    try { const r = await onPurgeArchived(order); const t = Object.entries(r || {}).map(([id,kg]) => `${id}: ${kg.toFixed(3)} kg`).join(', ') || 'sin material pendiente'; alert(`Orden eliminada. Material devuelto → ${t}`); } catch(e) { alert('Error: ' + e.message); } finally { setBusy(''); }
  };
  const handlePurgeCarga = async (carga) => {
    if (!window.confirm(`¿Eliminar la carga ${carga.code} de Firestore y limpiar el caché local?\n\nEstado actual en memoria: ${carga.status}`)) return;
    setBusyCargaId(carga.id);
    try {
      await db.collection('cargas_tintoreria').doc(carga.id).delete();
      try {
        const raw = localStorage.getItem('ingesa_log_cache_v1');
        if (raw) { const c = JSON.parse(raw); if (c.cargas?.data) { c.cargas.data = c.cargas.data.filter(x => String(x.id) !== String(carga.id)); localStorage.setItem('ingesa_log_cache_v1', JSON.stringify(c)); } }
      } catch (e) {}
      alert(`Carga ${carga.code} eliminada. La pantalla se recargará.`);
      window.location.reload();
    } catch (e) { alert('Error: ' + (e?.message || e)); } finally { setBusyCargaId(''); }
  };
  const handleClearCargasCache = () => {
    if (!window.confirm('¿Vaciar TODO el caché local de cargas?\n\nSe recargará la pantalla y se traerán de nuevo desde Firestore (una sola lectura).')) return;
    try { const raw = localStorage.getItem('ingesa_log_cache_v1'); if (raw) { const c = JSON.parse(raw); delete c.cargas; localStorage.setItem('ingesa_log_cache_v1', JSON.stringify(c)); } window.location.reload(); } catch (e) { alert('Error: ' + (e?.message || e)); }
  };
  const handleClearRecepcionesCache = () => {
    if (!window.confirm('¿Vaciar TODO el caché local de recepciones?\n\nSe recargará la pantalla y se traerán de nuevo desde Firestore (una sola lectura).')) return;
    try { const raw = localStorage.getItem('ingesa_log_cache_v1'); if (raw) { const c = JSON.parse(raw); delete c.recepciones; localStorage.setItem('ingesa_log_cache_v1', JSON.stringify(c)); } window.location.reload(); } catch (e) { alert('Error: ' + (e?.message || e)); }
  };
  const rebuildPartidasIndex = async () => {
    if (busy === 'partidas_index') return;
    if (!uniquePartidas.length) { setIndexMessage('No hay partidas en las órdenes cargadas.'); return; }
    setBusy('partidas_index');
    setIndexMessage(`Preparando ${uniquePartidas.length} partidas…`);
    try {
      const byMonth = new Map();
      uniquePartidas.forEach(partida => { const month = String(partida).split('_')[0] || 'SIN_MES'; if (!byMonth.has(month)) byMonth.set(month, []); byMonth.get(month).push(partida); });
      const monthEntries = [...byMonth.entries()];
      for (let i = 0; i < monthEntries.length; i += 400) {
        const batch = db.batch();
        monthEntries.slice(i, i + 400).forEach(([month, partidas]) => { batch.set(db.collection('partidas_index').doc(month), { partidas: FieldValue.arrayUnion(...partidas), updatedAt: FieldValue.serverTimestamp() }, { merge: true }); });
        await batch.commit();
      }
      setIndexMessage(`✅ Índice actualizado con ${uniquePartidas.length} partidas.`);
    } catch (e) { setIndexMessage(`❌ ${e?.message || e}`); } finally { setBusy(''); }
  };
  const setupScannerSheets = async () => {
    if (busy) return;
    if (!window.confirm('¿Enviar a Apps Script la orden para crear o completar MAQ y las 36 hojas de máquinas? Conserva los registros existentes.')) return;
    setBusy('scanner_sheets');
    setSheetSetupMessage('Enviando solicitud…');
    try {
      await fetch('https://script.google.com/macros/s/AKfycbyk7YD8sl-0yYqSRWGU55aNiGQhj66I7N7nUr_K4tfd1MbvBsKVHFmlWLZ9iVBlFhGeKw/exec', {
        method: 'POST',
        mode: 'no-cors',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({ action: 'syncSetup', payload: { origen: 'LOGISTICA', operador: ingesaUserName(), timestamp: Date.now() } })
      });
      setSheetSetupMessage('✅ Solicitud enviada. Espera unos segundos y revisa el libro; si no aparecen, revisa Ejecuciones de Apps Script.');
    } catch (e) {
      setSheetSetupMessage('❌ No se pudo enviar la solicitud: ' + (e?.message || e));
    } finally { setBusy(''); }
  };
  const migrateLegacySnapshots = async () => {
    if (busy) return;
    if (!DATA?.buildProductionLabel || !DATA?.getModelSnapshot) { setSnapshotMessage('❌ Capa de datos no disponible.'); return; }
    if (!legacyOrdersToMigrate.length) { setSnapshotMessage('No hay órdenes antiguas que requieran snapshot v2.'); return; }
    const confirmText = `Se actualizarán ${legacyOrdersToMigrate.length} órdenes antiguas y hasta ${legacyPackageCount} fichas. ¿Continuar?`;
    if (!window.confirm(confirmText)) return;
    setBusy('legacy_snapshots');
    setSnapshotMessage('Preparando snapshots…');
    setSnapshotProgress({ done: 0, total: legacyOrdersToMigrate.length, labels: 0, errors: 0 });
    const modelCache = new Map(); const imageCache = new Map();
    const writes = []; const labelIds = new Set();
    let missingModel = 0, missingCode = 0, oversized = 0, duplicateLabels = 0, preparationErrors = 0;
    try {
      for (let index = 0; index < legacyOrdersToMigrate.length; index++) {
        const order = legacyOrdersToMigrate[index];
        const code = DATA.cleanCode(order.codigo || order.modelo || '');
        let candidate = order.modelSnapshot || null;
        const hasSnapshotStructure = value => !!(value && ((value.subPiecesData || []).length || (value.tablasEnhebrado || []).length || (value.threading || []).length));
        if (!hasSnapshotStructure(candidate) && !hasSnapshotStructure(order) && code) {
          try { if (!modelCache.has(code)) modelCache.set(code, await DATA.getModelSnapshot(db, code, { forceRemote: true })); candidate = modelCache.get(code) || candidate; }
          catch (error) { preparationErrors++; }
        }
        const model = candidate || {};
        const snapshotInput = { ...model, codigo: code, cliente: model.cliente || order.cliente || 'SIN CLIENTE', threading: model.threading?.length ? model.threading : (order.threading || []), tablasEnhebrado: model.tablasEnhebrado?.length ? model.tablasEnhebrado : (order.tablasEnhebrado || []), subPiecesData: model.subPiecesData?.length ? model.subPiecesData : (order.subPiecesData || []), subPiecesDataInactivas: model.subPiecesDataInactivas?.length ? model.subPiecesDataInactivas : (order.subPiecesDataInactivas || []), imageData: model.imageData || order.modelImageData || order.imageData || null, imageRef: model.imageRef || order.imageRef || null };
        let snapshot = DATA.normalizeModelSnapshot(snapshotInput, code);
        const hasPackageTables = (order.progreso || []).some(pkg => (pkg?.tablaEnhebrado || pkg?.tablaFisica || []).length > 0);
        if (!hasSnapshotStructure(snapshot) && !hasPackageTables) { missingModel++; setSnapshotProgress(previous => ({ ...previous, done: index + 1 })); continue; }
        if (!snapshot.imageData && code) {
          try { if (!imageCache.has(code)) imageCache.set(code, await DATA.getImageData(db, code, { forceRemote: true })); const image = imageCache.get(code); if (image?.data || image?.ref) snapshot = DATA.normalizeModelSnapshot({ ...snapshot, imageData: image.data || null, imageRef: image.ref || snapshot.imageRef }, code); }
          catch (error) { preparationErrors++; }
        }
        if (order.id && (!order.modelSnapshot || Number(order.snapshotVersion || 0) < 2)) writes.push({ kind: 'order', ref: db.collection('orders').doc(String(order.id)), data: { snapshotVersion: 2, modelSnapshot: snapshot, modelImageData: snapshot.imageData || null } });
        (order.progreso || []).forEach((pkg, packageIndex) => {
          const label = DATA.buildProductionLabel({ order, draft: order, pkg, packageIndex, modelSnapshot: snapshot });
          const labelCode = DATA.cleanCode(label.labelCode || pkg?.codigoUnico || pkg?.packageCode || '');
          if (!labelCode) { missingCode++; return; }
          const docId = DATA.labelDocId(labelCode);
          if (!docId) { missingCode++; return; }
          if (labelIds.has(docId)) { duplicateLabels++; return; }
          labelIds.add(docId);
          label.labelCode = labelCode; label.packageCode = labelCode;
          const bytes = new Blob([JSON.stringify(label)]).size;
          if (bytes > 900000) { oversized++; return; }
          writes.push({ kind: 'label', ref: db.collection('production_labels').doc(docId), data: label, bytes });
        });
        setSnapshotProgress(previous => ({ ...previous, done: index + 1 }));
      }
      const maxOps = 250, maxBytes = 4 * 1024 * 1024;
      let chunk = [], chunkBytes = 0, committed = 0, labelsCreated = 0, writeErrors = 0;
      const commitChunk = async () => {
        if (!chunk.length) return;
        const current = chunk; chunk = []; chunkBytes = 0;
        try { const batch = db.batch(); current.forEach(item => batch.set(item.ref, item.data, { merge: true })); await batch.commit(); committed += current.length; labelsCreated += current.filter(item => item.kind === 'label').length; }
        catch (error) { writeErrors += current.length; }
        setSnapshotProgress(previous => ({ ...previous, labels: labelsCreated, errors: writeErrors + preparationErrors }));
      };
      for (const item of writes) {
        const bytes = item.bytes || new Blob([JSON.stringify(item.data)]).size;
        if (chunk.length && (chunk.length >= maxOps || chunkBytes + bytes > maxBytes)) await commitChunk();
        chunk.push(item); chunkBytes += bytes;
      }
      await commitChunk();
      const result = `✅ Migración terminada: ${legacyOrdersToMigrate.length} órdenes evaluadas; ${committed - labelsCreated} órdenes actualizadas; ${labelsCreated} etiquetas creadas/actualizadas.`;

      setSnapshotMessage(result + (warnings.length ? ' Avisos: ' + warnings.join('; ') + '.' : ''));
      setSnapshotProgress({ done: legacyOrdersToMigrate.length, total: legacyOrdersToMigrate.length, labels: labelsCreated, errors: writeErrors + preparationErrors });
    } catch (error) { setSnapshotMessage('❌ Error: ' + (error?.message || error)); } finally { setBusy(''); }
  };

  const dates = [...new Set(partidaGroup.entities.flatMap(entityDeliveryDates))];
  return (
    <div className="bg-slate-900 rounded-xl card-shadow border border-slate-800 h-full flex flex-col overflow-hidden">
      <div className="p-3">
        <div className="flex items-center justify-between gap-2">
          <button onClick={onToggle} className="flex items-center gap-3 flex-1 text-left min-w-0">
            <div className="w-12 h-12 rounded-lg flex flex-col items-center justify-center shrink-0 bg-purple-950/60 border border-purple-700"><span className="text-[8px] font-bold text-purple-300">PARTIDA</span><Icon name="layers" size={18} className="text-purple-400"/></div>
            <div className="min-w-0"><div className="text-lg font-black text-slate-100 truncate">{partidaGroup.id}</div><div className="text-xs font-bold text-slate-400">{partidaGroup.entities.length} tarjeta(s) · {finishedPkgs}/{totalPkgs} paquetes tejidos</div><div className="text-[10px] text-amber-300 font-bold mt-0.5">Entrega: {dates.join(' / ') || 'Sin fecha registrada'}</div></div>
          </button>
          <button onClick={onToggle} className="p-2 shrink-0"><Icon name={expanded ? 'chevron-up' : 'chevron-down'} size={20} className="text-slate-400"/></button>
        </div>
        <div className="w-full bg-slate-950 h-2.5 rounded-full overflow-hidden border border-slate-800 mt-3"><div className="h-full bg-purple-500 transition-all duration-500" style={{ width: `${pct}%` }}/></div>
      </div>
      {expanded && <div className="border-t border-slate-800 p-3 bg-slate-950/40 flex-1 overflow-y-auto"><div className="space-y-2">{partidaGroup.entities.map(entity => <div key={entity.id} className="bg-slate-900 rounded-lg border border-slate-800 hover:border-slate-600 overflow-hidden"><div className="w-full p-2.5 flex items-center gap-3 cursor-pointer hover:bg-slate-800/50" onClick={() => actions.onViewDetails(entity)}><div className="bg-slate-950 border border-slate-800 rounded-lg w-10 h-10 flex flex-col items-center justify-center shrink-0"><span className="text-[7px] text-slate-500 font-bold">MQ</span><span className="text-sm font-black text-yellow-400 leading-none">Ø {entityDiameterGroupKey(entity)}</span></div>{renderEntityContent(entity)}</div></div>)}</div></div>}
    </div>
  );
};

const PlantaScreen = ({ orders, actions, viewConfig = {}, viewConfigLoaded = false }) => {
  const [expandedMachine, setExpandedMachine] = useState(null);
  const [expandedPartida, setExpandedPartida] = useState(null);
  const [expandedModel, setExpandedModel] = useState(null);
  const [query, setQuery] = useState('');
  const [columns, setColumns] = useState(1);
  const [machineOrder, setMachineOrder] = useState([]);
  const [draggedItem, setDraggedItem] = useState(null);
  const [statusTab, setStatusTab] = useState('pendientes');
  const [groupMode, setGroupMode] = useState('partida');

  useEffect(() => {
    if (!viewConfigLoaded) return;
    if (viewConfig.columns) setColumns(viewConfig.columns);
    if (Array.isArray(viewConfig.machineOrder)) setMachineOrder(viewConfig.machineOrder);
    if (viewConfig.statusTab) setStatusTab(viewConfig.statusTab);
    if (Number(viewConfig.groupModeVersion) >= 2 && viewConfig.groupMode) setGroupMode(viewConfig.groupMode === 'oc' ? 'partida' : viewConfig.groupMode);
    else setGroupMode('partida');
  }, [viewConfig, viewConfigLoaded]);

  const kitsCache = useKitsCache();
  const allEntities = useMemo(() => buildLogisticsEntities(orders, kitsCache), [orders, kitsCache]);
  const pendingEntities = useMemo(() => allEntities.filter(e => { const p = entityProgress(e); return p.total === 0 || p.done < p.total; }), [allEntities]);
  const finishedEntities = useMemo(() => allEntities.filter(e => { const p = entityProgress(e); return p.total > 0 && p.done === p.total; }), [allEntities]);
  const baseEntities = statusTab === 'terminadas' ? finishedEntities : statusTab === 'todas' ? allEntities : pendingEntities;

  const filteredEntities = useMemo(() => {
    if (!query) return baseEntities;
    const q = query.toUpperCase();
    return baseEntities.filter(e => {
      const rep = e.representative || e.orders[0];
      const packageText = entityPackages(e).flatMap(p => [p.codigoUnico, p.codigo, p.shortCode, p.baseCodigo]).filter(Boolean).join(' ').toUpperCase();
      const piecesText = (e.orders || []).flatMap(o => (o.subPiecesData || []).map(p => p.pieza)).join(' ');
      const haystack = [entityPartida(e), entityModel(e), entityClient(e), rep.maquina, entityDiameters(e).join(' '), entityOrdenCompra(e), rep.nombreModeloCliente, piecesText].filter(Boolean).join(' ').toUpperCase();
      return haystack.includes(q) || packageText.includes(q);
    });
  }, [baseEntities, query]);

  const machineGroups = useMemo(() => { const g = {}; filteredEntities.forEach(e => { const d = entityDiameterGroupKey(e); if (!g[d]) g[d] = []; g[d].push(e); }); return Object.keys(g).sort((a,b) => { const na = parseInt(a), nb = parseInt(b); if (!isNaN(na) && !isNaN(nb)) return na - nb; return a.localeCompare(b); }).map(k => ({ id:k, entities:g[k] })); }, [filteredEntities]);
  const partidaGroups = useMemo(() => {
    const g = {};
    filteredEntities.forEach(e => {
      const k = entityPartida(e) || 'SIN PARTIDA';
      if (!g[k]) g[k] = { id:k, entities:[] };
      g[k].entities.push(e);
    });
    return Object.values(g).sort((a,b) => getPartidaDateValue(a.id) - getPartidaDateValue(b.id) || a.id.localeCompare(b.id));
  }, [filteredEntities]);
  const modelGroups = useMemo(() => {
    const g = {};
    filteredEntities.forEach(e => { const k = entityModel(e) || 'S/M'; if (!g[k]) g[k] = { id:k, modelName:k, entities:[] }; g[k].entities.push(e); });
    return Object.values(g).map(m => { m.entities.sort((a,b) => getPartidaDateValue(entityPartida(a)) - getPartidaDateValue(entityPartida(b))); return m; }).sort((a,b) => a.modelName.localeCompare(b.modelName));
  }, [filteredEntities]);

  const summary = useMemo(() => { let p = 0; pendingEntities.forEach(e => { p += entityProgress(e).total - entityProgress(e).done; }); const m = new Set(); const partidas = new Set(); pendingEntities.forEach(e => { m.add(entityDiameterGroupKey(e)); partidas.add(entityPartida(e) || 'SIN PARTIDA'); }); return { maquinas: m.size, pendientes: p, partidas: partidas.size }; }, [pendingEntities]);

  const orderedGroups = useMemo(() => {
    if (groupMode === 'partida') return partidaGroups;
    if (groupMode === 'modelo') return modelGroups;
    const g = [...machineGroups];
    if (machineOrder.length > 0) g.sort((a,b) => { const ia = machineOrder.indexOf(a.id); const ib = machineOrder.indexOf(b.id); if (ia !== -1 && ib !== -1) return ia - ib; if (ia !== -1) return -1; if (ib !== -1) return 1; return 0; });
    return g;
  }, [machineGroups, partidaGroups, modelGroups, machineOrder, groupMode]);

  const visibleGroups = useMemo(() => {
    if (groupMode === 'maquina') return expandedMachine ? orderedGroups.filter(g => g.id === expandedMachine) : orderedGroups;
    if (groupMode === 'partida') return expandedPartida ? orderedGroups.filter(g => g.id === expandedPartida) : orderedGroups;
    return expandedModel ? orderedGroups.filter(g => g.id === expandedModel) : orderedGroups;
  }, [groupMode, orderedGroups, expandedMachine, expandedPartida, expandedModel]);

  let gridClass = 'grid-cols-1';
  if (columns === 2) gridClass = 'grid-cols-1 md:grid-cols-2';
  if (columns === 3) gridClass = 'grid-cols-1 md:grid-cols-2 lg:grid-cols-3';

  const handleDragStart = (e, id) => { if (groupMode !== 'maquina') return; setDraggedItem(id); e.dataTransfer.effectAllowed = 'move'; e.dataTransfer.setData('text/plain', id); };
  const handleDragOver = (e) => { e.preventDefault(); e.dataTransfer.dropEffect = 'move'; };
  const handleDrop = (e, targetId) => {
    e.preventDefault();
    if (groupMode !== 'maquina') return;
    if (!draggedItem || draggedItem === targetId) return;
    const newOrder = orderedGroups.map(g => g.id);
    const di = newOrder.indexOf(draggedItem); const ti = newOrder.indexOf(targetId);
    newOrder.splice(di, 1); newOrder.splice(ti, 0, draggedItem);
    db.collection('settings').doc('planta_view').set({ machineOrder: newOrder }, { merge: true });
    setDraggedItem(null);
  };
  const updateColumns = (c) => db.collection('settings').doc('planta_view').set({ columns: c }, { merge: true });
  const updateGroupMode = (m) => { setGroupMode(m); db.collection('settings').doc('planta_view').set({ groupMode: m, groupModeVersion: 2 }, { merge: true }); setExpandedMachine(null); setExpandedPartida(null); setExpandedModel(null); };
  const updateStatusTab = (t) => { setStatusTab(t); db.collection('settings').doc('planta_view').set({ statusTab: t }, { merge: true }); setExpandedMachine(null); setExpandedPartida(null); setExpandedModel(null); };

  const generateGlobalPDF = () => {
    const doc = new window.jspdf.jsPDF('landscape');
    doc.setFontSize(14); doc.text("Reporte Global de Producción (Pendiente)", 14, 15);
    doc.setFontSize(10); doc.text(`Fecha: ${new Date().toLocaleString('es-MX')}`, 14, 22);
    const tableData = [];
    const byModel = {};
    pendingEntities.forEach(e => { const m = entityModel(e) || 'S/M'; if (!byModel[m]) byModel[m] = []; byModel[m].push(e); });
    Object.keys(byModel).sort().forEach(m => { byModel[m].sort((a,b) => getPartidaDateValue(entityPartida(a)) - getPartidaDateValue(entityPartida(b))).forEach(e => {
      const p = entityProgress(e);
      const tipo = e.type === 'kit' ? 'KIT' : 'IND';
      const avance = `${p.done}/${p.total} (${p.pct}%)${p.partial ? ` · ${p.partial} parcial${p.partial === 1 ? '' : 'es'} · ${p.partialQty} pzs` : ''}`;
      tableData.push([m, entityPartida(e), entityClient(e), entityDiameterGroupKey(e), avance, entityDeliveryDates(e).join(' / ') || '-', entityOrdenCompra(e) || '-', tipo]);
    }); });
      doc.autoTable({ startY: 28, head: [['Modelo','Partida','Cliente','Diámetro','Avance','Entrega','OC','Tipo']], body: tableData, theme: 'grid', headStyles: { fillColor: [30,41,59] } });
    doc.save(`Produccion_${new Date().toISOString().split('T')[0]}.pdf`);
  };

  return (
    <div className="p-4 pb-4">
      <div className="bg-slate-900 text-white rounded-xl p-3 mb-4 flex flex-col md:flex-row justify-between items-center border border-slate-800 card-shadow gap-3">
        <div className="flex justify-around text-center w-full md:w-auto md:gap-8">
          <div><div className="text-2xl font-black text-blue-400">{summary.pendientes}</div><div className="text-[10px] text-slate-400 font-bold">PAQUETES PENDIENTES</div></div>
          <div><div className="text-2xl font-black">{summary.maquinas}</div><div className="text-[10px] text-slate-400 font-bold">DIÁMETROS</div></div>
          <div className="hidden sm:block"><div className="text-2xl font-black">{summary.partidas}</div><div className="text-[10px] text-slate-400 font-bold">PARTIDAS</div></div>
        </div>
        <div className="flex flex-col gap-2 w-full md:w-auto">
          <div className="flex items-center gap-2 overflow-x-auto hide-scrollbar">
            <span className="text-[10px] font-black uppercase tracking-wider text-slate-500 shrink-0">Estado</span>
            <div className="flex bg-slate-950 p-1 rounded-lg border border-slate-800 items-center shrink-0">
              <button onClick={() => updateStatusTab('pendientes')} className={`px-3 py-1.5 rounded text-xs font-black ${statusTab === 'pendientes' ? 'bg-amber-600 text-white' : 'text-slate-400'}`}>Pendientes</button>
              <button onClick={() => updateStatusTab('todas')} className={`px-3 py-1.5 rounded text-xs font-black ${statusTab === 'todas' ? 'bg-slate-700 text-white' : 'text-slate-400'}`}>Todas</button>
              <button onClick={() => updateStatusTab('terminadas')} className={`px-3 py-1.5 rounded text-xs font-black ${statusTab === 'terminadas' ? 'bg-emerald-600 text-white' : 'text-slate-400'}`}>Tejidas</button>
            </div>
          </div>
          <div className="flex items-center gap-2 overflow-x-auto hide-scrollbar">
            <span className="text-[10px] font-black uppercase tracking-wider text-slate-500 shrink-0">Agrupar</span>
            <div className="flex bg-slate-950 p-1 rounded-lg border border-slate-800 items-center shrink-0">
              <button onClick={() => updateGroupMode('maquina')} className={`px-3 py-1.5 rounded text-xs font-black ${groupMode === 'maquina' ? 'bg-blue-600 text-white' : 'text-slate-400'}`}>Diámetro</button>
              <button onClick={() => updateGroupMode('partida')} className={`px-3 py-1.5 rounded text-xs font-black ${groupMode === 'partida' ? 'bg-purple-600 text-white' : 'text-slate-400'}`}>Partida</button>
              <button onClick={() => updateGroupMode('modelo')} className={`px-3 py-1.5 rounded text-xs font-black ${groupMode === 'modelo' ? 'bg-blue-600 text-white' : 'text-slate-400'}`}>Modelo</button>
            </div>
            <button onClick={generateGlobalPDF} className="shrink-0 bg-rose-600 hover:bg-rose-500 text-white px-3 py-1.5 rounded-lg text-xs font-bold flex items-center gap-1 shadow"><Icon name="file-text" size={14}/> PDF Global</button>
            <div className="hidden lg:flex gap-1 bg-slate-950 p-1.5 rounded-lg border border-slate-800 shrink-0">
              <button onClick={() => updateColumns(1)} className={`p-1.5 rounded ${columns === 1 ? 'bg-blue-600 text-white' : 'text-slate-400'}`}><Icon name="align-justify" size={16}/></button>
              <button onClick={() => updateColumns(2)} className={`p-1.5 rounded ${columns === 2 ? 'bg-blue-600 text-white' : 'text-slate-400'}`}><Icon name="layout-grid" size={16}/></button>
              <button onClick={() => updateColumns(3)} className={`p-1.5 rounded ${columns === 3 ? 'bg-blue-600 text-white' : 'text-slate-400'}`}><Icon name="columns" size={16}/></button>
            </div>
          </div>
        </div>
      </div>
      <div className="relative mb-4">
        <input value={query} onChange={e => setQuery(e.target.value)} placeholder="Buscar por OC, partida, modelo, cliente..." className="w-full p-3 pl-10 bg-slate-900 border border-slate-800 text-slate-100 placeholder-slate-500 rounded-xl shadow-sm focus:outline-none focus:border-blue-500"/>
        <Icon name="search" size={18} className="absolute left-3 top-3.5 text-slate-500"/>
      </div>
      {orderedGroups.length === 0 && <div className="text-center text-slate-500 py-10">{statusTab === 'terminadas' ? 'No hay órdenes tejidas.' : statusTab === 'todas' ? 'No hay órdenes activas.' : 'Sin producción activa.'}</div>}
      <div className={`grid gap-4 ${gridClass}`}>
        {visibleGroups.map(g => (
          <div key={g.id} draggable={groupMode === 'maquina' && !query && !expandedMachine} onDragStart={(e) => handleDragStart(e, g.id)} onDragOver={handleDragOver} onDrop={(e) => handleDrop(e, g.id)} onDragEnd={() => setDraggedItem(null)} className={`transition-all duration-200 h-full ${draggedItem === g.id ? 'opacity-40 scale-95' : ''}`}>
            <div className="pointer-events-auto h-full">
              {groupMode === 'maquina' && <MachineAccordion maquina={g.id} entities={g.entities} expanded={expandedMachine === g.id} onToggle={() => setExpandedMachine(expandedMachine === g.id ? null : g.id)} actions={actions} isFinishedView={statusTab === 'terminadas'}/>}
              {groupMode === 'partida' && <PartidaAccordion partidaGroup={g} expanded={expandedPartida === g.id} onToggle={() => setExpandedPartida(expandedPartida === g.id ? null : g.id)} actions={actions}/>}
              {groupMode === 'modelo' && <ModelAccordion modelGroup={g} expanded={expandedModel === g.id} onToggle={() => setExpandedModel(expandedModel === g.id ? null : g.id)} actions={actions}/>}
            </div>
          </div>
        ))}
      </div>
    </div>
  );
};

/* ============ GRÁFICA DE AVANCE ============ */
const ProgressGraphView = ({ orders, productionLogs = [], actions }) => {
  const activeOrders = useMemo(() => orders.filter(o => o.status !== 'ARCHIVADO'), [orders]);
  const modelOptions = useMemo(() => [...new Set(activeOrders.map(o => String(o.codigo || o.modelo || '').trim()).filter(Boolean))].sort(), [activeOrders]);
  const [selectedModel, setSelectedModel] = useState(() => localStorage.getItem('planta.graph.model') || '');
  const [selectedPartida, setSelectedPartida] = useState(() => localStorage.getItem('planta.graph.partida') || '');
  useEffect(() => { if (selectedModel) localStorage.setItem('planta.graph.model', selectedModel); }, [selectedModel]);
  useEffect(() => { if (selectedPartida) localStorage.setItem('planta.graph.partida', selectedPartida); }, [selectedPartida]);
  useEffect(() => { if (!selectedModel && modelOptions.length) setSelectedModel(modelOptions[0]); if (selectedModel && !modelOptions.includes(selectedModel)) setSelectedModel(modelOptions[0] || ''); }, [modelOptions, selectedModel]);

  const partidaOptions = useMemo(() => {
    const map = {};
    activeOrders.filter(o => String(o.codigo || o.modelo || '').trim() === selectedModel).forEach(order => {
      const id = String(order.partida || '').trim();
      if (!id) return;
      const color = String(order.color || 'SIN COLOR').trim();
      if (!map[id]) map[id] = { id, colors: new Set() };
      if (color) map[id].colors.add(color);
    });
    return Object.values(map).map(x => ({ ...x, colors: [...x.colors] })).sort((a,b) => getPartidaDateValue(a.id) - getPartidaDateValue(b.id));
  }, [activeOrders, selectedModel]);

  useEffect(() => { if (!selectedPartida || !partidaOptions.some(p => p.id === selectedPartida)) setSelectedPartida(partidaOptions[0]?.id || ''); }, [partidaOptions, selectedPartida]);

  const selectedOrders = useMemo(() => activeOrders.filter(o => String(o.codigo || o.modelo || '').trim() === selectedModel && String(o.partida || '').trim() === selectedPartida), [activeOrders, selectedModel, selectedPartida]);
  const selectedColors = useMemo(() => [...new Set(selectedOrders.map(o => String(o.color || 'SIN COLOR').trim()).filter(Boolean))], [selectedOrders]);
  const selectedPackages = useMemo(() => selectedOrders.flatMap(order => {
    const pieceMap = Object.fromEntries((order.subPiecesData || []).map(piece => [String(piece.pieza), piece]));
    return (order.progreso || []).map((pkg, index) => {
      const piece = pieceMap[String(pkg.piezaNombre || pkg.pieza || '')] || {};
      const code = String(pkg.codigoUnico || pkg.codigo || pkg.shortCode || `${order.id}-${index}`);
      const qty = Number(pkg.cantidad) || 0;
      const state = pkg.finished === true ? 'terminado' : 'sin-iniciar';
      return { order, pkg, piece, code, qty, state };
    });
  }), [selectedOrders]);

  const tallaRows = useMemo(() => {
    const map = {};
    selectedPackages.forEach(item => {
      const talla = String(item.piece.talla || item.pkg.talla || 'S/T');
      if (!map[talla]) map[talla] = { talla, paquetes:0, piezas:0, tejido:0 };
      map[talla].paquetes += 1;
      map[talla].piezas += item.qty;
      if (item.pkg.finished === true) map[talla].tejido += item.qty;
    });
    return Object.values(map).sort((a,b) => tallaRankValue(a.talla) - tallaRankValue(b.talla) || String(a.talla).localeCompare(String(b.talla), undefined, { numeric: true }));
  }, [selectedPackages]);

  return (
    <div className="p-4 pb-8 space-y-4">
      <div className="rounded-xl border border-slate-800 bg-slate-900 p-4 card-shadow">
        <div className="flex flex-col gap-1 mb-3">
          <div className="text-lg font-black text-white flex items-center gap-2"><Icon name="bar-chart-3" size={20} className="text-rose-400"/> Gráfica de avance · Tejido</div>
          <div className="text-[10px] uppercase tracking-wider text-slate-500 font-bold">Avance por talla de una partida</div>
        </div>
        <div className="grid grid-cols-1 md:grid-cols-2 gap-3">
          <label className="text-[10px] uppercase font-black tracking-wider text-slate-500">Modelo
            <select value={selectedModel} onChange={e => { setSelectedModel(e.target.value); setSelectedPartida(''); }} className="mt-1 w-full rounded-lg border border-slate-700 bg-slate-950 p-2.5 text-sm font-bold text-white">
              <option value="">Selecciona modelo</option>
              {modelOptions.map(m => <option key={m} value={m}>{m}</option>)}
            </select>
          </label>
          <label className="text-[10px] uppercase font-black tracking-wider text-slate-500">Partida
            <select value={selectedPartida} onChange={e => setSelectedPartida(e.target.value)} className="mt-1 w-full rounded-lg border border-slate-700 bg-slate-950 p-2.5 text-sm font-bold text-white">
              <option value="">Selecciona partida</option>
              {partidaOptions.map(p => <option key={p.id} value={p.id}>{p.id} · {p.colors.join(' / ') || 'SIN COLOR'}</option>)}
            </select>
          </label>
        </div>
      </div>

      {!selectedPartida ? (
        <div className="rounded-xl border border-dashed border-slate-700 p-10 text-center text-sm font-bold text-slate-500">Selecciona Modelo y Partida.</div>
      ) : (
        <div className="rounded-xl border border-slate-800 bg-slate-900 p-4 card-shadow">
          <div className="flex items-center justify-between gap-3 mb-4">
            <div>
              <div className="text-sm font-black text-white">{selectedModel} · {selectedPartida} · {selectedColors.join(' / ')}</div>
              <div className="text-[10px] text-slate-500 font-bold uppercase">Avance por talla</div>
            </div>
            <div className="text-right text-[10px] text-slate-400">{selectedPackages.length} paquetes · {tallaRows.reduce((s,r) => s+r.piezas,0)} piezas</div>
          </div>
          <div className="space-y-4">
            {tallaRows.length === 0 ? (
              <div className="text-center text-sm text-slate-500 py-6">No hay paquetes.</div>
            ) : (
              <>
                <div className="flex flex-wrap gap-3 text-[10px] font-bold text-slate-400 mb-2">
                  <span><i className="inline-block w-2 h-2 rounded-sm bg-slate-700 mr-1"/>Pendiente</span>
                  <span><i className="inline-block w-2 h-2 rounded-sm bg-green-600 mr-1"/>Tejido</span>
                </div>
                <div className="overflow-x-auto pb-3">
                  <div className="min-w-[600px] flex items-start gap-3 px-2">
                    {tallaRows.map(row => {
                      const total = Math.max(1, row.piezas);
                      const pendientes = Math.max(0, row.piezas - row.tejido);
                      return (
                        <div key={row.talla} className="flex-1 min-w-[132px] flex flex-col items-center">
                          <div className="text-[10px] font-black text-slate-300 mb-1">TALLA {row.talla} · {row.piezas} pzs</div>
                          <div className="w-[78px] h-60 flex flex-col justify-end rounded-t-lg overflow-hidden border border-slate-700 bg-slate-950">
                            <div className="bg-slate-700" style={{ height: `${(pendientes/total)*100}%` }}/>
                            <div className="bg-green-600" style={{ height: `${(row.tejido/total)*100}%` }}/>
                          </div>
                          <div className="mt-2 text-xs font-black text-white">TALLA {row.talla}</div>
                          <div className="text-[9px] text-slate-500">{row.paquetes} paq · {pendientes} pend.</div>
                          <div className="mt-2 w-full flex flex-col gap-1">
                            {selectedPackages.filter(it => String(it.piece.talla || it.pkg.talla || 'S/T') === String(row.talla)).map(it => (
                              <button key={it.code} onClick={() => actions.onViewDetails(it.order)} className={`text-[9px] p-1.5 rounded border ${it.state === 'terminado' ? 'bg-green-700 border-green-500 text-white' : 'bg-slate-800 border-slate-700 text-slate-300'}`} title={it.code}>
                                <span className="font-black">{it.state === 'terminado' ? '✓' : ''} {it.code}</span>
                              </button>
                            ))}
                          </div>
                        </div>
                      );
                    })}
                  </div>
                </div>

/* ============ PURGE HELPERS ============ */
const findTraceDocs = async (collectionName, fields, values) => {
  const found = new Map();
  for (const field of fields) for (const value of values.filter(v => v !== undefined && v !== null && v !== '')) {
    try { const snap = await db.collection(collectionName).where(field, '==', value).get(); snap.forEach(doc => found.set(doc.ref.path, doc)); }
    catch(e) {}
  }
  return [...found.values()];
};
const deleteDocsInChunks = async docs => { for (let i = 0; i < docs.length; i += 400) { const b = db.batch(); docs.slice(i, i+400).forEach(doc => b.delete(doc.ref)); await b.commit(); } };
const waitForPurgeCommand = (id, timeoutMs = 30000) => new Promise((resolve, reject) => {
  const ref = db.collection('purga_pruebas').doc(id); let finished = false; let unsub = () => {};
  const timer = setTimeout(() => { if (!finished) { finished = true; unsub(); reject(new Error('HILATURAS no confirmó la purga.')); } }, timeoutMs);
  unsub = ref.onSnapshot(doc => { const d = doc.data() || {}; if (d.estado === 'PROCESADO') { finished = true; clearTimeout(timer); unsub(); resolve(d); } if (d.estado === 'ERROR') { finished = true; clearTimeout(timer); unsub(); reject(new Error(d.error || 'HILATURAS rechazó la purga.')); } }, e => { if (!finished) { finished = true; clearTimeout(timer); unsub(); reject(e); } });
});
const purgeTestOrder = async (order) => {
  const orderId = String(order.id);
  const packageIds = (order.progreso || []).map(p => p.id).filter(Boolean);
  const codes = (order.progreso || []).flatMap(p => [p.codigoUnico, p.codigo, p.codigo_paquete]).filter(Boolean);
  const values = [order.id, orderId, order.partida, ...packageIds, ...codes].filter(Boolean);
  const historyDocs = await findTraceDocs('consumo_hilo_historial', ['orderId','pkgId','codigoUnico'], values);
  const restore = {}; historyDocs.forEach(doc => { const d = doc.data() || {}; if (d.materialId && Number(d.kilos) > 0) restore[d.materialId] = (restore[d.materialId] || 0) + Number(d.kilos); });
  const cmdRef = db.collection('purga_pruebas').doc();
  await cmdRef.set({ tipo:'PURGE_TEST', estado:'PENDIENTE', orderId, partida:order.partida || '', packageIds, codes, restaurarPorMaterial:restore, solicitadoEn:FieldValue.serverTimestamp(), solicitadoDesde:'PLANTA' });
  const data = await waitForPurgeCommand(cmdRef.id);
  const traceTargets = [
    ['registro_produccion',['orderId','codigo_paquete','codigoUnico']],
    ['paquetes_historial',['orderId','pkgId','codigoUnico','codigo']],
    ['consumo_hilo_historial',['orderId','pkgId','codigoUnico']],
    ['alertas_admin',['orderId','codigoUnico','packageId']]
  ];
  const traceDocs = new Map();
  for (const [c, f] of traceTargets) (await findTraceDocs(c, f, values)).forEach(d => traceDocs.set(d.ref.path, d));
  historyDocs.forEach(d => traceDocs.set(d.ref.path, d));
  await deleteDocsInChunks([...traceDocs.values()]);
  await db.collection('orders').doc(orderId).delete();
  await cmdRef.delete();
  return { deleted: traceDocs.size, restored: data.restauradoPorMaterial || {} };
};
const purgeArchivedOrder = async (order) => {
  const orderId = String(order.id);
  const collected = new Map();
  const addDocs = snap => snap.forEach(d => collected.set(d.ref.path, d));
  try { addDocs(await db.collection('consumo_hilo_historial').where('orderId','==',orderId).get()); } catch(e){}
  try { addDocs(await db.collection('consumo_hilo_historial').where('partida','==',order.partida).get()); } catch(e){}
  try { addDocs(await db.collection('paquetes_historial').where('orderId','==',orderId).get()); } catch(e){}
  try { addDocs(await db.collection('registro_produccion').where('orderId','==',orderId).get()); } catch(e){}
  const ret = {}; const hd = [...collected.values()].filter(d => d.ref.parent.id === 'consumo_hilo_historial');
  hd.forEach(doc => { const d = doc.data() || {}; if (d.materialId && Number(d.kilos) > 0) ret[d.materialId] = (ret[d.materialId] || 0) + Number(d.kilos); });
  if (Object.keys(ret).length > 0) {
    await db.runTransaction(async tx => {
      const ref = db.collection('inventory').doc('main'); const snap = await tx.get(ref); if (!snap.exists) return;
      const items = (snap.data().items || []).map(item => ret[item.id] ? { ...item, stock: parseFloat((parseFloat(item.stock || 0) + ret[item.id]).toFixed(3)) } : item);
      tx.update(ref, { items });
    });
  }
  await deleteDocsInChunks([...collected.values()]);
  await db.collection('orders').doc(orderId).delete();
  return ret;
};

/* ============ DESTRUCCIÓN TOTAL · extraído de "destruir_partidas" ============ */
/* Borra todos los docs de `collectionName` donde el campo `partida` esté en partidaIds.
   Lotes de 400 (límite de Firestore). Silencia errores por colecciones inexistentes. */
const deleteCollectionByPartida = async (collectionName, partidaIds) => {
  let total = 0;
  for (const pid of partidaIds) {
    try {
      let snap = await db.collection(collectionName).where('partida', '==', pid).get();
      while (!snap.empty) {
        const chunk = snap.docs.slice(0, 400);
        const b = db.batch();
        chunk.forEach(d => b.delete(d.ref));
        await b.commit();
        total += chunk.length;
        if (snap.size <= 400) break;
        snap = await db.collection(collectionName).where('partida', '==', pid).limit(400).get();
      }
    } catch (e) {
      console.warn(`[destroy] ${collectionName} · ${pid}:`, e?.message || e);
    }
  }
  return total;
};

/* Quita una partida de partidas_index y de settings/config.partidasGeneradas.
   Se usa SOLO cuando no queda ninguna orden viva en esa partida. */
const cleanupPartidaRefs = async (partida) => {
  const pid = String(partida || '').trim().toUpperCase();
  if (!pid) return;
  try {
    const idxSnap = await db.collection('partidas_index').get();
    for (const d of idxSnap.docs) {
      const current = Array.isArray(d.data().partidas) ? d.data().partidas : [];
      const hit = current.find(x => String(x || '').trim().toUpperCase() === pid);
      if (hit) {
        await d.ref.set({ partidas: FieldValue.arrayRemove(hit), updatedAt: FieldValue.serverTimestamp() }, { merge: true });
      }
    }
  } catch (e) { console.warn('[destroy · partidas_index]', e?.message || e); }
  try {
    await db.collection('settings').doc('config').set({ partidasGeneradas: FieldValue.arrayRemove(pid) }, { merge: true });
  } catch (e) {}
};

/* Destruye UNA orden individual: orden + etiquetas + trazas + devuelve hilo.
   - Trazas: consumo_hilo_historial, paquetes_historial, registro_produccion por orderId.
   - Etiquetas: production_labels por labelCode/codigoUnico de sus paquetes.
   - Hilo: reintegra stock desde los docs de consumo_hilo_historial. */
const destroySingleOrder = async (order) => {
  const orderId = String(order.id);
  const collected = new Map();
  const addDocs = snap => snap.forEach(d => collected.set(d.ref.path, d));

  try { addDocs(await db.collection('consumo_hilo_historial').where('orderId', '==', orderId).get()); } catch (e) {}
  try { addDocs(await db.collection('paquetes_historial').where('orderId', '==', orderId).get()); } catch (e) {}
  try { addDocs(await db.collection('registro_produccion').where('orderId', '==', orderId).get()); } catch (e) {}

  const codes = [...new Set((order.progreso || []).flatMap(p => [p.codigoUnico, p.codigo, p.codigo_paquete]).filter(Boolean).map(c => String(c).toUpperCase()))];
  for (let i = 0; i < codes.length; i += 10) {
    const slice = codes.slice(i, i + 10);
    try {
      const snap = await db.collection('production_labels').where('labelCode', 'in', slice).get();
      snap.forEach(d => collected.set(d.ref.path, d));
    } catch (e) {
      for (const code of slice) {
        try {
          const snap = await db.collection('production_labels').where('labelCode', '==', code).get();
          snap.forEach(d => collected.set(d.ref.path, d));
        } catch (e2) {}
      }
    }
  }

  const ret = {};
  [...collected.values()].filter(d => d.ref.parent.id === 'consumo_hilo_historial').forEach(doc => {
    const d = doc.data() || {};
    if (d.materialId && Number(d.kilos) > 0) ret[d.materialId] = (ret[d.materialId] || 0) + Number(d.kilos);
  });
  if (Object.keys(ret).length > 0) {
    await db.runTransaction(async tx => {
      const ref = db.collection('inventory').doc('main');
      const snap = await tx.get(ref);
      if (!snap.exists) return;
      const items = (snap.data().items || []).map(item => ret[item.id] ? { ...item, stock: parseFloat((parseFloat(item.stock || 0) + ret[item.id]).toFixed(3)) } : item);
      tx.update(ref, { items });
    });
  }
  await deleteDocsInChunks([...collected.values()]);
  await db.collection('orders').doc(orderId).delete();
  return ret;
};

/* Destruye una PARTIDA COMPLETA:
   - Órdenes con algún paquete `finished:true` → se ARCHIVAN (no se destruyen).
   - Órdenes sin paquetes tejidos → se destruyen (delete + cleanup + devolución de hilo).
   - Si TODAS las órdenes terminan archivadas, la partida sigue viva (sigue en índice y Generadas).
   - Si ALGUNA orden se destruyó y no queda ninguna viva en la partida, se limpia partidas_index y Generadas. */
const destroyPartidaGroup = async (partida, allOrders) => {
  const pid = String(partida || '').trim().toUpperCase();
  if (!pid) throw new Error('Partida vacía.');
  const groupOrders = (allOrders || []).filter(o => String(o.partida || '').trim().toUpperCase() === pid);
  if (!groupOrders.length) throw new Error('No se encontraron órdenes en esta partida.');

  const toArchive = groupOrders.filter(orderHasWeaving);
  const toDelete = groupOrders.filter(o => !orderHasWeaving(o));

  let archived = 0;
  for (const o of toArchive) {
    try {
      await db.collection('orders').doc(String(o.id)).update({
        status: 'ARCHIVADO',
        archivedAt: FieldValue.serverTimestamp(),
        archivedFrom: 'PLANTA_GROUP_DESTROY'
      });
      archived++;
    } catch (e) { console.warn('[destroy · archive]', o.id, e?.message || e); }
  }

  let deleted = 0;
  let totalReturned = 0;
  for (const o of toDelete) {
    try {
      const ret = await destroySingleOrder(o);
      totalReturned += Object.values(ret || {}).reduce((s, v) => s + Number(v || 0), 0);
      deleted++;
    } catch (e) { console.warn('[destroy · delete]', o.id, e?.message || e); }
  }

  if (deleted > 0 && toArchive.length === 0) {
    try { await deleteCollectionByPartida('kits_datos', [pid]); } catch (e) {}
    try { await deleteCollectionByPartida('paquete_avances', [pid]); } catch (e) {}
    try { await deleteCollectionByPartida('movimientos_produccion', [pid]); } catch (e) {}
    await cleanupPartidaRefs(pid);
  }
  return { archived, deleted, totalReturned, partida: pid };
};

/* ============ PRINT KIT · jsPDF · 3 piezas por hoja letter ============ */
const toJpegDataUrl = (src, maxSize = 400) => new Promise(resolve => {
  if (!src) return resolve(null);
  if (typeof src === 'string' && src.startsWith('data:image/jpeg')) return resolve(src);
  const img = new Image();
  img.crossOrigin = 'anonymous';
  img.onload = () => {
    try {
      const canvas = document.createElement('canvas');
      const scale = Math.min(1, maxSize / Math.max(img.width, img.height));
      canvas.width = Math.max(1, Math.round(img.width * scale));
      canvas.height = Math.max(1, Math.round(img.height * scale));
      const ctx = canvas.getContext('2d');
      ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
      resolve(canvas.toDataURL('image/jpeg', 0.72));
    } catch (e) { resolve(null); }
  };
  img.onerror = () => resolve(null);
  img.src = src;
});

const resolveOrderImage = (order) => {
  if (!order) return null;
  if (order.imagenSeleccionada?.url) return order.imagenSeleccionada.url;
  const cached = readImgCache(order.codigo);
  if (cached) return cached;
  const ms = order.modelSnapshot;
  if (ms?.imageData) return ms.imageData;
  if (ms?.imageRef) return ms.imageRef;
  if (order.modelImageData) return order.modelImageData;
  if (order.imageData) return order.imageData;
  return `https://raw.githubusercontent.com/vn-1993/INGESA/refs/heads/main/IMAGENES/${order.codigo}.jpg`;
};

// Orden de tallas para gráficas, hojas y PDFs. Reconoce equivalencias
// internacionales y regionales: XS/ECH/XCH, S/CH, L/G, XL/EG/XG,
// XXL/XXG/2XL/2XG, etc.
const TALLA_ORDER = {
  'XXXS':0, '3XS':0, '3XCH':0,
  'XS':1, 'ECH':1, 'XCH':1, 'EXCH':1,
  'S':2, 'CH':2,
  'M':3,
  'L':4, 'G':4,
  'XL':5, 'EG':5, 'XG':5, 'EXG':5,
  'XXL':6, 'XXG':6, '2XL':6, '2XG':6, '2EG':6,
  'XXXL':7, 'XXXG':7, '3XL':7, '3XG':7, '3EG':7,
  'U':50, 'UNI':50, 'UNICA':50
};
const tallaKey = value => String(value || '').trim().toUpperCase().replace(/[.\s_-]/g, '');
const tallaRankValue = value => {
  const key = tallaKey(value);
  if (Object.prototype.hasOwnProperty.call(TALLA_ORDER, key)) return TALLA_ORDER[key];
  const numeric = parseFloat(key);
  return 100 + (Number.isFinite(numeric) ? numeric : 0);
};
const tallaRank = (o) => {
  const sizes = (o?.subPiecesData || []).map(p => p && p.talla).filter(Boolean);
  return sizes.length ? Math.min(...sizes.map(tallaRankValue)) : tallaRankValue('');
};
const sortOrdersForPrint = (orders) => {
  const seen = new Set();
  return (orders || []).filter(o => { const k = String(o.id); if (seen.has(k)) return false; seen.add(k); return true; })
    .sort((a, b) =>
      (tallaRank(a) - tallaRank(b)) ||
      String(a.codigo || '').localeCompare(String(b.codigo || '')) ||
      String(a.color || '').localeCompare(String(b.color || '')) ||
      String(a.partida || '').localeCompare(String(b.partida || '')) ||
      String(a.subPiecesData?.[0]?.pieza || '').localeCompare(String(b.subPiecesData?.[0]?.pieza || '')));
};

// jsPDF no sabe dibujar emojis: se separan del texto y se pintan como imagen PNG (canvas del dispositivo).
const EMOJI_RE_SRC = '[\\u{1F1E6}-\\u{1F1FF}]{2}|[#*0-9]\\uFE0F?\\u20E3|(?:\\p{Extended_Pictographic}|\\p{Emoji_Presentation})(?:\\uFE0F|\\p{Emoji_Modifier})*(?:\\u200D(?:\\p{Extended_Pictographic}|\\p{Emoji_Presentation})(?:\\uFE0F|\\p{Emoji_Modifier})*)*';
const tokenizeEmoji = (str) => {
  const text = String(str == null ? '' : str);
  const re = new RegExp(EMOJI_RE_SRC, 'gu');
  const out = [];
  let last = 0, m;
  while ((m = re.exec(text))) {
    if (m.index > last) out.push({ e: false, v: text.slice(last, m.index) });
    out.push({ e: true, v: m[0] });
    last = m.index + m[0].length;
  }
  if (last < text.length) out.push({ e: false, v: text.slice(last) });
  return out;
};
const EMOJI_PNG_CACHE = new Map();
const emojiPng = (emoji) => {
  if (EMOJI_PNG_CACHE.has(emoji)) return EMOJI_PNG_CACHE.get(emoji);
  let res = null;
  try {
    const px = 128;
    const font = `${Math.round(px * 0.7)}px "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif`;
    const c = document.createElement('canvas');
    c.width = px; c.height = px;
    let ctx = c.getContext('2d');
    ctx.font = font;
    const mw = Math.ceil(ctx.measureText(emoji).width);
    c.width = Math.max(px / 2, mw + 8); c.height = px;
    ctx = c.getContext('2d');
    ctx.font = font; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(emoji, c.width / 2, px / 2 + px * 0.05);
    res = { url: c.toDataURL('image/png'), ratio: c.width / c.height };
  } catch (e) { res = null; }
  EMOJI_PNG_CACHE.set(emoji, res);
  return res;
};
// Texto con emojis: letras con doc.text, emojis como imagen. Devuelve la X final.
const drawRich = (doc, text, x, y, sizePt, maxW) => {
  const eh = sizePt * 0.3528; // alto del emoji en mm ≈ tamaño de la letra
  let cx = x;
  doc.setFontSize(sizePt);
  for (const sg of tokenizeEmoji(text)) {
    if (!sg.e) {
      let t = sg.v;
      while (t.length > 0 && (cx - x) + doc.getTextWidth(t) > maxW) t = t.slice(0, -1);
      if (!t) break;
      doc.text(t, cx, y);
      cx += doc.getTextWidth(t);
      if (t.length < sg.v.length) break;
    } else {
      const img = emojiPng(sg.v);
      if (!img || !img.url) continue;
      const ew = eh * img.ratio;
      if ((cx - x) + ew > maxW) break;
      try { doc.addImage(img.url, 'PNG', cx + 0.3, y - eh * 0.82, ew, eh, undefined, 'FAST'); } catch (e) { /* sin emoji */ }
      cx += ew + 0.6;
    }
  }
  return cx;
};

// Dibuja UNA ficha de producción (mismo formato que la hoja normal) en jsPDF.
// k = escala (1 = media hoja letter, 1.25 = hoja completa). Devuelve la Y final.
const drawFicha = (doc, order, x0, y0, w, k, jpeg) => {
  const PW = doc.internal.pageSize.getWidth();
  const M = 10;
  y0 += 1;
  const trunc = (txt, maxW) => { let t = String(txt || ''); while (t.length > 1 && doc.getTextWidth(t) > maxW) t = t.slice(0, -1); return t; };
  const normTxt = x => String(x || '').toUpperCase().replace(/[\s()]/g, '');
  const modelName = order.nombreModeloCliente && normTxt(order.nombreModeloCliente) !== normTxt(order.codigo) ? order.nombreModeloCliente : '';
  const minutos = (order.subPiecesData || []).reduce((a, c) => a + (Number(c.tiempo) || 0), 0);
  const pzsHr = minutos > 0 ? (60 / minutos).toFixed(0) : '0';
  const pzs8 = minutos > 0 ? ((60 / minutos) * 8).toFixed(0) : '0';

  // ---------- ENCABEZADO ----------
  const leftW = w * 0.66;
  doc.setFont('helvetica', 'bold');
  doc.setTextColor(0, 0, 0);
  doc.setFontSize(18 * k);
  drawRich(doc, String(order.cliente || 'SIN CLIENTE').toUpperCase(), x0, y0 + 6 * k, 18 * k, leftW);
  doc.setFontSize(12 * k);
  const modTxt = `MOD: ${String(order.codigo || '').toUpperCase()}`;
  doc.text(modTxt, x0, y0 + 11.2 * k);
  if (modelName) {
    const mw = doc.getTextWidth(modTxt);
    doc.setFontSize(8 * k); doc.setTextColor(107, 114, 128);
    doc.text(trunc(`(${modelName})`, leftW - mw - 2), x0 + mw + 1.5, y0 + 11.2 * k);
    doc.setTextColor(0, 0, 0);
  }
  doc.setFontSize(10 * k);
  const base = y0 + 15.6 * k;
  let cx = x0;
  const oc = String(order.ordenCompra || '').toUpperCase();
  const color = String(order.color || '').toUpperCase();
  if (oc) { const t = `OC: ${oc}`; doc.setTextColor(30, 64, 175); doc.text(t, cx, base); cx += doc.getTextWidth(t); }
  if (oc && color) { const t = ' · '; doc.setTextColor(150, 150, 150); doc.text(t, cx, base); cx += doc.getTextWidth(t); }
  if (color) { doc.setTextColor(185, 28, 28); doc.text(trunc(`COLOR: ${color}`, leftW - (cx - x0)), cx, base); }
  doc.setTextColor(0, 0, 0);

  const xr = x0 + w;
  const tagW = 15 * k, tagH = 2.6 * k;
  doc.setFillColor(0, 0, 0);
  doc.rect(xr - tagW, y0, tagW, tagH, 'F');
  doc.setTextColor(255, 255, 255); doc.setFontSize(6 * k);
  doc.text('DIÁMETRO', xr - tagW / 2, y0 + 1.9 * k, { align: 'center' });
  doc.setTextColor(0, 0, 0); doc.setFontSize(30 * k);
  doc.text(`Ø ${getOrderDiameter(order)}`, xr, y0 + tagH + 10.5 * k, { align: 'right' });
  doc.setFontSize(9 * k);
  doc.text(`PARTIDA: ${order.partida || '—'}`, xr, y0 + tagH + 15 * k, { align: 'right' });

  const hy = y0 + 19.2 * k;
  doc.setDrawColor(0, 0, 0); doc.setLineWidth(0.9);
  doc.line(x0, hy, x0 + w, hy);

  // ---------- CUERPO: tablas a la izquierda, imagen a la derecha ----------
  const by = hy + 1.5 * k;
  const wL = w * 0.6;
  const imgX = x0 + wL + 2, imgW = w - wL - 2, imgH = 38 * k;
  const cellPad = { top: 0.4 * k, bottom: 0.4 * k, left: 1.2, right: 1.2 };
  const headS = { fillColor: [226, 232, 240], textColor: [0, 0, 0], fontStyle: 'bold', fontSize: 8 * k, cellPadding: cellPad, lineColor: [51, 51, 51], lineWidth: 0.2 };
  const bodyS = { fontSize: 8 * k, textColor: [17, 17, 17], cellPadding: cellPad, lineColor: [85, 85, 85], lineWidth: 0.15, overflow: 'ellipsize' };
  const leftMargin = { left: x0, right: PW - (x0 + wL), top: M, bottom: M };

  const piezaRows = [...(order.subPiecesData || [])]
    .sort((a, b) => tallaRankValue(a?.talla) - tallaRankValue(b?.talla) || String(a?.pieza || '').localeCompare(String(b?.pieza || '')))
    .map(p => [String(p.pieza || '') + (p.codigoPrograma ? ` / ${p.codigoPrograma}` : ''), String(p.talla || 'U'), String(p.totalPedido ?? '')]);
  if (!piezaRows.length) piezaRows.push(['—', 'U', '']);
  doc.autoTable({
    startY: by, head: [['PIEZA', 'TALLA', 'TOTAL']], body: piezaRows, theme: 'grid',
    headStyles: headS, bodyStyles: bodyS, margin: leftMargin, tableWidth: wL,
    columnStyles: { 0: { cellWidth: wL - 27 * k }, 1: { cellWidth: 14 * k, halign: 'center' }, 2: { cellWidth: 13 * k, halign: 'center', fontStyle: 'bold' } }
  });
  const enhRows = (order.threading || []).map(t => [String(t.material || ''), String(t.porcentaje ?? '')]);
  if (!enhRows.length) enhRows.push(['—', '']);
  doc.autoTable({
    startY: doc.lastAutoTable.finalY + 1, head: [[{ content: 'ENHEBRADO', colSpan: 2 }], ['MATERIAL', '%']], body: enhRows, theme: 'grid',
    headStyles: headS, bodyStyles: { ...bodyS, fontStyle: 'bold' }, margin: leftMargin, tableWidth: wL,
    columnStyles: { 0: { cellWidth: wL - 14 * k }, 1: { cellWidth: 14 * k, halign: 'center' } }
  });
  // cajas PZS/HR y PZS/12H
  const bY = doc.lastAutoTable.finalY + 1.2;
  const boxH = 11 * k, boxW = (wL - 1.5) / 2;
  doc.setDrawColor(0, 0, 0); doc.setLineWidth(0.5);
  [[x0, 'PZS/HR', pzsHr], [x0 + boxW + 1.5, 'PZS/8H', pzs8]].forEach(([bx, lbl, val]) => {
    doc.rect(bx, bY, boxW, boxH);
    doc.setLineWidth(0.4); doc.line(bx, bY + 3.8 * k, bx + boxW, bY + 3.8 * k); doc.setLineWidth(0.5);
    doc.setFont('helvetica', 'bold'); doc.setTextColor(0, 0, 0);
    doc.setFontSize(6.5 * k); doc.text(lbl, bx + boxW / 2, bY + 2.8 * k, { align: 'center' });
    doc.setFontSize(16 * k); doc.text(String(val), bx + boxW / 2, bY + 9.6 * k, { align: 'center' });
  });
  const leftEnd = bY + boxH;

  // imagen
  doc.setDrawColor(0, 0, 0); doc.setLineWidth(0.5);
  doc.setFillColor(248, 250, 252);
  doc.rect(imgX, by, imgW, imgH, 'FD');
  if (jpeg) {
    try {
      const props = doc.getImageProperties(jpeg);
      const sc = Math.min((imgW - 2) / props.width, (imgH - 2) / props.height);
      const dw = props.width * sc, dh = props.height * sc;
      doc.addImage(jpeg, 'JPEG', imgX + (imgW - dw) / 2, by + (imgH - dh) / 2, dw, dh, undefined, 'FAST');
    } catch (e) { /* sin imagen */ }
  }

  // ---------- CONTROL DE TEJIDO ----------
  const bodyEnd = Math.max(leftEnd, by + imgH) + 1.5 * k;
  doc.setFont('helvetica', 'bold'); doc.setTextColor(0, 0, 0); doc.setFontSize(8 * k);
  doc.text('CONTROL DE TEJIDO', x0, bodyEnd + 2.8 * k);
  doc.text(new Date().toLocaleDateString('es-MX'), x0 + w, bodyEnd + 2.8 * k, { align: 'right' });
  doc.setDrawColor(0, 0, 0); doc.setLineWidth(0.9);
  doc.line(x0, bodyEnd + 3.8 * k, x0 + w, bodyEnd + 3.8 * k);
  const formatPartialDate = h => {
    const raw = Number(h?.timestamp || 0);
    if (!raw) return '';
    try { return new Date(raw).toLocaleDateString('es-MX'); } catch (e) { return ''; }
  };
  const rows = (order.progreso || []).map((p, idx) => {
    const total = Number(p.cantidad || 0);
    const partial = Number(p.partialQuantity || 0);
    const history = Array.isArray(p.partialHistory) ? p.partialHistory : [];
    const hasPartial = partial > 0 && (partial < total || history.length > 0);
    const qtyText = String(p.cantidad ?? 0);
    const historyText = history.map(h => {
      const operator = String(h.operatorName || h.operador || '').trim() || 'ANÓNIMO';
      const kind = String(h.tipo || '').toUpperCase() === 'CIERRE' ? 'cierre' : 'parcial';
      return `${operator} ${Number(h.qty || 0)} (${kind})`;
    }).join(' + ');
    const weaverText = historyText || (p.finished ? String(p.tejedor || '') : (hasPartial ? 'PARCIAL' : '_'));
    const lastPartial = history.length ? history[history.length - 1] : null;
    const dateText = history.length ? (formatPartialDate(lastPartial) || String(p.fecha || '_')) : (p.finished ? String(p.fecha || '') : '_');
    return [
      String(idx + 1), String(p.codigoUnico || ''), qtyText,
      weaverText, dateText,
      p.finished ? String(p.defectos || '') : (hasPartial ? '—' : '_'),
      p.finished ? String(p.agujas || '') : (hasPartial ? '—' : '_')
    ];
  });
  if (!rows.length) rows.push(['', 'Sin paquetes generados', '', '', '', '', '']);
  const pct = [0.04, 0.34, 0.10, 0.20, 0.14, 0.09, 0.09];
  doc.autoTable({
    startY: bodyEnd + 4.6 * k, head: [['#', 'CÓDIGO', 'CANT', 'TEJ', 'FEC', 'DEF', 'AGJ']], body: rows, theme: 'grid',
    headStyles: headS, bodyStyles: bodyS, showHead: 'everyPage',
    margin: { left: x0, right: PW - (x0 + w), top: M, bottom: M }, tableWidth: w,
    columnStyles: {
      0: { cellWidth: w * pct[0], halign: 'center', fontStyle: 'bold' },
      1: { cellWidth: w * pct[1], font: 'courier' },
      2: { cellWidth: w * pct[2], halign: 'center', fontStyle: 'bold' },
      3: { cellWidth: w * pct[3] }, 4: { cellWidth: w * pct[4] }, 5: { cellWidth: w * pct[5] }, 6: { cellWidth: w * pct[6] }
    }
  });
  return doc.lastAutoTable.finalY;
};

// Genera UN PDF letter vertical: 2 fichas por hoja (si caben en media hoja) o 1 ficha por hoja.
// Las que caben en media hoja se emparejan aunque no sean contiguas; la línea punteada
// del centro queda siempre para cortar con guillotina.
const generateSheetsPDF = async (entity) => {
  const PDF = window.jspdf?.jsPDF;
  if (!PDF) throw new Error('jsPDF no está disponible.');
  // El tiempo por pieza puede faltar en la orden. Se completa (en este orden de prioridad):
  //  1) tiempo propio de la orden, 2) tiempo de la plantilla del modelo para esa talla,
  //  3) tiempo de otra talla del mismo modelo y pieza.
  const pieceKey = (o, p) => `${String(o.codigo || '').trim().toUpperCase()}|${String(p.pieza || '').trim().toUpperCase()}`;
  const tallaKey = (o, p) => `${pieceKey(o, p)}|${String(p.talla || '').trim().toUpperCase()}`;
  const tiempoRef = new Map();      // modelo|pieza -> tiempo (de otra talla)
  const tiempoTalla = new Map();    // modelo|pieza|talla -> tiempo (de plantilla)
  [...(entity.orders || []), ...(entity.refOrders || [])].forEach(o => (o.subPiecesData || []).forEach(p => {
    const t = Number(p.tiempo) || 0;
    const k = pieceKey(o, p);
    if (t > 0 && !tiempoRef.has(k)) tiempoRef.set(k, t);
  }));
  const snapTiempo = (snap, p) => { try { return Number(DATA.getPiece(snap, p.pieza, p.talla)?.tiempo) || 0; } catch (e) { return 0; } };
  const modelCache = new Map();
  for (const o of (entity.orders || [])) {
    for (const p of (o.subPiecesData || [])) {
      if (Number(p.tiempo) > 0) continue;
      let t = o.modelSnapshot ? snapTiempo(o.modelSnapshot, p) : 0;
      if (!t) {
        const code = DATA.cleanCode(o.codigo || '');
        if (code && !modelCache.has(code)) {
          let snap = null;
          try {
            snap = await DATA.getModelSnapshot(db, code);
            const hasT = m => !!m && [...(m.subPiecesData || [])].some(x => Number(x.tiempo) > 0);
            if (!hasT(snap)) snap = (await DATA.getModelSnapshot(db, code, { forceRemote: true })) || snap;
          } catch (e) { /* sin plantilla */ }
          modelCache.set(code, snap);
        }
        const snap = modelCache.get(code);
        t = snap ? snapTiempo(snap, p) : 0;
      }
      if (t > 0) tiempoTalla.set(tallaKey(o, p), t);
    }
  }
  const withTiempo = (o) => ({ ...o, subPiecesData: (o.subPiecesData || []).map(p => (Number(p.tiempo) > 0 ? p : { ...p, tiempo: tiempoTalla.get(tallaKey(o, p)) || tiempoRef.get(pieceKey(o, p)) || p.tiempo })) });
  const orders = sortOrdersForPrint(entity.orders || []).map(withTiempo);
  if (!orders.length) throw new Error('No hay órdenes para imprimir.');
  const mk = () => new PDF({ orientation: 'portrait', unit: 'mm', format: 'letter' });
  const doc = mk();
  const PW = doc.internal.pageSize.getWidth();
  const PH = doc.internal.pageSize.getHeight();
  const M = 10, CW = PW - M * 2, HALF = (PH - M * 2) / 2;

  // Imagen única por modelo, convertida a JPEG una sola vez
  const imgCache = new Map();
  const codes = [...new Set(orders.map(o => String(o.codigo || '').toUpperCase()).filter(Boolean))];
  for (const code of codes) {
    const piece = orders.find(o => String(o.codigo || '').toUpperCase() === code);
    imgCache.set(code, await toJpegDataUrl(resolveOrderImage(piece), 500));
  }
  const imgOf = o => imgCache.get(String(o.codigo || '').toUpperCase()) || null;

  // Escala máxima a la que la ficha cabe en 'maxH' mm (se mide dibujándola en un PDF de prueba).
  // Devuelve 0 si ni a escala 1 cabe.
  const fitK = (o, maxH, kMax) => {
    for (let k = kMax; k >= 1 - 1e-9; k = Math.round((k - 0.05) * 100) / 100) {
      try {
        const t = mk();
        const end = drawFicha(t, o, M, M, CW, k, null);
        if (t.getNumberOfPages() === 1 && end <= M + maxH) return k;
      } catch (e) { /* intenta con menor escala */ }
    }
    return 0;
  };

  // Empaquetado: las que caben en media hoja se emparejan (aunque no sean contiguas);
  // cada ficha se agranda hasta llenar su mitad (tope 1.4x). Las demás, hoja completa.
  const pages = [];
  let open = null;
  orders.forEach(o => {
    const kh = fitK(o, HALF - 3, 1.4);
    if (kh) {
      if (open) { open.items.push({ o, k: kh }); open = null; }
      else { open = { type: 'half', items: [{ o, k: kh }] }; pages.push(open); }
    } else {
      pages.push({ type: 'full', o, k: fitK(o, PH - M * 2 - 1, 1.5) || 1 });
    }
  });

  pages.forEach((pg, i) => {
    if (i > 0) doc.addPage();
    if (pg.type === 'half') {
      const kPage = Math.min(...pg.items.map(it => it.k)); // misma escala en ambas mitades
      pg.items.forEach((it, j) => drawFicha(doc, it.o, M, M + j * HALF, CW, kPage, imgOf(it.o)));
      try {
        doc.setDrawColor(150, 150, 150); doc.setLineWidth(0.2);
        if (typeof doc.setLineDashPattern === 'function') doc.setLineDashPattern([1.5, 1.5], 0);
        doc.line(M, M + HALF, M + CW, M + HALF);
        if (typeof doc.setLineDashPattern === 'function') doc.setLineDashPattern([], 0);
      } catch (e) { /* sin línea punteada */ }
    } else {
      drawFicha(doc, pg.o, M, M, CW, pg.k, imgOf(pg.o));
    }
  });

  const name = String(entity.kitKey || entity.id || 'produccion').replace(/[^A-Za-z0-9_\-]+/g, '_');
  doc.save(`${entity.title ? 'GRUPO' : 'KIT'}_${name}.pdf`);
};

const PrintKitOrder = ({ entity, onBack }) => {
  const [status, setStatus] = useState('Generando PDF…');

  useEffect(() => {

      try {
        await generateSheetsPDF(entity);

        setStatus('✓ PDF descargado');
        setTimeout(() => { if (!cancelled) onBack(); }, 900);
      } catch (e) {
        if (cancelled) return;
        console.error('[generateSheetsPDF]', e);

const TVBoard = ({ orders = [], productionLogs = [], recepciones = [], deviceInfo, display = {} }) => {

  const activePackages = useMemo(() => activeOrders.flatMap(o => (o.progreso || []).map(p => ({ order:o, pkg:p }))), [activeOrders]);
  const packageTotal = activePackages.length;
  const packageDone = activePackages.filter(x => x.pkg.finished === true).length;
  const pieceTotal = activePackages.reduce((s,x) => s + (Number(x.pkg.cantidad) || 0), 0);
  const pieceDone = activePackages.reduce((s,x) => s + (x.pkg.finished === true ? (Number(x.pkg.cantidad) || 0) : 0), 0);
  const today = new Date().toLocaleDateString('en-CA');
  const todayScans = productionLogs.filter(x => { const t = x.timestamp && x.timestamp.toDate ? x.timestamp.toDate() : new Date(x.timestamp || 0); return !isNaN(t.getTime()) && t.toLocaleDateString('en-CA') === today; }).length;
  const comparisons = useMemo(() => {
    const models = {};
    activeOrders.forEach(order => {
      const model = String(order.codigo || order.modelo || order.nombreModeloCliente || 'SIN MODELO').trim();
      const machine = String(order.maquina || order.diametro || getOrderDiameter(order) || 'SIN MÁQUINA').trim();
      if (!models[model]) models[model] = {};
      if (!models[model][machine]) models[model][machine] = { machine, packages:0, done:0, pieces:0, piecesDone:0 };
      (order.progreso || []).forEach(pkg => { const row = models[model][machine]; const qty = Number(pkg.cantidad) || 0; row.packages++; row.pieces += qty; if (pkg.finished === true) { row.done++; row.piecesDone += qty; } });
    });
    return Object.keys(models).sort((a,b) => a.localeCompare(b)).map(model => ({ model, machines:Object.values(models[model]).sort((a,b) => a.machine.localeCompare(b.machine,undefined,{numeric:true})) })).filter(x => x.machines.length > 1);
  }, [activeOrders]);

  useEffect(() => {

  return <div className="min-h-full bg-slate-950 p-5 text-white md:p-8">
    <div className="mb-5 flex flex-wrap items-center justify-between gap-4 rounded-2xl border border-cyan-700/50 bg-gradient-to-r from-slate-900 to-cyan-950/50 p-5">

      <div className="flex items-center gap-2">{[0,1,2].map(i => <button key={i} onClick={() => setSlide(i)} aria-label={`Mostrar diapositiva ${i+1}`} className={`h-3 w-8 rounded-full ${i===slide?'bg-cyan-300':'bg-slate-600'}`}/>)}</div>

      <div className={card}><div className="text-xs font-black uppercase tracking-wider text-slate-400">Órdenes activas</div><div className="mt-3 text-5xl font-black text-white">{activeOrders.length}</div><div className="mt-2 text-sm text-slate-500">En curso, sin archivadas</div></div>
      <div className={card}><div className="text-xs font-black uppercase tracking-wider text-slate-400">Paquetes tejidos</div><div className="mt-3 text-5xl font-black text-emerald-300">{packageDone}<span className="text-2xl text-slate-500"> / {packageTotal}</span></div><div className="mt-4 h-3 overflow-hidden rounded-full bg-slate-700"><div className="h-full rounded-full bg-emerald-400" style={{width:`${progress}%`}}/></div><div className="mt-2 text-sm text-slate-400">{progress}% de los paquetes activos</div></div>

    })}{comparisons.length===0 && <div className={`${card} text-slate-300`}>Todavía no hay datos activos de un mismo modelo en más de una máquina para comparar. No se inventan comparaciones.</div>}</div>}
    {slide === 2 && <div className="grid gap-5 xl:grid-cols-3"><div className={card}><div className="text-xs font-black uppercase tracking-wider text-slate-400">Recepciones con incidencias</div><div className="mt-2 text-5xl font-black text-amber-300">{quality.length}</div><div className="mt-3 text-sm text-slate-400">Basado en piezas malas o diferencia entre esperadas y buenas.</div><div className="mt-4 text-sm text-slate-300">Piezas malas: <b className="text-rose-300">{quality.reduce((s,r)=>s+r.bad,0)}</b><br/>Piezas faltantes: <b className="text-amber-300">{quality.reduce((s,r)=>s+r.missing,0)}</b></div></div><div className={`${card} xl:col-span-2`}><div className="mb-4 text-lg font-black">Incidencias recientes</div>{quality.slice(0,6).map((r,i)=><div key={r.id||i} className="flex flex-wrap items-center justify-between gap-2 border-t border-slate-800 py-3"><div><b>{r.model||'Modelo'} · {r.partida||'Sin partida'}</b><div className="text-xs text-slate-400">{r.pkgCode||'Paquete'} · {r.incidenciaTipo||'Recepción con diferencia'} {r.notes||r.notas ? `· ${r.notes||r.notas}` : ''}</div></div><div className="text-right text-sm"><span className="text-rose-300">Malas {r.bad}</span><br/><span className="text-amber-300">Faltan {r.missing}</span></div></div>)}{quality.length===0&&<div className="text-slate-400">No hay incidencias de recepción en los datos cargados.</div>}</div></div>}
    <div className="mt-6 flex items-center justify-between border-t border-slate-800 pt-4 text-xs text-slate-500"><span>Actualización en vivo · INGESA Logística</span><span>{new Date().toLocaleString('es-MX')}</span></div>
  </div>;
};
