/* ============ EFICIENCIA IA (DEV · análisis inteligente de máquinas) ============ */
const EFFICIENCY_CACHE_KEY = 'ingesa_efficiency_v1';
const EFFICIENCY_CACHE_TTL_MS = 15 * 60 * 1000;

const isoDateNDaysAgo = (n) => {
  const d = new Date(); d.setDate(d.getDate() - n);
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
};
const isoTodayEff = () => isoDateNDaysAgo(0);

// Convierte cualquier timestamp (Firestore, ISO, "DD/MM/YYYY HH:MM" de es-MX) a ms
const parseEffTimestamp = (raw) => {
  if (raw == null || raw === '') return null;
  if (typeof raw === 'number') return raw;
  if (raw?.toDate) return raw.toDate().getTime();
  if (raw?.seconds != null) return Number(raw.seconds) * 1000;
  if (raw instanceof Date) return raw.getTime();
  const s = String(raw).trim();
  const local = s.match(/^(\d{1,2})[\/.\-](\d{1,2})[\/.\-](\d{4})(?:\s*[, ]?\s*(\d{1,2}):(\d{2}))?/);
  if (local) return new Date(Number(local[3]), Number(local[2]) - 1, Number(local[1]), Number(local[4] || 0), Number(local[5] || 0)).getTime();
  const iso = s.match(/^(\d{4})-(\d{2})-(\d{2})/);
  if (iso) return new Date(Number(iso[1]), Number(iso[2]) - 1, Number(iso[3])).getTime();
  const p = new Date(s).getTime();
  return Number.isFinite(p) ? p : null;
};

// Lee la caché local del análisis (para no volver a consultar al abrir la pestaña)
const readEfficiencyCache = () => {
  try {
    const c = JSON.parse(localStorage.getItem(EFFICIENCY_CACHE_KEY) || 'null');
    if (!c || !c.raw || !c.savedAt) return null;
    if (c.raw.v !== 2) return null; // versión anterior: invalidar
    if (Date.now() - Number(c.savedAt) > EFFICIENCY_CACHE_TTL_MS) return null;
    return c.raw;
  } catch (e) { return null; }
};

// Guarda una versión "slim" (sin documentos crudos) para no romper quota.
// v2 incluye partialEvents (avances parciales), reportes_operadores y maquinas_estado
// para que la pestaña funcione también con partidas aún no terminadas.
const writeEfficiencyCache = (raw) => {
  const buildSlim = () => ({
    v: 2,
    dateFrom: raw.dateFrom,
    dateTo: raw.dateTo,
    packages: (raw.packages || []).map(p => ({
      orderId: p.orderId || '', codigo: p.codigo || '', modelo: p.modelo || '',
      codigoUnico: p.codigoUnico || '', partida: p.partida || '',
      pieza: p.pieza || p.piezaNombre || '', talla: p.talla || '',
      color: p.color || '', cantidad: Number(p.cantidad) || 0,
      maquina: p.maquina || '', diametro: p.diametro || '',
      operador: p.operador || p.tejedor || '',
      timestamp: p.timestamp || null, fecha: p.fecha || '',
      kitId: p.kitId || '', kitNumber: p.kitNumber || ''
    })),
    partialEvents: (raw.partialEvents || []).map(e => ({
      orderId: e.orderId || '', codigo: e.codigo || '', modelo: e.modelo || '',
      partida: e.partida || '', codigoUnico: e.codigoUnico || '',
      pieza: e.pieza || '', talla: e.talla || '', color: e.color || '',
      cantidad: Number(e.cantidad) || 0, tipo: e.tipo || '',
      totalPackage: Number(e.totalPackage) || 0,
      operador: e.operador || '', maquina: e.maquina || '',
      diametro: e.diametro || '', timestamp: Number(e.timestamp) || 0,
      estado: e.estado || ''
    })),
    alerts: (raw.alerts || []).map(a => ({
      tipo: a.tipo || '', origen: a.origen || '', maquina: a.maquina || '',
      modelo: a.modelo || '', partida: a.partida || '', codigoUnico: a.codigoUnico || '',
      defectoCodigo: a.defectoCodigo || '', defectoNombre: a.defectoNombre || '',
      cantidadLienzos: Number(a.cantidadLienzos) || 0,
      tejedorResponsable: a.tejedorResponsable || '',
      primera: a.primera === true, operador: a.operador || '',
      timestamp: a.timestamp || null, detalles: a.detalles || ''
    })),
    reportes: (raw.reportes || []).map(r => ({
      maquina: r.maquina || '', mainStatus: r.mainStatus || '',
      subStatus: r.subStatus || '', alerta: r.alerta || '',
      alerta_detalles: r.alerta_detalles || '',
      operador: r.operador || '', origen: r.origen || '',
      timestamp: Number(r.timestamp) || 0
    })),
    estados: (raw.estados || []).map(e => ({
      maquina: e.maquina || e.id || '',
      estado_actual: e.estado_actual || '',
      sub_estado: e.sub_estado || '',
      responsable: e.responsable || '',
      modelo_tejiendo: e.modelo_tejiendo || '',
      color_tejiendo: e.color_tejiendo || '',
      ultima_actualizacion: Number(e.ultima_actualizacion) || 0
    })),
    ordersSlim: raw.ordersSlim || [],
    confirmaciones: (raw.confirmaciones || []).map(c => ({
      orderId: c.orderId || '', maquinaAsignada: c.maquinaAsignada || '',
      maquinaOriginal: c.maquinaOriginal || '',
      trabajandoDesdeMs: Number(c.trabajandoDesdeMs) || 0,
      timestamp: c.timestamp || null
    }))
  });
  try {
    localStorage.setItem(EFFICIENCY_CACHE_KEY, JSON.stringify({ savedAt: Date.now(), raw: buildSlim() }));
  } catch (e) {
    // Si falla por quota, purgar caché de imágenes y reintentar una vez.
    try {
      const victims = [];
      for (let i = 0; i < localStorage.length; i++) {
        const k = localStorage.key(i);
        if (k && (k.startsWith('ingesa_log_img_v1:') || k.startsWith('ingesa_image_v2:'))) victims.push(k);
      }
      victims.forEach(k => { try { localStorage.removeItem(k); } catch (er) {} });
      localStorage.setItem(EFFICIENCY_CACHE_KEY, JSON.stringify({ savedAt: Date.now(), raw: buildSlim() }));
    } catch (er) { console.warn('[efficiency cache] quota persistente', er); }
  }
};

// Construye intervalos de paro por máquina a partir de alertas (FALLA→CORREGIDA, PARADA→PRODUCIENDO)
const buildDowntimeIntervals = (alertsByMachine) => {
  const result = {};
  Object.entries(alertsByMachine).forEach(([machine, alerts]) => {
    const sorted = alerts.slice().sort((a, b) => (parseEffTimestamp(a.timestamp) || 0) - (parseEffTimestamp(b.timestamp) || 0));
    const intervals = [];
    let open = null;
    sorted.forEach(a => {
      const ts = parseEffTimestamp(a.timestamp);
      if (!ts) return;
      const tipo = String(a.tipo || '').toUpperCase();
      const det = String(a.detalles || '').toUpperCase();
      const isStop = /FALLA_MECANICA|MAQUINA_PARADA|FALLA_TEJIENDO|SIN_PAPELETAS|SIN_TRABAJO|MANTENIMIENTO|MAQUINA_APAGADA|CALENTANDO|REPUESTO|PRUEBA/.test(tipo);
      const isResume = /CORREGID|PRODUCIENDO|TRABAJANDO_BIEN|RESUELT|PRODUCTO_TERMINADO/.test(tipo + ' ' + det);
      if (isStop && !open) open = { startMs: ts, tipo };
      else if (isResume && open) { intervals.push({ startMs: open.startMs, endMs: ts, tipo: open.tipo }); open = null; }
    });
    if (open) intervals.push({ startMs: open.startMs, endMs: open.startMs + 30 * 60 * 1000, tipo: open.tipo });
    result[machine] = intervals;
  });
  return result;
};

// Minutos por pieza (por talla exacta o por nombre de pieza) desde subPiecesData
const minutesForPieceEff = (order, pkg) => {
  if (!order?.subPiecesData) return 0;
  const name = String(pkg?.piezaNombre || pkg?.pieza || '').trim().toUpperCase();
  const talla = String(pkg?.talla || '').trim().toUpperCase();
  const exact = order.subPiecesData.find(p => String(p?.pieza || '').trim().toUpperCase() === name && String(p?.talla || '').trim().toUpperCase() === talla);
  const byName = order.subPiecesData.find(p => String(p?.pieza || '').trim().toUpperCase() === name);
  return Number((exact || byName || {}).tiempo) || 0;
};

// Reconstruye ventana de producción de un paquete.
//   effectiveMs = tiempo por pieza × cantidad
//   endMs       = timestamp de finished (paquetes_historial / fecha)
//   naiveStart  = endMs - effectiveMs
//   actualStart = naiveStart - downtimes superpuestos (o trabajandoDesdeMs de confirmación)
//   efficiency  = effectiveMs / totalMs
const reconstructProductionWindow = (pkg, order, downtimeByMachine, confirmacionesByMachine) => {
  // Un paquete puede venir de:
  //  - paquetes_historial (registro final directo)
  //  - partialHistory (avance parcial o CIERRE)
  //  - evento sintético sin timestamp → no aporta a eficiencia pero sí a conteos
  if (!pkg.timestamp && !pkg.fecha) return null;
  const minPerPiece = minutesForPieceEff(order, pkg);
  const qty = Number(pkg.cantidad) || 0;
  const effectiveMs = minPerPiece * qty * 60 * 1000;
  if (!effectiveMs || !qty) return null;
  const endMs = parseEffTimestamp(pkg.timestamp) || parseEffTimestamp(pkg.fecha);
  if (!endMs) return null;
  const machine = String(pkg.maquina || '').trim().toUpperCase();
  const naiveStartMs = endMs - effectiveMs;
  const intervals = downtimeByMachine[machine] || [];
  let downtimeMs = 0;
  intervals.forEach(iv => {
    const s = Math.max(iv.startMs, naiveStartMs - 6 * 3600000);
    const e = Math.min(iv.endMs, endMs);
    if (e > s) downtimeMs += Math.max(0, e - s);
  });
  let actualStartMs = naiveStartMs - downtimeMs;
  const confs = confirmacionesByMachine[machine] || [];
  if (confs.length) {
    const relevant = confs
      .filter(c => Number(c.trabajandoDesdeMs) > 0 && Number(c.trabajandoDesdeMs) <= endMs && Number(c.trabajandoDesdeMs) >= naiveStartMs - 6 * 3600000)
      .sort((a, b) => Number(b.trabajandoDesdeMs) - Number(a.trabajandoDesdeMs))[0];
    if (relevant) actualStartMs = Math.min(actualStartMs, Number(relevant.trabajandoDesdeMs));
  }
  const totalMs = Math.max(effectiveMs, endMs - actualStartMs);
  const efficiencyPct = totalMs > 0 ? Math.min(100, Math.round(effectiveMs / totalMs * 100)) : null;
  return { startMs: actualStartMs, endMs, naiveStartMs, effectiveMs, downtimeMs, totalMs, efficiencyPct };
};

const computeEfficiencyAnalysis = (raw) => {
  if (!raw) return null;
  const { packages = [], partialEvents = [], alerts = [], reportes = [], estados = [], ordersSlim = [], confirmaciones = [] } = raw;
  const ordersMap = {};
  ordersSlim.forEach(o => { if (o.id) ordersMap[o.id] = o; });
  const alertsByMachine = {};
  alerts.forEach(a => {
    const m = String(a.maquina || '').trim().toUpperCase();
    if (!m) return;
    if (!alertsByMachine[m]) alertsByMachine[m] = [];
    alertsByMachine[m].push(a);
  });
  const confirmacionesByMachine = {};
  confirmaciones.forEach(c => {
    const m = String(c.maquinaAsignada || c.maquinaOriginal || '').trim().toUpperCase();
    if (!m) return;
    if (!confirmacionesByMachine[m]) confirmacionesByMachine[m] = [];
    confirmacionesByMachine[m].push(c);
  });
  const estadosByMachine = {};
  estados.forEach(e => {
    const m = String(e.maquina || e.id || '').trim().toUpperCase();
    if (m) estadosByMachine[m] = e;
  });
  const downtimeByMachine = buildDowntimeIntervals(alertsByMachine);

  // ==== STREAM UNIFICADO DE EVENTOS DE PRODUCCIÓN ====
  // Los paquetes pueden completarse por dos rutas distintas:
  //  1) paquetes_historial    → registro directo (handleRegisterPapeleta, sin avances parciales)
  //  2) partialHistory        → avances parciales + un evento CIERRE cuando llegan al 100%
  // Si un paquete usó ambas rutas, hay que DEDUPLICAR para no sumar doble los lienzos.
  const rawEvents = [];
  packages.forEach(p => rawEvents.push({
    kind: 'FINAL_DIRECTO',
    orderId: p.orderId || '', codigo: p.codigo || '', modelo: p.modelo || '',
    partida: p.partida || '', codigoUnico: String(p.codigoUnico || '').toUpperCase(),
    pieza: p.pieza || p.piezaNombre || '', talla: p.talla || '',
    color: p.color || '', cantidad: Number(p.cantidad) || 0,
    maquina: String(p.maquina || '').toUpperCase(), diametro: p.diametro || '',
    operador: p.operador || p.tejedor || '',
    timestamp: parseEffTimestamp(p.timestamp) || parseEffTimestamp(p.fecha) || 0
  }));
  partialEvents.forEach(ev => rawEvents.push({
    kind: String(ev.tipo || '').toUpperCase() === 'CIERRE' ? 'FINAL_PARC' : 'PARCIAL',
    orderId: ev.orderId || '', codigo: ev.codigo || '', modelo: ev.modelo || '',
    partida: ev.partida || '', codigoUnico: String(ev.codigoUnico || '').toUpperCase(),
    pieza: ev.pieza || '', talla: ev.talla || '',
    color: ev.color || '', cantidad: Number(ev.cantidad) || 0,
    maquina: String(ev.maquina || '').toUpperCase(), diametro: ev.diametro || '',
    operador: ev.operador || '',
    timestamp: parseEffTimestamp(ev.timestamp) || 0
  }));

  // Deduplicar por codigoUnico
  const eventsByCode = {};
  rawEvents.forEach(e => {
    if (!e.codigoUnico) return;
    if (!eventsByCode[e.codigoUnico]) eventsByCode[e.codigoUnico] = [];
    eventsByCode[e.codigoUnico].push(e);
  });
  const productionEvents = [];
  const finishedCodes = new Set();
  Object.entries(eventsByCode).forEach(([code, evs]) => {
    const hasCierre = evs.some(e => e.kind === 'FINAL_PARC');
    const hasDirect = evs.some(e => e.kind === 'FINAL_DIRECTO');
    if (hasCierre) {
      finishedCodes.add(code);
      evs.filter(e => e.kind === 'PARCIAL' || e.kind === 'FINAL_PARC').forEach(e => productionEvents.push(e));
    } else if (hasDirect) {
      finishedCodes.add(code);
      const partialSum = evs.filter(e => e.kind === 'PARCIAL').reduce((s, e) => s + e.cantidad, 0);
      const direct = evs.find(e => e.kind === 'FINAL_DIRECTO');
      evs.filter(e => e.kind === 'PARCIAL').forEach(e => productionEvents.push(e));
      const remaining = Math.max(0, direct.cantidad - partialSum);
      if (remaining > 0) productionEvents.push({ ...direct, cantidad: remaining });
    } else {
      // Solo parciales → paquete aún en progreso
      evs.filter(e => e.kind === 'PARCIAL').forEach(e => productionEvents.push(e));
    }
  });

  const machineStats = {};
  const modelStats = {};
  const partidaStats = {};
  const defectsList = [];
  const timelinesByMachine = {};

  const addTimeline = (machine, event) => {
    const m = String(machine || '').trim().toUpperCase();
    if (!m) return;
    if (!timelinesByMachine[m]) timelinesByMachine[m] = [];
    timelinesByMachine[m].push(event);
  };

  productionEvents.forEach(p => {
    const order = ordersMap[p.orderId];
    const win = reconstructProductionWindow(p, order, downtimeByMachine, confirmacionesByMachine);
    const machine = String(p.maquina || 'SIN MQ').trim().toUpperCase() || 'SIN MQ';
    const model = String(p.codigo || p.modelo || order?.codigo || '').trim().toUpperCase();
    const partida = String(p.partida || order?.partida || '').trim().toUpperCase();
    const qty = Number(p.cantidad) || 0;

    if (!machineStats[machine]) machineStats[machine] = { machine, packages: 0, pieces: 0, effectiveMs: 0, downtimeMs: 0, totalMs: 0, models: new Set(), diameters: new Set(), partialsCount: 0 };
    machineStats[machine].packages++;
    machineStats[machine].pieces += qty;
    if (p.kind === 'PARCIAL') machineStats[machine].partialsCount++;
    if (win) { machineStats[machine].effectiveMs += win.effectiveMs; machineStats[machine].downtimeMs += win.downtimeMs; machineStats[machine].totalMs += win.totalMs; }
    if (model) machineStats[machine].models.add(model);
    if (p.diametro) machineStats[machine].diameters.add(String(p.diametro));

    if (model) {
      const mk = `${machine}|${model}`;
      if (!modelStats[mk]) modelStats[mk] = { machine, model, packages: 0, pieces: 0, effectiveMs: 0, downtimeMs: 0, totalMs: 0, partidas: new Set() };
      modelStats[mk].packages++;
      modelStats[mk].pieces += qty;
      if (win) { modelStats[mk].effectiveMs += win.effectiveMs; modelStats[mk].downtimeMs += win.downtimeMs; modelStats[mk].totalMs += win.totalMs; }
      if (partida) modelStats[mk].partidas.add(partida);
    }

    if (partida) {
      if (!partidaStats[partida]) partidaStats[partida] = { partida, packages: 0, pieces: 0, effectiveMs: 0, downtimeMs: 0, totalMs: 0, machines: new Set(), models: new Set(), pendingPackages: 0, inProgressPackages: 0, totalPackages: 0 };
      partidaStats[partida].packages++;
      partidaStats[partida].pieces += qty;
      if (win) { partidaStats[partida].effectiveMs += win.effectiveMs; partidaStats[partida].downtimeMs += win.downtimeMs; partidaStats[partida].totalMs += win.totalMs; }
      partidaStats[partida].machines.add(machine);
      if (model) partidaStats[partida].models.add(model);
    }

    // Timeline: producción
    addTimeline(machine, {
      kind: 'production',
      timestamp: p.timestamp || 0,
      title: `${p.kind === 'PARCIAL' ? '⏳ Avance parcial' : p.kind === 'FINAL_PARC' ? '✅ Cierre' : '✅ Registro final'} · ${p.cantidad} pzs`,
      subtitle: `${p.codigoUnico || ''} · ${model || 'sin modelo'}${p.pieza ? ' · ' + p.pieza : ''}${p.operador ? ' · ' + p.operador : ''}`
    });
  });

  // ==== Contar partidas pendientes / en progreso (incluso sin eventos) ====
  ordersSlim.forEach(o => {
    const pid = String(o.partida || '').trim().toUpperCase();
    if (!pid) return;
    if (!partidaStats[pid]) partidaStats[pid] = { partida: pid, packages: 0, pieces: 0, effectiveMs: 0, downtimeMs: 0, totalMs: 0, machines: new Set(), models: new Set(), pendingPackages: 0, inProgressPackages: 0, totalPackages: 0 };
    const c = o._pkgCounts || { total: 0, finished: 0, inProgress: 0 };
    partidaStats[pid].totalPackages += c.total;
    partidaStats[pid].pendingPackages += Math.max(0, c.total - c.finished);
    partidaStats[pid].inProgressPackages += c.inProgress;
    if (o.codigo) partidaStats[pid].models.add(String(o.codigo).toUpperCase());
  });

  // ==== Timeline: reportes del escáner ====
  reportes.forEach(r => {
    addTimeline(r.maquina, {
      kind: 'report',
      timestamp: Number(r.timestamp) || 0,
      title: `📋 ${r.mainStatus || 'Reporte'}${r.subStatus ? ' · ' + r.subStatus : ''}`,
      subtitle: `${r.operador || ''}${r.alerta ? ' · 🚨 ' + r.alerta : ''}${r.alerta_detalles ? ': ' + String(r.alerta_detalles).slice(0, 80) : ''}`
    });
  });

  // ==== Timeline: alertas (incluye alertas de calidad) ====
  alerts.forEach(a => {
    const isQuality = a.origen === 'ESCANER_CALIDAD' || a.tipo === 'CALIDAD_DEFECTO';
    addTimeline(a.maquina, {
      kind: isQuality ? 'quality' : 'alert',
      timestamp: parseEffTimestamp(a.timestamp) || 0,
      title: `${isQuality ? '🎯 Calidad' : '🚨 Alerta'} · ${a.defectoCodigo || a.tipo || ''}${a.defectoNombre ? ' · ' + a.defectoNombre : ''}${isQuality && a.cantidadLienzos ? ' (' + a.cantidadLienzos + ' lz)' : ''}`,
      subtitle: `${a.operador ? a.operador + ' · ' : ''}${a.detalles ? String(a.detalles).slice(0, 100) : ''}`
    });
  });

  // Ordenar timelines por timestamp descendente
  Object.values(timelinesByMachine).forEach(list => list.sort((a, b) => (b.timestamp || 0) - (a.timestamp || 0)));

  alerts.forEach(a => {
    const isQuality = a.origen === 'ESCANER_CALIDAD' || a.tipo === 'CALIDAD_DEFECTO';
    if (!isQuality) return;
    defectsList.push({
      timestamp: parseEffTimestamp(a.timestamp) || 0,
      machine: String(a.maquina || '').toUpperCase(),
      model: String(a.modelo || '').toUpperCase(),
      partida: String(a.partida || '').toUpperCase(),
      codigoUnico: String(a.codigoUnico || '').toUpperCase(),
      defectoCodigo: a.defectoCodigo || '',
      defectoNombre: a.defectoNombre || '',
      cantidadLienzos: Number(a.cantidadLienzos) || 0,
      tejedorResponsable: a.tejedorResponsable || '',
      primera: a.primera === true,
      operador: a.operador || ''
    });
  });

  const defectsByMachine = {}, defectsByPartida = {}, defectsByCode = {};
  defectsList.forEach(d => {
    if (d.machine) {
      if (!defectsByMachine[d.machine]) defectsByMachine[d.machine] = { machine: d.machine, count: 0, lienzos: 0, items: [] };
      defectsByMachine[d.machine].count++; defectsByMachine[d.machine].lienzos += d.cantidadLienzos; defectsByMachine[d.machine].items.push(d);
    }
    if (d.partida) {
      if (!defectsByPartida[d.partida]) defectsByPartida[d.partida] = { partida: d.partida, count: 0, lienzos: 0, items: [] };
      defectsByPartida[d.partida].count++; defectsByPartida[d.partida].lienzos += d.cantidadLienzos; defectsByPartida[d.partida].items.push(d);
    }
    const k = d.defectoCodigo || d.defectoNombre;
    if (k) {
      if (!defectsByCode[k]) defectsByCode[k] = { code: k, name: d.defectoNombre, count: 0, lienzos: 0 };
      defectsByCode[k].count++; defectsByCode[k].lienzos += d.cantidadLienzos;
    }
  });

  const eff = (s) => s.totalMs > 0 ? Math.min(100, Math.round(s.effectiveMs / s.totalMs * 100)) : null;
  const machines = Object.values(machineStats)
    .map(m => ({
      ...m,
      efficiency: eff(m),
      models: [...m.models],
      diameters: [...m.diameters],
      defectCount: defectsByMachine[m.machine]?.count || 0,
      defectLienzos: defectsByMachine[m.machine]?.lienzos || 0,
      currentState: estadosByMachine[m.machine] || null,
      timeline: timelinesByMachine[m.machine] || [],
      reportCount: (timelinesByMachine[m.machine] || []).filter(e => e.kind === 'report').length,
      alertCount: (timelinesByMachine[m.machine] || []).filter(e => e.kind === 'alert').length
    }))
    .sort((a, b) => (a.efficiency ?? 101) - (b.efficiency ?? 101) || b.pieces - a.pieces);

  // Incluir máquinas que solo tienen reportes/estado (sin producción en el periodo)
  // para que el análisis también muestre "máquinas activas sin tejido registrado".
  Object.keys(estadosByMachine).forEach(m => {
    if (machines.some(x => x.machine === m)) return;
    const st = estadosByMachine[m];
    machines.push({
      machine: m, packages: 0, pieces: 0, effectiveMs: 0, downtimeMs: 0, totalMs: 0,
      models: [], diameters: [String(st.diametro || '')].filter(Boolean),
      efficiency: null, defectCount: defectsByMachine[m]?.count || 0,
      defectLienzos: defectsByMachine[m]?.lienzos || 0,
      currentState: st,
      timeline: timelinesByMachine[m] || [],
      reportCount: (timelinesByMachine[m] || []).filter(e => e.kind === 'report').length,
      alertCount: (timelinesByMachine[m] || []).filter(e => e.kind === 'alert').length,
      partialsCount: 0
    });
  });

  const models = Object.values(modelStats).map(m => ({ ...m, efficiency: eff(m), partidas: [...m.partidas] })).sort((a, b) => b.pieces - a.pieces);
  const partidas = Object.values(partidaStats).map(p => ({
    ...p,
    efficiency: eff(p),
    machines: [...p.machines],
    models: [...p.models],
    defectCount: defectsByPartida[p.partida]?.count || 0,
    defectLienzos: defectsByPartida[p.partida]?.lienzos || 0,
    completionPct: p.totalPackages > 0 ? Math.round((p.totalPackages - p.pendingPackages) / p.totalPackages * 100) : null
  })).sort((a, b) => a.partida.localeCompare(b.partida));

  const avgEfficiency = machines.filter(m => m.efficiency != null).length
    ? Math.round(machines.filter(m => m.efficiency != null).reduce((s, m) => s + m.efficiency, 0) / machines.filter(m => m.efficiency != null).length)
    : null;

  return {
    period: { from: raw.dateFrom, to: raw.dateTo },
    machines, models, partidas,
    defects: { list: defectsList, byMachine: Object.values(defectsByMachine), byPartida: Object.values(defectsByPartida), byCode: Object.values(defectsByCode).sort((a, b) => b.lienzos - a.lienzos) },
    summary: {
      totalPackages: productionEvents.filter(e => e.kind !== 'PARCIAL').length,
      totalPartialEvents: productionEvents.filter(e => e.kind === 'PARCIAL').length,
      totalPieces: productionEvents.reduce((s, e) => s + (Number(e.cantidad) || 0), 0),
      totalMachines: machines.length,
      totalDefects: defectsList.length,
      totalDefectLienzos: defectsList.reduce((s, d) => s + d.cantidadLienzos, 0),
      totalReports: reportes.length,
      totalAlerts: alerts.length,
      totalPartidas: partidas.length,
      pendingPartidas: partidas.filter(p => p.pendingPackages > 0).length,
      avgEfficiency
    }
  };
};

// Payload estructurado listo para IA
const buildAIPayload = (analysis) => {
  if (!analysis) return {};
  return {
    meta: { generado: new Date().toISOString(), periodo: analysis.period, fuente: 'INGESA Logística · Análisis de Eficiencia' },
    resumen: analysis.summary,
    maquinas: analysis.machines.map(m => ({
      maquina: m.machine, diametros: m.diameters, paquetes: m.packages, piezas: m.pieces,
      eficiencia_pct: m.efficiency, minutos_efectivos: Math.round(m.effectiveMs / 60000),
      minutos_paro: Math.round(m.downtimeMs / 60000), minutos_totales: Math.round(m.totalMs / 60000),
      modelos: m.models, defectos_count: m.defectCount, defectos_lienzos: m.defectLienzos
    })),
    modelos_por_maquina: analysis.models.map(m => ({ maquina: m.machine, modelo: m.model, piezas: m.pieces, eficiencia_pct: m.efficiency, partidas: m.partidas })),
    partidas: analysis.partidas.map(p => ({ partida: p.partida, piezas: p.pieces, paquetes: p.packages, maquinas: p.machines, modelos: p.models, eficiencia_pct: p.efficiency, defectos_lienzos: p.defectLienzos })),
    defectos: analysis.defects.byCode,
    preguntas_sugeridas: [
      '¿Qué máquinas tuvieron la peor eficiencia y por qué?',
      '¿Cómo se relacionan los defectos de calidad con las fallas mecánicas?',
      '¿Qué partidas o modelos necesitan atención urgente?',
      '¿Hay patrones anómalos en los datos (tiempos imposibles, paros excesivos)?'
    ]
  };
};

// Compara eficiencia del modelo actual con el modelo que la máquina tejió antes
const computeModelComparison = (analysis) => {
  if (!analysis) return [];
  const byMachine = {};
  analysis.models.forEach(m => {
    if (!byMachine[m.machine]) byMachine[m.machine] = [];
    byMachine[m.machine].push(m);
  });
  const out = [];
  Object.entries(byMachine).forEach(([machine, models]) => {
    if (models.length < 2) return;
    models.sort((a, b) => b.pieces - a.pieces);
    const [first, second] = models;
    out.push({
      machine,
      current: { model: first.model, eff: first.efficiency, pieces: first.pieces },
      previous: { model: second.model, eff: second.efficiency, pieces: second.pieces },
      delta: (first.efficiency != null && second.efficiency != null) ? first.efficiency - second.efficiency : null
    });
  });
  return out.sort((a, b) => Math.abs(b.delta ?? 0) - Math.abs(a.delta ?? 0));
};

const MachineEfficiencyView = ({ currentUserName }) => {
  const [dateFrom, setDateFrom] = useState(() => isoDateNDaysAgo(3));
  const [dateTo, setDateTo] = useState(() => isoTodayEff());
  const [loading, setLoading] = useState(false);
  const [error, setError] = useState('');
  const [raw, setRaw] = useState(() => readEfficiencyCache());
  const [analysis, setAnalysis] = useState(null);
  const [tab, setTab] = useState('resumen');
  const [toast, setToast] = useState('');
  const [selectedMachine, setSelectedMachine] = useState(null);

  useEffect(() => { if (raw) setAnalysis(computeEfficiencyAnalysis(raw)); }, [raw]);

  const refresh = async () => {
    setLoading(true); setError('');
    try {
      const startMs = new Date(dateFrom + 'T00:00:00').getTime();
      const endMs = new Date(dateTo + 'T23:59:59').getTime();
      if (!Number.isFinite(startMs) || !Number.isFinite(endMs) || endMs <= startMs) throw new Error('Rango de fechas inválido.');

      // 1) Paquetes terminados en el rango (timestamps numéricos)
      const pkgSnap = await db.collection('paquetes_historial')
        .where('timestamp', '>=', startMs)
        .where('timestamp', '<=', endMs)
        .limit(600)
        .get();
      const packages = pkgSnap.docs.map(d => ({ id: d.id, ...d.data() }));

      // 2) Alertas del rango (fallas + calidad + produccion)
      let alerts = [];
      try {
        const aSnap = await db.collection('alertas_admin')
          .where('timestamp', '>=', startMs)
          .where('timestamp', '<=', endMs)
          .limit(500)
          .get();
        alerts = aSnap.docs.map(d => ({ id: d.id, ...d.data() }));
      } catch (e) { console.warn('[eff] alertas', e?.message || e); }

      // 3) Confirmaciones de máquina (trabajandoDesdeMs = hora firme de inicio)
      let confirmaciones = [];
      try {
        const cSnap = await db.collection('confirmaciones_maquina_tejeduria')
          .where('timestamp', '>=', startMs)
          .where('timestamp', '<=', endMs)
          .limit(300)
          .get();
        confirmaciones = cSnap.docs.map(d => ({ id: d.id, ...d.data() }));
      } catch (e) { console.warn('[eff] confirmaciones', e?.message || e); }

      // 4) Órdenes activas (para tiempo por pieza desde subPiecesData + progreso)
      let ordersSlim = [];
      const partialEvents = [];
      try {
        const oSnap = await db.collection('orders').where('status', '!=', 'ARCHIVADO').limit(250).get();
        oSnap.docs.forEach(d => {
          const data = d.data() || {};
          const progreso = Array.isArray(data.progreso) ? data.progreso : [];
          const finishedCount = progreso.filter(p => p.finished === true).length;
          const inProgressCount = progreso.filter(p => Number(p.partialQuantity) > 0 && p.finished !== true).length;
          ordersSlim.push({
            id: d.id,
            codigo: data.codigo || data.modelo || '',
            partida: data.partida || '',
            cliente: data.cliente || '',
            color: data.color || '',
            diametro: data.diametro || '',
            maquina: data.maquina || '',
            status: data.status || 'ACTIVO',
            subPiecesData: (data.subPiecesData || []).map(p => ({
              pieza: p.pieza || p.descripcion || '', talla: p.talla || '', tiempo: p.tiempo || 0, peso: p.peso || 0
            })),
            _pkgCounts: { total: progreso.length, finished: finishedCount, inProgress: inProgressCount }
          });
          // Extraer eventos parciales dentro del rango (para no inflar la caché)
          progreso.forEach(p => {
            const history = Array.isArray(p.partialHistory) ? p.partialHistory : [];
            history.forEach(h => {
              const ts = Number(h.timestamp) || 0;
              if (!ts || ts < startMs || ts > endMs) return;
              partialEvents.push({
                orderId: d.id,
                codigo: data.codigo || data.modelo || '',
                modelo: data.codigo || data.modelo || '',
                partida: data.partida || '',
                codigoUnico: String(p.codigoUnico || '').toUpperCase(),
                pieza: p.piezaNombre || '',
                talla: p.talla || '',
                color: data.color || '',
                cantidad: Number(h.qty) || 0,
                tipo: h.tipo || 'PARCIAL',
                totalPackage: Number(h.totalPackage) || 0,
                operador: h.operatorName || '',
                maquina: String(h.maquina || p.maquina || data.maquina || '').toUpperCase(),
                diametro: data.diametro || '',
                timestamp: ts,
                estado: h.estado || ''
              });
            });
          });
        });
      } catch (e) { console.warn('[eff] orders/partials', e?.message || e); }

      // 5) Reportes de operadores (estados reportados al escáner)
      let reportes = [];
      try {
        const rSnap = await db.collection('reportes_operadores')
          .where('fecha', '>=', new Date(startMs))
          .where('fecha', '<=', new Date(endMs))
          .limit(400).get();
        reportes = rSnap.docs.map(d => {
          const data = d.data() || {};
          return {
            maquina: String(data.maquina || '').toUpperCase(),
            mainStatus: data.mainStatus || '',
            subStatus: data.subStatus || '',
            alerta: data.alerta || '',
            alerta_detalles: data.alerta_detalles || '',
            operador: data.operador || '',
            origen: data.origen || '',
            timestamp: parseEffTimestamp(data.fecha) || 0
          };
        });
      } catch (e) { console.warn('[eff] reportes_operadores', e?.message || e); }

      // 6) Estados actuales por máquina
      let estados = [];
      try {
        const eSnap = await db.collection('maquinas_estado').get();
        estados = eSnap.docs.map(d => {
          const data = d.data() || {};
          return {
            maquina: String(d.id || '').toUpperCase(),
            estado_actual: data.estado_actual || '',
            sub_estado: data.sub_estado || '',
            responsable: data.responsable || '',
            modelo_tejiendo: data.modelo_tejiendo || '',
            color_tejiendo: data.color_tejiendo || '',
            ultima_actualizacion: parseEffTimestamp(data.ultima_actualizacion) || 0
          };
        });
      } catch (e) { console.warn('[eff] maquinas_estado', e?.message || e); }

      const next = { dateFrom, dateTo, packages, partialEvents, alerts, reportes, estados, confirmaciones, ordersSlim };
      setRaw(next);
      setAnalysis(computeEfficiencyAnalysis(next));
      writeEfficiencyCache(next);
      setToast(`Actualizado · ${packages.length + partialEvents.length} eventos · ${alerts.length} alertas · ${reportes.length} reportes`);
      setTimeout(() => setToast(''), 2800);
    } catch (e) {
      console.error('[eff refresh]', e);
      setError(e?.message || String(e));
    } finally { setLoading(false); }
  };

  const downloadJSON = () => {
    if (!analysis) return;
    const payload = buildAIPayload(analysis);
    const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = `INGESA_Eficiencia_${analysis.period.from}_a_${analysis.period.to}.json`;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
    setToast('JSON descargado'); setTimeout(() => setToast(''), 2000);
  };

  const copyJSON = async () => {
    if (!analysis) return;
    const payload = buildAIPayload(analysis);
    const text = JSON.stringify(payload, null, 2);
    try {
      await navigator.clipboard.writeText(text);
    } catch (e) {
      const ta = document.createElement('textarea'); ta.value = text; document.body.appendChild(ta); ta.select();
      try { document.execCommand('copy'); } catch (er) {}
      ta.remove();
    }
    setToast('JSON copiado al portapapeles');
    setTimeout(() => setToast(''), 2200);
  };

  const sendToAI = async (provider) => {
    if (!analysis) return;
    const fullJSON = JSON.stringify(buildAIPayload(analysis), null, 2);
    const shortPrompt = buildShortAIPrompt(analysis);
    try {
      await navigator.clipboard.writeText(fullJSON);
      setToast(`JSON copiado · Pega con Ctrl+V en ${provider.name}`);
      setTimeout(() => setToast(''), 4000);
    } catch (e) {
      const ta = document.createElement('textarea'); ta.value = fullJSON; document.body.appendChild(ta); ta.select();
      try { document.execCommand('copy'); } catch (er) {}
      ta.remove();
      setToast(`JSON copiado · Pega con Ctrl+V en ${provider.name}`);
      setTimeout(() => setToast(''), 4000);
    }
    let url = provider.url;
    if (provider.prefill && shortPrompt.length < 7500) {
      url += (url.includes('?') ? '&' : '?') + 'q=' + encodeURIComponent(shortPrompt);
    }
    window.open(url, '_blank', 'noopener');
  };

  const exportPDF = () => {
    const PDF = window.jspdf?.jsPDF;
    if (!PDF || !analysis) return;
    const doc = new PDF({ orientation: 'portrait', unit: 'mm', format: 'letter' });
    const M = 12, W = doc.internal.pageSize.getWidth();
    doc.setFillColor(15, 118, 110); doc.rect(0, 0, W, 16, 'F');
    doc.setTextColor(255, 255, 255); doc.setFont('helvetica', 'bold'); doc.setFontSize(15);
    doc.text('INGESA · ANÁLISIS DE EFICIENCIA', M, 10.5);
    doc.setTextColor(0, 0, 0); doc.setFontSize(11); doc.setFont('helvetica', 'normal');
    doc.text(`Periodo: ${analysis.period.from} → ${analysis.period.to}`, M, 24);
    doc.text(`Generado por: ${(currentUserName || 'DEV').toUpperCase()} · ${new Date().toLocaleString('es-MX')}`, M, 30);

    const s = analysis.summary;
    const sumBody = [
      ['Máquinas analizadas', String(s.totalMachines)],
      ['Paquetes tejidos', String(s.totalPackages)],
      ['Piezas tejidas', String(s.totalPieces)],
      ['Eficiencia promedio', s.avgEfficiency != null ? s.avgEfficiency + '%' : '—'],
      ['Defectos de calidad', `${s.totalDefects} registros · ${s.totalDefectLienzos} lienzos`]
    ];
    doc.autoTable({ startY: 36, head: [['Métrica', 'Valor']], body: sumBody, theme: 'grid',
      headStyles: { fillColor: [30, 41, 59], textColor: [255, 255, 255], fontStyle: 'bold' },
      styles: { fontSize: 9, cellPadding: 1.6 }, margin: { left: M, right: M }, tableWidth: W - M * 2 });

    let y = doc.lastAutoTable.finalY + 6;
    doc.setFont('helvetica', 'bold'); doc.setFontSize(11); doc.text('Eficiencia por máquina', M, y); y += 3;
    const machineBody = analysis.machines.map(m => [
      m.machine, String(m.pieces), m.efficiency != null ? m.efficiency + '%' : '—',
      Math.round(m.effectiveMs / 60000) + ' min', Math.round(m.downtimeMs / 60000) + ' min',
      String(m.defectLienzos)
    ]);
    doc.autoTable({ startY: y + 2, head: [['Máquina', 'Piezas', 'Eficiencia', 'Tiempo efectivo', 'Paro estimado', 'Defectos (lz)']], body: machineBody, theme: 'grid',
      headStyles: { fillColor: [15, 118, 110], textColor: [255, 255, 255], fontStyle: 'bold' },
      styles: { fontSize: 8.5, cellPadding: 1.5 }, margin: { left: M, right: M }, tableWidth: W - M * 2 });

    y = doc.lastAutoTable.finalY + 6;
    if (y > doc.internal.pageSize.getHeight() - 50) { doc.addPage(); y = M; }
    doc.setFont('helvetica', 'bold'); doc.setFontSize(11); doc.text('Partidas del periodo', M, y); y += 3;
    const partidaBody = analysis.partidas.map(p => [
      p.partida, String(p.pieces), String(p.packages), p.machines.join(', '),
      p.efficiency != null ? p.efficiency + '%' : '—', String(p.defectLienzos)
    ]);
    doc.autoTable({ startY: y + 2, head: [['Partida', 'Piezas', 'Paquetes', 'Máquinas', 'Eficiencia', 'Defectos (lz)']], body: partidaBody, theme: 'grid',
      headStyles: { fillColor: [124, 58, 237], textColor: [255, 255, 255], fontStyle: 'bold' },
      styles: { fontSize: 8.5, cellPadding: 1.5 }, margin: { left: M, right: M }, tableWidth: W - M * 2 });

    y = doc.lastAutoTable.finalY + 6;
    if (y > doc.internal.pageSize.getHeight() - 40) { doc.addPage(); y = M; }
    doc.setFont('helvetica', 'bold'); doc.setFontSize(11); doc.text('Defectos por código', M, y); y += 3;
    const defBody = analysis.defects.byCode.slice(0, 20).map(d => [d.code, d.name || '—', String(d.count), String(d.lienzos)]);
    doc.autoTable({ startY: y + 2, head: [['Código', 'Defecto', 'Registros', 'Lienzos']], body: defBody, theme: 'grid',
      headStyles: { fillColor: [185, 28, 28], textColor: [255, 255, 255], fontStyle: 'bold' },
      styles: { fontSize: 8.5, cellPadding: 1.5 }, margin: { left: M, right: M }, tableWidth: W - M * 2 });

    doc.save(`INGESA_Eficiencia_${analysis.period.from}_${analysis.period.to}.pdf`);
    setToast('PDF descargado'); setTimeout(() => setToast(''), 2200);
  };

  const modelComparison = useMemo(() => computeModelComparison(analysis), [analysis]);

  const fmtMin = (ms) => Math.round(Number(ms || 0) / 60000);

  // Sin datos → pantalla inicial
  if (!analysis) {
    return (
      <div className="p-5 max-w-4xl mx-auto space-y-4">
        <div className="rounded-2xl border-2 border-emerald-700/60 bg-gradient-to-br from-emerald-950/40 to-slate-900 p-5">
          <div className="flex items-center gap-2 text-[11px] font-black uppercase tracking-widest text-emerald-300">
            <Icon name="brain" size={16}/> Eficiencia IA · DEV
          </div>
          <h2 className="mt-1 text-2xl font-black text-white">Análisis inteligente de máquinas</h2>
          <p className="mt-2 text-sm text-slate-300 leading-relaxed">
            Reconstruye tiempos reales de producción usando paquetes, fallas y confirmaciones del escáner.
            Descarga PDF/JSON y envíalo a tu IA favorita para interpretar los datos.
          </p>
          <div className="mt-3 text-[10px] text-emerald-200/80">
            Se consulta bajo demanda (≈5 lecturas puntuales por análisis). Caché de 15 min.
          </div>
        </div>
        <div className="grid grid-cols-2 gap-3">
          <label className="text-[10px] font-black uppercase tracking-widest text-slate-400">
            Desde
            <input type="date" value={dateFrom} onChange={e => setDateFrom(e.target.value)} className="mt-1 w-full p-3 bg-slate-900 border border-slate-700 rounded-xl text-white text-sm font-bold"/>
          </label>
          <label className="text-[10px] font-black uppercase tracking-widest text-slate-400">
            Hasta
            <input type="date" value={dateTo} onChange={e => setDateTo(e.target.value)} className="mt-1 w-full p-3 bg-slate-900 border border-slate-700 rounded-xl text-white text-sm font-bold"/>
          </label>
        </div>
        <button onClick={refresh} disabled={loading} className="w-full py-4 bg-emerald-600 hover:bg-emerald-500 disabled:opacity-50 text-white font-black rounded-xl text-base flex items-center justify-center gap-2">
          <Icon name="refresh-cw" size={18}/> {loading ? 'Analizando…' : 'Analizar periodo'}
        </button>
        {error && <div className="rounded-xl border border-red-700 bg-red-950/40 p-3 text-xs font-bold text-red-200">{error}</div>}
        {toast && <div className="text-center text-xs font-black text-emerald-300">{toast}</div>}
      </div>
    );
  }

  return (
    <div className="p-4 pb-8 max-w-5xl mx-auto space-y-4">
      {toast && <div className="fixed top-3 left-1/2 -translate-x-1/2 z-[999] px-4 py-2 rounded-xl bg-emerald-800 border border-emerald-500 text-emerald-100 text-xs font-black shadow-2xl">{toast}</div>}

      <div className="rounded-2xl border border-emerald-700/60 bg-gradient-to-br from-emerald-950/40 to-slate-900 p-4">
        <div className="flex items-center justify-between gap-2">
          <div className="min-w-0">
            <div className="text-[10px] font-black uppercase tracking-widest text-emerald-300">Eficiencia IA · DEV</div>
            <div className="mt-1 text-xs text-slate-400">Periodo {analysis.period.from} → {analysis.period.to}</div>
          </div>
          <button onClick={refresh} disabled={loading} className="shrink-0 rounded-lg bg-emerald-600 hover:bg-emerald-500 disabled:opacity-50 px-3 py-2 text-[11px] font-black text-white flex items-center gap-1">
            <Icon name="refresh-cw" size={14}/> {loading ? '…' : 'Actualizar'}
          </button>
        </div>
        <div className="mt-3 grid grid-cols-2 gap-2">
          <input type="date" value={dateFrom} onChange={e => setDateFrom(e.target.value)} className="p-2 bg-slate-900 border border-slate-700 rounded-lg text-white text-xs font-bold"/>
          <input type="date" value={dateTo} onChange={e => setDateTo(e.target.value)} className="p-2 bg-slate-900 border border-slate-700 rounded-lg text-white text-xs font-bold"/>
        </div>
      </div>

      <div className="grid grid-cols-2 gap-2">
        <div className="rounded-xl border border-slate-800 bg-slate-900 p-3 text-center">
          <div className="text-[9px] font-black uppercase tracking-widest text-slate-500">Piezas</div>
          <div className="text-2xl font-black text-white">{analysis.summary.totalPieces}</div>
        </div>
        <div className="rounded-xl border border-slate-800 bg-slate-900 p-3 text-center">
          <div className="text-[9px] font-black uppercase tracking-widest text-slate-500">Eficiencia prom.</div>
          <div className="text-2xl font-black text-emerald-300">{analysis.summary.avgEfficiency != null ? analysis.summary.avgEfficiency + '%' : '—'}</div>
        </div>
      </div>

      <div className="flex border-b border-slate-800 overflow-x-auto">
        {[['resumen','Resumen'],['maquinas','Máquinas'],['modelos','Modelos'],['partidas','Partidas'],['defectos','Defectos']].map(([id,label]) => (
          <button key={id} onClick={() => setTab(id)} className={`shrink-0 px-3 py-2 text-xs font-black border-b-2 ${tab === id ? 'border-emerald-500 text-emerald-300' : 'border-transparent text-slate-400 hover:text-white'}`}>{label}</button>
        ))}
      </div>

      {tab === 'resumen' && (
        <div className="space-y-3">
          {modelComparison.length > 0 && (
            <div className="rounded-xl border border-amber-700/60 bg-amber-950/30 p-3">
              <div className="text-[10px] font-black uppercase tracking-widest text-amber-300 mb-2">Comparativa: modelo actual vs. anterior por máquina</div>
              <div className="space-y-2">
                {modelComparison.slice(0, 6).map(c => (
                  <div key={c.machine} className="rounded-lg bg-slate-950/60 p-2 text-[11px]">
                    <div className="font-black text-white">{c.machine}</div>
                    <div className="text-slate-400 mt-1">
                      <b className="text-emerald-300">{c.current.model}</b> · {c.current.eff ?? '?'}% vs.
                      <b className="text-slate-300 ml-1">{c.previous.model}</b> · {c.previous.eff ?? '?'}%
                      {c.delta != null && <span className={`ml-2 font-black ${c.delta < 0 ? 'text-rose-400' : 'text-emerald-400'}`}>{c.delta > 0 ? '▲' : '▼'} {Math.abs(c.delta)}%</span>}
                    </div>
                  </div>
                ))}
              </div>
            </div>
          )}
          <div className="rounded-xl border border-slate-800 bg-slate-900 p-3">
            <div className="text-[10px] font-black uppercase tracking-widest text-slate-500 mb-2">Top / bottom máquinas</div>
            <div className="space-y-1">
              {analysis.machines.filter(m => m.efficiency != null).slice(0, 3).map(m => <div key={m.machine} className="text-xs text-emerald-300">✅ {m.machine} · {m.efficiency}% · {m.pieces} pzs</div>)}
              {analysis.machines.filter(m => m.efficiency != null).length > 3 && analysis.machines.filter(m => m.efficiency != null).slice(-3).reverse().map(m => <div key={m.machine} className="text-xs text-rose-300">⚠ {m.machine} · {m.efficiency}% · {m.pieces} pzs</div>)}
              {analysis.machines.filter(m => m.efficiency == null).length > 0 && <div className="text-[10px] text-slate-500 italic">+ {analysis.machines.filter(m => m.efficiency == null).length} máquina(s) con actividad pero sin eficiencia calculable</div>}
            </div>
          </div>
          {analysis.summary.totalPartidas > 0 && (
            <div className="rounded-xl border border-purple-700/60 bg-purple-950/30 p-3">
              <div className="text-[10px] font-black uppercase tracking-widest text-purple-300 mb-1">Partidas activas</div>
              <div className="text-xs text-slate-300"><b className="text-white">{analysis.summary.totalPartidas}</b> partidas · <b className="text-amber-300">{analysis.summary.pendingPartidas}</b> aún con paquetes pendientes</div>
            </div>
          )}
          <div className="rounded-xl border border-cyan-700/60 bg-cyan-950/30 p-3">
            <div className="text-[10px] font-black uppercase tracking-widest text-cyan-300 mb-1">Actividad del periodo</div>
            <div className="text-xs text-slate-300">
              📋 {analysis.summary.totalReports} reportes de estado · 🚨 {analysis.summary.totalAlerts} alertas · ⏳ {analysis.summary.totalPartialEvents} avances parciales
            </div>
          </div>
        </div>
      )}

      {tab === 'maquinas' && (
        <div className="space-y-2">
          {analysis.machines.map(m => {
            const st = m.currentState;
            return (
            <div key={m.machine} className="rounded-xl border border-slate-800 bg-slate-900 p-3">
              <div className="flex items-center justify-between gap-2">
                <div className="font-black text-white">MQ {m.machine}</div>
                <div className={`text-sm font-black ${m.efficiency == null ? 'text-slate-400' : m.efficiency >= 80 ? 'text-emerald-300' : m.efficiency >= 60 ? 'text-amber-300' : 'text-rose-300'}`}>{m.efficiency != null ? m.efficiency + '%' : '—'}</div>
              </div>
              {st && (
                <div className="mt-1 rounded-lg bg-slate-950 border border-slate-800 p-2">
                  <div className="text-[9px] uppercase font-black text-slate-500">Estado actual</div>
                  <div className="text-xs font-bold text-white">{st.estado_actual || '—'}{st.sub_estado ? <span className="text-slate-400"> · {st.sub_estado}</span> : ''}</div>
                  {st.modelo_tejiendo && <div className="text-[10px] text-slate-400">Tejiendo: <b className="text-slate-200">{st.modelo_tejiendo}</b>{st.color_tejiendo ? ' · ' + st.color_tejiendo : ''}</div>}
                  {st.responsable && <div className="text-[10px] text-slate-500">Resp: {st.responsable}{st.ultima_actualizacion ? ' · ' + new Date(st.ultima_actualizacion).toLocaleString('es-MX', { day:'2-digit', month:'short', hour:'2-digit', minute:'2-digit' }) : ''}</div>}
                </div>
              )}
              <div className="mt-2 grid grid-cols-4 gap-2 text-[10px] text-slate-400">
                <div><span className="text-slate-500">Piezas</span> <b className="text-white">{m.pieces}</b></div>
                <div><span className="text-slate-500">Paq</span> <b className="text-white">{m.packages}</b></div>
                <div><span className="text-slate-500">Efectivo</span> <b className="text-white">{fmtMin(m.effectiveMs)}m</b></div>
                <div><span className="text-slate-500">Paro</span> <b className="text-white">{fmtMin(m.downtimeMs)}m</b></div>
              </div>
              <div className="mt-1 flex flex-wrap gap-2 text-[10px]">
                {m.partialsCount > 0 && <span className="text-sky-300">⏳ {m.partialsCount} avances parciales</span>}
                {m.reportCount > 0 && <span className="text-cyan-300">📋 {m.reportCount} reportes</span>}
                {m.alertCount > 0 && <span className="text-amber-300">🚨 {m.alertCount} alertas</span>}
                {m.defectLienzos > 0 && <span className="text-rose-300">🎯 {m.defectLienzos} lz con defecto</span>}
              </div>
              {m.models.length > 0 && <div className="mt-1 text-[10px] text-slate-500 truncate">Modelos: {m.models.join(', ')}</div>}
              <button onClick={() => setSelectedMachine(m)} className="mt-2 w-full py-2 rounded-lg bg-slate-800 hover:bg-slate-700 border border-slate-700 text-white text-[10px] font-black flex items-center justify-center gap-1">
                <Icon name="list" size={12}/> Ver timeline completo ({m.timeline.length} eventos)
              </button>
            </div>
            );
          })}
        </div>
      )}

      {tab === 'modelos' && (
        <div className="space-y-2">
          {analysis.models.map(m => (
            <div key={`${m.machine}|${m.model}`} className="rounded-xl border border-slate-800 bg-slate-900 p-3 flex items-center justify-between gap-2">
              <div className="min-w-0">
                <div className="font-black text-white truncate">{m.model}</div>
                <div className="text-[10px] text-slate-500">MQ {m.machine} · {m.pieces} piezas · partidas: {m.partidas.join(', ') || '—'}</div>
              </div>
              <div className={`text-sm font-black shrink-0 ${m.efficiency == null ? 'text-slate-400' : m.efficiency >= 80 ? 'text-emerald-300' : 'text-amber-300'}`}>{m.efficiency != null ? m.efficiency + '%' : '—'}</div>
            </div>
          ))}
        </div>
      )}

      {tab === 'partidas' && (
        <div className="space-y-2">
          {analysis.partidas.map(p => {
            const done = Math.max(0, (p.totalPackages || 0) - (p.pendingPackages || 0));
            return (
            <div key={p.partida} className="rounded-xl border border-slate-800 bg-slate-900 p-3">
              <div className="flex items-center justify-between gap-2">
                <div className="font-black text-white">{p.partida}</div>
                <div className="text-sm font-black text-purple-300">{p.efficiency != null ? p.efficiency + '%' : '—'}</div>
              </div>
              <div className="mt-1 text-[10px] text-slate-400">
                {p.pieces} piezas producidas · {p.packages} eventos
              </div>
              {p.totalPackages > 0 && (
                <div className="mt-2 rounded-lg bg-slate-950 border border-slate-800 p-2">
                  <div className="flex items-center justify-between gap-2 text-[10px]">
                    <span className="font-black text-slate-300">Progreso paquetes</span>
                    <span className="font-black text-white">{done} / {p.totalPackages} <span className="text-slate-500">({p.completionPct ?? 0}%)</span></span>
                  </div>
                  <div className="mt-1 h-1.5 rounded-full overflow-hidden bg-slate-800">
                    <div className="h-full bg-emerald-500" style={{ width: `${p.completionPct ?? 0}%` }} />
                  </div>
                  {(p.pendingPackages > 0 || p.inProgressPackages > 0) && (
                    <div className="mt-1 flex flex-wrap gap-2 text-[10px]">
                      {p.pendingPackages > 0 && <span className="text-amber-300">⏸ {p.pendingPackages} sin empezar</span>}
                      {p.inProgressPackages > 0 && <span className="text-sky-300">⏳ {p.inProgressPackages} en progreso</span>}
                    </div>
                  )}
                </div>
              )}
              <div className="mt-1 text-[10px] text-slate-500 truncate">MQ: {p.machines.join(', ') || '—'}</div>
              {p.defectLienzos > 0 && <div className="mt-1 text-[10px] text-rose-300">⚠ {p.defectLienzos} lienzos con defecto</div>}
            </div>
            );
          })}
        </div>
      )}

      {tab === 'defectos' && (
        <div className="space-y-2">
          {analysis.defects.byCode.length === 0 && <div className="text-center text-slate-500 py-8 text-sm">Sin defectos en el periodo.</div>}
          {analysis.defects.byCode.map(d => (
            <div key={d.code} className="rounded-xl border border-slate-800 bg-slate-900 p-3 flex items-center justify-between gap-2">
              <div className="min-w-0">
                <div className="font-black text-white truncate"><span className="text-fuchsia-300 font-mono text-xs">{d.code}</span> · {d.name || '—'}</div>
                <div className="text-[10px] text-slate-500">{d.count} registros</div>
              </div>
              <div className="text-sm font-black text-rose-300 shrink-0">{d.lienzos} lz</div>
            </div>
          ))}
        </div>
      )}

      {selectedMachine && (
        <div className="fixed inset-0 z-[500] bg-black/90 backdrop-blur-md flex items-end sm:items-center justify-center p-3" onClick={() => setSelectedMachine(null)}>
          <div className="w-full max-w-lg max-h-[92vh] overflow-y-auto rounded-2xl border-2 border-emerald-600 bg-slate-900" onClick={e => e.stopPropagation()}>
            <div className="sticky top-0 bg-emerald-700 p-4 flex items-center justify-between z-10">
              <div className="min-w-0">
                <div className="text-[10px] font-black uppercase tracking-widest text-emerald-100">Timeline · MQ {selectedMachine.machine}</div>
                <div className="text-lg font-black text-white truncate">{selectedMachine.currentState?.estado_actual || 'Sin estado actual'}</div>
                <div className="text-[10px] text-emerald-100/80">{selectedMachine.timeline.length} eventos en el periodo</div>
              </div>
              <button onClick={() => setSelectedMachine(null)} className="w-9 h-9 rounded-full bg-black/30 text-white font-black shrink-0 ml-2">✕</button>
            </div>
            <div className="p-3 space-y-1.5">
              {selectedMachine.timeline.length === 0 && (
                <div className="text-center text-slate-500 text-xs py-8">Sin eventos registrados en el periodo.</div>
              )}
              {selectedMachine.timeline.map((ev, i) => {
                const cls = ev.kind === 'report' ? 'border-cyan-700/60 bg-cyan-950/30 text-cyan-100'
                  : ev.kind === 'alert' ? 'border-rose-700/60 bg-rose-950/30 text-rose-100'
                  : ev.kind === 'quality' ? 'border-fuchsia-700/60 bg-fuchsia-950/30 text-fuchsia-100'
                  : 'border-emerald-700/60 bg-emerald-950/30 text-emerald-100';
                return (
                  <div key={i} className={`rounded-lg border p-2 ${cls}`}>
                    <div className="text-[11px] font-black leading-tight">{ev.title || 'Evento'}</div>

                    <div className="text-[9px] opacity-60 mt-0.5 font-mono">{ev.timestamp ? new Date(ev.timestamp).toLocaleString('es-MX', { day:'2-digit', month:'short', hour:'2-digit', minute:'2-digit' }) : 'sin hora'}</div>

/* ============ CALIDAD SEMANAL (usuarios · vista de solo lectura) ============ */
const CALIDAD_WEEK_CACHE_KEY = 'ingesa_calidad_week_v1';
const CALIDAD_WEEK_CACHE_MAX_WEEKS = 12;

const getMondayOfWeek = (date) => {
  const d = new Date(date);
  d.setHours(0, 0, 0, 0);
  const day = d.getDay();
  const diff = day === 0 ? -6 : 1 - day;
  d.setDate(d.getDate() + diff);
  return d;
};
const weekKeyFromMonday = (monday) => `${monday.getFullYear()}-${String(monday.getMonth() + 1).padStart(2, '0')}-${String(monday.getDate()).padStart(2, '0')}`;
const getWeekRange = (offset) => {
  const monday = getMondayOfWeek(new Date());
  monday.setDate(monday.getDate() + offset * 7);
  const friday = new Date(monday);
  friday.setDate(monday.getDate() + 4);
  friday.setHours(23, 59, 59, 999);
  return { monday, friday, weekKey: weekKeyFromMonday(monday) };
};

const readCalidadWeekCache = (weekKey) => {
  try {
    const raw = localStorage.getItem(CALIDAD_WEEK_CACHE_KEY);
    if (!raw) return null;
    const all = JSON.parse(raw) || {};
    const entry = all[weekKey];
    if (!entry || !Array.isArray(entry.items)) return null;
    return entry;
  } catch (e) { return null; }
};
const writeCalidadWeekCache = (weekKey, items) => {
  try {
    const raw = localStorage.getItem(CALIDAD_WEEK_CACHE_KEY);
    const all = raw ? (JSON.parse(raw) || {}) : {};
    all[weekKey] = { savedAt: Date.now(), items };
    const keys = Object.keys(all).sort();
    if (keys.length > CALIDAD_WEEK_CACHE_MAX_WEEKS) keys.slice(0, keys.length - CALIDAD_WEEK_CACHE_MAX_WEEKS).forEach(k => delete all[k]);
    localStorage.setItem(CALIDAD_WEEK_CACHE_KEY, JSON.stringify(all));
  } catch (e) {
    try {
      const victims = [];
      for (let i = 0; i < localStorage.length; i++) {
        const k = localStorage.key(i);
        if (k && (k.startsWith('ingesa_log_img_v1:') || k.startsWith('ingesa_image_v2:'))) victims.push(k);
      }
      victims.forEach(k => { try { localStorage.removeItem(k); } catch (er) {} });
      const raw = localStorage.getItem(CALIDAD_WEEK_CACHE_KEY);
      const all = raw ? (JSON.parse(raw) || {}) : {};
      all[weekKey] = { savedAt: Date.now(), items };
      localStorage.setItem(CALIDAD_WEEK_CACHE_KEY, JSON.stringify(all));
    } catch (er) { console.warn('[calidad week cache] quota', er); }
  }
};

const isCalidadAlerta = (a) => !!(a && (a.origen === 'ESCANER_CALIDAD' || a.tipo === 'CALIDAD_DEFECTO'));

// Analiza los registros del escáner de calidad de una semana y agrupa por:
//   - máquina   (con modelo top + tejedor top de ese modelo)
//   - modelo    (con máquina top + tejedor top)
//   - tejedor   (con máquina top + modelo top)
//   - defecto   (global)
// Todo ordenado por lienzos (y en empate por registros).
const analyzeCalidadWeek = (items) => {
  const list = (items || []).filter(isCalidadAlerta);
  const byMachine = {}, byModel = {}, byWeaver = {}, byDefect = {};
  let totalLienzos = 0, totalRegistros = 0;
  const addTo = (obj, key) => { if (!obj[key]) obj[key] = { count: 0, lienzos: 0 }; obj[key].count++; return obj[key]; };

  list.forEach(a => {
    const lienzos = Number(a.cantidadLienzos) || 0;
    const machine = String(a.maquina || 'SIN MQ').trim().toUpperCase() || 'SIN MQ';
    const model = String(a.modelo || 'SIN MODELO').trim().toUpperCase() || 'SIN MODELO';
    const weaver = String(a.tejedorResponsable || '').trim().toUpperCase() || 'SIN TEJEDOR';
    const defectKey = String(a.defectoCodigo || a.defectoNombre || 'SIN DEFECTO');
    const defectName = String(a.defectoNombre || '');
    const ts = Number(a.timestamp) || 0;

    totalRegistros++;
    totalLienzos += lienzos;

    if (!byMachine[machine]) byMachine[machine] = { key: machine, count: 0, lienzos: 0, models: {}, weavers: {}, defects: {}, items: [] };
    byMachine[machine].count++;
    byMachine[machine].lienzos += lienzos;
    addTo(byMachine[machine].models, model).lienzos += lienzos;
    addTo(byMachine[machine].weavers, weaver).lienzos += lienzos;
    const mDef = addTo(byMachine[machine].defects, defectKey);
    mDef.lienzos += lienzos; if (defectName) mDef.name = defectName;
    byMachine[machine].items.push({ ...a, _lienzos: lienzos, _ts: ts, _model: model, _weaver: weaver, _defect: defectKey });

    if (!byModel[model]) byModel[model] = { key: model, count: 0, lienzos: 0, machines: {}, weavers: {}, defects: {} };
    byModel[model].count++;
    byModel[model].lienzos += lienzos;
    addTo(byModel[model].machines, machine).lienzos += lienzos;
    addTo(byModel[model].weavers, weaver).lienzos += lienzos;
    const moDef = addTo(byModel[model].defects, defectKey);
    moDef.lienzos += lienzos; if (defectName) moDef.name = defectName;

    if (!byWeaver[weaver]) byWeaver[weaver] = { key: weaver, count: 0, lienzos: 0, machines: {}, models: {}, defects: {} };
    byWeaver[weaver].count++;
    byWeaver[weaver].lienzos += lienzos;
    addTo(byWeaver[weaver].machines, machine).lienzos += lienzos;
    addTo(byWeaver[weaver].models, model).lienzos += lienzos;
    const wDef = addTo(byWeaver[weaver].defects, defectKey);
    wDef.lienzos += lienzos; if (defectName) wDef.name = defectName;

    if (!byDefect[defectKey]) byDefect[defectKey] = { code: defectKey, name: defectName, count: 0, lienzos: 0 };
    byDefect[defectKey].count++;
    byDefect[defectKey].lienzos += lienzos;
    if (defectName) byDefect[defectKey].name = defectName;
  });

  const topN = (obj, n = 1) => Object.entries(obj || {}).map(([key, v]) => ({ key, ...v })).sort((a, b) => b.lienzos - a.lienzos || b.count - a.count).slice(0, n);
  const sortList = (obj, extras = () => ({})) => Object.entries(obj || {}).map(([key, v]) => ({ key, ...v, ...extras(v) })).sort((a, b) => b.lienzos - a.lienzos || b.count - a.count);

  const machines = sortList(byMachine, (v) => {
    const topModel = topN(v.models, 1)[0] || null;
    // Tejedor con más lienzos DENTRO del modelo top en ESTA máquina
    // (petición explícita: "cuántas sacó cada tejedor de ese modelo en esa máquina específicamente").
    let weaverOfTopModel = null;
    if (topModel && Array.isArray(v.items)) {
      const per = {};
      v.items.forEach(it => {
        if (it._model !== topModel.key) return;
        const w = it._weaver;
        if (!per[w]) per[w] = { key: w, count: 0, lienzos: 0 };
        per[w].count++;
        per[w].lienzos += it._lienzos || 0;
      });
      weaverOfTopModel = Object.values(per).sort((a, b) => b.lienzos - a.lienzos || b.count - a.count)[0] || null;
    }
    return {
      topModel,
      topWeaver: topN(v.weavers, 1)[0] || null,
      topDefect: topN(v.defects, 1)[0] || null,
      weaverOfTopModel
    };
  });

  const models = sortList(byModel, (v) => ({
    topMachine: topN(v.machines, 1)[0] || null,
    topWeaver: topN(v.weavers, 1)[0] || null,
    topDefect: topN(v.defects, 1)[0] || null
  }));

  const weavers = sortList(byWeaver, (v) => ({
    topMachine: topN(v.machines, 1)[0] || null,
    topModel: topN(v.models, 1)[0] || null,
    topDefect: topN(v.defects, 1)[0] || null
  }));

  const defects = Object.values(byDefect).sort((a, b) => b.lienzos - a.lienzos || b.count - a.count);

  return { list, totalRegistros, totalLienzos, machines, models, weavers, defects };
};

const CalidadSemanalView = () => {
  const [weekOffset, setWeekOffset] = useState(0);
  const [tab, setTab] = useState('maquinas');
  const [rawItems, setRawItems] = useState([]);
  const [loading, setLoading] = useState(true);
  const [error, setError] = useState('');
  const [toast, setToast] = useState('');
  const [detail, setDetail] = useState(null);
  const unsubRef = useRef(null);

  const { monday, friday, weekKey } = useMemo(() => getWeekRange(weekOffset), [weekOffset]);
  const isOngoingWeek = useMemo(() => {
    const now = new Date();
    return now >= monday && now <= friday;
  }, [monday, friday]);

  const weekLabel = useMemo(() => {
    const fmtStart = d => d.toLocaleDateString('es-MX', { day: '2-digit', month: 'short' });
    const fmtEnd = d => d.toLocaleDateString('es-MX', { day: '2-digit', month: 'short', year: 'numeric' });
    return `${fmtStart(monday)} – ${fmtEnd(friday)}`;
  }, [monday, friday]);

  useEffect(() => {
    let active = true;
    setError('');
    if (unsubRef.current) { try { unsubRef.current(); } catch (e) {} unsubRef.current = null; }

    // 1) Cache instantáneo (0 lecturas)
    const cached = readCalidadWeekCache(weekKey);
    if (cached?.items) {
      setRawItems(cached.items);
      setLoading(false);
    } else {
      setLoading(true);
    }

    const startMs = monday.getTime();
    const endMs = friday.getTime();

    if (isOngoingWeek) {
      // Semana en curso → onSnapshot (llegan actualizaciones del escáner de calidad).
      // Cada documento nuevo o modificado cuenta como 1 lectura, pero es justo lo
      // que el usuario quiere ver en vivo.
      try {
        unsubRef.current = db.collection('alertas_admin')
          .where('timestamp', '>=', startMs)
          .where('timestamp', '<=', endMs)
          .onSnapshot(snap => {
            if (!active) return;
            const items = snap.docs.map(d => ({ id: d.id, ...d.data() })).filter(isCalidadAlerta);
            setRawItems(items);
            writeCalidadWeekCache(weekKey, items);
            setLoading(false);
          }, e => {
            if (!active) return;
            console.warn('[calidad semana · snapshot]', e);
            setError(e?.message || 'No se pudo suscribir a la semana actual.');
            setLoading(false);
          });
      } catch (e) {
        setError(e?.message || 'Error al suscribir.');
        setLoading(false);
      }
    } else if (!cached?.items) {
      // Semana pasada sin caché → una sola lectura puntual y se guarda.
      (async () => {
        try {
          const snap = await db.collection('alertas_admin')
            .where('timestamp', '>=', startMs)
            .where('timestamp', '<=', endMs)
            .get();
          if (!active) return;
          const items = snap.docs.map(d => ({ id: d.id, ...d.data() })).filter(isCalidadAlerta);
          setRawItems(items);
          writeCalidadWeekCache(weekKey, items);
        } catch (e) {
          if (active) setError(e?.message || 'Error al cargar la semana.');
        } finally { if (active) setLoading(false); }
      })();
    } else {
      setLoading(false);
    }

    return () => {
      active = false;
      if (unsubRef.current) { try { unsubRef.current(); } catch (e) {} unsubRef.current = null; }
    };
  }, [weekKey, isOngoingWeek, monday, friday]);

  useEffect(() => () => { if (unsubRef.current) { try { unsubRef.current(); } catch (e) {} } }, []);

  const analysis = useMemo(() => analyzeCalidadWeek(rawItems), [rawItems]);

  const flash = (m) => { setToast(m); setTimeout(() => setToast(''), 2400); };

  const refresh = async () => {
    setLoading(true); setError('');
    try {
      const snap = await db.collection('alertas_admin')
        .where('timestamp', '>=', monday.getTime())
        .where('timestamp', '<=', friday.getTime())
        .get();
      const items = snap.docs.map(d => ({ id: d.id, ...d.data() })).filter(isCalidadAlerta);
      setRawItems(items);
      writeCalidadWeekCache(weekKey, items);
      flash('Semana actualizada');
    } catch (e) {
      setError(e?.message || 'No se pudo actualizar.');
    } finally { setLoading(false); }
  };

  const goPrevWeek = () => setWeekOffset(o => o - 1);
  const goNextWeek = () => setWeekOffset(o => Math.min(0, o + 1));

  const exportPDF = () => {
    const PDF = window.jspdf?.jsPDF;
    if (!PDF) { flash('PDF no disponible'); return; }
    const doc = new PDF({ orientation: 'portrait', unit: 'mm', format: 'letter' });
    const M = 12;
    const W = doc.internal.pageSize.getWidth();

    doc.setFillColor(13, 148, 136);
    doc.rect(0, 0, W, 16, 'F');
    doc.setTextColor(255, 255, 255);

    doc.text('INGESA · CALIDAD SEMANAL', M, 10.5);

    doc.text(`Semana: ${weekLabel}`, M, 24);

    const sumBody = [
      ['Registros de calidad', String(analysis.totalRegistros)],

      ['Máquinas afectadas', String(analysis.machines.length)],
      ['Modelos afectados', String(analysis.models.length)],
      ['Tejedores implicados', String(analysis.weavers.length)]

    doc.autoTable({ startY: 36, head: [['Resumen', 'Valor']], body: sumBody, theme: 'grid',
      headStyles: { fillColor: [30, 41, 59], textColor: [255, 255, 255], fontStyle: 'bold' },
      styles: { fontSize: 9, cellPadding: 1.6 }, margin: { left: M, right: M }, tableWidth: W - M * 2 });

    let y = doc.lastAutoTable.finalY + 6;
    doc.setFont('helvetica', 'bold'); doc.setFontSize(11); doc.text('Máquinas con más defectos', M, y); y += 3;
    const machineRows = analysis.machines.map(m => [
      m.key, String(m.lienzos), String(m.count),
      m.topModel ? `${m.topModel.key} (${m.topModel.lienzos} lz)` : '—',
      m.weaverOfTopModel ? `${m.weaverOfTopModel.key} (${m.weaverOfTopModel.lienzos} lz)` : (m.topWeaver ? `${m.topWeaver.key} (${m.topWeaver.lienzos} lz)` : '—'),
      m.topDefect ? `${m.topDefect.key} (${m.topDefect.lienzos} lz)` : '—'

    doc.autoTable({ startY: y + 2,

    const modelRows = analysis.models.map(m => [
      m.key, String(m.lienzos), String(m.count),
      m.topMachine ? `${m.topMachine.key} (${m.topMachine.lienzos} lz)` : '—',
      m.topWeaver ? `${m.topWeaver.key} (${m.topWeaver.lienzos} lz)` : '—',
      m.topDefect ? `${m.topDefect.key} (${m.topDefect.lienzos} lz)` : '—'
    ]);
    doc.autoTable({ startY: y + 2,
      head: [['Modelo', 'Lienzos', 'Registros', 'Máquina top', 'Tejedor top', 'Defecto top']],
      body: modelRows, theme: 'grid',
      headStyles: { fillColor: [124, 58, 237], textColor: [255, 255, 255], fontStyle: 'bold' },
      styles: { fontSize: 8.5, cellPadding: 1.5 }, margin: { left: M, right: M }, tableWidth: W - M * 2 });

    y = doc.lastAutoTable.finalY + 6;
    if (y > doc.internal.pageSize.getHeight() - 40) { doc.addPage(); y = M; }
    doc.setFont('helvetica', 'bold'); doc.setFontSize(11); doc.text('Tejedores con más defectos', M, y); y += 3;
    const weaverRows = analysis.weavers.map(w => [
      w.key, String(w.lienzos), String(w.count),
      w.topMachine ? `${w.topMachine.key} (${w.topMachine.lienzos} lz)` : '—',
      w.topModel ? `${w.topModel.key} (${w.topModel.lienzos} lz)` : '—',
      w.topDefect ? `${w.topDefect.key} (${w.topDefect.lienzos} lz)` : '—'
    ]);
    doc.autoTable({ startY: y + 2,
      head: [['Tejedor', 'Lienzos', 'Registros', 'Máquina top', 'Modelo top', 'Defecto top']],
      body: weaverRows, theme: 'grid',
      headStyles: { fillColor: [217, 119, 6], textColor: [255, 255, 255], fontStyle: 'bold' },
      styles: { fontSize: 8.5, cellPadding: 1.5 }, margin: { left: M, right: M }, tableWidth: W - M * 2 });

    y = doc.lastAutoTable.finalY + 6;
    if (y > doc.internal.pageSize.getHeight() - 30) { doc.addPage(); y = M; }
    doc.setFont('helvetica', 'bold'); doc.setFontSize(11); doc.text('Defectos más frecuentes', M, y); y += 3;

      styles: { fontSize: 8.5, cellPadding: 1.5 }, margin: { left: M, right: M }, tableWidth: W - M * 2 });

    doc.save(`INGESA_Calidad_${weekKey}.pdf`);
    flash('PDF descargado');
  };

  const fmtDate = (ts) => {
    try { return new Date(ts).toLocaleString('es-MX', { day:'2-digit', month:'short', hour:'2-digit', minute:'2-digit' }); }
    catch (e) { return '—'; }
  };

  return (
    <div className="p-4 pb-8 max-w-4xl mx-auto space-y-4">
      {toast && <div className="fixed top-3 left-1/2 -translate-x-1/2 z-[999] px-4 py-2 rounded-xl bg-teal-800 border border-teal-500 text-teal-100 text-xs font-black shadow-2xl">{toast}</div>}

      <div className="rounded-2xl border border-teal-700/60 bg-gradient-to-br from-teal-950/40 to-slate-900 p-4">

  }), [orders]);
