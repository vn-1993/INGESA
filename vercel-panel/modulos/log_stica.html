const App = () => {
  const [orders, setOrders] = useState(() => readOrdersCache());
  const [inventory, setInventory] = useState([]);
  const [logs, setLogs] = useState(() => { try { const cached = JSON.parse(localStorage.getItem('ingesa_production_logs_cache_v1') || '[]'); return Array.isArray(cached) ? cached : []; } catch (e) { return []; } });
  const [plantaViewConfig, setPlantaViewConfig] = useState({});
  const [plantaViewConfigLoaded, setPlantaViewConfigLoaded] = useState(false);
  const [recepcionesTejido, setRecepcionesTejido] = useState([]);
  const [cargasTintoreria, setCargasTintoreria] = useState([]);
  const [archivedOrders, setArchivedOrders] = useState([]);
  const [editingOrder, setEditingOrder] = useState(null);
  const [printingOrder, setPrintingOrder] = useState(null);
  const [detailedEntity, setDetailedEntity] = useState(null);
  const [archivingOrder, setArchivingOrder] = useState(null);
  const [msg, setMsg] = useState('');
  const [activeModule, setActiveModuleState] = useState(() => TV_DEVICE_INFO ? 'tvboard' : (localStorage.getItem('planta.lastModule') || 'easy'));
  const navigationHistoryRef = useRef([]);
  const [homeHelpOpen, setHomeHelpOpen] = useState(false);
  const setActiveModule = next => {
    const target = typeof next === 'function' ? next(activeModule) : next;
    if (target === activeModule) return;
    navigationHistoryRef.current.push(activeModule);
    if (navigationHistoryRef.current.length > 40) navigationHistoryRef.current.shift();
    setActiveModuleState(target);
  };
  const [devMode, setDevMode] = useState(false);
  const [devPanelOpen, setDevPanelOpen] = useState(false);
  const [devPinOpen, setDevPinOpen] = useState(false);
  const [hiddenModules, setHiddenModulesState] = useState([]);
  const [helpNotes, setHelpNotesState] = useState({});
  const [tvDisplays, setTvDisplays] = useState({});
  const [tvRemoteZoom, setTvRemoteZoom] = useState(() => { if (!TV_DEVICE_INFO) return 1; try { const current = localStorage.getItem(`ingesa_tv_zoom_v2_${TV_DEVICE_INFO.id}`); if (current !== null) return clampTvZoom(current); const legacy = localStorage.getItem(`ingesa_tv_zoom_${TV_DEVICE_INFO.id}`); return legacy === null ? 1 : tvZoomFromLegacy(legacy); } catch (e) { return 1; } });
  const [viewingCarga, setViewingCarga] = useState(null);
  const [pendingUncheck, setPendingUncheck] = useState(null);
  const [currentUserName, setCurrentUserName] = useState(() => ingesaUserName());
  useEffect(() => {
    const handler = e => {
      if (e?.data?.type === 'INDEX_CONTEXT') {
        setCurrentUserName(String(e.data.payload?.name || 'PLANTA').toUpperCase());
      }
    };
    window.addEventListener('message', handler);
    return () => window.removeEventListener('message', handler);
  }, []);
  const isAdmin = PLANT_ADMIN_USERS.some(u => currentUserName.includes(u));
  const devPressTimerRef = useRef(null); const devHeldRef = useRef(false);

  const handleAppBack = () => {
    if (homeHelpOpen) { setHomeHelpOpen(false); return; }
    if (printingOrder) { setPrintingOrder(null); return; }
    if (editingOrder) { setEditingOrder(null); return; }
    if (devMode && devPanelOpen) { setDevPanelOpen(false); return; }
    if (devPinOpen) { setDevPinOpen(false); return; }
    if (archivingOrder) { setArchivingOrder(null); return; }
    if (viewingCarga) { setViewingCarga(null); return; }
    if (detailedEntity) { setDetailedEntity(null); return; }
    const previous = navigationHistoryRef.current.pop();
    if (previous && previous !== activeModule) { setActiveModuleState(previous); return; }
    const homeModule = TV_DEVICE_INFO ? 'tvboard' : 'easy';
    if (activeModule !== homeModule) { navigationHistoryRef.current = []; setActiveModuleState(homeModule); return; }
    setHomeHelpOpen(true);
  };

  useEffect(() => {
    window.__INGESA_TV_BACK = handleAppBack;
    const onBackKey = event => {
      const key = event.key || '';
      const code = event.keyCode || event.which || 0;
      const editable = event.target && event.target.closest && event.target.closest('input,textarea,select,[contenteditable="true"]');
      if (key === 'Escape' || key === 'BrowserBack' || code === 4 || ((key === 'Backspace' || code === 8) && !editable)) {
        event.preventDefault(); event.stopPropagation(); handleAppBack();
      }
    };
    window.addEventListener('keydown', onBackKey, true);
    return () => { window.removeEventListener('keydown', onBackKey, true); if (window.__INGESA_TV_BACK === handleAppBack) delete window.__INGESA_TV_BACK; };
  }, [homeHelpOpen, devMode, devPanelOpen, devPinOpen, archivingOrder, viewingCarga, detailedEntity, editingOrder, printingOrder, activeModule]);

  useEffect(() => {
    if (homeHelpOpen) { const button = document.getElementById('tv-home-help-ok'); if (button) button.focus(); }
  }, [homeHelpOpen]);

  useEffect(() => { localStorage.setItem('planta.lastModule', activeModule); }, [activeModule]);
  useEffect(() => { if (!TV_DEVICE_INFO && activeModule === 'tvdevices' && !devMode) setActiveModuleState('easy'); }, [activeModule, devMode]);

  useEffect(() => {
    const unsub = db.collection('settings').doc('planta_view').onSnapshot(doc => {
      const data = doc.exists ? (doc.data() || {}) : {};
      setPlantaViewConfig(data);
      setPlantaViewConfigLoaded(true);
      if (Array.isArray(data.devHiddenModules)) setHiddenModulesState(data.devHiddenModules);
      if (data.devHelpNotes && typeof data.devHelpNotes === 'object') setHelpNotesState(data.devHelpNotes);
      if (data.tvDisplays && typeof data.tvDisplays === 'object') {
        setTvDisplays(data.tvDisplays);
        if (TV_DEVICE_INFO && data.tvDisplays[TV_DEVICE_INFO.id]?.displayName) { try { localStorage.setItem(`ingesa_tv_name_${TV_DEVICE_INFO.id}`, String(data.tvDisplays[TV_DEVICE_INFO.id].displayName)); } catch (e) {} }
        const tvProfile = TV_DEVICE_INFO && data.tvDisplays[TV_DEVICE_INFO.id];
        if (tvProfile && tvProfile.zoomScale != null && Number.isFinite(Number(tvProfile.zoomScale))) setTvRemoteZoom(clampTvZoom(tvProfile.zoomScale));
        else if (tvProfile && tvProfile.zoom != null && Number.isFinite(Number(tvProfile.zoom))) setTvRemoteZoom(tvZoomFromLegacy(tvProfile.zoom));
      }
    }, e => console.warn('[TV] No se pudo leer la configuración de pantallas', e?.code || e?.message || e));
    return () => unsub();
  }, []);

  useEffect(() => {
    if (!TV_DEVICE_INFO) return;
    const scale = getTvZoomScale(tvRemoteZoom);
    document.documentElement.style.zoom = '1';
    document.body.style.overflow = 'hidden';
    const appFrame = document.querySelector('#root > div');
    if (appFrame) {
      const width = `${100 / scale}vw`;
      const height = `${100 / scale}vh`;
      appFrame.style.position = 'fixed';
      appFrame.style.left = '0';
      appFrame.style.top = '0';
      appFrame.style.transformOrigin = 'top left';
      appFrame.style.transform = `scale(${scale})`;
      appFrame.style.width = width;
      appFrame.style.height = height;
      appFrame.style.minHeight = height;
    }
    try { localStorage.setItem(`ingesa_tv_zoom_v2_${TV_DEVICE_INFO.id}`, String(clampTvZoom(tvRemoteZoom))); } catch (e) {}
  }, [tvRemoteZoom]);

  useEffect(() => {
    if (!TV_DEVICE_INFO) return;
    const ref = db.collection('settings').doc('planta_view');
    ref.set({ tvDisplays: { [TV_DEVICE_INFO.id]: { deviceId: TV_DEVICE_INFO.id, hardwareModel: TV_DEVICE_INFO.model, appVersion: TV_DEVICE_INFO.appVersion, lastSeenAt: FieldValue.serverTimestamp() } } }, { merge: true }).catch(e => console.warn('[TV] Registro no disponible; la app sigue operando', e?.code || e?.message || e));
  }, []);

  useEffect(() => {
    if (hiddenModules.includes(activeModule)) {
      const fb = ['easy','planta','recepcion','cargas','graph'].find(id => !hiddenModules.includes(id)) || 'easy';
      setActiveModuleState(fb);
    }
  }, [hiddenModules, activeModule]);

  const setHiddenModules = next => { setHiddenModulesState(next); db.collection('settings').doc('planta_view').set({ devHiddenModules: next }, { merge: true }).catch(()=>{}); };
  const setHelpNotes = async next => { setHelpNotesState(next); await db.collection('settings').doc('planta_view').set({ devHelpNotes: next }, { merge: true }); };
  const saveTvDisplay = async (id, patch) => { await db.collection('settings').doc('planta_view').set({ tvDisplays: { [id]: patch } }, { merge: true }); };
  const handleDevLongPressStart = () => { devHeldRef.current = false; if (devPressTimerRef.current) clearTimeout(devPressTimerRef.current); devPressTimerRef.current = setTimeout(() => { devHeldRef.current = true; if (devMode) setDevPanelOpen(true); else setDevPinOpen(true); }, 3000); };
  const handleDevLongPressEnd = () => { if (devPressTimerRef.current) { clearTimeout(devPressTimerRef.current); devPressTimerRef.current = null; } if (devHeldRef.current) { devHeldRef.current = false; return; } };
  const handleDevLongPressCancel = () => { if (devPressTimerRef.current) { clearTimeout(devPressTimerRef.current); devPressTimerRef.current = null; } devHeldRef.current = false; };

  useEffect(() => {
    const cachedRec = INGESA_LOG_CACHE.read('recepciones');
    if (cachedRec?.data) setRecepcionesTejido(cachedRec.data);
    const cachedCar = INGESA_LOG_CACHE.read('cargas');
    if (cachedCar?.data) setCargasTintoreria(cachedCar.data);

    let uRec = null, ivRec = null;
    if (INGESA_LOG_CACHE.age('recepciones') < REC_CACHE_FRESH_MS) {
      ivRec = setInterval(async () => {
        try {
          const cached = (INGESA_LOG_CACHE.read('recepciones')?.data) || [];
          const lastMs = cached.reduce((m, r) => Math.max(m, (r.createdAt?.seconds || 0) * 1000), 0);
          let q = db.collection('recepcion_tejido').orderBy('createdAt', 'desc').limit(50);
          if (lastMs > 0) q = q.startAfter(new Date(lastMs));
          const snap = await q.get();
          if (!snap.empty) {
            const nuevos = snap.docs.map(d => ({ id: d.id, ...d.data() }));
            const merged = [...nuevos, ...cached].slice(0, 500);
            setRecepcionesTejido(merged);
            INGESA_LOG_CACHE.write('recepciones', merged);
          }
        } catch (e) {}
      }, DELTA_POLL_MS);
    } else {
      uRec = db.collection('recepcion_tejido').orderBy('createdAt', 'desc').limit(300).onSnapshot(s => {
        const data = s.docs.map(d => ({ id: d.id, ...d.data() }));
        setRecepcionesTejido(data);
        INGESA_LOG_CACHE.write('recepciones', data);
      }, () => {});
    }

    let uCar = null, ivCar = null;
    if (INGESA_LOG_CACHE.age('cargas') < CAR_CACHE_FRESH_MS) {
      ivCar = setInterval(async () => {
        try {
          const cached = (INGESA_LOG_CACHE.read('cargas')?.data) || [];
          const lastMs = cached.reduce((m, c) => Math.max(m, (c.createdAt?.seconds || 0) * 1000), 0);
          let q = db.collection('cargas_tintoreria').orderBy('createdAt', 'desc').limit(30);
          if (lastMs > 0) q = q.startAfter(new Date(lastMs));
          const snap = await q.get();
          if (!snap.empty) {
            const nuevos = snap.docs.map(d => ({ id: d.id, ...d.data() }));
            const merged = [...nuevos, ...cached].slice(0, 200);
            setCargasTintoreria(merged);
            INGESA_LOG_CACHE.write('cargas', merged);
          }
        } catch (e) {}
      }, DELTA_POLL_MS);
    } else {
      uCar = db.collection('cargas_tintoreria').orderBy('createdAt', 'desc').limit(150).onSnapshot(s => {
        const data = s.docs.map(d => ({ id: d.id, ...d.data() }));
        setCargasTintoreria(data);
        INGESA_LOG_CACHE.write('cargas', data);
      }, () => {});
    }

    return () => {
      if (uRec) uRec();
      if (uCar) uCar();
      if (ivRec) clearInterval(ivRec);
      if (ivCar) clearInterval(ivCar);
    };
  }, []);

  const needsActiveOrders = ['easy', 'planta', 'graph', 'tvboard'].includes(activeModule) || devPanelOpen;
  useEffect(() => {
    if (!needsActiveOrders) return;
    const unsub = db.collection('orders').where('status', '!=', 'ARCHIVADO').onSnapshot(snap => {
      const data = snap.docs.map(d => ({ ...d.data(), id: d.id }));
      setOrders(data);
      writeOrdersCache(data);
    }, e => console.warn('[active orders]', e?.code || e?.message || e));
    return () => unsub();
  }, [needsActiveOrders]);

  useEffect(() => {
    if (!editingOrder) return;
    const unsub = db.collection('inventory').doc('main').onSnapshot(doc => setInventory(doc.exists && doc.data().items ? doc.data().items : []), e => console.warn('[inventory]', e?.code || e?.message || e));
    return () => unsub();
  }, [!!editingOrder]);

  useEffect(() => {
    if (activeModule !== 'tvboard') return;
    const inicioDia = new Date(); inicioDia.setHours(0, 0, 0, 0);
    const unsub = db.collection('paquetes_historial').where('timestamp', '>=', inicioDia.getTime()).orderBy('timestamp', 'desc').onSnapshot(snap => {
      const data = snap.docs.map(d => ({ id: d.id, ...d.data() }));
      setLogs(data);
      try { localStorage.setItem('ingesa_production_logs_cache_v1', JSON.stringify(data)); } catch (e) {}
    }, e => console.warn('[production logs]', e?.code || e?.message || e));
    return () => unsub();
  }, [activeModule]);

  // Una sola consulta compartida entre el DevPanel y la pestaña de archivadas.
  const needsArchivedOrders = devPanelOpen || (activeModule === 'archived' && isAdmin);
  useEffect(() => {
    if (!needsArchivedOrders) return;
    const unsub = db.collection('orders').where('status', '==', 'ARCHIVADO').limit(500).onSnapshot(snap => {
      setArchivedOrders(snap.docs.map(d => ({ ...d.data(), id: d.id })));
    }, e => console.warn('[archived orders]', e?.code || e?.message || e));
    return () => unsub();
  }, [needsArchivedOrders]);

  const flash = m => { setMsg(m); setTimeout(() => setMsg(''), 4000); };
  const onEdit = o => setEditingOrder(o);
  const onPrint = entity => setPrintingOrder(entity);
  const onViewDetails = entity => setDetailedEntity(entity);
  const onArchiveIntent = o => setArchivingOrder(o);
  const onUnarchive = (order) => {
    if (!order) return;
    if (!window.confirm(`¿Desarchivar orden ${order.partida || ''} · ${order.codigo || order.modelo || ''}?\n\nVolverá a producción y se podrá editar/destruir de nuevo.`)) return;
    (async () => {
      try {
        await db.collection('orders').doc(String(order.id)).update({
          status: 'ACTIVO',
          archivedAt: FieldValue.delete(),
          archivedFrom: FieldValue.delete(),
          unarchivedAt: FieldValue.serverTimestamp(),
          unarchivedBy: ingesaUserName()
        });
        flash('Orden desarchivada.');
        if (detailedEntity && detailedEntity.orders?.some(o => String(o.id) === String(order.id))) setDetailedEntity(null);
      } catch (e) { alert('Error: ' + (e?.message || e)); }
    })();
  };
  const onDestroyGroup = (entity) => {
    const representative = entity?.representative || entity?.orders?.[0];
    if (!representative) { alert('No se encontró la orden para mostrar sus acciones.'); return; }
    setArchivingOrder(representative);
  };
  // Asignar / corregir la fecha de entrega de una orden (o de un KIT completo).
  // Se escribe en:
  //  - orders.fechaEntrega            (fuente principal para Logística y Modo Fácil)
  //  - orders.progreso[].fechaEntrega (por si el paquete la toma de ahí)
  //  - production_labels.fechaEntrega (el escáner hereda desde la etiqueta)
  const onSetDeliveryDate = async (entity, dateStr) => {
    if (!entity || !dateStr) return;
    const ordersToUpdate = (entity.orders && entity.orders.length ? entity.orders : [entity.representative || entity]).filter(Boolean);
    const dateValue = String(dateStr).trim(); // "YYYY-MM-DD"
    if (!/^\d{4}-\d{2}-\d{2}$/.test(dateValue)) throw new Error('Formato de fecha inválido.');
    for (const order of ordersToUpdate) {
      const oid = String(order.id || '').trim();
      if (!oid) continue;
      const payload = { fechaEntrega: dateValue };
      if (Array.isArray(order.progreso) && order.progreso.length) {
        payload.progreso = order.progreso.map(p => ({ ...p, fechaEntrega: dateValue }));
      }
      await db.collection('orders').doc(oid).update(payload);
      // Etiquetas del escáner: actualizar cada paquete por su código único
      const codes = (order.progreso || []).map(p => String(p.codigoUnico || '').trim().toUpperCase()).filter(Boolean);
      for (const code of codes) {
        try {
          await db.collection('production_labels').doc(DATA.labelDocId(code)).set({ fechaEntrega: dateValue }, { merge: true });
        } catch (e) { console.warn('[setDeliveryDate · label]', code, e?.message || e); }
      }
    }
    flash('Fecha de entrega actualizada.');
  };
  const actions = { onEdit, onPrint, onArchiveIntent, onViewDetails, onUnarchive, onDestroyGroup, onSetDeliveryDate };

  const onSaveEdit = async updated => {
    try {
      const packages = updated.progreso || updated.predefinedPackages || [];
      await db.collection('orders').doc(String(updated.id)).update({
        cliente: updated.cliente, color: updated.color, diametro: updated.diametro || '', maquina: updated.maquina || '',
        ordenCompra: updated.ordenCompra || '', nombreModeloCliente: updated.nombreModeloCliente || '',
        threading: updated.threading, subPiecesData: updated.subPiecesData, progreso: packages,
        imagenSeleccionada: updated.imagenSeleccionada || null
      });
      setEditingOrder(null); flash('Orden actualizada.');
    } catch(e) { alert('Error: ' + e.message); }
  };

  const handleArchiveConfirm = async actionType => {
    const order = archivingOrder; if (!order) return;
    if (actionType === 'DELETE' && (order.progreso || []).some(p => p.finished)) { alert('Ya tiene escaneos. Usa limpieza oculta o la purga del grupo.'); return; }
    setArchivingOrder(null);
    if (detailedEntity && detailedEntity.orders.some(o => o.id === order.id)) setDetailedEntity(null);
    if (actionType === 'DELETE' || actionType === 'PURGE_TEST' || actionType === 'DELETE_PARTIDA') {
      try { INGESA_FX.play(); } catch (e) {}
    }
    try {
      const ref = db.collection('orders').doc(String(order.id));
      if (actionType === 'ARCHIVE') { await ref.update({ status:'ARCHIVADO', archivedAt:FieldValue.serverTimestamp(), archivedFrom:'PLANTA' }); flash('Orden archivada.'); }
      else if (actionType === 'ARCHIVE_PARTIDA') {
        const partida = String(order.partida || '').trim();
        if (!partida) throw new Error('Esta orden no tiene partida; solo se puede archivar la orden individual.');
        const pid = partida.toUpperCase();
        const groupOrders = orders.filter(o => String(o.partida || '').trim().toUpperCase() === pid);
        if (!groupOrders.length) throw new Error(`No hay órdenes activas en la partida ${pid}.`);
        for (let i = 0; i < groupOrders.length; i += 450) {
          const batch = db.batch();
          groupOrders.slice(i, i + 450).forEach(o => batch.update(db.collection('orders').doc(String(o.id)), { status:'ARCHIVADO', archivedAt:FieldValue.serverTimestamp(), archivedFrom:'PLANTA_PARTIDA' }));
          await batch.commit();
        }
        flash(`Partida ${pid}: ${groupOrders.length} orden(es) archivada(s).`);
        if (detailedEntity && detailedEntity.orders?.some(o => String(o.partida || '').trim().toUpperCase() === pid)) setDetailedEntity(null);
      }
      else if (actionType === 'DELETE') {
        const ret = await destroySingleOrder(order);
        const kg = Object.values(ret || {}).reduce((s, v) => s + Number(v || 0), 0);
        flash(`Orden destruida${kg > 0 ? ` · ${kg.toFixed(2)} kg devueltos` : ''}.`);
      }
      else if (actionType === 'PURGE_TEST') { const r = await purgeTestOrder(order); flash(`Prueba eliminada. ${r.deleted} registros limpiados.`); }
      else if (actionType === 'DELETE_PARTIDA') {
        const partida = String(order.partida || '').trim();
        if (!partida) throw new Error('Esta orden no tiene partida. No se buscará por O.C.');
        const result = await destroyPartidaGroup(partida, orders);
        flash(`Partida ${partida}: ${result.archived} archivada(s) · ${result.deleted} destruida(s)${result.totalReturned > 0 ? ` · ${result.totalReturned.toFixed(2)} kg devueltos` : ''}.`);
        if (detailedEntity && detailedEntity.orders?.some(o => String(o.partida || '').trim().toUpperCase() === partida.toUpperCase())) setDetailedEntity(null);
      }
    } catch(e) { alert(e.message); }
  };

  const togglePackageState = async (orderId, pkgId, stage, options = {}) => {
    if (stage !== 'tejido') return;
    const order = orders.find(o => o.id === orderId);
    if (!order) return;
    const pkg = order.progreso.find(p => p.id === pkgId);
    if (!pkg) return;
    const willBeFinished = !pkg.finished;
    // Desmarcar (paquete ya tejido) → exigir confirmación explícita.
    if (!willBeFinished && !options.skipConfirm) {
      setPendingUncheck({
        orderId, pkgId, stage,
        pkgInfo: {
          codigoUnico: pkg.codigoUnico,
          piezaNombre: pkg.piezaNombre,
          tejedor: pkg.tejedor,
          fecha: pkg.fecha
        }
      });
      return;
    }
    const pieceData = order.subPiecesData.find(sp => sp.pieza === pkg.piezaNombre);
    const pesoGramos = pieceData ? (Number(pieceData.peso) || 0) : 0;
    const packageKg = (pkg.cantidad * pesoGramos) / 1000;
    const materialUpdates = [];
    if (packageKg > 0 && order.threading) order.threading.forEach(t => { if (t.materialId && Number(t.porcentaje) > 0) materialUpdates.push({ id: t.materialId, name: t.material, kg: packageKg * (Number(t.porcentaje) / 100) }); });
    const now = new Date();
    const dateStr = willBeFinished ? now.toLocaleString('es-MX', { dateStyle:'short', timeStyle:'short' }) : '';
    const newProgreso = order.progreso.map(p => p.id === pkgId ? {
      ...p,
      finished: willBeFinished,
      tejedor: willBeFinished ? ingesaUserName() : '',
      fecha: dateStr,
      defectos: '',
      agujas: '',
      partialQuantity: willBeFinished ? Number(p.partialQuantity || 0) : 0,
      partialHistory: willBeFinished ? (Array.isArray(p.partialHistory) ? p.partialHistory : []) : [],
      fotoId: willBeFinished ? (p.fotoId || null) : null,
      lastFotoId: willBeFinished ? (p.lastFotoId || null) : null,
      kitRegistered: willBeFinished ? !!p.kitRegistered : false
    } : p);
    if (detailedEntity && detailedEntity.orders.some(o => o.id === orderId)) {
      setDetailedEntity({
        ...detailedEntity,
        orders: detailedEntity.orders.map(o => o.id === orderId ? { ...o, progreso: newProgreso } : o),
        representative: detailedEntity.representative && detailedEntity.representative.id === orderId
          ? { ...detailedEntity.representative, progreso: newProgreso }
          : detailedEntity.representative
      });
    }
    try {
      await db.runTransaction(async tx => {
        const invRef = db.collection('inventory').doc('main'); const invDoc = await tx.get(invRef);
        let items = invDoc.exists ? (invDoc.data().items || []) : [];
        if (materialUpdates.length > 0) {
          items = items.map(item => { const u = materialUpdates.find(x => x.id === item.id); if (u) item.stock = parseFloat((parseFloat(item.stock || 0) + (willBeFinished ? -u.kg : u.kg)).toFixed(3)); return item; });
          tx.update(invRef, { items });
        }
        tx.update(db.collection('orders').doc(String(orderId)), { progreso: newProgreso });
        // Mantener sincronizada la etiqueta que consulta el escáner. Antes solo cambiaba
        // orders.progreso y production_labels conservaba finished=true al desmarcar.
        if (pkg.codigoUnico) {
          tx.set(db.collection('production_labels').doc(DATA.labelDocId(pkg.codigoUnico)), {
            finished: willBeFinished,
            partialQuantity: willBeFinished ? Number(pkg.partialQuantity || 0) : 0,
            kitRegistered: willBeFinished ? !!pkg.kitRegistered : false,
            tejedor: willBeFinished ? ingesaUserName() : '',
            updatedAt: now
          }, { merge: true });
        }
      });
      if (willBeFinished) {
        for (const mu of materialUpdates) await db.collection('consumo_hilo_historial').add({ pkgId: pkg.id, orderId: order.id, ordenCompra: order.ordenCompra || '', partida: order.partida, pieza: pkg.piezaNombre, talla: pieceData ? pieceData.talla : '', maquina: order.maquina, materialId: mu.id, materialName: mu.name, kilos: mu.kg, timestamp: Date.now() });
        flash('Paquete marcado como tejido. Ya está disponible para recepción.');
      } else {
        // Firestore ya confirmó el desmarcado; solicitar que Sheets elimine solo esta papeleta.
        if (pkg.codigoUnico) {
          await fetch('https://script.google.com/macros/s/AKfycbyk7YD8sl-0yYqSRWGU55aNiGQhj66I7N7nUr_K4tfd1MbvBsKVHFmlWLZ9iVBlFhGeKw/exec', {
            method: 'POST',
            mode: 'no-cors',
            headers: { 'Content-Type': 'text/plain;charset=utf-8' },
            body: JSON.stringify({ action: 'syncDesmarcarPapeleta', payload: {
              codigoUnico: pkg.codigoUnico,
              maquina: order.maquina || pkg.maquina || '',
              orderId: String(order.id || orderId),
              partida: order.partida || '',
              pieza: pkg.piezaNombre || '',
              operador: ingesaUserName(),
              origen: 'LOGISTICA',
              timestamp: Date.now()
            } })
          }).catch(e => console.warn('[LOGISTICA → SHEETS] No se pudo enviar el desmarcado:', e));
        }
        const snap = await db.collection('consumo_hilo_historial').where('pkgId','==',pkg.id).get();
        const b = db.batch(); snap.forEach(d => b.delete(d.ref)); await b.commit();
        flash('Check removed. Hilo reintegrado.');
      }
    } catch(err) { alert('Error: ' + err.message); }
  };

  if (printingOrder) {
    if (printingOrder.type === 'kit') {
      return <PrintKitOrder entity={printingOrder} onBack={() => setPrintingOrder(null)} />;
    }
    const singleOrder = printingOrder.representative || printingOrder.orders?.[0] || printingOrder;
    // Fallback: si llega como 'single' pero la orden pertenece a un KIT (por kitId/kitRef
    // o por código de paquete en el índice de kits_datos), reconstruir el KIT completo
    // para imprimir TODAS las piezas (1/3 de hoja cada una).
    const kitsInfo = KITS_STORE.get();
    const norm = s => String(s || '').trim().toUpperCase();
    const resolveKitKeyForOrder = (o) => {
      let k = norm(o.kitRef || o.kitId || o.kitNumber || o.kitKey);
      if (k) return k;
      for (const pkg of (o.progreso || [])) {
        const code = norm(pkg.codigoUnico);
        const hit = code ? kitsInfo.byCode.get(code) : null;
        if (hit) return norm(hit.kitId || hit.kitNumber || hit.id);
      }
      const direct = kitsInfo.byId.get(norm(o.id));
      if (direct) return norm(direct.kitId || direct.kitNumber || direct.id);
      return '';
    };
    const kitKey = resolveKitKeyForOrder(singleOrder);
    if (kitKey && orders.length) {
      const siblings = orders.filter(o => resolveKitKeyForOrder(o) === kitKey && norm(o.status) !== 'ARCHIVADO');
      if (siblings.length > 1) {
        const rep = siblings.find(o => o.kitPrimaryRecord) || siblings[0];
        return <PrintKitOrder entity={{ id: `KIT_${kitKey}`, type: 'kit', orders: siblings, representative: rep, kitKey }} onBack={() => setPrintingOrder(null)} />;
      }
    }
    return <PrintOrder order={singleOrder} onBack={() => setPrintingOrder(null)} />;
  }
  if (editingOrder) return <OrderEditor draft={editingOrder} inventory={inventory} onSave={onSaveEdit} onCancel={() => setEditingOrder(null)} />;

  const allModulesConfig = [
    { id:'easy', name:'Modo Fácil', icon:'book-open', desc:'Vista simplificada', color:'text-amber-400' },
    { id:'planta', name:'Control de Planta', icon:'layers', desc:'Por partida, diámetro o modelo', color:'text-indigo-400' },
    { id:'recepcion', name:'Recepción de Tejido', icon:'box', desc:'Recibidos y standby', color:'text-cyan-400' },
    { id:'calidad', name:'Calidad semanal', icon:'clipboard-list', desc:'Defectos por máquina, modelo y tejedor', color:'text-teal-400' },
    { id:'cargas', name:'Cargas de Tintorería', icon:'package', desc:'Partidas de 45 kg', color:'text-fuchsia-400' },
    { id:'graph', name:'Gráfica de Avance', icon:'bar-chart-3', desc:'Avance por talla', color:'text-rose-400' },
    ...(isAdmin ? [{ id:'archived', name:'Archivadas', icon:'archive', desc:'Solo lectura · desarchivar', color:'text-rose-400' }] : []),
    ...(devMode ? [{ id:'efficiency', name:'Eficiencia IA', icon:'brain', desc:'Análisis inteligente de máquinas (DEV)', color:'text-emerald-400' }] : []),
    ...(TV_DEVICE_INFO ? [{ id:'tvboard', name:'Tablero TV', icon:'monitor', desc:'Diapositivas de planta', color:'text-cyan-400' }] : (devMode ? [{ id:'tvdevices', name:'Pantallas TV', icon:'monitor', desc:'Zoom y tablero remoto', color:'text-cyan-400' }] : []))
  ];
  const modulesConfig = allModulesConfig.filter(m => !hiddenModules.includes(m.id));
  const recepcionesStandby = recepcionesTejido.filter(r => r.status === 'standby').length;
  const cargasListas = cargasTintoreria.filter(c => c.status === 'lista').length;

  return (
    <div className="flex h-screen flex-col overflow-hidden bg-[var(--portal-bg-base,#020617)] text-[var(--portal-text-main,#f8fafc)]">
      {msg && <div className="absolute left-0 right-0 top-0 z-[200] border-b border-[var(--portal-accent,#e62b70)] bg-[var(--portal-bg-surface,#0f172a)] p-3 text-center text-sm font-bold text-[var(--portal-accent,#e62b70)] shadow-lg">{msg}</div>}
      <header className="header-3d flex shrink-0 items-center justify-between border-b border-[var(--portal-border,#1e293b)] bg-[var(--portal-bg-surface,#0f172a)] px-4 py-3 shadow-sm">
        <button
          type="button"
          onClick={() => {}}
          onPointerDown={handleDevLongPressStart}
          onPointerUp={handleDevLongPressEnd}
          onPointerLeave={handleDevLongPressCancel}
          onPointerCancel={handleDevLongPressCancel}
          onContextMenu={e => e.preventDefault()}
          className="text-left select-none touch-none"
          title="Mantén 3s para DEV"
        >
          <h1 className="flex items-center gap-2 text-lg font-black pointer-events-none text-[var(--portal-text-main)]"><Icon name="layers" size={20} className="text-[var(--portal-accent,#e62b70)]"/> INGESA · LOGÍSTICA</h1>
          <span className="text-[10px] font-bold uppercase tracking-wider text-[var(--portal-text-muted,#94a3b8)] pointer-events-none">Tejido → Recepción → Carga</span>
        </button>
        <div className="flex items-center gap-2">
          {recepcionesStandby > 0 && (
            <button onClick={() => setActiveModule('recepcion')} className="relative rounded-xl border border-red-700 bg-red-950/40 p-2 text-red-200" title="Recepción en standby">
              <Icon name="alert-octagon" size={19}/>
              <span className="absolute -right-2 -top-2 flex h-[18px] min-w-[18px] items-center justify-center rounded-full border-2 border-[var(--portal-bg-base,#020617)] bg-red-600 px-1 text-[9px] font-black text-white">{recepcionesStandby}</span>
            </button>
          )}
          {cargasListas > 0 && (
            <button onClick={() => setActiveModule('cargas')} className="relative rounded-xl border border-fuchsia-700 bg-fuchsia-950/40 p-2 text-fuchsia-200" title="Cargas listas">
              <Icon name="package" size={19}/>
              <span className="absolute -right-2 -top-2 flex h-[18px] min-w-[18px] items-center justify-center rounded-full border-2 border-[var(--portal-bg-base,#020617)] bg-fuchsia-600 px-1 text-[9px] font-black text-white">{cargasListas}</span>
            </button>
          )}
          <span className="rounded-lg border border-[var(--portal-border,#1e293b)] bg-[var(--portal-bg-surface-alt,#1e293b)] px-3 py-1.5 text-xs font-bold text-[var(--portal-text-muted,#94a3b8)]">{orders.filter(o => o.status !== 'ARCHIVADO').length} activas</span>
        </div>
      </header>

      <div className="flex border-b border-[var(--portal-border,#1e293b)] bg-[var(--portal-bg-surface,#0f172a)] overflow-x-auto shrink-0">
        {modulesConfig.map(m => (
          <button key={m.id} onClick={() => setActiveModule(m.id)} className={`shrink-0 px-4 py-2.5 text-xs font-black flex items-center gap-2 border-b-2 transition-colors ${activeModule === m.id ? 'border-[var(--portal-accent,#e62b70)] text-[var(--portal-accent,#e62b70)]' : 'border-transparent text-[var(--portal-text-muted,#94a3b8)] hover:text-[var(--portal-text-main,#fff)]'}`}>
            <Icon name={m.icon} size={14}/> {m.name}
          </button>
        ))}
      </div>

      <main className="min-h-0 flex-1 overflow-y-auto">
        {activeModule === 'easy' && <EasyModeView orders={orders} helpNotes={helpNotes} actions={actions} />}
        {activeModule === 'planta' && <PlantaScreen orders={orders} actions={actions} viewConfig={plantaViewConfig} viewConfigLoaded={plantaViewConfigLoaded} />}
        {activeModule === 'recepcion' && <RecepcionTejidoPanel recepciones={recepcionesTejido} />}
        {activeModule === 'cargas' && <CargasTintoreriaPanel cargas={cargasTintoreria} />}
        {activeModule === 'graph' && <ProgressGraphView orders={orders} productionLogs={logs} actions={actions} />}
        {activeModule === 'calidad' && <CalidadSemanalView />}
        {activeModule === 'archived' && isAdmin && <ArchivedOrdersView archivedOrders={archivedOrders} actions={actions} />}
        {activeModule === 'efficiency' && devMode && <MachineEfficiencyView currentUserName={currentUserName} />}
        {activeModule === 'tvdevices' && <TVDevicesPanel devices={tvDisplays} onSave={saveTvDisplay} />}
        {activeModule === 'tvboard' && TV_DEVICE_INFO && <TVBoard orders={orders} productionLogs={logs} recepciones={recepcionesTejido} deviceInfo={TV_DEVICE_INFO} display={tvDisplays[TV_DEVICE_INFO.id] || {}} />}
      </main>

      {detailedEntity && <OrderDetailModal entity={detailedEntity} actions={actions} onClose={() => setDetailedEntity(null)} togglePackageState={togglePackageState} recepcionesTejido={recepcionesTejido} cargasTintoreria={cargasTintoreria} onOpenCarga={setViewingCarga} />}
      {viewingCarga && <CargaDetailModal carga={viewingCarga} onClose={() => setViewingCarga(null)} />}
      {archivingOrder && <ArchiveRecoveryModal order={archivingOrder} ordersOfPartida={orders.filter(o => String(o.partida || '').trim().toUpperCase() === String(archivingOrder.partida || '').trim().toUpperCase())} onClose={() => setArchivingOrder(null)} onConfirm={handleArchiveConfirm} />}
      {pendingUncheck && (
        <UncheckConfirmModal
          pkgInfo={pendingUncheck.pkgInfo}
          onClose={() => setPendingUncheck(null)}
          onConfirm={async () => {
            const p = pendingUncheck;
            setPendingUncheck(null);
            await togglePackageState(p.orderId, p.pkgId, p.stage, { skipConfirm: true });
          }}
        />
      )}
      {devPinOpen && <DevPinModal onClose={() => setDevPinOpen(false)} onSuccess={() => { setDevPinOpen(false); setDevMode(true); setDevPanelOpen(true); }} />}
      {devMode && devPanelOpen && <DevPanel onClose={() => setDevPanelOpen(false)} hiddenModules={hiddenModules} setHiddenModules={setHiddenModules} helpNotes={helpNotes} setHelpNotes={setHelpNotes} archivedOrders={archivedOrders} onPurgeArchived={purgeArchivedOrder} orders={orders} cargas={cargasTintoreria} />}
      {homeHelpOpen && <div className="fixed inset-0 z-[900] flex items-center justify-center bg-slate-950/95 p-6" role="dialog" aria-modal="true" aria-labelledby="tv-home-help-title"><div className="w-full max-w-xl rounded-2xl border border-cyan-500 bg-slate-900 p-8 text-center shadow-2xl"><div className="mx-auto mb-4 flex h-16 w-16 items-center justify-center rounded-full bg-cyan-950 text-3xl text-cyan-300">⌂</div><h2 id="tv-home-help-title" className="text-2xl font-black text-white">Tablero fijo</h2><p className="mt-4 text-lg leading-relaxed text-slate-300">El botón Atrás no cierra la aplicación. Para ir a la pantalla principal de Fire TV/Android, presiona el botón <b className="text-cyan-300">HOME</b> del control remoto.</p><button id="tv-home-help-ok" autoFocus onClick={() => setHomeHelpOpen(false)} className="mt-6 min-h-14 rounded-xl bg-cyan-600 px-8 py-3 text-lg font-black text-white focus:outline-none focus:ring-4 focus:ring-cyan-300">Entendido</button></div></div>}
      {devMode && (<div className="fixed bottom-4 left-4 z-[300] no-print"><button onClick={() => setDevPanelOpen(true)} className="px-3 py-2 rounded-lg bg-amber-600 hover:bg-amber-500 text-white text-[10px] font-black shadow-xl flex items-center gap-1 border border-amber-400" title="Panel DEV"><Icon name="settings" size={14}/> DEV</button></div>)}
    </div>
  );
};

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
</script>
</body>
</html>
