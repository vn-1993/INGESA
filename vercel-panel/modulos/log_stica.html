<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>INGESA | Control de Planta</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/react@18/umd/react.development.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.31/jspdf.plugin.autotable.min.js"></script>
<script>
/* INGESA Firestore read meter v4 — stable TV identity plus iframe bridge, client-side estimate only. */
(function (global) {
  'use strict';
  if (global.INGESA_QUOTA_METER?.version === 4) return;

  const PROTOCOL = 1;
  const HELLO = 'INGESA_QUOTA_BRIDGE_HELLO';
  const ACK = 'INGESA_QUOTA_BRIDGE_ACK';
  const REPORT = 'INGESA_QUOTA_BRIDGE_REPORT';
  const chainMethods = new Set(['collection', 'collectionGroup', 'doc', 'where', 'orderBy', 'limit', 'startAt', 'startAfter', 'endAt', 'endBefore', 'select', 'withConverter']);
  const installedDbs = new WeakMap();

  const normalizeAppKey = value => String(value || 'app').toLowerCase()
    .normalize('NFD').replace(/[\u0300-\u036f]/g, '')
    .replace(/[^a-z0-9_-]+/g, '_').replace(/^_+|_+$/g, '').slice(0, 40) || 'app';
  const safeUser = () => {
    try {
      const bridge = global.INGESA_TV;
      const deviceId = bridge && typeof bridge.getDeviceId === 'function' ? String(bridge.getDeviceId() || '').trim() : '';
      if (deviceId) { let label = ''; try { label = global.localStorage.getItem(`ingesa_tv_name_${deviceId}`) || ''; } catch (e) {} return { id: `TV_${deviceId}`, name: label || `Pantalla TV ${deviceId.slice(-6)}`, role: 'TELEVISOR', deviceId }; }
      const user = JSON.parse(global.localStorage.getItem('ingesa_logged_user') || 'null');
      const id = String(user?.id || user?.uid || user?.username || user?.name || '').trim();
      return id ? { id, name: String(user?.name || id), role: String(user?.role || '') } : null;
    } catch (e) { return null; }
  };
  const countInitialSnapshot = snap => Array.isArray(snap?.docs) ? Math.max(1, snap.docs.length) : 1;

  function install(db, appName) {
    if (!db || typeof db.collection !== 'function') return db;
    if (installedDbs.has(db)) return installedDbs.get(db);

    const rawCollection = db.collection.bind(db);
    const rawDoc = typeof db.doc === 'function' ? db.doc.bind(db) : null;
    const rawCollectionGroup = typeof db.collectionGroup === 'function' ? db.collectionGroup.bind(db) : null;
    const FieldValue = global.firebase?.firestore?.FieldValue;
    const localAppKey = normalizeAppKey(appName || global.document?.title || 'app');
    const pending = new Map();
    const preConfiguration = new Map();
    const proxyCache = new WeakMap();
    const frameApps = new WeakMap();
    const embedded = !!(global.parent && global.parent !== global);
    let enabled = false;
    let configKnown = false;
    let localStarted = false;
    let bridgeMode = embedded ? 'pending' : 'local';
    let bridgeTimer = null;
    let configUnsub = null;

    const dayKey = () => new Date().toISOString().slice(0, 10);
    const makeDocId = (date, uid) => `${date}__${encodeURIComponent(uid).slice(0, 900)}`;

    function flushOne(key) {
      const bucket = pending.get(key);
      if (!bucket || bucket.busy || !bucket.reads || !FieldValue?.increment) return;
      const appCounts = { ...bucket.readsByApp };
      const reads = Object.values(appCounts).reduce((sum, value) => sum + value, 0);
      if (!reads) return;
      bucket.reads = 0;
      bucket.readsByApp = Object.create(null);
      bucket.busy = true;
      const ref = rawCollection('firestore_quota_usage').doc(makeDocId(bucket.date, bucket.user.id));
      const readsByApp = Object.fromEntries(Object.entries(appCounts).map(([key, value]) => [key, FieldValue.increment(value)]));
      ref.set({
        date: bucket.date,
        userId: bucket.user.id,
        userName: bucket.user.name,
        role: bucket.user.role,
        estimatedReads: FieldValue.increment(reads),
        meterWrites: FieldValue.increment(1),
        readsByApp,
        updatedAt: FieldValue.serverTimestamp()
      }, { merge: true }).catch(e => {
        bucket.reads += reads;
        for (const [app, value] of Object.entries(appCounts)) bucket.readsByApp[app] = (bucket.readsByApp[app] || 0) + value;
        console.warn('[quota meter] no se pudo guardar el agregado', e?.code || e?.message || e);
      }).finally(() => {
        bucket.busy = false;
        if (bucket.reads >= 25) flushOne(key);
        else if (!bucket.reads) pending.delete(key);
      });
    }

    function flushAll() { for (const key of pending.keys()) flushOne(key); }

    function addToBucket(units, sourceApp) {
      const count = Math.max(0, Math.floor(Number(units) || 0));
      if (!count) return;
      if (!configKnown) {
        const app = normalizeAppKey(sourceApp || localAppKey);
        preConfiguration.set(app, (preConfiguration.get(app) || 0) + count);
        return;
      }
      if (!enabled) return;
      const user = safeUser();
      if (!user) return;
      const date = dayKey();
      const key = `${date}::${user.id}`;
      const bucket = pending.get(key) || { date, user, reads: 0, readsByApp: Object.create(null), busy: false };
      bucket.user = user;
      const app = normalizeAppKey(sourceApp || localAppKey);
      bucket.reads += count;
      bucket.readsByApp[app] = (bucket.readsByApp[app] || 0) + count;
      pending.set(key, bucket);
      if (bucket.reads >= 25) flushOne(key);
    }

    function sendReport(units, sourceApp) {
      const count = Math.max(0, Math.floor(Number(units) || 0));
      if (!count) return;
      const app = normalizeAppKey(sourceApp || localAppKey);
      if (!embedded || bridgeMode === 'local') { addToBucket(count, app); return; }
      if (bridgeMode === 'pending') {
        preConfiguration.set(app, (preConfiguration.get(app) || 0) + count);
        return;
      }
      try { global.parent.postMessage({ type: REPORT, protocol: PROTOCOL, app, units: count }, '*'); }
      catch (e) { /* Do not break the business screen if the host refuses messaging. */ }
    }

    function startLocalMeter() {
      if (localStarted) return;
      localStarted = true;
      try {
        configUnsub = rawCollection('launcher_settings').doc('firestore_quota_monitor').onSnapshot(doc => {
          if (doc?.metadata?.fromCache === true) return;
          const next = !!(doc.exists && doc.data()?.enabled === true);
          const wasEnabled = enabled;
          configKnown = true;
          if (wasEnabled && !next) flushAll();
          enabled = next;
          const queued = Array.from(preConfiguration.entries());
          preConfiguration.clear();
          if (enabled) queued.forEach(([app, count]) => addToBucket(count, app));
        }, e => {
          configKnown = true;
          enabled = false;
          preConfiguration.clear();
          console.warn('[quota meter] no se pudo leer el interruptor', e?.code || e?.message || e);
        });
        if (typeof global.setInterval === 'function') global.setInterval(flushAll, 60000);
        if (typeof global.addEventListener === 'function') global.addEventListener('pagehide', flushAll);
        global.document?.addEventListener?.('visibilitychange', () => {
          if (global.document.visibilityState === 'hidden') flushAll();
        });
      } catch (e) {
        configKnown = true;
        enabled = false;
        console.warn('[quota meter] no se pudo inicializar', e?.code || e?.message || e);
      }
    }

    function isLiveFrame(source) {
      if (!source || !global.document?.querySelectorAll) return false;
      try { return Array.from(global.document.querySelectorAll('iframe')).some(frame => frame.contentWindow === source); }
      catch (e) { return false; }
    }

    function handleParentMessage(event) {
      const data = event?.data;
      const source = event?.source;
      if (!data || data.protocol !== PROTOCOL || !isLiveFrame(source)) return;
      if (data.type === HELLO) {
        frameApps.set(source, normalizeAppKey(data.app || 'iframe'));
        try { source.postMessage({ type: ACK, protocol: PROTOCOL }, '*'); } catch (e) {}
        return;
      }
      if (data.type === REPORT && frameApps.has(source)) {
        sendReport(data.units, frameApps.get(source));
      }
    }

    function activateLocalFallback() {
      if (bridgeMode !== 'pending') return;
      bridgeMode = 'local';
      if (bridgeTimer) global.clearTimeout(bridgeTimer);
      global.removeEventListener?.('message', handleChildAck);
      startLocalMeter();
      const queued = Array.from(preConfiguration.entries());
      preConfiguration.clear();
      queued.forEach(([app, count]) => addToBucket(count, app));
    }

    function handleChildAck(event) {
      if (!embedded || event?.source !== global.parent || event?.data?.type !== ACK || event?.data?.protocol !== PROTOCOL) return;
      if (bridgeMode !== 'pending') return;
      bridgeMode = 'parent';
      if (bridgeTimer) global.clearTimeout(bridgeTimer);
      global.removeEventListener?.('message', handleChildAck);
      const queued = Array.from(preConfiguration.entries());
      preConfiguration.clear();
      for (const [app, count] of queued) {
        try { global.parent.postMessage({ type: REPORT, protocol: PROTOCOL, app, units: count }, '*'); } catch (e) {}
      }
    }

    global.addEventListener?.('message', handleParentMessage);
    if (embedded) {
      global.addEventListener?.('message', handleChildAck);
      try { global.parent.postMessage({ type: HELLO, protocol: PROTOCOL, app: localAppKey }, '*'); }
      catch (e) { activateLocalFallback(); }
      if (bridgeMode === 'pending' && typeof global.setTimeout === 'function') bridgeTimer = global.setTimeout(activateLocalFallback, 700);
      else if (bridgeMode === 'local') startLocalMeter();
    } else {
      startLocalMeter();
    }

    function queryChangeReads(snap) {
      if (Array.isArray(snap?.docs) && typeof snap.docChanges === 'function') {
        try {
          return snap.docChanges().filter(change => change.type === 'removed' || !change.doc?.metadata?.hasPendingWrites).length;
        } catch (e) {}
      }
      return 1;
    }

    function wrapListener(target, original, args) {
      const nextIndex = typeof args[0] === 'function' || typeof args[0]?.next === 'function' ? 0 :
        (typeof args[1] === 'function' || typeof args[1]?.next === 'function' ? 1 : -1);
      if (nextIndex < 0) return original.apply(target, args);
      const wrappedArgs = args.slice();
      const observer = wrappedArgs[nextIndex];
      let hasServerSnapshot = false;
      let lastDocFingerprint = null;
      const meterNext = snap => {
        const fromCache = snap?.metadata?.fromCache === true;
        const pendingWrite = snap?.metadata?.hasPendingWrites === true;
        if (!fromCache && !pendingWrite) {
          if (!hasServerSnapshot) {
            sendReport(countInitialSnapshot(snap), localAppKey);
            hasServerSnapshot = true;
            if (!Array.isArray(snap?.docs)) {
              try { lastDocFingerprint = JSON.stringify({ exists: snap.exists, data: snap.exists ? snap.data() : null }); } catch (e) { lastDocFingerprint = ''; }
            }
          } else if (Array.isArray(snap?.docs) && typeof snap.docChanges === 'function') {
            sendReport(queryChangeReads(snap), localAppKey);
          } else {
            let fingerprint = '';
            try { fingerprint = JSON.stringify({ exists: snap.exists, data: snap.exists ? snap.data() : null }); } catch (e) { fingerprint = String(Date.now()); }
            if (fingerprint !== lastDocFingerprint) sendReport(1, localAppKey);
            lastDocFingerprint = fingerprint;
          }
        }
        if (typeof observer === 'function') observer(snap);
        else if (observer && typeof observer.next === 'function') observer.next(snap);
      };
      if (typeof observer === 'function') wrappedArgs[nextIndex] = meterNext;
      else wrappedArgs[nextIndex] = { ...observer, next: meterNext };
      return original.apply(target, wrappedArgs);
    }

    function wrapRef(ref) {
      if (!ref || (typeof ref !== 'object' && typeof ref !== 'function')) return ref;
      if (proxyCache.has(ref)) return proxyCache.get(ref);
      const proxy = new Proxy(ref, {
        get(target, prop) {
          const value = Reflect.get(target, prop, target);
          if (prop === 'get' && typeof value === 'function') {
            return (...args) => Promise.resolve(value.apply(target, args)).then(snap => {
              if (!(args[0] && args[0].source === 'cache') && snap?.metadata?.fromCache !== true) sendReport(countInitialSnapshot(snap), localAppKey);
              return snap;
            });
          }
          if (prop === 'onSnapshot' && typeof value === 'function') return (...args) => wrapListener(target, value, args);
          if (chainMethods.has(prop) && typeof value === 'function') return (...args) => wrapRef(value.apply(target, args));
          return typeof value === 'function' ? value.bind(target) : value;
        }
      });
      proxyCache.set(ref, proxy);
      return proxy;
    }

    const proxyDb = new Proxy(db, {
      get(target, prop) {
        if (prop === 'collection') return (...args) => wrapRef(rawCollection(...args));
        if (prop === 'doc' && rawDoc) return (...args) => wrapRef(rawDoc(...args));
        if (prop === 'collectionGroup' && rawCollectionGroup) return (...args) => wrapRef(rawCollectionGroup(...args));
        if (prop === 'runTransaction' && typeof target.runTransaction === 'function') {
          return (updateFunction, options) => target.runTransaction(transaction => {
            const txProxy = new Proxy(transaction, {
              get(tx, txProp) {
                const method = Reflect.get(tx, txProp, tx);
                if (txProp === 'get' && typeof method === 'function') return (...args) => Promise.resolve(method.apply(tx, args)).then(snap => { sendReport(countInitialSnapshot(snap), localAppKey); return snap; });
                if (txProp === 'getAll' && typeof method === 'function') return (...args) => Promise.resolve(method.apply(tx, args)).then(snaps => { (snaps || []).forEach(snap => sendReport(countInitialSnapshot(snap), localAppKey)); return snaps; });
                return typeof method === 'function' ? method.bind(tx) : method;
              }
            });
            return updateFunction(txProxy);
          }, options);
        }
        const value = Reflect.get(target, prop, target);
        return typeof value === 'function' ? value.bind(target) : value;
      }
    });

    try { installedDbs.set(db, proxyDb); } catch (e) {}
    return proxyDb;
  }

  global.INGESA_QUOTA_METER = { version: 4, install };
})(window);
</script>

<script>
/* INGESA DATA LAYER v2 — snapshots autocontenidos y lecturas puntuales */
(function (global) {
  'use strict';
  const MODEL_INDEX_KEY = 'ingesa_model_index_v2';
  const MODEL_PREFIX = 'ingesa_model_snapshot_v2:';
  const LABEL_PREFIX = 'ingesa_production_label_v2:';
  const IMAGE_PREFIX = 'ingesa_image_v2:';
  const CACHE_TTL = 1000 * 60 * 60 * 24 * 30;
  const memory = { models: new Map(), labels: new Map(), images: new Map(), pending: new Map() };

  const cleanCode = value => String(value == null ? '' : value).trim().toUpperCase();
  const safeId = value => encodeURIComponent(cleanCode(value)).slice(0, 1400);
  const clone = value => { try { return JSON.parse(JSON.stringify(value)); } catch (e) { return value; } };
  const readJSON = key => { try { const raw = localStorage.getItem(key); return raw ? JSON.parse(raw) : null; } catch (e) { return null; } };
  const writeJSON = (key, value) => {
    try { localStorage.setItem(key, JSON.stringify(value)); return; } catch (e) {}
    // QuotaExceeded: liberar SOLO cachés de imágenes propias (regenerables) y reintentar.
    // Se conservan snapshots de modelos y etiquetas porque son más valiosos y difíciles de
    // reconstruir. Nota: purgeLocalImageCaches vive en el scope React (más abajo) y no es
    // accesible aquí; por eso se hace la purga inline.
    try {
      const victims = [];
      for (let i = 0; i < localStorage.length; i++) {
        const k = localStorage.key(i);
        if (!k) continue;
        if (k.startsWith('ingesa_log_img_v1:') || k.startsWith('ingesa_image_v2:')) victims.push(k);
      }
      victims.forEach(k => { try { localStorage.removeItem(k); } catch (er) {} });
      localStorage.setItem(key, JSON.stringify(value));
    } catch (e) {}
  };
  const now = () => Date.now();

  function normalizePieces(items) { return (Array.isArray(items) ? items : []).map(item => ({ ...item })); }

  function normalizeModelSnapshot(input, code) {
    const src = input || {};
    const codigo = cleanCode(src.codigo || src.modelo || code);
    const active = normalizePieces(src.subPiecesData || src.activas || src.pieces || []);
    const inactive = normalizePieces(src.subPiecesDataInactivas || src.inactivas || src.inactivePieces || []);
    const imageData = src.imageData || src.imagenModelo || src.modelImageData || src.localImage || src.imagen || src.image || null;
    return {
      snapshotVersion: 2,
      codigo,
      cliente: String(src.cliente || 'SIN CLIENTE').toUpperCase(),
      estiloCliente: String(src.estiloCliente || '').toUpperCase(),
      threading: clone(src.threading || []),

const CARD_SIZE_RANK = {
  'XXXS':0, '3XS':0, 'XS':1, 'ECH':1, 'XCH':1, 'EXCH':1,
  'S':2, 'CH':2, 'M':3, 'L':4, 'G':4,
  'XL':5, 'EG':5, 'XG':5, 'EXG':5,
  'XXL':6, 'XXG':6, '2XL':6, '2XG':6, '2EG':6,
  'XXXL':7, 'XXXG':7, '3XL':7, '3XG':7, '3EG':7,
  'U':50, 'UNI':50, 'UNICA':50
};
const cardSizeKey = value => String(value || '').trim().toUpperCase().replace(/[.\s_-]/g, '');
const cardSizeRank = value => CARD_SIZE_RANK[cardSizeKey(value)] ?? 90;
const splitCardSizes = value => String(value || '').split(/[,/;|·\s]+/).map(v => v.trim()).filter(Boolean);
const entityTallas = (e) => {
  const values = [];
  (e.orders || []).forEach(o => {
    (o.subPiecesData || []).forEach(p => { if (p?.talla) values.push(...splitCardSizes(p.talla)); });
    (o.progreso || []).forEach(pkg => {
      const piece = (o.subPiecesData || []).find(p => String(p?.pieza || '') === String(pkg?.piezaNombre || ''));
      const talla = pkg?.talla || piece?.talla;
      if (talla) values.push(...splitCardSizes(talla));
    });
  });
  const unique = [...new Set(values.filter(Boolean))];
  // Se ordena por grupos de rango, no por el orden original de Firestore.
  // Así XS siempre queda antes de S, M, L y XL.
  return unique.sort((a, b) => {
    const rankA = cardSizeRank(a);
    const rankB = cardSizeRank(b);
    if (rankA !== rankB) return rankA - rankB;
    return cardSizeKey(a).localeCompare(cardSizeKey(b));
  });
};
const compareEntitiesByTalla = (a, b) => {
  const tallaA = entityTallas(a)[0] || '';

};
const entityPieceTotals = (e) => {

      if (!packageNames.has(name)) totals[name] = (totals[name] || 0) + (Number(piece?.totalPedido) || 0);

};

const INGESA_LOG_CACHE = (() => {
  const KEY = 'ingesa_log_cache_v1';
  const readRaw = () => { try { return JSON.parse(localStorage.getItem(KEY) || '{}'); } catch(e) { return {}; } };
  const read = (k) => { const c = readRaw(); return c[k] || null; };
  const write = (k, data) => {
    const attempt = () => { const c = readRaw(); c[k] = { data, savedAt: Date.now() }; localStorage.setItem(KEY, JSON.stringify(c)); };
    try { attempt(); return; } catch (e) {}
    // QuotaExceeded: purgar caché de imágenes y reintentar; si aún falla, recortar
    // los otros buckets y quedarnos solo con el actual.
    try { purgeLocalImageCaches(); attempt(); return; } catch (e) {}
    try {
      const c = readRaw();
      for (const key of Object.keys(c)) { if (key !== k) delete c[key]; }
      c[k] = { data, savedAt: Date.now() };
      localStorage.setItem(KEY, JSON.stringify(c));
    } catch (e) {}
  };
  const age = (k) => { const x = read(k); return x ? Date.now() - x.savedAt : Infinity; };
  const clear = (k) => { try { const c = readRaw(); if (k) delete c[k]; else for (const key in c) delete c[key]; localStorage.setItem(KEY, JSON.stringify(c)); } catch(e) {} };
  return { read, write, age, clear };
})();

/* ============================================================
   KITS INDEX · espejo local de kits_datos para agrupar KITs en
   Logística sin depender de que cada orden traiga kitRef/kitId.
   Se carga una vez (o cuando se pide force) y se comparte entre
   Modo Fácil y Control de Planta vía suscripción ligera.
============================================================ */
const KITS_CACHE_KEY = 'ingesa_kits_index_cache_v2';
const KITS_CACHE_TTL_MS = 20 * 60 * 1000;
const buildKitsLookup = (kits) => {
  const byCode = new Map(), byId = new Map();
  (kits || []).forEach(kit => {
    const idKey = String(kit.id || '').toUpperCase();
    if (idKey) byId.set(idKey, kit);
    if (kit.kitNumber) byId.set(String(kit.kitNumber).toUpperCase(), kit);
    if (kit.kitId) byId.set(String(kit.kitId).toUpperCase(), kit);
    const pieces = Array.isArray(kit.piezas) ? kit.piezas : (Array.isArray(kit.components) ? kit.components : []);
    pieces.forEach(piece => { const code = String(piece?.codigoUnico || '').toUpperCase(); if (code) byCode.set(code, kit); });
    (kit.componentPackageCodes || []).forEach(code => { const normalized = String(code || '').toUpperCase(); if (normalized) byCode.set(normalized, kit); });
  });
  return { byCode, byId };
};
const readKitsCache = () => { try { const cache = JSON.parse(localStorage.getItem(KITS_CACHE_KEY) || 'null'); return cache && Array.isArray(cache.kits) ? cache : null; } catch (e) { return null; } };
const KITS_STORE = (() => {
  let listeners = new Set();
  const cached = readKitsCache();
  const lookup = buildKitsLookup(cached?.kits || []);
  let state = { loaded: !!cached, loading: false, byCode: lookup.byCode, byId: lookup.byId, kits: cached?.kits || [], savedAt: Number(cached?.savedAt || 0) };
  return {
    get: () => state,
    set: (next) => { state = { ...state, ...next }; listeners.forEach(fn => { try { fn(state); } catch (e) {} }); },
    subscribe: (fn) => { listeners.add(fn); return () => listeners.delete(fn); }
  };
})();

const loadKitsIndex = async (db, force = false) => {
  const current = KITS_STORE.get();
  if (current.loading) return current;
  if (current.loaded && !force && Date.now() - current.savedAt < KITS_CACHE_TTL_MS) return current;
  if (!db) return current;
  KITS_STORE.set({ loading: true });
  try {
    const snap = await db.collection('kits_datos').limit(500).get();
    const kits = snap.docs.map(doc => ({ id: doc.id, ...doc.data() }));
    const { byCode, byId } = buildKitsLookup(kits);
    const savedAt = Date.now();
    try { localStorage.setItem(KITS_CACHE_KEY, JSON.stringify({ kits, savedAt })); } catch (e) {}
    KITS_STORE.set({ loaded: true, loading: false, byCode, byId, kits, savedAt });
    return KITS_STORE.get();
  } catch (e) {
    console.warn('[KITS INDEX] no se pudo cargar kits_datos', e?.code || e?.message || e);
    KITS_STORE.set({ loading: false });
    return KITS_STORE.get();
  }
};

const useKitsCache = () => {
  const [state, setState] = useState(() => KITS_STORE.get());
  useEffect(() => {
    const unsub = KITS_STORE.subscribe(setState);
    if ((!KITS_STORE.get().loaded || Date.now() - KITS_STORE.get().savedAt >= KITS_CACHE_TTL_MS) && !KITS_STORE.get().loading) loadKitsIndex(db).catch(() => {});
    return unsub;
  }, []);
  return state;
};

============================================================ */
const INGESA_FX = (() => {
  let config = null;
  let loaded = false;
  let lastGifId = null;
  const load = async () => {
    if (loaded) return config;
    try {
      const snap = await db.collection('settings').doc('ambiente').get();
      if (snap.exists) {
        const d = snap.data() || {};
        let gifs = Array.isArray(d.fxGifs) ? d.fxGifs.filter(g => g && g.url) : [];
        if (!gifs.length && d.fxGifUrl) gifs = [{ id: 'legacy', url: String(d.fxGifUrl), soundUrl: '' }];
        config = { enabled: d.fxEnabled === true, vibrate: d.fxVibrate === true, defaultSoundUrl: String(d.fxDefaultSoundUrl || d.fxSoundUrl || '').trim(), gifs };
      } else {
        config = { enabled: false, vibrate: false, defaultSoundUrl: '', gifs: [] };
      }
    } catch (e) {
      console.warn('[FX] No se pudo leer settings/ambiente:', e?.message || e);
      config = { enabled: false, vibrate: false, defaultSoundUrl: '', gifs: [] };
    }
    loaded = true;
    return config;
  };
  const pickGif = () => {
    const gifs = (config?.gifs || []).filter(g => g && g.url);
    if (!gifs.length) return null;
    if (gifs.length === 1) return gifs[0];
    const pool = gifs.filter(g => g.id !== lastGifId);
    const usable = pool.length ? pool : gifs;
    const pick = usable[Math.floor(Math.random() * usable.length)];
    lastGifId = pick.id;
    return pick;
  };
  const play = async () => {
    try {
      const cfg = await load();
      if (!cfg || !cfg.enabled) return;
      const gif = pickGif();
      const soundUrl = (gif && gif.soundUrl) || cfg.defaultSoundUrl;
      let overlay = document.getElementById('ingesaLogFxOverlay');
      if (!overlay) {
        overlay = document.createElement('div');
        overlay.id = 'ingesaLogFxOverlay';
        overlay.style.cssText = 'position:fixed;inset:0;z-index:9999;background:rgba(0,0,0,.82);display:none;align-items:center;justify-content:center;flex-direction:column;pointer-events:none';
        overlay.innerHTML = '<img id="ingesaLogFxGif" alt="💥" style="max-width:min(92vw,520px);max-height:62vh;border-radius:16px;box-shadow:0 0 60px rgba(255,120,0,.6);display:none">'
          + '<div style="margin-top:16px;font-size:22px;font-weight:900;color:#fbbf24;text-shadow:0 0 18px rgba(251,191,36,.8),0 2px 0 #000;letter-spacing:.08em;text-align:center">¡BOOM! 💥</div>';
        document.body.appendChild(overlay);
      }
      const img = overlay.querySelector('#ingesaLogFxGif');
      const hide = () => { overlay.style.display = 'none'; };
      if (img && gif && gif.url) {
        img.style.display = 'block';
        img.onerror = () => { img.style.display = 'none'; };
        try {
          const u = new URL(gif.url, window.location.href);
          u.searchParams.set('_t', Date.now());
          img.src = u.toString();
        } catch (e) { img.src = gif.url; }
      } else if (img) {
        img.style.display = 'none';
      }
      overlay.style.display = 'flex';
      if (play._t) clearTimeout(play._t);
      play._t = setTimeout(hide, 10000);
      if (soundUrl) {
        try {
          const a = new Audio(soundUrl);
          a.volume = 0.85;
          a.addEventListener('ended', hide);
          a.addEventListener('error', hide);
          a.play().catch(() => {
            const retry = () => { a.play().catch(() => {}); document.removeEventListener('click', retry); };
            document.addEventListener('click', retry, { once: true });
          });
        } catch (e) { hide(); }
      }
      if (cfg.vibrate && navigator.vibrate) {
        try { navigator.vibrate([200, 80, 200, 80, 400]); } catch (e) {}
      }
    } catch (e) { console.warn('[FX] play:', e?.message || e); }
  };
  return { play };
})();

  const handleError = () => { if (variants.length > 0) return; if (imgSrc && imgSrc.endsWith('.jpg')) setImgSrc(imgSrc.replace('.jpg', '.png')); else setImgSrc(null); };
  const handleVariantSelect = (variant) => { if (onSelectVariant) onSelectVariant(variant); setImgSrc(variant.url); setShowGallery(false); };
  const openGallery = async () => {
    setLoadingGallery(true); setShowGallery(true);
    try {
      const regex = /https:\/\/raw\.githubusercontent\.com\/([^/]+)\/([^/]+)\/([^/]+)\/(.*)/;
      const match = DEFAULT_IMAGE_REPO.match(regex);
      if (match) { const [, user, repo, branch, path] = match; const apiUrl = `https://api.github.com/repos/${user}/${repo}/contents/${path}?ref=${branch}`; const res = await fetch(apiUrl); if (res.ok) { const files = await res.json(); if (Array.isArray(files)) { const images = files.filter(f => f.type === 'file' && /\.(jpg|jpeg|png)$/i.test(f.name)); setGalleryImages(images.map(f => ({ name: f.name, url: f.download_url }))); } } }
    } catch (e) {}
    setLoadingGallery(false);
  };
  if (loading) return <div className={`bg-slate-900 flex items-center justify-center text-slate-500 ${className}`}>Cargando...</div>;
  return (
    <div className="relative inline-block w-full h-full">
      {imgSrc ? (<img src={imgSrc} onError={handleError} className={className} alt={codigo} onClick={() => !hideOptionsButton && setShowOptions(true)} />) : (hideOptionsButton ? (<div className={`flex items-center justify-center bg-slate-900 text-slate-400 ${className}`}>SIN IMAGEN</div>) : (<div className={`flex flex-col items-center justify-center bg-slate-900 text-slate-500 ${className}`} onClick={() => setShowOptions(true)}><Icon name="image-off" size={32}/><span className="text-[10px] mt-1 text-slate-400">Sin img</span></div>))}
      {!hideOptionsButton && (<button onClick={(e) => { e.stopPropagation(); setShowOptions(true); }} className="absolute bottom-1 right-1 bg-slate-800/90 rounded-full p-1 shadow text-white" title="Cambiar imagen"><Icon name="chevron-down" size={14}/></button>)}
      {showOptions && (<div className="fixed inset-0 bg-black/80 z-[200] flex items-center justify-center text-white" onClick={(e)=>e.stopPropagation()}><div className="bg-slate-800 border border-slate-700 rounded-xl w-full max-w-xs p-4"><h3 className="font-bold text-sm mb-3">Cambiar imagen de {codigo}</h3><button onClick={() => { setShowOptions(false); openGallery(); }} className="w-full py-2 bg-indigo-600 text-white rounded font-bold text-xs flex items-center justify-center gap-2"><Icon name="folder-open" size={14}/> Elegir del repositorio</button><button onClick={() => setShowOptions(false)} className="mt-3 w-full py-2 bg-slate-700 text-slate-300 rounded font-bold text-xs">Cerrar</button></div></div>)}
      {showGallery && (<div className="fixed inset-0 bg-black/80 z-[200] flex items-center justify-center text-white" onClick={(e)=>e.stopPropagation()}><div className="bg-slate-800 border border-slate-700 rounded-xl w-full max-w-md p-4 max-h-[80vh] flex flex-col"><div className="flex justify-between items-center mb-3"><h3 className="font-bold text-sm">Galería</h3><button onClick={() => setShowGallery(false)}><Icon name="x" size={18}/></button></div><div className="flex-1 overflow-y-auto">{loadingGallery ? <div className="text-center py-10 text-slate-400">Cargando...</div> : <div className="grid grid-cols-2 gap-2">{galleryImages.map((img,i) => (<div key={i} className="border border-slate-700 bg-slate-900 rounded p-1 cursor-pointer hover:border-[var(--portal-accent)]" onClick={() => handleVariantSelect(img)}><img src={img.url} alt={img.name} className="w-full h-20 object-contain bg-slate-950" /><div className="text-[10px] font-bold text-center truncate mt-1 text-slate-300">{img.name}</div></div>))}{galleryImages.length === 0 && <div className="col-span-2 text-center py-10 text-slate-400">No hay imágenes.</div>}</div>}</div></div></div>)}
    </div>
  );
};

const TimeInput = ({ value, onChange }) => {
  const [mins, setMins] = useState(''); const [secs, setSecs] = useState('');
  useEffect(() => { if (value === undefined || value === '' || value === null) { setMins(''); setSecs(''); return; } const total = parseFloat(value); const m = Math.floor(total); const s = Math.round((total - m) * 60); setMins(m.toString()); setSecs(s < 10 ? '0' + s : s.toString()); }, [value]);
  const handle = (newM, newS) => { const m = parseInt(newM)||0; const s = parseInt(newS)||0; onChange((m + s/60).toFixed(4)); };
  return (<div className="flex items-center gap-0.5"><input inputMode="numeric" value={mins} placeholder="m" onChange={e=>{setMins(e.target.value); handle(e.target.value,secs);}} className="w-12 text-center border border-slate-700 rounded p-1.5 font-mono text-xs bg-slate-900 text-white"/><span className="font-bold text-slate-500">:</span><input inputMode="numeric" value={secs} placeholder="s" max="59" onChange={e=>{setSecs(e.target.value); handle(mins,e.target.value);}} className="w-12 text-center border border-slate-700 rounded p-1.5 font-mono text-xs bg-slate-900 text-white"/></div>);
};

const HoldArchiveButton = ({ onArchive, onReveal }) => {
  const timerRef = useRef(null); const heldRef = useRef(false);
  const readyRef = useRef(false);
  useEffect(() => { const t = setTimeout(() => { readyRef.current = true; }, 400); return () => clearTimeout(t); }, []);
  const clearTimer = () => { if (timerRef.current) clearTimeout(timerRef.current); timerRef.current = null; };
  const beginHold = () => { if (!readyRef.current) return; heldRef.current = false; clearTimer(); timerRef.current = setTimeout(() => { heldRef.current = true; onReveal(); }, 3000); };
  const finishHold = () => { if (!readyRef.current) return; clearTimer(); if (!heldRef.current) onArchive(); };
  return (<button type="button" onPointerDown={beginHold} onPointerUp={finishHold} onPointerCancel={finishHold} onPointerLeave={finishHold} onContextMenu={event => event.preventDefault()} className="w-full py-3 bg-amber-600 hover:bg-amber-500 text-white rounded-lg font-bold flex items-center justify-center gap-2 select-none touch-none" title="Toca para archivar. Mantén 3s para limpieza de prueba."><Icon name="archive" size={18}/> Archivar Orden</button>);
};

const getOrderActionSummary = (order) => {
  const packages = Array.isArray(order?.progreso) ? order.progreso : [];
  const pieces = Array.isArray(order?.subPiecesData) ? order.subPiecesData : [];
  const tallaQty = {};
  packages.forEach(pkg => {
    const piece = pieces.find(p => String(p?.pieza || '') === String(pkg?.piezaNombre || ''));
    const talla = String(pkg?.talla || piece?.talla || 'S/T').trim() || 'S/T';
    tallaQty[talla] = (tallaQty[talla] || 0) + (Number(pkg?.cantidad) || 0);
  });
  if (!packages.length) pieces.forEach(piece => {
    const talla = String(piece?.talla || 'S/T').trim() || 'S/T';
    tallaQty[talla] = (tallaQty[talla] || 0) + (Number(piece?.totalPedido) || 0);
  });
  const pieceTotals = {};
  packages.forEach(pkg => { const name = String(pkg?.piezaNombre || 'PIEZA').trim().toUpperCase(); pieceTotals[name] = (pieceTotals[name] || 0) + (Number(pkg?.cantidad) || 0); });
  if (!packages.length) pieces.forEach(piece => { const name = String(piece?.pieza || 'PIEZA').trim().toUpperCase(); pieceTotals[name] = (pieceTotals[name] || 0) + (Number(piece?.totalPedido) || 0); });
  const totalPieces = packages.length ? packages.reduce((sum, pkg) => sum + (Number(pkg?.cantidad) || 0), 0) : pieces.reduce((sum, piece) => sum + (Number(piece?.totalPedido) || 0), 0);
  const finished = packages.filter(pkg => pkg?.finished === true).length;
  return {
    id: String(order?.id || ''),
    model: String(order?.codigo || order?.modelo || order?.nombreModeloCliente || 'SIN MODELO'),
    partida: String(order?.partida || 'SIN PARTIDA'),
    color: String(order?.color || 'SIN COLOR'),
    diameter: getOrderDiameter(order),
    sizes: Object.entries(tallaQty).sort(([a], [b]) => a.localeCompare(b, undefined, { numeric: true })).map(([size, qty]) => `${size}: ${qty} pzs`),
    pieces: Object.entries(pieceTotals).filter(([, qty]) => qty > 0).map(([name, qty]) => `${name}: ${qty} pzs`),
    totalPackages: packages.length,
    finishedPackages: finished,
    totalPieces,
    hasWeaving: orderHasWeaving(order)
  };
};

          <div><h2 className="font-bold text-lg">Acciones por orden o por partida</h2><div className="text-[11px] opacity-80">No se agrupa ni se ejecuta por O.C.</div></div>
        </div>
        <div className="p-4 sm:p-5">
          <div className="flex justify-between text-sm mb-4 bg-slate-900 p-3 rounded-lg border border-slate-700">
            <div><span className="text-slate-500 block text-xs font-bold uppercase">Orden seleccionada</span><span className="font-black text-white">{order.codigo || order.modelo || 'SIN MODELO'} · Partida {order.partida || 'SIN PARTIDA'} · Ø {getOrderDiameter(order)}</span></div>
            <div className="text-right"><span className="text-slate-500 block text-xs font-bold uppercase">Progreso de esta orden</span><span className={`font-black ${isComplete ? 'text-green-400' : 'text-amber-400'}`}>{finishedPkgs}/{totalPkgs} paquetes</span></div>
          </div>
          <div className="rounded-xl border border-slate-600 bg-slate-950/70 p-3 mb-4">
            <div className="flex flex-wrap items-center justify-between gap-2 mb-2"><div><div className="font-black text-white">Órdenes activas de la partida {order.partida || 'SIN PARTIDA'}</div><div className="text-[9px] text-slate-500">Resultado al procesar partida: tejido = archivar · sin tejido = eliminar</div></div><div className="text-[10px] font-bold text-slate-400">{actionOrders.length} órdenes · {allPackages} paquetes · {allPieces} piezas</div></div>
            <div className="max-h-56 overflow-y-auto space-y-2">
              {orderSummaries.map(({ order: rowOrder, summary, outcome }) => <div key={summary.id} className="rounded-lg border border-slate-700 bg-slate-900 p-2.5">
                <div className="flex flex-wrap items-center justify-between gap-1"><div className="font-black text-sm text-white">{summary.model} <span className="text-slate-400 font-bold">· {summary.partida}</span> <span className="text-[9px] font-normal text-slate-500">ID {summary.id.slice(-10)}</span></div><span className={`rounded px-2 py-0.5 text-[9px] font-black ${summary.hasWeaving ? 'bg-amber-950 text-amber-300 border border-amber-700' : 'bg-rose-950 text-rose-300 border border-rose-700'}`}>{outcome}</span></div>
                <div className="mt-1 text-[10px] text-slate-300">Color: <b className="text-rose-300">{summary.color}</b> · Diámetro: <b className="text-yellow-300">Ø {summary.diameter}</b> · Progreso: <b>{summary.finishedPackages}/{summary.totalPackages} paquetes tejidos</b> · Total: <b>{summary.totalPieces} piezas</b></div>
                <div className="mt-1 text-[10px] text-slate-400">Tallas: <b className="text-fuchsia-300">{summary.sizes.join(' · ') || 'Sin talla registrada'}</b></div>

          <button type="button" disabled={!partidaKey || !actionOrders.length} onClick={() => onConfirm('ARCHIVE_PARTIDA')} className="w-full py-3 rounded-lg font-black border border-amber-500 bg-amber-950/70 hover:bg-amber-900 text-amber-200 disabled:opacity-40">Archivar todas las órdenes ACTIVAS de esta partida ({actionOrders.length})</button>

          <div className="rounded-lg border border-rose-900/70 bg-rose-950/40 p-2 text-[10px] text-rose-200">Al procesar la partida: <b>{archiveOrders} orden(es) con tejido se archivan</b> y <b>{deleteOrders} sin tejido se eliminan</b>, con limpieza/devolución de material cuando aplique. Este resumen incluye las órdenes activas listadas; las ya archivadas no se alteran. Nunca se toma la O.C. como alcance.</div>

        <div className="p-4 space-y-4">
          {Object.entries(byModel).map(([model, list]) => {
            const mKg = list.reduce((s, it) => s + (Number(it.kg) || 0), 0);
            const mPzs = list.reduce((s, it) => s + (Number(it.qty) || 0), 0);
            return (
              <div key={model} className="rounded-xl border border-slate-800 bg-slate-950 overflow-hidden">
                <div className="flex gap-3 p-3 border-b border-slate-800">
                  <div className="w-16 h-20 rounded-lg overflow-hidden bg-slate-900 shrink-0">
                    <SmartImage codigo={model} className="w-full h-full object-contain" hideOptionsButton={true} />
                  </div>
                  <div className="flex-1 min-w-0">
                    <div className="text-sm font-black text-white truncate">{model}</div>
                    <div className="text-[10px] text-slate-500 mt-0.5">{list.length} paquete(s)</div>
                    <div className="text-[11px] text-fuchsia-300 font-black mono mt-1">{mKg.toFixed(2)} kg · {mPzs} pzs</div>
                  </div>
                </div>
                <div className="divide-y divide-slate-800">
                  {list.map((it, i) => (
                    <div key={i} className="flex items-center gap-2 px-3 py-2 text-[11px]">
                      <div className="flex-1 min-w-0"><div className="font-mono text-white truncate">{it.pkgCode}</div><div className="text-slate-500 truncate">{it.partida} · T.{it.talla} · {it.pieza}</div></div>
                      <div className="text-right shrink-0"><div className="font-black mono text-fuchsia-300">{Number(it.kg || 0).toFixed(3)}kg</div><div className="text-slate-500">{it.qty}pzs</div></div>
                    </div>
                  ))}
                </div>
              </div>
            );
          })}
        </div>
      </div>
    </div>
  );
};

const PackageTracking = ({ pkg, recepcion, carga, onOpenCarga }) => {
  const esperado = recepcion ? Number(recepcion.expectedQty) || 0 : 0;
  const buenas = recepcion ? Number(recepcion.receivedGood) || 0 : 0;
  const malas = recepcion ? Number(recepcion.receivedBad) || 0 : 0;
  const saldo = recepcion ? Number(recepcion.saldo) || 0 : 0;
  const hayFaltante = recepcion && buenas < esperado;
  const hayMalas = recepcion && malas > 0;
  const haySaldo = recepcion && saldo > 0;
  const incidencia = hayFaltante || hayMalas;
  const faltaPor = hayFaltante ? esperado - buenas : 0;
  const parcial = Number(pkg.partialQuantity || 0);
  const totalPkg = Number(pkg.cantidad || 0);
  const historial = Array.isArray(pkg.partialHistory) ? pkg.partialHistory : [];
  const hayParcial = parcial > 0 && (parcial < totalPkg || historial.length > 0);
  return (
    <div className="mt-3 pl-3 border-l-2 border-slate-700 space-y-2.5">
      <div className="flex items-start gap-2">
        <div className={`w-2.5 h-2.5 rounded-full mt-1 shrink-0 ${pkg.finished ? 'bg-emerald-500' : (hayParcial ? 'bg-amber-500' : 'bg-slate-600')}`} />
        <div className="flex-1 min-w-0">
          <div className="text-[9px] font-black uppercase tracking-wider text-slate-500">Tejido</div>
          {pkg.finished ? (
            <div className="text-[10px] text-emerald-400">
              ✓ Terminado{pkg.tejedor ? <> por <b className="text-emerald-300">{pkg.tejedor}</b></> : ''}{pkg.fecha ? <span className="text-slate-500"> · {pkg.fecha}</span> : ''}
            </div>
          ) : hayParcial ? (
            <div className="text-[10px] text-amber-400">
              ⏳ Parcial: <b className="text-amber-300">{parcial}/{totalPkg}</b> lienzos
              {historial.length > 0 && <span className="text-slate-500"> · {historial.length} registro(s)</span>}
            </div>
          ) : (
            <div className="text-[10px] text-slate-500">Pendiente</div>
          )}
          {hayParcial && historial.length > 0 && (
            <div className="mt-1 space-y-0.5">
              {historial.slice(-4).map((h, hi) => (
                <div key={hi} className="text-[10px] text-slate-400">
                  · <b className="text-slate-300">{h.operatorName || h.operador || 'ANÓNIMO'}</b>: {h.qty} pzs {h.tipo === 'CIERRE' ? '(cierre)' : '(parcial)'}
                  {h.estado && h.estado !== 'BUENO' && <> · <span className="text-amber-300">{h.estado}</span></>}
                </div>
              ))}
            </div>
          )}
        </div>
      </div>
      {pkg.finished && (
        <div className="flex items-start gap-2">
          <div className={`w-2.5 h-2.5 rounded-full mt-1 shrink-0 ${recepcion ? (incidencia ? 'bg-amber-500' : 'bg-emerald-500') : 'bg-slate-600'}`} />
          <div className="flex-1 min-w-0">
            <div className="text-[9px] font-black uppercase tracking-wider text-slate-500">Recepción · Armador</div>
            {recepcion ? (
              <div className="text-[10px] space-y-0.5">
                <div className={incidencia ? 'text-amber-400' : 'text-emerald-400'}>{incidencia ? '⚠' : '✓'} {buenas}/{esperado} buenas{hayMalas && <> · <span className="text-rose-400">{malas} malas</span></>}{haySaldo && <> · <span className="text-amber-300">{saldo} saldo</span></>}</div>
                {hayFaltante && (<div className="text-rose-400 font-black">✗ INCOMPLETO: {pkg.tejedor || 'TEJEDOR'} marcó completo pero faltaron {faltaPor} pzs</div>)}
                {hayMalas && !hayFaltante && (<div className="text-amber-300">⚠ Enviado "completo" pero con {malas} pza(s) defectuosa(s){haySaldo ? ` (${saldo} saldo)` : ''}</div>)}
                {recepcion.operatorName && (<div className="text-slate-500">Recibido por <b className="text-slate-400">{recepcion.operatorName}</b></div>)}
              </div>
            ) : (<div className="text-[10px] text-slate-500 italic">Esperando recepción en armador…</div>)}
          </div>
        </div>
      )}
      {pkg.finished && recepcion && (
        <div className="flex items-start gap-2">
          <div className={`w-2.5 h-2.5 rounded-full mt-1 shrink-0 ${carga ? (carga.status === 'lista' ? 'bg-fuchsia-500' : carga.status === 'anulada' ? 'bg-rose-500' : 'bg-blue-500') : 'bg-slate-600'}`} />
          <div className="flex-1 min-w-0">
            <div className="text-[9px] font-black uppercase tracking-wider text-slate-500">Armado de partidas</div>
            {carga ? (
              <button type="button" onClick={() => onOpenCarga && onOpenCarga(carga)} className="text-[10px] text-left hover:opacity-80 active:opacity-60">
                <span className="text-fuchsia-400 font-black underline">{carga.code}</span>
                <span className="text-slate-500"> · {carga.status === 'lista' ? 'Cerrada' : carga.status === 'abierta' ? 'En armado' : carga.status}</span>
                <span className="text-fuchsia-300 font-black"> · ver detalle →</span>
              </button>
            ) : (<div className="text-[10px] text-slate-500 italic">Sin carga asignada</div>)}
          </div>
        </div>
      )}
    </div>
  );
};

  useEffect(() => {
    setDateInput(toDateInputValue(getOrderDeliveryDate(rep)));
    setEditingDate(false);

  const hiloStats = useMemo(() => {
    const totals = new Map();
    (entity.orders || []).forEach(order => {
      if (!order.threading) return;
      order.threading.filter(t => t.materialId && Number(t.porcentaje) > 0).forEach(t => {
        let consumido = 0, pendiente = 0;
        (order.progreso || []).forEach(p => {
          const pd = (order.subPiecesData || []).find(sp => sp.pieza === p.piezaNombre);
          const peso = pd ? Number(pd.peso) || 0 : 0;
          const gramos = p.cantidad * peso;
          if (p.finished) consumido += gramos; else pendiente += gramos;
        });
        const key = t.materialId || t.material;
        const cur = totals.get(key) || { material: t.material, consumido: 0, pendiente: 0 };
        cur.consumido += (consumido/1000) * (Number(t.porcentaje)/100);
        cur.pendiente += (pendiente/1000) * (Number(t.porcentaje)/100);
        totals.set(key, cur);
      });
    });
    return Array.from(totals.values());

        <button onClick={onClose} className="p-2 bg-slate-800 text-slate-300 rounded hover:bg-rose-600 hover:text-white transition-colors"><Icon name="x" size={16}/></button>
      </div>
      <div className="flex-1 overflow-y-auto p-4 space-y-4 max-w-4xl mx-auto w-full">
        <div className="flex gap-2">
          {!readOnly && <button onClick={() => actions.onEdit(rep)} className="flex-1 bg-slate-800 hover:bg-slate-700 text-white font-bold py-2 px-3 rounded-lg flex items-center justify-center gap-2 text-xs border border-slate-700"><Icon name="pencil" size={14}/> Editar</button>}
          <button onClick={() => actions.onPrint(entity)} className="flex-1 bg-blue-600 hover:bg-blue-500 text-white font-bold py-2 px-3 rounded-lg flex items-center justify-center gap-2 text-xs border border-blue-500"><Icon name="printer" size={14}/> Imprimir {entity.type === 'kit' ? `KIT (${entity.orders.length})` : ''}</button>
          {!readOnly && <button onClick={() => actions.onArchiveIntent(rep)} className="flex-1 bg-amber-600 hover:bg-amber-500 text-white font-bold py-2 px-3 rounded-lg flex items-center justify-center gap-2 text-xs border border-amber-500"><Icon name="archive" size={14}/> Archivar</button>}
          {!readOnly && actions.onDestroyGroup && <button onClick={() => actions.onDestroyGroup(entity)} title="Revisar acciones por orden o partida" className="bg-rose-700 hover:bg-rose-600 text-white font-bold py-2 px-2 rounded-lg flex items-center justify-center text-xs border border-rose-500">🧨</button>}
          {readOnly && <button onClick={() => actions.onUnarchive(rep)} className="flex-1 bg-emerald-700 hover:bg-emerald-600 text-white font-bold py-2 px-3 rounded-lg flex items-center justify-center gap-2 text-xs border border-emerald-500"><Icon name="archive-restore" size={14}/> Desarchivar</button>}
        </div>
        {readOnly && <div className="text-[10px] text-amber-300 font-black uppercase tracking-widest text-center -mt-1">Solo lectura · archivada</div>}

        {allTejido && (
          <div className="rounded-xl border-2 border-emerald-600 bg-emerald-950/40 p-4 text-center">
            <div className="text-3xl mb-1">✓</div>
            <div className="font-black text-emerald-300">Todos los paquetes tejidos</div>
            <div className="text-[11px] text-emerald-200/80 mt-1">Este {isKit ? 'KIT' : 'paquete'} debe pasar a Recepción de Tejido para su conteo y control.</div>

              </div>

                      <div className="text-xs font-black text-white uppercase truncate">{pieza}</div>

              const malasPkg = recepcion ? Number(recepcion.receivedBad) || 0 : 0;

              return (
                <div key={pkg.id} className={`flex flex-col p-3 rounded-lg border transition-all ${isFinished ? (hayIncidencia ? 'bg-slate-900 border-amber-700/60' : 'bg-slate-900 border-emerald-700/60') : 'bg-slate-950/50 border-slate-800'}`}>
                  <div className="flex items-center justify-between min-w-0 mb-3">
                    <div className="flex flex-col min-w-0">
                      <span className={`font-mono font-bold text-sm truncate ${isFinished ? (hayIncidencia ? 'text-amber-400' : 'text-green-400') : 'text-slate-200'}`}>{pkg.codigoUnico}</span>
                      <div className="text-[10px] font-mono text-slate-500 mt-0.5">{pkg.fecha || 'Sin fecha'}{isKit && ` · Ø ${getOrderDiameter(order)}`}</div>
                    </div>
                    <div className="text-xs text-slate-400 font-medium text-right shrink-0"><span className="uppercase text-slate-300">{pkg.piezaNombre}</span> · <strong className="text-white">{pkg.cantidad} pzs</strong> · {pkg.paqueteNum}/{pkg.paquetesDePieza}</div>
                  </div>
                  <label className={`flex items-center gap-2 bg-slate-950 p-2.5 rounded-lg border border-slate-800 select-none ${readOnly ? 'cursor-default opacity-80' : 'cursor-pointer'}`}>

                  </label>
                  {isFinished && <PackageTracking pkg={pkg} recepcion={recepcion} carga={carga} onOpenCarga={onOpenCarga} />}
                </div>
              );
            })}
          </div>
        </div>
      </div>
    </div>
  );
};

/* ============ MÓDULO · RECEPCIÓN DE TEJIDO ============ */
const RecepcionTejidoPanel = ({ recepciones }) => {
  const [filter, setFilter] = useState('all');
  const [search, setSearch] = useState('');
  const filtered = useMemo(() => {
    let list = filter === 'all' ? recepciones : recepciones.filter(r => r.status === filter);
    if (search.trim()) {
      const q = search.trim().toUpperCase();
      list = list.filter(r => [r.pkgCode, r.model, r.partida, r.color, r.operatorName, r.jefeTurnoName].filter(Boolean).join(' ').toUpperCase().includes(q));
    }
    return list.slice().sort((a,b) => (b.createdAt?.seconds || 0) - (a.createdAt?.seconds || 0));
  }, [recepciones, filter, search]);
  const counts = useMemo(() => ({
    all: recepciones.length,
    ok: recepciones.filter(r => r.status === 'ok').length,
    standby: recepciones.filter(r => r.status === 'standby').length,
    resolved: recepciones.filter(r => r.status === 'resolved').length
  }), [recepciones]);
  const statusPill = s => s === 'ok' ? 'bg-emerald-900/40 text-emerald-300 border border-emerald-700' : s === 'standby' ? 'bg-red-900/40 text-red-300 border border-red-700' : s === 'resolved' ? 'bg-blue-900/40 text-blue-300 border border-blue-700' : 'bg-amber-900/40 text-amber-300 border border-amber-700';
  const fmtTime = t => { if (!t) return '—'; const d = t.toDate ? t.toDate() : new Date(t); return isNaN(d.getTime()) ? '—' : d.toLocaleString('es-MX', { dateStyle:'short', timeStyle:'short' }); };
  const standbyHours = r => { if (!r.alertedAt) return 0; const t = r.alertedAt.toDate ? r.alertedAt.toDate().getTime() : (r.alertedAt.seconds ? r.alertedAt.seconds * 1000 : 0); return t ? (Date.now() - t) / 3600000 : 0; };

  return (
    <div className="p-4">
      <div className="rounded-2xl border border-cyan-700/50 bg-gradient-to-br from-cyan-950/40 to-slate-900/60 p-4 mb-4">
        <div className="text-[10px] font-black uppercase tracking-widest text-cyan-400 flex items-center gap-2"><Icon name="box" size={14}/> Recepción de Tejido <HelpTooltip text={DEFAULT_HELP_NOTES.recepcion_intro}/></div>
        <div className="text-2xl font-black text-white mt-1">Paquetes recibidos</div>
        <div className="text-xs text-slate-400 mt-1">Todo lo que llega desde tejeduría con control de buenas/malas y reposiciones.</div>
        <div className="grid grid-cols-4 gap-2 mt-4">
          <div className="bg-slate-950/60 rounded-lg p-2 text-center"><div className="text-xl font-black text-slate-200">{counts.all}</div><div className="text-[9px] font-black uppercase text-slate-500">Todas</div></div>
          <div className="bg-emerald-950/40 rounded-lg p-2 text-center"><div className="text-xl font-black text-emerald-400">{counts.ok}</div><div className="text-[9px] font-black uppercase text-emerald-600">OK</div></div>
          <div className="bg-red-950/40 rounded-lg p-2 text-center"><div className="text-xl font-black text-red-400">{counts.standby}</div><div className="text-[9px] font-black uppercase text-red-600">Standby</div></div>
          <div className="bg-blue-950/40 rounded-lg p-2 text-center"><div className="text-xl font-black text-blue-400">{counts.resolved}</div><div className="text-[9px] font-black uppercase text-blue-600">Resueltas</div></div>
        </div>
      </div>
      <div className="relative mb-3">
        <input value={search} onChange={e => setSearch(e.target.value)} placeholder="Buscar paquete, modelo, partida, jefe..." className="w-full p-3 pl-10 bg-slate-900 border border-slate-800 text-slate-100 placeholder-slate-500 rounded-xl shadow-sm focus:outline-none focus:border-cyan-500"/>
        <Icon name="search" size={18} className="absolute left-3 top-3.5 text-slate-500"/>
      </div>
      <div className="flex gap-2 mb-4 overflow-x-auto pb-1">
        {[['all','Todas',counts.all],['ok','Correctas',counts.ok],['standby','Standby',counts.standby],['resolved','Resueltas',counts.resolved]].map(([id,label,count]) => (
          <button key={id} onClick={() => setFilter(id)} className={`shrink-0 px-3 py-2 rounded-lg text-[11px] font-black border transition-colors ${filter === id ? 'bg-cyan-600 border-cyan-500 text-white' : 'bg-slate-900 border-slate-700 text-slate-400 hover:text-white'}`}>{label} <span className="opacity-70">· {count}</span></button>
        ))}
      </div>
      {filtered.length === 0 ? (
        <div className="text-center text-slate-500 py-16 text-sm border border-dashed border-slate-800 rounded-xl">No hay recepciones para este filtro.</div>
      ) : (
        <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-3">
          {filtered.map(r => {
            const hrs = standbyHours(r);
            const isStale = r.status === 'standby' && hrs > 1 && !r.escalated;
            return (
              <div key={r.id} className={`rounded-xl border bg-slate-900 p-3 ${r.status === 'standby' ? (r.escalated ? 'border-red-500 animate-pulse' : 'border-red-700/70') : r.status === 'ok' ? 'border-emerald-700/60' : 'border-slate-700'}`}>
                <div className="flex items-start justify-between gap-2 mb-1">
                  <div className="font-mono text-xs font-black text-white truncate">{r.pkgCode}</div>
                  <span className={`pill ${statusPill(r.status)}`}>{r.status}</span>
                </div>
                <div className="text-[11px] text-slate-400 truncate">{r.model} · {r.partida} · T.{r.talla}</div>
                <div className="text-[10px] text-slate-500 mt-1 truncate">{r.pieza}</div>
                <div className="grid grid-cols-3 gap-1 mt-2 text-center">
                  <div className="bg-slate-950 rounded p-1"><div className="text-[9px] text-slate-500 uppercase">Esp.</div><div className="text-sm font-black text-slate-200">{r.expectedQty}</div></div>
                  <div className="bg-slate-950 rounded p-1"><div className="text-[9px] text-emerald-500 uppercase">Buenas</div><div className="text-sm font-black text-emerald-300">{r.receivedGood}</div></div>
                  <div className="bg-slate-950 rounded p-1"><div className="text-[9px] text-red-500 uppercase">Malas</div><div className="text-sm font-black text-red-300">{r.receivedBad || 0}</div></div>
                </div>
                {r.incidenciaTipo && <div className="mt-2 text-[10px] font-black text-amber-400">⚠ {String(r.incidenciaTipo).toUpperCase()}</div>}
                {r.saldo > 0 && <div className="text-[10px] text-amber-300 mt-0.5">Saldo: {r.saldo} pzs</div>}
                {r.notas && <div className="text-[10px] text-slate-500 mt-1 italic line-clamp-2">"{r.notas}"</div>}
                {r.jefeTurnoName && (<div className="text-[10px] text-slate-400 mt-2 border-t border-slate-800 pt-1">Jefe: <b className="text-slate-200">{r.jefeTurnoName}</b>{r.escalated && <span className="ml-1 text-red-400 font-black">· ESCALADA</span>}{isStale && <span className="ml-1 text-amber-400 font-black">· {hrs.toFixed(1)}h</span>}</div>)}
                <div className="text-[9px] text-slate-500 mt-1">Op: {r.operatorName} · {fmtTime(r.createdAt)}</div>
                {r.cargaCode && <div className="text-[10px] font-black text-fuchsia-400 mt-1">→ Carga: {r.cargaCode}</div>}
              </div>
            );
          })}
        </div>
      )}
    </div>
  );
};

/* ============ MÓDULO · CARGAS DE TINTORERÍA ============ */
const CargasTintoreriaPanel = ({ cargas }) => {
  const [selected, setSelected] = useState(null);
  const [filter, setFilter] = useState('all');
  const sorted = useMemo(() => {
    let list = filter === 'all' ? cargas : cargas.filter(c => c.status === filter);
    return list.slice().sort((a,b) => (b.createdAt?.seconds || 0) - (a.createdAt?.seconds || 0));
  }, [cargas, filter]);
  const counts = useMemo(() => ({
    all: cargas.length,
    lista: cargas.filter(c => c.status === 'lista').length,
    enviada: cargas.filter(c => c.status === 'enviada').length,
    recibida: cargas.filter(c => c.status === 'recibida' || c.status === 'en_proceso').length
  }), [cargas]);
  const fmtTime = t => { if (!t) return '—'; const d = t.toDate ? t.toDate() : new Date(t); return isNaN(d.getTime()) ? '—' : d.toLocaleString('es-MX', { dateStyle:'short', timeStyle:'short' }); };
  const statusPill = s => s === 'lista' ? 'bg-amber-900/40 text-amber-300 border border-amber-700' : s === 'enviada' ? 'bg-blue-900/40 text-blue-300 border border-blue-700' : 'bg-emerald-900/40 text-emerald-300 border border-emerald-700';

  const generateCargaPDF = async (carga) => {
    const PDF = window.jspdf?.jsPDF;
    if (!PDF) return alert('No se pudo cargar el generador PDF.');
    const doc = new PDF({ orientation: 'portrait', unit: 'mm', format: 'letter' });
    const margin = 12; const W = doc.internal.pageSize.getWidth(); const H = doc.internal.pageSize.getHeight();
    doc.setFillColor(124, 58, 237); doc.rect(0, 0, W, 14, 'F');
    doc.setTextColor(255,255,255); doc.setFont('helvetica','bold'); doc.setFontSize(15);
    doc.text('INGESA · CARGA TINTORERÍA', margin, 9.5); doc.setTextColor(0,0,0);
    doc.setFontSize(24); doc.text(carga.code, margin, 30);
    doc.setFontSize(10); doc.setFont('helvetica','normal');
    doc.text(`Color: ${carga.color || '—'}`, margin, 38);
    doc.text(`Total: ${Number(carga.totalKg||0).toFixed(2)} kg · ${carga.totalPieces||0} pzs`, margin, 44);
    doc.text(`Empacado por: ${carga.operatorName || '—'}`, margin, 50);
    const byModel = {};
    (carga.items || []).forEach(it => { const m = String(it.model || 'SIN MODELO').toUpperCase(); if (!byModel[m]) byModel[m] = []; byModel[m].push(it); });
    let cursorY = 58;
    for (const [model, list] of Object.entries(byModel)) {
      if (cursorY + 40 > H - margin) { doc.addPage(); cursorY = margin; }
      const cachedImg = readImgCache(model);
      if (cachedImg) { try { const fmt = cachedImg.startsWith('data:image/png') ? 'PNG' : 'JPEG'; doc.addImage(cachedImg, fmt, margin, cursorY, 24, 30, undefined, 'FAST'); } catch (e) {} }
      doc.setFont('helvetica','bold'); doc.setFontSize(13); doc.text(model, margin + 28, cursorY + 8);
      doc.setFont('helvetica','normal'); doc.setFontSize(9);
      const mKg = list.reduce((s, it) => s + (Number(it.kg) || 0), 0);
      const mPzs = list.reduce((s, it) => s + (Number(it.qty) || 0), 0);
      doc.text(`${list.length} paquete(s) · ${mKg.toFixed(2)} kg · ${mPzs} pzs`, margin + 28, cursorY + 15);
      cursorY += 32;
      const body = list.map((it, i) => [String(i+1), it.pkgCode || it.labelCode || it.codigoUnico || '', it.partida||'', it.talla||'', it.pieza||'', String(it.qty||0), (Number(it.kg)||0).toFixed(3)]);
      doc.autoTable({ startY: cursorY, head: [['#','CÓDIGO','PARTIDA','TALLA','PIEZA','PZS','KG']], body, theme: 'grid', styles: { fontSize: 8, cellPadding: 1.5 }, headStyles: { fillColor: [50,45,90], textColor: [255,255,255], fontStyle: 'bold' }, margin: { left: margin, right: margin } });
      cursorY = doc.lastAutoTable.finalY + 6;
    }
    if (cursorY + 12 > H - margin) { doc.addPage(); cursorY = margin; }
    doc.setFont('helvetica','bold'); doc.setFontSize(12);
    doc.text(`TOTAL: ${Number(carga.totalKg||0).toFixed(2)} kg`, margin, cursorY + 4);
    doc.save(`Carga_${carga.code}.pdf`);
  };

  return (
    <div className="p-4">
      <div className="rounded-2xl border border-fuchsia-700/50 bg-gradient-to-br from-fuchsia-950/40 to-slate-900/60 p-4 mb-4">
        <div className="text-[10px] font-black uppercase tracking-widest text-fuchsia-400 flex items-center gap-2"><Icon name="package" size={14}/> Cargas de Tintorería <HelpTooltip text={DEFAULT_HELP_NOTES.cargas_intro}/></div>
        <div className="text-2xl font-black text-white mt-1">Partidas para teñido</div>
        <div className="text-xs text-slate-400 mt-1">Cada carga agrupa paquetes del mismo color. Objetivo sugerido: {TARGET_KG} kg (no obligatorio).</div>
        <div className="grid grid-cols-4 gap-2 mt-4">
          <div className="bg-slate-950/60 rounded-lg p-2 text-center"><div className="text-xl font-black text-slate-200">{counts.all}</div><div className="text-[9px] font-black uppercase text-slate-500">Todas</div></div>
          <div className="bg-amber-950/40 rounded-lg p-2 text-center"><div className="text-xl font-black text-amber-400">{counts.lista}</div><div className="text-[9px] font-black uppercase text-amber-600">Listas</div></div>
          <div className="bg-blue-950/40 rounded-lg p-2 text-center"><div className="text-xl font-black text-blue-400">{counts.enviada}</div><div className="text-[9px] font-black uppercase text-blue-600">Enviadas</div></div>
          <div className="bg-emerald-950/40 rounded-lg p-2 text-center"><div className="text-xl font-black text-emerald-400">{counts.recibida}</div><div className="text-[9px] font-black uppercase text-emerald-600">Recibidas</div></div>
        </div>
      </div>
      <div className="flex gap-2 mb-4 overflow-x-auto pb-1">
        {[['all','Todas',counts.all],['lista','Listas',counts.lista],['enviada','Enviadas',counts.enviada],['recibida','Recibidas',counts.recibida]].map(([id,label,count]) => (
          <button key={id} onClick={() => setFilter(id)} className={`shrink-0 px-3 py-2 rounded-lg text-[11px] font-black border transition-colors ${filter === id ? 'bg-fuchsia-600 border-fuchsia-500 text-white' : 'bg-slate-900 border-slate-700 text-slate-400 hover:text-white'}`}>{label} <span className="opacity-70">· {count}</span></button>
        ))}
      </div>
      {sorted.length === 0 ? (
        <div className="text-center text-slate-500 py-16 text-sm border border-dashed border-slate-800 rounded-xl">Aún no hay cargas armadas.</div>
      ) : (
        <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-3">
          {sorted.map(c => {
            const pct = Math.min(100, Math.round((Number(c.totalKg || 0) / (c.targetKg || TARGET_KG)) * 100));
            return (
              <div key={c.id} className="rounded-xl border border-slate-700 bg-slate-900 p-3 hover:border-fuchsia-500 transition-colors">
                <div className="flex items-start justify-between gap-2 mb-1">
                  <div className="font-mono text-sm font-black text-white">{c.code}</div>
                  <span className={`pill ${statusPill(c.status)}`}>{c.status}</span>
                </div>
                <div className="text-[11px] text-slate-400">Color: <b className="text-slate-200">{c.color}</b></div>
                <div className="text-2xl font-black mono text-fuchsia-300 mt-2">{Number(c.totalKg||0).toFixed(2)}<span className="text-xs">kg</span></div>
                <div className="h-2 mt-1 rounded-full bg-slate-950 overflow-hidden"><div className="h-full bg-fuchsia-500" style={{width:pct+'%'}}/></div>
                <div className="flex items-center justify-between text-[10px] text-slate-500 mt-2"><span>{(c.items||[]).length} paq · {c.totalPieces||0} pzs</span><span>{fmtTime(c.createdAt)}</span></div>
                <div className="text-[10px] text-slate-500 mt-1 truncate">Emp: {c.operatorName}</div>
                <div className="grid grid-cols-2 gap-1 mt-2">
                  <button onClick={() => setSelected(c)} className="text-[10px] font-black py-2 rounded-lg bg-slate-800 hover:bg-slate-700 border border-slate-700">Ver detalle</button>
                  <button onClick={() => generateCargaPDF(c)} className="text-[10px] font-black py-2 rounded-lg bg-fuchsia-700 hover:bg-fuchsia-600 text-white">📄 PDF</button>
                </div>
              </div>
            );
          })}
        </div>
      )}
      {selected && (
        <div className="fixed inset-0 z-[250] bg-black/85 backdrop-blur-sm p-4 flex items-center justify-center" onClick={() => setSelected(null)}>
          <div className="w-full max-w-2xl max-h-[88vh] overflow-y-auto bg-slate-900 border-2 border-fuchsia-600 rounded-2xl p-4" onClick={e => e.stopPropagation()}>
            <div className="flex items-start justify-between mb-3">
              <div>
                <div className="text-[10px] font-black uppercase tracking-widest text-fuchsia-400">Carga · detalle</div>
                <div className="text-2xl font-black mono text-white">{selected.code}</div>
                <div className="text-xs text-slate-400 mt-1">Color {selected.color} · {Number(selected.totalKg||0).toFixed(2)}kg · {(selected.items||[]).length} paquetes</div>
              </div>
              <button onClick={() => setSelected(null)} className="w-9 h-9 rounded-lg bg-slate-800 border border-slate-700 text-white font-black text-lg">✕</button>
            </div>
            <div className="space-y-2 mt-3">
              {(selected.items||[]).map((it, i) => (
                <div key={i} className="flex items-center gap-2 bg-slate-950 p-2 rounded-lg border border-slate-800">
                  <div className="text-slate-500 font-black text-xs w-6">{i+1}</div>
                  <div className="flex-1 min-w-0"><div className="text-xs font-black mono text-white truncate">{it.pkgCode}</div><div className="text-[10px] text-slate-500 truncate">{it.model} · {it.partida} · T.{it.talla} · {it.pieza}</div></div>
                  <div className="text-right"><div className="text-xs font-black mono text-fuchsia-300">{Number(it.kg||0).toFixed(3)}kg</div><div className="text-[9px] text-slate-500">{it.qty}pzs</div></div>
                </div>
              ))}
            </div>
            {selected.notas && <div className="mt-3 text-xs text-slate-400 italic">"{selected.notas}"</div>}
            <div className="grid grid-cols-2 gap-2 mt-4">
              <button onClick={() => generateCargaPDF(selected)} className="py-3 rounded-lg bg-fuchsia-700 hover:bg-fuchsia-600 text-white font-black text-sm">📄 Descargar PDF de la carga</button>
              <button onClick={() => setSelected(null)} className="py-3 rounded-lg bg-slate-800 border border-slate-700 font-black text-sm">Cerrar</button>
            </div>
          </div>
        </div>
      )}
    </div>
  );
};
