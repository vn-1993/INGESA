<script>
/* INGESA Firestore read meter v3 — iframe -> index bridge, client-side estimate only. */
(function (global) {
  'use strict';
  if (global.INGESA_QUOTA_METER?.version === 3) return;

  const PROTOCOL = 1;
  const HELLO = 'INGESA_QUOTA_BRIDGE_HELLO';
  const ACK = 'INGESA_QUOTA_BRIDGE_ACK';
  const REPORT = 'INGESA_QUOTA_BRIDGE_REPORT';
  const chainMethods = new Set(['collection', 'collectionGroup', 'doc', 'where', 'orderBy', 'limit', 'startAt', 'startAfter', 'endAt', 'endBefore', 'select', 'withConverter']);
  const installedDbs = new WeakMap();

  const normalizeAppKey = value => String(value || 'app').toLowerCase()
    .normalize('NFD').replace(/[\u0300-\u036f]/g, '')
    .replace(/[^a-z0-9_-]+/g, '_').replace(/^_+|_+$/g, '').slice(0, 40) || 'app';
  const safeUser = () => {
    try {
      const user = JSON.parse(global.localStorage.getItem('ingesa_logged_user') || 'null');
      const id = String(user?.id || user?.uid || user?.username || user?.name || '').trim();
      return id ? { id, name: String(user?.name || id), role: String(user?.role || '') } : null;
    } catch (e) { return null; }
  };
  const countInitialSnapshot = snap => Array.isArray(snap?.docs) ? Math.max(1, snap.docs.length) : 1;

  function install(db, appName) {
    if (!db || typeof db.collection !== 'function') return db;
    if (installedDbs.has(db)) return installedDbs.get(db);

    const rawCollection = db.collection.bind(db);
    const rawDoc = typeof db.doc === 'function' ? db.doc.bind(db) : null;
    const rawCollectionGroup = typeof db.collectionGroup === 'function' ? db.collectionGroup.bind(db) : null;
    const FieldValue = global.firebase?.firestore?.FieldValue;
    const localAppKey = normalizeAppKey(appName || global.document?.title || 'app');
    const pending = new Map();
    const preConfiguration = new Map();
    const proxyCache = new WeakMap();
    const frameApps = new WeakMap();
    const embedded = !!(global.parent && global.parent !== global);
    let enabled = false;
    let configKnown = false;
    let localStarted = false;
    let bridgeMode = embedded ? 'pending' : 'local';
    let bridgeTimer = null;
    let configUnsub = null;

    const dayKey = () => new Date().toISOString().slice(0, 10);
    const makeDocId = (date, uid) => `${date}__${encodeURIComponent(uid).slice(0, 900)}`;

    function flushOne(key) {
      const bucket = pending.get(key);
      if (!bucket || bucket.busy || !bucket.reads || !FieldValue?.increment) return;
      const appCounts = { ...bucket.readsByApp };
      const reads = Object.values(appCounts).reduce((sum, value) => sum + value, 0);
      if (!reads) return;
      bucket.reads = 0;
      bucket.readsByApp = Object.create(null);
      bucket.busy = true;
      const ref = rawCollection('firestore_quota_usage').doc(makeDocId(bucket.date, bucket.user.id));
      const readsByApp = Object.fromEntries(Object.entries(appCounts).map(([key, value]) => [key, FieldValue.increment(value)]));
      ref.set({
        date: bucket.date,
        userId: bucket.user.id,
        userName: bucket.user.name,
        role: bucket.user.role,
        estimatedReads: FieldValue.increment(reads),
        meterWrites: FieldValue.increment(1),
        readsByApp,
        updatedAt: FieldValue.serverTimestamp()
      }, { merge: true }).catch(e => {
        bucket.reads += reads;
        for (const [app, value] of Object.entries(appCounts)) bucket.readsByApp[app] = (bucket.readsByApp[app] || 0) + value;
        console.warn('[quota meter] no se pudo guardar el agregado', e?.code || e?.message || e);
      }).finally(() => {
        bucket.busy = false;
        if (bucket.reads >= 25) flushOne(key);
        else if (!bucket.reads) pending.delete(key);
      });
    }

    function flushAll() { for (const key of pending.keys()) flushOne(key); }

    function addToBucket(units, sourceApp) {
      const count = Math.max(0, Math.floor(Number(units) || 0));
      if (!count) return;
      if (!configKnown) {
        const app = normalizeAppKey(sourceApp || localAppKey);
        preConfiguration.set(app, (preConfiguration.get(app) || 0) + count);
        return;
      }
      if (!enabled) return;
      const user = safeUser();
      if (!user) return;
      const date = dayKey();
      const key = `${date}::${user.id}`;
      const bucket = pending.get(key) || { date, user, reads: 0, readsByApp: Object.create(null), busy: false };
      bucket.user = user;
      const app = normalizeAppKey(sourceApp || localAppKey);
      bucket.reads += count;
      bucket.readsByApp[app] = (bucket.readsByApp[app] || 0) + count;
      pending.set(key, bucket);
      if (bucket.reads >= 25) flushOne(key);
    }

    function sendReport(units, sourceApp) {
      const count = Math.max(0, Math.floor(Number(units) || 0));
      if (!count) return;
      const app = normalizeAppKey(sourceApp || localAppKey);
      if (!embedded || bridgeMode === 'local') { addToBucket(count, app); return; }
      if (bridgeMode === 'pending') {
        preConfiguration.set(app, (preConfiguration.get(app) || 0) + count);
        return;
      }
      try { global.parent.postMessage({ type: REPORT, protocol: PROTOCOL, app, units: count }, '*'); }
      catch (e) { /* Do not break the business screen if the host refuses messaging. */ }
    }

    function startLocalMeter() {
      if (localStarted) return;
      localStarted = true;
      try {
        configUnsub = rawCollection('launcher_settings').doc('firestore_quota_monitor').onSnapshot(doc => {
          if (doc?.metadata?.fromCache === true) return;
          const next = !!(doc.exists && doc.data()?.enabled === true);
          const wasEnabled = enabled;
          configKnown = true;
          if (wasEnabled && !next) flushAll();
          enabled = next;
          const queued = Array.from(preConfiguration.entries());
          preConfiguration.clear();
          if (enabled) queued.forEach(([app, count]) => addToBucket(count, app));
        }, e => {
          configKnown = true;
          enabled = false;
          preConfiguration.clear();
          console.warn('[quota meter] no se pudo leer el interruptor', e?.code || e?.message || e);
        });
        if (typeof global.setInterval === 'function') global.setInterval(flushAll, 60000);
        if (typeof global.addEventListener === 'function') global.addEventListener('pagehide', flushAll);
        global.document?.addEventListener?.('visibilitychange', () => {
          if (global.document.visibilityState === 'hidden') flushAll();
        });
      } catch (e) {
        configKnown = true;
        enabled = false;
        console.warn('[quota meter] no se pudo inicializar', e?.code || e?.message || e);
      }
    }

    function isLiveFrame(source) {
      if (!source || !global.document?.querySelectorAll) return false;
      try { return Array.from(global.document.querySelectorAll('iframe')).some(frame => frame.contentWindow === source); }
      catch (e) { return false; }
    }

    function handleParentMessage(event) {
      const data = event?.data;
      const source = event?.source;
      if (!data || data.protocol !== PROTOCOL || !isLiveFrame(source)) return;
      if (data.type === HELLO) {
        frameApps.set(source, normalizeAppKey(data.app || 'iframe'));
        try { source.postMessage({ type: ACK, protocol: PROTOCOL }, '*'); } catch (e) {}
        return;
      }
      if (data.type === REPORT && frameApps.has(source)) {
        sendReport(data.units, frameApps.get(source));
      }
    }

    function activateLocalFallback() {
      if (bridgeMode !== 'pending') return;
      bridgeMode = 'local';
      if (bridgeTimer) global.clearTimeout(bridgeTimer);
      global.removeEventListener?.('message', handleChildAck);
      startLocalMeter();
      const queued = Array.from(preConfiguration.entries());
      preConfiguration.clear();
      queued.forEach(([app, count]) => addToBucket(count, app));
    }

    function handleChildAck(event) {
      if (!embedded || event?.source !== global.parent || event?.data?.type !== ACK || event?.data?.protocol !== PROTOCOL) return;
      if (bridgeMode !== 'pending') return;
      bridgeMode = 'parent';
      if (bridgeTimer) global.clearTimeout(bridgeTimer);
      global.removeEventListener?.('message', handleChildAck);
      const queued = Array.from(preConfiguration.entries());
      preConfiguration.clear();
      for (const [app, count] of queued) {
        try { global.parent.postMessage({ type: REPORT, protocol: PROTOCOL, app, units: count }, '*'); } catch (e) {}
      }
    }

    // Any level may receive reports from its direct child iframes; embedded index pages relay upward.
    global.addEventListener?.('message', handleParentMessage);
    if (embedded) {
      global.addEventListener?.('message', handleChildAck);
      try { global.parent.postMessage({ type: HELLO, protocol: PROTOCOL, app: localAppKey }, '*'); }
      catch (e) { activateLocalFallback(); }
      if (bridgeMode === 'pending' && typeof global.setTimeout === 'function') bridgeTimer = global.setTimeout(activateLocalFallback, 700);
      else if (bridgeMode === 'local') startLocalMeter();
    } else {
      startLocalMeter();
    }

    function queryChangeReads(snap) {
      if (Array.isArray(snap?.docs) && typeof snap.docChanges === 'function') {
        try {
          // Conservatively count removed results: a changed document leaving a query may be billable.
          // Physical deletions may be over-counted because the client cannot distinguish the cause.
          return snap.docChanges().filter(change => change.type === 'removed' || !change.doc?.metadata?.hasPendingWrites).length;
        } catch (e) {}
      }
      return 1;
    }

    function wrapListener(target, original, args) {
      const nextIndex = typeof args[0] === 'function' || typeof args[0]?.next === 'function' ? 0 :
        (typeof args[1] === 'function' || typeof args[1]?.next === 'function' ? 1 : -1);
      if (nextIndex < 0) return original.apply(target, args);
      const wrappedArgs = args.slice();
      const observer = wrappedArgs[nextIndex];
      let hasServerSnapshot = false;
      let lastDocFingerprint = null;
      const meterNext = snap => {
        const fromCache = snap?.metadata?.fromCache === true;
        const pendingWrite = snap?.metadata?.hasPendingWrites === true;
        if (!fromCache && !pendingWrite) {
          if (!hasServerSnapshot) {
            sendReport(countInitialSnapshot(snap), localAppKey);
            hasServerSnapshot = true;
            if (!Array.isArray(snap?.docs)) {
              try { lastDocFingerprint = JSON.stringify({ exists: snap.exists, data: snap.exists ? snap.data() : null }); } catch (e) { lastDocFingerprint = ''; }
            }
          } else if (Array.isArray(snap?.docs) && typeof snap.docChanges === 'function') {
            sendReport(queryChangeReads(snap), localAppKey);
          } else {
            let fingerprint = '';
            try { fingerprint = JSON.stringify({ exists: snap.exists, data: snap.exists ? snap.data() : null }); } catch (e) { fingerprint = String(Date.now()); }
            if (fingerprint !== lastDocFingerprint) sendReport(1, localAppKey);
            lastDocFingerprint = fingerprint;
          }
        }
        if (typeof observer === 'function') observer(snap);
        else if (observer && typeof observer.next === 'function') observer.next(snap);
      };
      if (typeof observer === 'function') wrappedArgs[nextIndex] = meterNext;
      else wrappedArgs[nextIndex] = { ...observer, next: meterNext };
      return original.apply(target, wrappedArgs);
    }

    function wrapRef(ref) {
      if (!ref || (typeof ref !== 'object' && typeof ref !== 'function')) return ref;
      if (proxyCache.has(ref)) return proxyCache.get(ref);
      const proxy = new Proxy(ref, {
        get(target, prop) {
          const value = Reflect.get(target, prop, target);
          if (prop === 'get' && typeof value === 'function') {
            return (...args) => Promise.resolve(value.apply(target, args)).then(snap => {
              if (!(args[0] && args[0].source === 'cache') && snap?.metadata?.fromCache !== true) sendReport(countInitialSnapshot(snap), localAppKey);
              return snap;
            });
          }
          if (prop === 'onSnapshot' && typeof value === 'function') return (...args) => wrapListener(target, value, args);
          if (chainMethods.has(prop) && typeof value === 'function') return (...args) => wrapRef(value.apply(target, args));
          return typeof value === 'function' ? value.bind(target) : value;
        }
      });
      proxyCache.set(ref, proxy);
      return proxy;
    }

    const proxyDb = new Proxy(db, {
      get(target, prop) {
        if (prop === 'collection') return (...args) => wrapRef(rawCollection(...args));
        if (prop === 'doc' && rawDoc) return (...args) => wrapRef(rawDoc(...args));
        if (prop === 'collectionGroup' && rawCollectionGroup) return (...args) => wrapRef(rawCollectionGroup(...args));
        if (prop === 'runTransaction' && typeof target.runTransaction === 'function') {
          return (updateFunction, options) => target.runTransaction(transaction => {
            const txProxy = new Proxy(transaction, {
              get(tx, txProp) {
                const method = Reflect.get(tx, txProp, tx);
                if (txProp === 'get' && typeof method === 'function') return (...args) => Promise.resolve(method.apply(tx, args)).then(snap => { sendReport(countInitialSnapshot(snap), localAppKey); return snap; });
                if (txProp === 'getAll' && typeof method === 'function') return (...args) => Promise.resolve(method.apply(tx, args)).then(snaps => { (snaps || []).forEach(snap => sendReport(countInitialSnapshot(snap), localAppKey)); return snaps; });
                return typeof method === 'function' ? method.bind(tx) : method;
              }
            });
            return updateFunction(txProxy);
          }, options);
        }
        const value = Reflect.get(target, prop, target);
        return typeof value === 'function' ? value.bind(target) : value;
      }
    });

    try { installedDbs.set(db, proxyDb); } catch (e) {}
    return proxyDb;
  }

  global.INGESA_QUOTA_METER = { version: 3, install };
})(window);
</script>

    <script type="text/babel">
        const { useState, useEffect, useMemo, useRef } = React;

        const firebaseConfig = {

  projectId: "ingesa-database",

};
        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const db = window.INGESA_QUOTA_METER.install(firebase.firestore(), 'hilaturas');

  // Sincronización del tema y el acento del portal padre.
  (() => {
    const syncPortalTheme = () => {
      try {
        if (!window.parent || window.parent === window) return;
        const parentRoot = window.parent.document.documentElement;
        const current = getComputedStyle(parentRoot);
        const map = {
          '--portal-bg-base': '--bg-base', '--portal-bg-surface': '--bg-surface',
          '--portal-bg-surface-alt': '--bg-surface-alt', '--portal-text-main': '--text-main',
          '--portal-text-muted': '--text-muted', '--portal-border': '--border-main',
          '--portal-accent': '--accent'
        };
        Object.entries(map).forEach(([local, remote]) => {
          const value = current.getPropertyValue(remote).trim();
          if (value) document.documentElement.style.setProperty(local, value);
        });
      } catch (e) {}
    };
    syncPortalTheme();
    setInterval(syncPortalTheme, 500);
  })();


        // =================================================================
        // COMPONENTE ICONO REUTILIZABLE
        // =================================================================
        const Icon = ({ name, size = 18, className = '' }) => {
            const r = useRef(null);
            useEffect(() => {
                if (r.current && window.lucide && window.lucide.icons[name]) {
                    r.current.innerHTML = window.lucide.icons[name].toSvg({ width: size, height: size });
                } else if (r.current) {
                    const fallbacks = { 'printer': '🖨️', 'download': '⬇️', 'spool': '🧵', 'alert-triangle': '⚠️', 'folder': '📁', 'hash': '#', 'grip-vertical': '⋮⋮', 'chevron-down': '🔽', 'chevron-up': '🔼', 'layers': '📚', 'git-merge': '🔗', 'history': '⏳', 'plus': '➕', 'x': '❌', 'edit-2': '✏️', 'save': '💾', 'link': '🔗', 'arrow-down': '⬇️' };
                    r.current.textContent = fallbacks[name] || name;
                }
            }, [name, size]);
            return <span ref={r} className={`inline-flex items-center justify-center ${className || ''}`} />;
        };

        // =================================================================
        // VISTA 1: INVENTARIO CENTRAL Y FUSIÓN
        // =================================================================
        const InventoryView = ({ items }) => {
            const [showForm, setShowForm] = useState(false);
            const [showMergeModal, setShowMergeModal] = useState(false);
            const [isEditing, setIsEditing] = useState(null);
            const [newItem, setNewItem] = useState({ material: '', color: '', hex: '#000000', calibre: '', estiraje: '', stock: '', proveedor: '', group: '', minStock: '10.00', torsionS: '', torsionZ: '' });
            const [originalItem, setOriginalItem] = useState(null);
            const [collapsedGroups, setCollapsedGroups] = useState({});

            const toggleGroup = (groupName) => setCollapsedGroups(prev => ({ ...prev, [groupName]: !prev[groupName] }));

            const groupedItems = useMemo(() => {
                const sorted = [...items].sort((a, b) => {
                    const gA = (a.group || 'SIN GRUPO').toUpperCase();
                    const gB = (b.group || 'SIN GRUPO').toUpperCase();
                    if (gA < gB) return -1; if (gA > gB) return 1;
                    return a.material.localeCompare(b.material);
                });
                return sorted.reduce((acc, item) => {
                    const gName = item.group || 'SIN GRUPO';
                    if (!acc[gName]) acc[gName] = [];
                    acc[gName].push(item);
                    return acc;
                }, {});
            }, [items]);

            const logMovement = async (item, type, quantity, note = '') => {
                 await db.collection('inventory_movements').add({
                    materialId: item.id, materialName: item.material, color: item.color || '',
                    type, quantityKg: quantity, currentStock: item.stock,
                    date: new Date().toISOString().split('T')[0], timestamp: Date.now(), note
                });
            };

            // -------------------------------------------------------------------------
            // FUNCIÓN MAESTRA DE PROPAGACIÓN DE CAMBIOS (Edición y Fusión)
            // -------------------------------------------------------------------------
            const propagateFiberChange = async (oldId, newId, newFullName) => {
                const updates = [];

                // 1. Actualizar en colección: orders
                const ordersSnap = await db.collection('orders').get();
                ordersSnap.forEach(doc => {
                    const data = doc.data();
                    if (data.threading) {
                        let changed = false;
                        const newThreading = data.threading.map(t => {
                            if (t.materialId === oldId) { changed = true; return { ...t, materialId: newId, material: newFullName }; }
                            return t;
                        });
                        if (changed) updates.push({ ref: doc.ref, data: { threading: newThreading } });
                    }
                });

                // 2. Actualizar en colección: plantillas
                const plantillasSnap = await db.collection('plantillas').get();
                plantillasSnap.forEach(doc => {
                    const data = doc.data();
                    if (data.threading) {
                        let changed = false;
                        const newThreading = data.threading.map(t => {
                            if (t.materialId === oldId) { changed = true; return { ...t, materialId: newId, material: newFullName }; }
                            return t;
                        });
                        if (changed) updates.push({ ref: doc.ref, data: { threading: newThreading } });
                    }
                });

                // 3. Actualizar en colección: consumo_hilo_historial (Bitácora)
                const historySnap = await db.collection('consumo_hilo_historial').where('materialId', '==', oldId).get();
                historySnap.forEach(doc => {
                    updates.push({ 
                        ref: doc.ref, 
                        data: { materialId: newId, materialName: newFullName, materialNombre: newFullName } 
                    });
                });

                // 4. Actualizar en colección: hilaturas-ingesa (Estructuras)
                const ingesaSnap = await db.collection('hilaturas-ingesa').where('inventoryId', '==', oldId).get();
                ingesaSnap.forEach(doc => {
                    updates.push({ ref: doc.ref, data: { inventoryId: newId, codigo: newFullName } });
                });

                // EJECUTAR EN LOTES DE 400 (Para evitar error de Firebase de 500 limit por batch)
                const chunkSize = 400;
                for (let i = 0; i < updates.length; i += chunkSize) {
                    const batch = db.batch();
                    updates.slice(i, i + chunkSize).forEach(u => batch.update(u.ref, u.data));
                    await batch.commit();
                }
            };

            const handleSave = async () => {
                if (!newItem.material) return alert("Nombre del material obligatorio");
                
                let updatedList;
                const stockValue = parseFloat(newItem.stock) || 0;
                const minStockValue = parseFloat(newItem.minStock) || 10;
                const payload = {
                    ...newItem, id: isEditing ? newItem.id : Date.now().toString(),
                    stock: stockValue.toFixed(2), minStock: minStockValue.toFixed(2),
                    group: newItem.group.toUpperCase() || 'SIN GRUPO', updatedAt: new Date().toISOString()
                };

                if (isEditing) {
                    updatedList = items.map(i => i.id === payload.id ? payload : i);
                    if (originalItem.material !== payload.material || originalItem.color !== payload.color) {
                        const newFullName = `${payload.material} ${payload.color || ''}`.trim();
                        
                        // Propagar cambios a todo el ecosistema
                        await propagateFiberChange(payload.id, payload.id, newFullName);
                        
                        await logMovement(payload, "EDICION_GLOBAL", 0, `Nombre actualizado globalmente.`);
                    } else {
                        await logMovement(payload, "EDICION_DETALLE", 0, `Cambios en propiedades.`);
                    }
                } else {
                    updatedList = [...items, payload];
                    if (stockValue > 0) await logMovement(payload, "ENTRADA", stockValue, `Ingreso inicial.`);
                }

                await db.collection('inventory').doc('main').set({ items: updatedList });
                setNewItem({ material: '', color: '', hex: '#000000', calibre: '', estiraje: '', stock: '', proveedor: '', group: '', minStock: '10.00', torsionS: '', torsionZ: '' });
                setIsEditing(null); setOriginalItem(null); setShowForm(false);
            };

            const startEdit = (item) => { setOriginalItem({...item}); setNewItem(item); setIsEditing(true); setShowForm(true); window.scrollTo({ top: 0, behavior: 'smooth' }); };

            const MergeModal = () => {
                const [sourceId, setSourceId] = useState('');
                const [targetId, setTargetId] = useState('');
                const [confirmText, setConfirmText] = useState('');
                const [processing, setProcessing] = useState(false);

                const executeMerge = async () => {
                    if (sourceId === targetId) return alert("El origen y destino no pueden ser el mismo.");
                    if (confirmText !== 'FUSIONAR') return alert("Escribe FUSIONAR para confirmar.");
                    setProcessing(true);

                    try {
                        const sourceItem = items.find(i => i.id === sourceId);
                        const targetItem = items.find(i => i.id === targetId);
                        const targetFullName = `${targetItem.material} ${targetItem.color || ''}`.trim();
                        
                        // Sumar Stock y remover el origen del inventario principal
                        const newStock = (parseFloat(targetItem.stock) || 0) + (parseFloat(sourceItem.stock) || 0);
                        
                        let newS = targetItem.torsionS;
                        let newZ = targetItem.torsionZ;
                        if (sourceItem.torsionS || sourceItem.torsionZ || targetItem.torsionS || targetItem.torsionZ) {
                            newS = ((parseFloat(targetItem.torsionS)||0) + (parseFloat(sourceItem.torsionS)||0)).toFixed(2);
                            newZ = ((parseFloat(targetItem.torsionZ)||0) + (parseFloat(sourceItem.torsionZ)||0)).toFixed(2);
                        }

                        let updatedItems = items.map(i => i.id === targetId ? { ...i, stock: newStock.toFixed(2), torsionS: newS, torsionZ: newZ } : i);
                        updatedItems = updatedItems.filter(i => i.id !== sourceId);
                        
                        await db.collection('inventory').doc('main').set({ items: updatedItems });
                        await logMovement(targetItem, "FUSION_ENTRADA", sourceItem.stock, `Fusión recibida de ${sourceItem.material}`);

                        // Propagar fusión a Órdenes, Plantillas, Bitácora y Estructuras INGESA
                        await propagateFiberChange(sourceId, targetId, targetFullName);

                        alert("¡Fusión completada con éxito! La base de datos y todo el historial han sido actualizados.");
                        setShowMergeModal(false);
                    } catch (e) {
                        console.error(e); alert("Error en la fusión.");
                    }
                    setProcessing(false);
                };

                return (
                    <div className="modal-overlay">
                        <div className="bg-slate-800 rounded-xl shadow-2xl w-full max-w-md p-6 border border-slate-700">
                            <h3 className="font-black text-xl text-white mb-2 flex items-center gap-2"><Icon name="git-merge" className="text-indigo-400"/> Herramienta de Fusión</h3>
                            <p className="text-xs text-slate-400 mb-6">Agrupa hilos duplicados. El stock del origen se sumará al destino y se actualizarán todas las órdenes, plantillas, bitácora y estructuras automáticamente.</p>
                            
                            <div className="space-y-4">
                                <div>
                                    <label className="block text-xs font-bold text-red-400 mb-1">ORIGEN (Este hilo se ELIMINARÁ)</label>
                                    <select className="w-full p-3 rounded-lg bg-slate-900 border-2 border-red-900 text-white font-bold" value={sourceId} onChange={e=>setSourceId(e.target.value)}>
                                        <option value="">-- Selecciona el hilo a desaparecer --</option>
                                        {items.map(i => <option key={i.id} value={i.id}>{i.material} {i.color||''} ({i.stock} kg)</option>)}
                                    </select>
                                </div>
                                <div className="flex justify-center text-slate-500"><Icon name="arrow-down" /></div>
                                <div>
                                    <label className="block text-xs font-bold text-green-400 mb-1">DESTINO (Este hilo PREVALECE)</label>
                                    <select className="w-full p-3 rounded-lg bg-slate-900 border-2 border-green-900 text-white font-bold" value={targetId} onChange={e=>setTargetId(e.target.value)}>
                                        <option value="">-- Selecciona el hilo correcto --</option>
                                        {items.map(i => <option key={i.id} value={i.id}>{i.material} {i.color||''} ({i.stock} kg)</option>)}
                                    </select>
                                </div>
                                <div className="pt-4 border-t border-slate-700">
                                    <label className="block text-xs font-bold text-slate-400 mb-1">Escribe "FUSIONAR" para confirmar</label>
                                    <input type="text" className="w-full p-3 rounded-lg bg-slate-900 border border-slate-600 text-white text-center font-black uppercase tracking-widest" value={confirmText} onChange={e=>setConfirmText(e.target.value.toUpperCase())} />
                                </div>
                            </div>
                            
                            <div className="mt-6 flex gap-3">
                                <button onClick={()=>setShowMergeModal(false)} className="flex-1 p-3 bg-slate-700 text-white rounded-lg font-bold">Cancelar</button>
                                <button onClick={executeMerge} disabled={processing || confirmText !== 'FUSIONAR'} className="flex-1 p-3 bg-indigo-600 disabled:bg-slate-700 text-white rounded-lg font-black shadow-lg">
                                    {processing ? 'Procesando...' : 'FUSIONAR AHORA'}
                                </button>
                            </div>
                        </div>
                    </div>
                );
            };

            return (
                <div className="p-4 max-w-7xl mx-auto pb-20">
                    {showMergeModal && <MergeModal />}
                    <div className="flex flex-col md:flex-row gap-3 mb-6">
                        <button onClick={() => { setShowForm(!showForm); if(!showForm) { setIsEditing(false); setNewItem({ material: '', color: '', hex: '#000000', calibre: '', estiraje: '', stock: '', proveedor: '', group: '', minStock: '10.00', torsionS: '', torsionZ: '' }); } }} className={`flex-1 py-3 rounded-xl font-black text-white flex justify-center items-center gap-2 shadow-sm transition-colors ${showForm ? 'bg-slate-700' : 'bg-indigo-600'}`}>
                            <Icon name={showForm ? "x" : "plus"} /> {showForm ? "CANCELAR" : "NUEVA HILATURA"}
                        </button>
                        <button onClick={() => setShowMergeModal(true)} className="md:w-auto py-3 px-6 rounded-xl font-black text-white bg-slate-800 border border-indigo-500/50 hover:bg-slate-700 flex justify-center items-center gap-2">
                            <Icon name="git-merge" /> FUSIONAR HILOS
                        </button>
                    </div>

                    {showForm && (
                        <div className="bg-slate-800 p-5 rounded-xl shadow-lg border border-slate-700 mb-6">
                            <h2 className="font-black text-lg mb-4 text-indigo-400 border-b border-slate-700 pb-2">{isEditing ? "EDITAR REGISTRO" : "CREAR REGISTRO"}</h2>
                            <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                <div>
                                    <label className="block text-xs font-bold mb-1 text-slate-400">GRUPO</label>
                                    <input list="groups" className="w-full bg-slate-900 border border-slate-600 p-3 rounded-lg uppercase font-bold text-white focus:border-indigo-500 outline-none" value={newItem.group} onChange={e => setNewItem({...newItem, group: e.target.value.toUpperCase()})} />
                                    <datalist id="groups"><option value="NYLON" /><option value="POLIESTER" /><option value="ALGODÓN" /></datalist>
                                </div>
                                <div>
                                    <label className="block text-xs font-bold mb-1 text-slate-400">MATERIAL *</label>
                                    <input className="w-full bg-slate-900 border border-slate-600 p-3 rounded-lg uppercase font-black text-white focus:border-indigo-500 outline-none" value={newItem.material} onChange={e => setNewItem({...newItem, material: e.target.value.toUpperCase()})} />
                                </div>
                                <div className="flex gap-3">
                                    <div className="flex-1">
                                        <label className="block text-xs font-bold mb-1 text-slate-400">COLOR (Opcional)</label>
                                        <input placeholder="Ej. ROJO" className="w-full bg-slate-900 border border-slate-600 p-3 rounded-lg uppercase font-bold text-white outline-none" value={newItem.color} onChange={e => setNewItem({...newItem, color: e.target.value.toUpperCase()})} />
                                    </div>
                                    <div className="w-20">
                                        <label className="block text-xs font-bold mb-1 text-slate-400 text-center">TONO</label>
                                        <input type="color" className="w-full h-[52px] border border-slate-600 p-1 rounded-lg cursor-pointer bg-slate-900" value={newItem.hex || '#000000'} onChange={e => setNewItem({...newItem, hex: e.target.value})} />
                                    </div>
                                </div>
                                <div className="flex gap-3">
                                    <div className="flex-1"><label className="block text-xs font-bold mb-1 text-slate-400">CALIBRE</label><input className="w-full bg-slate-900 border border-slate-600 p-3 rounded-lg text-white" value={newItem.calibre} onChange={e => setNewItem({...newItem, calibre: e.target.value})} /></div>
                                    <div className="flex-1"><label className="block text-xs font-bold mb-1 text-slate-400">ESTIRAJE</label><input className="w-full bg-slate-900 border border-slate-600 p-3 rounded-lg text-white" value={newItem.estiraje} onChange={e => setNewItem({...newItem, estiraje: e.target.value})} /></div>
                                </div>
                                <div className="flex gap-3">

                                            const val = e.target.value;
                                            const newStock = (parseFloat(val || 0) + parseFloat(newItem.torsionZ || 0)).toFixed(2);
                                            setNewItem({...newItem, torsionS: val, stock: newStock});

                                    </div>

                                        <label className="block text-xs font-bold mb-1 text-slate-400">TORSIÓN Z (Peso)</label>
                                        <input type="number" step="0.01" className="w-full bg-slate-900 border border-slate-600 p-3 rounded-lg text-white" placeholder="Ej. 1.25" value={newItem.torsionZ || ''} onChange={e => {
                                            const val = e.target.value;
                                            const newStock = (parseFloat(newItem.torsionS || 0) + parseFloat(val || 0)).toFixed(2);
                                            setNewItem({...newItem, torsionZ: val, stock: newStock});

                                    </div>
                                </div>
                                <div className="md:col-span-2 flex gap-4 bg-slate-900/50 p-4 rounded-xl border border-slate-700">
                                    <div className="flex-1">
                                        <label className="block text-xs font-bold mb-1 text-slate-300">STOCK (Kg)</label>
                                        <input type="number" step="0.01" className="w-full bg-slate-900 border-2 border-indigo-500/50 p-3 rounded-lg font-black text-xl text-center text-white" value={newItem.stock} onChange={e => setNewItem({...newItem, stock: e.target.value})} />
                                    </div>
                                    <div className="flex-1">
                                        <label className="block text-xs font-bold mb-1 text-red-400">MÍNIMO (Kg)</label>
                                        <input type="number" step="0.01" className="w-full bg-slate-900 border-2 border-red-500/50 p-3 rounded-lg font-bold text-xl text-center text-red-400" value={newItem.minStock} onChange={e => setNewItem({...newItem, minStock: e.target.value})} />
                                    </div>
                                </div>
                                <div className="md:col-span-2">
                                    <button onClick={handleSave} className="w-full py-4 bg-indigo-600 hover:bg-indigo-500 text-white font-black rounded-xl shadow-lg flex justify-center items-center gap-2 text-lg transition">
                                        <Icon name="save" /> {isEditing ? "GUARDAR CAMBIOS" : "CREAR HILATURA"}
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}

                    <div className="space-y-4">
                        {Object.keys(groupedItems).map(groupName => {
                            const groupItems = groupedItems[groupName];
                            const isCollapsed = collapsedGroups[groupName];
                            return (
                                <div key={groupName} className="bg-slate-800 rounded-xl shadow-sm border border-slate-700 overflow-hidden">
                                    <div className="bg-slate-900 p-4 flex justify-between items-center cursor-pointer hover:bg-slate-800/80 transition" onClick={() => toggleGroup(groupName)}>
                                        <div className="flex items-center gap-3">
                                            <Icon name={isCollapsed ? "chevron-right" : "chevron-down"} className="text-slate-400" />
                                            <h3 className="font-black text-lg text-white tracking-wider">{groupName}</h3>
                                            <span className="bg-slate-700 text-xs px-2 py-1 rounded-full font-bold">{groupItems.length}</span>
                                        </div>
                                    </div>
                                    {!isCollapsed && (
                                        <div className="p-3 bg-slate-800/50 grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-3">
                                            {groupItems.map(item => {
                                                const stockNum = parseFloat(item.stock) || 0;
                                                const minStockNum = parseFloat(item.minStock) || 10;
                                                const isLow = stockNum <= minStockNum;
                                                return (
                                                    <div key={item.id} className={`bg-slate-800 rounded-xl border-l-4 flex flex-col overflow-hidden ${isLow ? 'border-l-red-500' : 'border-l-indigo-500'} border-t border-r border-b border-slate-700`}>
                                                        <div className="p-4 flex gap-3 flex-1">
                                                            <div className="w-10 h-10 rounded-full shrink-0 border-2 border-slate-700" style={{ backgroundColor: item.hex || '#333' }}></div>
                                                            <div className="flex-1 min-w-0">
                                                                <div className="font-black text-lg text-white truncate leading-tight">{item.material}</div>
                                                                <div className="text-sm font-bold text-slate-400">{item.color || 'Sin color esp.'}</div>
                                                                {(item.torsionS || item.torsionZ) && (
                                                                    <div className="flex gap-3 mt-3">
                                                                        {item.torsionS && <span className="bg-slate-900 text-indigo-300 text-sm font-black px-3 py-1.5 rounded-lg border border-indigo-500/50 shadow-sm">S: {item.torsionS} kg</span>}
                                                                        {item.torsionZ && <span className="bg-slate-900 text-emerald-300 text-sm font-black px-3 py-1.5 rounded-lg border border-emerald-500/50 shadow-sm">Z: {item.torsionZ} kg</span>}
                                                                    </div>
                                                                )}
                                                            </div>
                                                        </div>
                                                        <div className="bg-slate-900/50 border-t border-slate-700 p-3 flex items-center justify-between">
                                                            <div>
                                                                <div className="text-[10px] font-bold text-slate-500 uppercase tracking-wider mb-1">Stock Actual</div>
                                                                <div className={`font-black text-xl leading-none ${isLow ? 'text-red-400' : 'text-emerald-400'}`}>{stockNum.toFixed(2)} <span className="text-xs">kg</span></div>
                                                            </div>
                                                            <button onClick={() => startEdit(item)} className="p-2 bg-slate-700 hover:bg-slate-600 text-white rounded-lg transition"><Icon name="edit-2" size={16} /></button>
                                                        </div>
                                                    </div>
                                                );
                                            })}
                                        </div>
                                    )}
                                </div>
                            );
                        })}
                    </div>
                </div>
            );
        };

        // =================================================================
        // VISTA 2: COMPOSICIÓN / ESTRUCTURAS INGESA
        // =================================================================
        const ComposicionView = ({ inventoryBase }) => {
            const [estructuras, setEstructuras] = useState([]);
            const [showForm, setShowForm] = useState(false);
            const [formData, setFormData] = useState({ inventoryId: '', codigo: '', calibre: '', filamentos: '', estiraje: '', notas: '', composicion: [{ material: 'Poliamida', porcentaje: 100 }] });
            
            useEffect(() => {
                const unsub = db.collection('hilaturas-ingesa').onSnapshot(snap => setEstructuras(snap.docs.map(d => ({id: d.id, ...d.data()}))));
                return () => unsub();
            }, []);

            const MATERIAS = ["Poliamida", "Elastano", "Poliéster", "Algodón", "Viscosa", "Otro"];
            const updateComposicion = (idx, field, val) => {
                const newC = [...formData.composicion];
                newC[idx][field] = field === 'porcentaje' ? parseFloat(val)||0 : val;
                setFormData({...formData, composicion: newC});
            };

            const handleSave = async () => {
                const total = formData.composicion.reduce((a, b) => a + b.porcentaje, 0);
                if (total !== 100) return alert("Los porcentajes deben sumar 100%");
                await db.collection('hilaturas-ingesa').add({...formData, updatedAt: Date.now()});
                setShowForm(false); setFormData({ inventoryId: '', codigo: '', calibre: '', filamentos: '', estiraje: '', notas: '', composicion: [{ material: 'Poliamida', porcentaje: 100 }] });
            };

            return (
                <div className="p-4 max-w-7xl mx-auto pb-20">
                    <button onClick={() => setShowForm(!showForm)} className="w-full mb-6 py-3 bg-indigo-600 hover:bg-indigo-500 rounded-xl font-black text-white flex justify-center items-center gap-2">
                        <Icon name={showForm ? "x" : "link"} /> {showForm ? "CANCELAR" : "VINCULAR NUEVA ESTRUCTURA"}
                    </button>
                    {showForm && (
                        <div className="bg-slate-800 p-5 rounded-xl border border-slate-700 mb-6 space-y-4">
                            <div>
                                <label className="block text-xs font-bold text-slate-400 mb-1">HILATURA DEL INVENTARIO</label>
                                <select className="w-full bg-slate-900 border border-slate-600 p-3 rounded-lg text-white font-bold" value={formData.inventoryId} onChange={e => {
                                    const item = inventoryBase.find(i => i.id === e.target.value);
                                    if(item) setFormData({...formData, inventoryId: item.id, codigo: `${item.material} ${item.color||''}`.trim(), calibre: item.calibre||'', estiraje: item.estiraje||''});
                                }}>
                                    <option value="">-- Selecciona --</option>
                                    {inventoryBase.map(i => <option key={i.id} value={i.id}>{i.material} {i.color||''}</option>)}
                                </select>
                            </div>
                            <div className="grid grid-cols-3 gap-3">
                                <div><label className="block text-xs text-slate-400 mb-1">CALIBRE</label><input className="w-full bg-slate-900 p-2 rounded text-white" value={formData.calibre} onChange={e=>setFormData({...formData, calibre:e.target.value})}/></div>
                                <div><label className="block text-xs text-slate-400 mb-1">FILAMENTOS</label><input className="w-full bg-slate-900 p-2 rounded text-white" value={formData.filamentos} onChange={e=>setFormData({...formData, filamentos:e.target.value})}/></div>
                                <div><label className="block text-xs text-slate-400 mb-1">ESTIRAJE</label><input className="w-full bg-slate-900 p-2 rounded text-white" value={formData.estiraje} onChange={e=>setFormData({...formData, estiraje:e.target.value})}/></div>
                            </div>

                                        <select className="flex-1 bg-slate-800 p-2 text-white text-sm" value={c.material} onChange={e=>updateComposicion(idx, 'material', e.target.value)}>

                    <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                        {estructuras.map(e => (

        // =================================================================
        // VISTA 3: BITÁCORA DE CONSUMO (PRODUCCIÓN)
        // =================================================================
        const HistorialConsumoView = () => {
            const [logs, setLogs] = useState([]);
            
            useEffect(() => {
                const unsub = db.collection('consumo_hilo_historial').orderBy('timestamp', 'desc').limit(100)
                    .onSnapshot(snap => setLogs(snap.docs.map(d => ({id: d.id, ...d.data()}))));
