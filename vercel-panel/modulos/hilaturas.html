            }, []);

            return (
                <div className="p-4 max-w-7xl mx-auto pb-20">
                    <div className="bg-slate-800 rounded-xl p-5 border border-slate-700 mb-4 flex items-center justify-between">
                        <h2 className="text-xl font-black text-white flex items-center gap-2"><Icon name="history" className="text-indigo-400"/> Historial de Consumo Real</h2>
                        <div className="text-xs text-slate-400">Descuentos físicos desde piso de producción</div>
                    </div>
                    
                    <div className="bg-slate-800 rounded-xl border border-slate-700 overflow-hidden">
                        <div className="overflow-x-auto">
                            <table className="w-full text-left text-sm text-slate-300">
                                <thead className="bg-slate-900 text-slate-400 text-xs uppercase font-bold">
                                    <tr><th className="p-3">Fecha</th><th className="p-3">Operador</th><th className="p-3">Modelo</th><th className="p-3">Orden / Partida</th><th className="p-3">Pieza / Talla</th><th className="p-3">Máq.</th><th className="p-3">Hilo Consumido</th><th className="p-3 text-right">Kilos Descontados</th></tr>
                                </thead>
                                <tbody>
                                    {logs.length === 0 ? <tr><td colSpan="8" className="p-6 text-center text-slate-500">Aún no hay consumos registrados desde producción.</td></tr> :
                                        logs.map(log => (
                                            <tr key={log.id} className="border-b border-slate-700/50 hover:bg-slate-700/30">
                                                <td className="p-3 text-xs">{log.timestamp ? new Date(log.timestamp).toLocaleString('es-MX') : (log.fecha_legible || '—')}</td>
                                                <td className="p-3 font-bold text-emerald-300">{log.operador || log.operatorName || 'ANÓNIMO'}</td>
                                                <td className="p-3 font-black text-white">{log.modelo || log.codigo || '—'}</td>
                                                <td className="p-3 font-bold text-white">{log.ordenCompra || 'S/OC'} <br/><span className="text-[10px] text-slate-400">{log.partida || 'S/P'}</span></td>
                                                <td className="p-3">{log.pieza || '—'} <br/><span className="text-xs font-bold text-indigo-400">{log.talla || 'S/T'}</span></td>
                                                <td className="p-3 font-mono">{log.maquina || '—'}</td>
                                                <td className="p-3 font-bold">{log.materialNombre || log.materialName || '—'}</td>
                                                <td className="p-3 text-right font-black text-red-400">-{(Number(log.kilos) || 0).toFixed(3)} kg</td>
                                            </tr>
                                        ))
                                    }
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            );
        };

        // =================================================================
        // VISTA 4: ESTIMACIÓN Y RESUMEN (CÓDIGO 1 INTEGRADO)
        // =================================================================
        
        // Helper Estimaciones
        const calculateMaterialConsumption = (orders) => {
            const materials = {};
            orders.forEach(order => {
                let pesoTotalGramos = 0;
                let pesoConsumidoGramos = 0;
                
                const pieceWeights = {};
                (order.subPiecesData || []).forEach(sp => {
                pieceWeights[sp.pieza] = Number(sp.peso) || 0;
                });
                
                (order.progreso || []).forEach(pkg => {
                const weight = pieceWeights[pkg.piezaNombre] || 0;
                const pkgGrams = pkg.cantidad * weight;
                pesoTotalGramos += pkgGrams;
                if (pkg.finished) pesoConsumidoGramos += pkgGrams;
                });
                
                (order.threading || []).forEach(th => {
                if (th.material && Number(th.porcentaje) > 0) {
                    const matName = th.material;
                    const pct = Number(th.porcentaje) / 100;
                    if (!materials[matName]) materials[matName] = { consumido: 0, total: 0 };
                    materials[matName].consumido += (pesoConsumidoGramos * pct) / 1000;
                    materials[matName].total += (pesoTotalGramos * pct) / 1000;
                }
                });
            });
            return materials;
        };

        // Componentes Estimaciones
        const OCAccordion = ({ ocGroup, expanded, onToggle }) => {
            const ocKey = ocGroup.id;
            const allOrders = ocGroup.orders;

            const { totalPkgs, finishedPkgs, progressPercent } = useMemo(() => {
                let total = 0, finished = 0;
                allOrders.forEach(o => {
                total += o.progreso?.length || 0;
                finished += o.progreso?.filter(p => p.finished).length || 0;
                });
                return { totalPkgs: total, finishedPkgs: finished, progressPercent: total ? Math.round((finished / total) * 100) : 0 };
            }, [allOrders]);

            const materialsSummary = useMemo(() => calculateMaterialConsumption(allOrders), [allOrders]);
            const materialKeys = Object.keys(materialsSummary).sort();
            const isFree = totalPkgs === 0 || finishedPkgs === totalPkgs;

            return (
                <div className="bg-slate-800 rounded-xl card-shadow border border-slate-700 h-full flex flex-col overflow-hidden">
                <div className="p-3">
                    <div className="flex items-center justify-between mb-2">
                    <div className="flex items-center gap-2 flex-1">
                        <div className="text-slate-600"><Icon name="grip-vertical" size={18}/></div>
                        <button onClick={onToggle} className="flex items-center gap-3 flex-1 text-left">
                            <div className={`w-12 h-12 rounded-lg flex flex-col items-center justify-center shrink-0 border ${isFree ? 'bg-slate-700 border-slate-600' : 'bg-blue-900/30 border-blue-500/50 shadow-inner'}`}>
                            <span className={`text-[8px] font-bold ${isFree ? 'text-slate-500' : 'text-blue-300'}`}>ORDEN</span>
                            <Icon name="folder" size={20} className={isFree ? 'text-slate-500' : 'text-blue-400'}/>
                            </div>
                            <div className="min-w-0">
                            <div className="text-lg font-black text-slate-100 truncate flex items-center gap-2">{ocKey}</div>
                            <div className="text-xs font-bold text-slate-400 flex items-center gap-1.5 mt-0.5">
                                <Icon name="hash" size={12}/> {allOrders.length} Máquina{allOrders.length!==1?'s':''} en O.C.
                            </div>
                            </div>
                        </button>
                    </div>
                    <button onClick={onToggle} className="p-2"><Icon name={expanded ? 'chevron-up' : 'chevron-down'} size={20} className="text-slate-400" /></button>
                    </div>
                    <div className="w-full bg-slate-900/50 h-3 rounded-full overflow-hidden border border-slate-700 mt-2">
                    <div className="h-full bg-blue-500 transition-all duration-500" style={{ width: `${progressPercent}%` }}></div>
                    </div>
                    <div className="flex justify-between text-[10px] text-slate-500 mt-1">
                    <span>{finishedPkgs}/{totalPkgs} pqs</span><span>{progressPercent}% completado</span>
                    </div>
                </div>

                {expanded && (
                    <div className="border-t border-slate-700 p-3 bg-slate-900/50 flex-1 overflow-y-auto">
                    {materialKeys.length > 0 ? (
                        <div className="flex flex-col gap-2 mb-4 p-3 bg-slate-800 border border-slate-700 rounded-xl">
                        <h3 className="text-[10px] font-bold text-slate-400 uppercase tracking-wider mb-1 flex items-center gap-1">
                            <Icon name="spool" size={14} className="text-blue-400"/> Consumo de Materiales (Estimado O.C.)
                        </h3>
                        <div className="space-y-3 mt-1">
                            {materialKeys.map(mat => {
                            const { consumido, total } = materialsSummary[mat];
                            const pct = total > 0 ? Math.min(100, (consumido / total) * 100) : 0;
                            return (
                                <div key={mat} className="text-xs">
                                <div className="flex justify-between items-end mb-1">
                                    <span className="font-bold text-slate-300 truncate pr-2">{mat.split(' - ')[0]}</span>
                                    <div className="text-right shrink-0">
                                    <span className="text-emerald-400 font-bold">{consumido.toFixed(2)} kg</span>
                                    <span className="text-slate-500 font-bold mx-1">/</span>
                                    <span className="text-slate-300 font-bold">{total.toFixed(2)} kg</span>
                                    </div>
                                </div>
                                <div className="w-full bg-slate-900 h-1.5 rounded-full overflow-hidden border border-slate-700">
                                    <div className="h-full bg-emerald-500 transition-all duration-500" style={{ width: `${pct}%` }}></div>
                                </div>
                                </div>
                            );
                            })}
                        </div>
                        </div>
                    ) : (
                        <div className="text-center text-slate-500 py-4 text-sm">No hay materiales registrados.</div>
                    )}
                    </div>
                )}
                </div>
            );
        };

        const GlobalMaterialsTab = ({ orders, onDownload }) => {
            const enrichedData = useMemo(() => {
                const materials = {};
                orders.forEach(order => {
                    const pieceWeights = {};
                    const pieceTotals = {};
                    (order.subPiecesData || []).forEach(sp => {
                        pieceWeights[sp.pieza] = Number(sp.peso) || 0;
                        pieceTotals[sp.pieza] = Number(sp.totalPedido) || 0;
                    });

                    let pesoConsumidoGramos = 0;
                    (order.progreso || []).forEach(pkg => {
                        if (pkg.finished) pesoConsumidoGramos += (pkg.cantidad || 0) * (pieceWeights[pkg.piezaNombre] || 0);
                    });

                    let pesoTotalGramos = 0;
                    (order.subPiecesData || []).forEach(sp => {
                        pesoTotalGramos += (Number(sp.peso) || 0) * (Number(sp.totalPedido) || 0);
                    });

                    (order.threading || []).forEach(th => {
                        if (th.material && Number(th.porcentaje) > 0) {
                        const matName = th.material;
                        const pct = Number(th.porcentaje) / 100;
                        if (!materials[matName]) materials[matName] = { consumido: 0, total: 0, restante: 0 };
                        materials[matName].consumido += (pesoConsumidoGramos * pct) / 1000;
                        materials[matName].total += (pesoTotalGramos * pct) / 1000;
                        }
                    });
                });

                return Object.keys(materials).map(key => {
                    const s = materials[key];
                    const restante = Math.max(0, s.total - s.consumido);
                    return { name: key, consumido: s.consumido, total: s.total, restante };
                }).sort((a, b) => b.restante - a.restante); 
            }, [orders]);

            return (
                <div className="p-4 max-w-7xl mx-auto space-y-4">
                    <div className="bg-slate-800 rounded-xl p-4 md:p-5 flex flex-col md:flex-row md:items-center justify-between gap-4 border border-slate-700 card-shadow">
                        {enrichedData.length > 0 && (
                        <button onClick={() => onDownload({ data: enrichedData, isOCView: false, title: 'Informe Global de Hilaturas' })} className="bg-indigo-600 hover:bg-indigo-500 text-white px-5 py-2.5 rounded-lg font-bold flex items-center gap-2 transition-colors shadow-lg">
                            <Icon name="download" /> Descargar PDF
                        </button>
                        )}
                    </div>

                    {enrichedData.length === 0 && (
                        <div className="text-center text-slate-500 py-10 font-bold text-lg bg-slate-800 rounded-xl border border-slate-700">No hay materiales en producción actualmente.</div>
                    )}
                    
                    {enrichedData.map(item => {
                        const pct = item.total > 0 ? Math.min(100, (item.consumido / item.total) * 100) : 0;
                        return (
                        <div key={item.name} className="bg-slate-800 border border-slate-700 rounded-xl p-4 md:p-5 flex flex-col xl:flex-row xl:items-center justify-between gap-4 card-shadow">
                            <div className="flex-1">
                            <div className="font-black text-slate-200 text-xl flex items-center gap-2 mb-2"><Icon name="spool" size={24} className="text-indigo-400" />{item.name}</div>
                            <div className="w-full bg-slate-900 h-3 rounded-full overflow-hidden border border-slate-700">
                                <div className="bg-indigo-500 h-full transition-all duration-500" style={{ width: `${pct}%` }}></div>
                            </div>
                            <div className="text-xs text-slate-400 font-bold mt-1.5 text-right">{pct.toFixed(1)}% Consumido</div>
                            </div>
                            <div className="grid grid-cols-3 gap-2 md:gap-4 xl:w-auto w-full shrink-0">
                            <div className="bg-slate-900/50 p-3 rounded-lg border border-slate-700 text-center">
                                <div className="text-[10px] text-slate-400 font-bold uppercase mb-1">Ya Consumido</div>
                                <div className="font-black text-emerald-400 text-base md:text-xl">{item.consumido.toFixed(2)} kg</div>
                            </div>
                            <div className="bg-amber-900/20 p-3 rounded-lg border-2 border-amber-500/50 text-center relative overflow-hidden shadow-[0_0_15px_rgba(245,158,11,0.15)]">
                                <div className="relative z-10">
                                <div className="text-[10px] text-amber-400 font-black uppercase tracking-wider mb-1">Por Consumir</div>
                                <div className="font-black text-amber-400 text-lg md:text-2xl">{item.restante.toFixed(2)} kg</div>
                                </div>
                            </div>
                            <div className="bg-slate-900/50 p-3 rounded-lg border border-slate-700 text-center">
                                <div className="text-[10px] text-slate-400 font-bold uppercase mb-1">Gran Total</div>
                                <div className="font-black text-slate-200 text-base md:text-xl">{item.total.toFixed(2)} kg</div>
                            </div>
                            </div>
                        </div>
                        );
                    })}
                </div>
            );
        };

        const OCMaterialsTab = ({ orders, onDownload }) => {
            const [expandedOC, setExpandedOC] = useState(null);
            const ocGroups = useMemo(() => {
                const groups = {};
                orders.forEach(o => {
                const ocKey = o.ordenCompra ? String(o.ordenCompra).toUpperCase() : o.partida;
                if (!groups[ocKey]) groups[ocKey] = { id: ocKey, orders: [] };
                groups[ocKey].orders.push(o);
                });
                return Object.values(groups).sort((a, b) => a.id.localeCompare(b.id));
            }, [orders]);

            return (
                <div className="p-4 max-w-7xl mx-auto space-y-4">
                    <div className="bg-slate-800 rounded-xl p-4 md:p-5 flex flex-col md:flex-row md:items-center justify-between gap-4 border border-slate-700 card-shadow">
                        {ocGroups.length > 0 && (
                        <button onClick={() => onDownload({ data: ocGroups.map(oc => ({ id: oc.id, materials: calculateMaterialConsumption(oc.orders) })), isOCView: true, title: 'Informe de Hilaturas por O.C.' })} className="bg-blue-600 hover:bg-blue-500 text-white px-5 py-2.5 rounded-lg font-bold flex items-center gap-2 transition-colors shadow-lg">
                            <Icon name="download" /> Descargar PDF (O.C.)
                        </button>
                        )}
                    </div>
                    {ocGroups.length === 0 && (
                        <div className="text-center text-slate-500 py-10 font-bold text-lg bg-slate-800 rounded-xl border border-slate-700">No hay órdenes activas.</div>
                    )}
                    <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                        {ocGroups.map(g => (
                        <OCAccordion key={g.id} ocGroup={g} expanded={expandedOC === g.id} onToggle={() => setExpandedOC(expandedOC === g.id ? null : g.id)} />
                        ))}
                    </div>
                </div>
            );
        };

        const EstimationsView = () => {
            const [orders, setOrders] = useState([]);
            const [viewMode, setViewMode] = useState('global');
            const [ordersLoading, setOrdersLoading] = useState(false);
            const [ordersError, setOrdersError] = useState('');
            const [ordersReadAt, setOrdersReadAt] = useState(null);
            const [ordersSyncDone, setOrdersSyncDone] = useState(false);
            const ordersSyncRef = db.collection('configuracion').doc('hilaturas_orders_sync');

            const readOrdersOnce = async ({ markAsCompleted = false } = {}) => {
                setOrdersLoading(true);
                setOrdersError('');
                try {
                    // Lectura puntual de toda la colección: no deja un listener abierto.
                    const snapshot = await db.collection('orders').get();
                    setOrders(snapshot.docs.map(d => ({ id: d.id, ...d.data() })).filter(o => o.status !== 'ARCHIVADO'));
                    setOrdersReadAt(new Date());
                    if (markAsCompleted) {
                        await ordersSyncRef.set({
                            ordersInitialized: true,
                            initializedAt: firebase.firestore.FieldValue.serverTimestamp(),
                            source: 'HILATURAS_HTML'
                        }, { merge: true });
                        setOrdersSyncDone(true);
                    }
                } catch (error) {
                    console.error('[HILATURAS · lectura puntual orders]', error);
                    setOrdersError(error?.message || 'No se pudo leer la colección orders.');
                } finally {
                    setOrdersLoading(false);
                }
            };

            useEffect(() => {
                let active = true;
                (async () => {
                    try {
                        const syncDoc = await ordersSyncRef.get();
                        if (active) setOrdersSyncDone(syncDoc.exists && syncDoc.data()?.ordersInitialized === true);
                    } catch (error) {
                        console.warn('[HILATURAS · estado de inicialización orders]', error);
                    }
                    if (active) readOrdersOnce();
                })();
                return () => { active = false; };
            }, []);

            const generatePDF = (config) => {
                const { jsPDF } = window.jspdf;
                const doc = new jsPDF();
                const { data, isOCView, title } = config;

                doc.setFontSize(16); doc.setTextColor(20, 20, 20); doc.text(title || 'Informe de Hilaturas', 14, 20);
                doc.setFontSize(10); doc.setTextColor(100, 100, 100); doc.text(`Fecha de generación: ${new Date().toLocaleDateString('es-MX')} a las ${new Date().toLocaleTimeString('es-MX')}`, 14, 28);

                if (!isOCView) {
                    const tableBody = data.map(item => [item.name, item.consumido.toFixed(2), item.restante.toFixed(2), item.total.toFixed(2)]);
                    const totalConsumido = data.reduce((a, b) => a + b.consumido, 0).toFixed(2);
                    const totalRestante = data.reduce((a, b) => a + b.restante, 0).toFixed(2);
                    const totalGran = data.reduce((a, b) => a + b.total, 0).toFixed(2);
                    
                    tableBody.push([
                        { content: 'TOTALES GLOBALES', styles: { fontStyle: 'bold', fillColor: [241, 245, 249], textColor: [15, 23, 42] } },
                        { content: totalConsumido, styles: { fontStyle: 'bold', fillColor: [241, 245, 249], textColor: [15, 23, 42] } },
                        { content: totalRestante, styles: { fontStyle: 'bold', fillColor: [254, 243, 199], textColor: [180, 83, 9] } },
                        { content: totalGran, styles: { fontStyle: 'bold', fillColor: [241, 245, 249], textColor: [15, 23, 42] } }
                    ]);

                    doc.autoTable({
                        startY: 35, head: [['Material', 'Ya Consumido (kg)', 'Por Consumir (kg)', 'Gran Total (kg)']],
                        body: tableBody, theme: 'grid', headStyles: { fillColor: [79, 70, 229] },
                        columnStyles: { 1: { halign: 'right' }, 2: { halign: 'right', fontStyle: 'bold', textColor: [180, 83, 9] }, 3: { halign: 'right' } }
                    });
                    doc.save(`Hilaturas_Global_${new Date().getTime()}.pdf`);
                } else {
                    let currentY = 35;
                    data.forEach((oc) => {
                        const materials = Object.keys(oc.materials).sort();
                        if (materials.length === 0) return;
                        if (currentY > 260) { doc.addPage(); currentY = 20; }
                        doc.setFontSize(12); doc.setTextColor(30, 41, 59); doc.setFont('helvetica', 'bold');
                        doc.text(`O.C. / Grupo: ${oc.id}`, 14, currentY);
                        currentY += 5;

                        const body = materials.map(mat => {
                            const { consumido, total } = oc.materials[mat];
                            return [mat, consumido.toFixed(2), Math.max(0, total - consumido).toFixed(2), total.toFixed(2)];
                        });

                        doc.autoTable({
                            startY: currentY, head: [['Material', 'Ya Consumido (kg)', 'Por Consumir (kg)', 'Gran Total (kg)']],
                            body: body, theme: 'grid', headStyles: { fillColor: [37, 99, 235] },
                            columnStyles: { 1: { halign: 'right' }, 2: { halign: 'right', fontStyle: 'bold', textColor: [180, 83, 9] }, 3: { halign: 'right' } }
                        });
                        currentY = doc.lastAutoTable.finalY + 15;
                    });
                    doc.save(`Hilaturas_Por_OC_${new Date().getTime()}.pdf`);
                }
            };

            return (
                <div className="flex flex-col h-full pb-20">
                    <div className="bg-slate-800 border-b border-slate-700 p-2 flex justify-center gap-2 shrink-0 shadow-md">
                        <button onClick={() => setViewMode('global')} className={`px-6 py-2.5 rounded-lg font-bold text-sm transition-colors flex items-center gap-2 ${viewMode === 'global' ? 'bg-indigo-600 text-white shadow' : 'text-slate-400 hover:text-white hover:bg-slate-700'}`}>
                           <Icon name="spool" size={16}/> Global
                        </button>
                        <button onClick={() => setViewMode('oc')} className={`px-6 py-2.5 rounded-lg font-bold text-sm transition-colors flex items-center gap-2 ${viewMode === 'oc' ? 'bg-blue-600 text-white shadow' : 'text-slate-400 hover:text-white hover:bg-slate-700'}`}>
                           <Icon name="folder" size={16}/> Por Orden (O.C.)
                        </button>
                    </div>
                    <div className="px-4 pt-3 flex flex-wrap items-center justify-between gap-2">
                        <div className="text-[11px] text-slate-500">
                            {ordersLoading ? 'Leyendo toda la colección orders…' : ordersReadAt ? `Lectura puntual: ${ordersReadAt.toLocaleString('es-MX')} · ${orders.length} órdenes activas` : 'Sin lectura de orders'}
                        </div>
                        {!ordersSyncDone && <button onClick={() => readOrdersOnce({ markAsCompleted: true })} disabled={ordersLoading} className="px-3 py-2 rounded-lg bg-indigo-700 border border-indigo-500 text-xs font-black text-white hover:bg-indigo-600 disabled:opacity-50">
                            {ordersLoading ? 'Inicializando…' : 'Inicializar orders (una sola vez)'}
                        </button>}
                    </div>
                    {ordersError && <div className="mx-4 mt-2 rounded-lg border border-red-700 bg-red-950/40 p-3 text-xs font-bold text-red-300">{ordersError}</div>}
                    <div className="flex-1 overflow-y-auto">
                        {viewMode === 'global' ? <GlobalMaterialsTab orders={orders} onDownload={generatePDF} /> : <OCMaterialsTab orders={orders} onDownload={generatePDF} />}
                    </div>
                </div>
            );
        };

        // =================================================================
        // RECEPTOR DE PURGAS DE PRUEBA SOLICITADAS DESDE PLANTA
        // =================================================================
        const processPurgeCommand = async commandId => {
            const commandRef = db.collection('purga_pruebas').doc(commandId);
            let commandData = null;
            try {
                await db.runTransaction(async transaction => {
                    const commandDoc = await transaction.get(commandRef);
                    if (!commandDoc.exists || commandDoc.data()?.estado !== 'PENDIENTE') return;
                    commandData = commandDoc.data();
                    transaction.update(commandRef, { estado:'PROCESANDO', procesandoPor:'HILATURAS', procesandoEn:firebase.firestore.FieldValue.serverTimestamp() });
                });
                if (!commandData) return null;

                const restoreByMaterial = commandData.restaurarPorMaterial || {};
                const inventoryRef = db.collection('inventory').doc('main');
                const movementIds = new Set();
                await db.runTransaction(async transaction => {
                    const [commandDoc, inventoryDoc] = await Promise.all([transaction.get(commandRef), transaction.get(inventoryRef)]);
                    if (!commandDoc.exists || commandDoc.data()?.estado !== 'PROCESANDO') return;
                    if (!inventoryDoc.exists) throw new Error('No existe inventory/main.');
                    const items = inventoryDoc.data().items || [];
                    const missingIds = Object.keys(restoreByMaterial).filter(id => !items.some(item => item.id === id));
                    if (missingIds.length) throw new Error(`Materiales no encontrados en inventario: ${missingIds.join(', ')}`);
                    let changed = false;
                    const updatedItems = items.map(item => {
                        const restore = Number(restoreByMaterial[item.id] || 0);
                        if (!restore) return item;
                        changed = true;
                        const nextStock = Number((Number(item.stock || 0) + restore).toFixed(3));
                        
                        let newS = item.torsionS;
                        let newZ = item.torsionZ;
                        if (item.torsionS !== undefined || item.torsionZ !== undefined) {
                            newS = ((parseFloat(item.torsionS) || 0) + (restore / 2)).toFixed(2);
                            newZ = ((parseFloat(item.torsionZ) || 0) + (restore / 2)).toFixed(2);
                        }

                        const movementId = `${commandId}_${item.id}`.replace(/[^a-zA-Z0-9_-]/g, '_');
                        const movementRef = db.collection('inventory_movements').doc(movementId);
                        movementIds.add(movementId);
                        transaction.set(movementRef, {
                            materialId:item.id, materialName:item.material, color:item.color || '', type:'PURGA_PRUEBA_REINTEGRO', quantityKg:restore, currentStock:nextStock,
                            date:new Date().toISOString().split('T')[0], timestamp:Date.now(), orderId:commandData.orderId || '', pkgId:(commandData.packageIds || []).join(','), purgaCommandId:commandId,
                            note:'Reintegro controlado por limpieza de prueba solicitada desde PLANTA.'
                        });
                        return {...item, stock:nextStock, torsionS: newS, torsionZ: newZ};
                    });
                    if (changed) transaction.update(inventoryRef, {items:updatedItems});
                    transaction.update(commandRef, { estado:'PROCESADO', procesadoPor:'HILATURAS', procesadoEn:firebase.firestore.FieldValue.serverTimestamp(), restauradoPorMaterial:restoreByMaterial, movementIds:[...movementIds] });
                });
                return {movementIds:[...movementIds], restored:restoreByMaterial};
            } catch (error) {
                await commandRef.set({ estado:'ERROR', error:String(error?.message || error), procesadoPor:'HILATURAS', errorEn:firebase.firestore.FieldValue.serverTimestamp() }, {merge:true});
                throw error;
            }
        };

        // =================================================================
        // MAIN APP CONTROLLER
        // =================================================================
        const App = () => {
            const [activeTab, setActiveTab] = useState('inventory');
            const [inventory, setInventory] = useState([]);
            const [purgeNotice, setPurgeNotice] = useState('');

            useEffect(() => {
                const unsub = db.collection('inventory').doc('main').onSnapshot(d => {
                    if(d.exists) setInventory(d.data().items || []);
                });
                return () => unsub();
            }, []);

            useEffect(() => {
                const unsub = db.collection('purga_pruebas').where('estado', '==', 'PENDIENTE').onSnapshot(async snap => {
                    for (const doc of snap.docs) {
                        try {
                            const result = await processPurgeCommand(doc.id);
                            if (result) {
                                setPurgeNotice(`Purga de prueba procesada: ${Object.keys(result.restored || {}).length} materiales reintegrados.`);
                                setTimeout(() => setPurgeNotice(''), 6000);
                            }
                        } catch (error) {
                            setPurgeNotice(`Error procesando purga: ${error.message}`);
                        }
                    }
                }, error => setPurgeNotice(`Error escuchando purgas: ${error.message}`));
                return () => unsub();
            }, []);

            return (
                <div className="flex flex-col min-h-screen">
                    <header className="bg-slate-900 border-b border-slate-800 p-4 sticky top-0 z-50">
                        {purgeNotice && <div className="mb-3 rounded-lg border border-amber-500 bg-amber-950/70 px-3 py-2 text-xs font-bold text-amber-200">{purgeNotice}</div>}
                        <div className="flex gap-2 mt-4 overflow-x-auto no-scrollbar">
                            <button onClick={()=>setActiveTab('inventory')} className={`px-4 py-2 rounded-lg font-bold text-sm transition-colors whitespace-nowrap ${activeTab==='inventory'?'bg-indigo-600 text-white':'bg-slate-800 text-slate-400 hover:text-white'}`}>📦 Inventario Físico</button>
                            <button onClick={()=>setActiveTab('ingesa')} className={`px-4 py-2 rounded-lg font-bold text-sm transition-colors whitespace-nowrap ${activeTab==='ingesa'?'bg-indigo-600 text-white':'bg-slate-800 text-slate-400 hover:text-white'}`}>🧬 Estructuras</button>
                            <button onClick={()=>setActiveTab('history')} className={`px-4 py-2 rounded-lg font-bold text-sm transition-colors whitespace-nowrap ${activeTab==='history'?'bg-indigo-600 text-white':'bg-slate-800 text-slate-400 hover:text-white'}`}>📉 Bitácora Producción</button>
                            <button onClick={()=>setActiveTab('estimations')} className={`px-4 py-2 rounded-lg font-bold text-sm transition-colors whitespace-nowrap ${activeTab==='estimations'?'bg-indigo-600 text-white':'bg-slate-800 text-slate-400 hover:text-white'}`}>📊 Consumo Estimado</button>
                        </div>
                    </header>
                    <main className="flex-1">
                        {activeTab === 'inventory' && <InventoryView items={inventory} />}
                        {activeTab === 'ingesa' && <ComposicionView inventoryBase={inventory} />}
                        {activeTab === 'history' && <HistorialConsumoView />}
                        {activeTab === 'estimations' && <EstimationsView />}
                    </main>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
