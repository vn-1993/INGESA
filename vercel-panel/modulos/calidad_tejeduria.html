    // Solo detecta el modo claro/oscuro del contenedor. Nunca copia su paleta ni sus variables CSS.
    (function () {
        function modeFromDocument(doc) {
            if (!doc) return null;
            const nodes = [doc.documentElement, doc.body, doc.getElementById && doc.getElementById('root'), ...Array.from(doc.querySelectorAll ? doc.querySelectorAll('[data-theme],[data-mode],[data-color-scheme],[data-bs-theme]') : [])].filter(Boolean);
            for (const node of nodes) {
                const hints = ['data-theme', 'data-mode', 'data-color-scheme', 'data-bs-theme']
                    .map(key => node.getAttribute && node.getAttribute(key));
                for (const hint of hints) {
                    const value = String(hint || '').trim().toLowerCase();
                    if (['dark', 'dark-mode', 'oscuro', 'night', 'noche'].includes(value)) return 'dark';
                    if (['light', 'light-mode', 'claro', 'day', 'día', 'dia'].includes(value)) return 'light';
                }
                if (node.classList?.contains('dark') || node.classList?.contains('dark-mode') || node.classList?.contains('theme-dark')) return 'dark';
                if (node.classList?.contains('light') || node.classList?.contains('light-mode') || node.classList?.contains('theme-light')) return 'light';
            }
            try {
                const scheme = String(doc.defaultView.getComputedStyle(doc.documentElement).colorScheme || '').toLowerCase();

                if (scheme.includes('light')) return 'light';

        :root {

        html, body, #root { width: 100%; height: 100%; }

        .app-shell { position: relative; display: flex; flex-direction: column; height: 100dvh; max-width: 28rem; margin: 0 auto; overflow: hidden; background: var(--rosa-papel); box-shadow: 0 0 0 1px rgba(168,28,82,.08); }

        [data-theme="dark"] .wallpaper-overlay { background: rgba(16,14,19,.88); }
        .logo-hold-target { -webkit-touch-callout: none; -webkit-user-select: none; user-select: none; background: none; border: 0; padding: 0; }

        /* Cinta métrica: el detalle de marca (viene del logo) */
        .tape { height: 18px; background-color: var(--cinta); background-image: linear-gradient(90deg, rgba(27,22,32,.82) 1.5px, transparent 1.5px), linear-gradient(90deg, rgba(27,22,32,.82) 1.5px, transparent 1.5px); background-size: 8px 6px, 40px 12px; background-position: left bottom, left bottom; background-repeat: repeat-x; box-shadow: 0 1px 0 rgba(27,22,32,.08); }

        .card { background: var(--superficie); border: 1.5px solid var(--linea); border-radius: 22px; }

        .lbl { display: block; font-size: .9375rem; font-weight: 700; color: var(--tinta-2); }
        .tag { font-size: .8125rem; font-weight: 700; color: var(--tinta-2); background: var(--superficie-suave); padding: .15rem .6rem; border-radius: 999px; white-space: nowrap; }

        .btn { display: flex; align-items: center; justify-content: center; gap: .6rem; width: 100%; min-height: 58px; padding: 0 1.25rem; border-radius: 18px; border: 2px solid transparent; font-size: 1.125rem; font-weight: 800; transition: transform .12s ease, background-color .15s ease; }

        .btn-install { display: inline-flex; align-items: center; gap: .4rem; min-height: 44px; padding: 0 1rem; border-radius: 999px; border: 2px solid var(--rosa); background: var(--superficie); color: var(--rosa-hondo); font-size: .9375rem; font-weight: 800; }

        .hero-btn { display: flex; align-items: center; gap: 1rem; width: 100%; text-align: left; padding: 1.1rem 1.1rem 1.1rem 1.25rem; border-radius: 26px; border: 2px solid transparent; transition: transform .12s ease; }
        .hero-btn:active { transform: scale(.985); }

                const activeSnaps = await Promise.all(QUALITY_ANALYTICS_TABS.map(tab => transaction.get(activeRefs[tab])));
                const currentByTab = {};
                QUALITY_ANALYTICS_TABS.forEach((tab, index) => {
                    currentByTab[tab] = activeSnaps[index].exists ? (activeSnaps[index].data() || {}) : {};
                });
                const now = Date.now();
                const candidateByTab = {};
                const sizeByTab = {};
                QUALITY_ANALYTICS_TABS.forEach(tab => {
                    const old = currentByTab[tab];
                    const registros = Array.isArray(old.registros) ? old.registros : [];
                    candidateByTab[tab] = registros.concat([tabRecords[tab]]);
                    const estimate = { tab, batchId, archived: false, createdAt: old.createdAt || now, updatedAt: now, totalRegistros: candidateByTab[tab].length, registros: candidateByTab[tab] };

                            ...old, tab, batchId, archived: true, archivedAt: now,

        // ================ GATE PIN ================
        const PinGateModal = ({ onSubmit, onClose }) => {

        // ================ APP PRINCIPAL ================
        const App = () => {

            const [view, setView] = useState('HOME');
            const [machineSearch, setMachineSearch] = useState('');

            const [status, setStatus] = useState('');
            const [statusType, setStatusType] = useState('');
            const [savingStage, setSavingStage] = useState('');
            const [analyticsSyncWarning, setAnalyticsSyncWarning] = useState('');

            const [calidadForm, setCalidadForm] = useState(null);
            const [calidadGuardando, setCalidadGuardando] = useState(false);
            const [customDefectos, setCustomDefectos] = useState([]);
            const [nuevoDefectoCustom, setNuevoDefectoCustom] = useState('');
            const [mostrarNuevoDefecto, setMostrarNuevoDefecto] = useState(false);
            const [tejedores, setTejedores] = useState([]);
            const [tejedoresLoading, setTejedoresLoading] = useState(false);
            const [jefesWhitelist, setJefesWhitelist] = useState([]);

            const [machineCatalog, setMachineCatalog] = useState(() => {

            const machineCatalogRequestRef = useRef(null);

            const [showAdminPanel, setShowAdminPanel] = useState(false);
            const [showIosInstall, setShowIosInstall] = useState(false);

            // PWA

            const [isIos, setIsIos] = useState(false);

            const scannerRef = useRef(null);
            const scanCooldown = useRef(false);
            const lastBackPressRef = useRef(0);
            const logoHoldTimer = useRef(null);
            const logoHoldTriggered = useRef(false);
            const analyticsControlCacheRef = useRef({ savedAt: 0, data: null });
            const analyticsReadCacheRef = useRef(new Map());

            // === Nuevo: registros de hoy (solo en este celular), fallas más usadas, búsquedas y avisos ===
            const [usoDefectos, setUsoDefectos] = useState(() => readLocalJSON(USO_DEFECTOS_KEY, {}));
            const [defectoBusqueda, setDefectoBusqueda] = useState('');
            const [tejedorBusqueda, setTejedorBusqueda] = useState('');
            const [toast, setToast] = useState('');
            const toastTimer = useRef(null);
            const formScrollRef = useRef(null);
            const showToast = (msg) => {
                setToast(msg);
                if (toastTimer.current) clearTimeout(toastTimer.current);

            };

            // === Long press logo → admin ===
            const startLogoHold = () => {
                logoHoldTriggered.current = false;
                if (logoHoldTimer.current) clearTimeout(logoHoldTimer.current);
                logoHoldTimer.current = setTimeout(() => { logoHoldTriggered.current = true; setShowAdminPanel(true); }, 3000);
            };
            const cancelLogoHold = () => { if (logoHoldTimer.current) { clearTimeout(logoHoldTimer.current); logoHoldTimer.current = null; } };

            // === PWA install detection ===
            useEffect(() => {
                const checkStandalone = () => {
                    const s = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true || document.referrer.includes('android-app://');
                    setIsInstalled(s);
                };
                checkStandalone();
                const mq = window.matchMedia('(display-mode: standalone)');
                const onMq = (e) => setIsInstalled(e.matches);
                mq.addEventListener?.('change', onMq);
                const ua = window.navigator.userAgent || '';
                const isIosDevice = /iPad|iPhone|iPod/.test(ua) && !window.MSStream;
                setIsIos(isIosDevice);
                const onBeforeInstall = (e) => { e.preventDefault(); setInstallPrompt(e); if (!window.matchMedia('(display-mode: standalone)').matches) setShowInstallBanner(true); };
                window.addEventListener('beforeinstallprompt', onBeforeInstall);
                const onInstalled = () => { setIsInstalled(true); setInstallPrompt(null); setShowInstallBanner(false); };
                window.addEventListener('appinstalled', onInstalled);
                if (isIosDevice && !window.navigator.standalone) setTimeout(() => setShowInstallBanner(true), 2500);
                return () => {
                    window.removeEventListener('beforeinstallprompt', onBeforeInstall);
                    window.removeEventListener('appinstalled', onInstalled);
                    mq.removeEventListener?.('change', onMq);
                };
            }, []);

            const handleInstallClick = async () => {
                if (installPrompt) {
                    installPrompt.prompt();
                    const c = await installPrompt.userChoice;
                    if (c.outcome === 'accepted') { setIsInstalled(true); setShowInstallBanner(false); }
                    setInstallPrompt(null);
                } else if (isIos) setShowIosInstall(true);
                else alert('Abre el menú del navegador (⋮) y toca "Instalar aplicación" o "Agregar a pantalla de inicio".');
            };

            // === Contexto del INDEX ===
            useEffect(() => {
                const normalizeThemeMode = (value) => {
                    if (typeof value === 'boolean') return value ? 'dark' : 'light';
                    if (value && typeof value === 'object') {
                        value = value.mode ?? value.themeMode ?? value.appearance ?? value.colorScheme ?? value.isDark ?? value.dark ?? value.darkMode ?? value.isDarkMode;
                    }
                    const text = String(value || '').trim().toLowerCase();
                    if (['dark', 'dark-mode', 'oscuro', 'night', 'noche'].includes(text)) return 'dark';
                    if (['light', 'light-mode', 'claro', 'day', 'día', 'dia'].includes(text)) return 'light';
                    return null;
                };
                const modeFromMessage = (data) => {
                    if (!data || typeof data !== 'object') return null;
                    const payload = data.payload && typeof data.payload === 'object' ? data.payload : {};
                    const keys = ['theme', 'indexTheme', 'mode', 'themeMode', 'appearance', 'colorScheme', 'isDark', 'dark', 'darkMode', 'isDarkMode'];
                    for (const source of [data, payload]) {
                        for (const key of keys) {
                            const mode = normalizeThemeMode(source[key]);
                            if (mode) return mode;
                        }
                    }
                    return null;
                };
                const modeFromParentDocument = () => {
                    try {
                        if (window.parent === window) return null;
                        const doc = window.parent.document;
                        const themeNodes = [doc.documentElement, doc.body, doc.getElementById && doc.getElementById('root'), ...Array.from(doc.querySelectorAll ? doc.querySelectorAll('[data-theme],[data-mode],[data-color-scheme],[data-bs-theme]') : [])].filter(Boolean);
                        for (const node of themeNodes) {
                            for (const key of ['data-theme', 'data-mode', 'data-color-scheme', 'data-bs-theme']) {
                                const mode = normalizeThemeMode(node.getAttribute?.(key));
                                if (mode) return mode;
                            }
                            if (node.classList?.contains('dark') || node.classList?.contains('dark-mode') || node.classList?.contains('theme-dark')) return 'dark';
                            if (node.classList?.contains('light') || node.classList?.contains('light-mode') || node.classList?.contains('theme-light')) return 'light';
                        }
                        const scheme = String(window.parent.getComputedStyle(doc.documentElement).colorScheme || '').toLowerCase();
                        if (scheme.includes('dark')) return 'dark';
                        if (scheme.includes('light')) return 'light';
                    } catch (e) { /* El padre puede ser de otro origen; se usará el mensaje de tema o el modo del dispositivo. */ }
                    return null;
                };
                const applyThemeMode = mode => {
                    if (mode !== 'dark' && mode !== 'light') return;
                    setUiTheme(mode);
                    document.documentElement.setAttribute('data-theme', mode);
                };
                const receive = (event) => {
                    if (event.source !== window && event.source !== window.parent) return;
                    const message = event.data || {};
                    // Se aceptan señales con el modo, no paletas ni variables de color de INDEX.
                    applyThemeMode(modeFromMessage(message));
                    if (message.type !== 'INDEX_CONTEXT') return;
                    const p = message.payload || {};
                    if (p.name) { const n = String(p.name).trim().toUpperCase(); setUserName(n); localStorage.setItem(STORAGE_KEY_NAME, n); }
                    if (p.id) { const id = String(p.id); setUserId(id); localStorage.setItem(STORAGE_KEY_ID, id); }
                    if (p.role) { const r = String(p.role).trim(); setUserRole(r); localStorage.setItem(STORAGE_KEY_ROLE, r); }
                    if (p.department || p.departamento) setDepartment(String(p.department || p.departamento).trim());
                    if (Array.isArray(p.userDirectory)) setIndexUsers(p.userDirectory);
                };
                window.addEventListener('message', receive);
                applyThemeMode(modeFromParentDocument());
                let observer = null;
                try {
                    if (window.parent !== window && window.parent.document.documentElement && typeof MutationObserver !== 'undefined') {
                        const parentDocument = window.parent.document;
                        observer = new MutationObserver(() => applyThemeMode(modeFromParentDocument()));
                        observer.observe(parentDocument.documentElement, { attributes: true, subtree: true, attributeFilter: ['class', 'style', 'data-theme', 'data-mode', 'data-color-scheme', 'data-bs-theme'] });
                    }
                } catch (e) { /* El puente postMessage sigue disponible para iframes de otro origen. */ }
                if (window.parent !== window) {
                    try { window.parent.postMessage({ type: 'QUALITY_THEME_REQUEST', app: 'calidad_tejeduria' }, '*'); } catch (e) {}
                }
                const systemTheme = window.matchMedia?.('(prefers-color-scheme: dark)');
                const onSystemThemeChange = event => { if (window.parent === window) applyThemeMode(event.matches ? 'dark' : 'light'); };
                systemTheme?.addEventListener?.('change', onSystemThemeChange);
                return () => {
                    window.removeEventListener('message', receive);
                    if (observer) observer.disconnect();
                    systemTheme?.removeEventListener?.('change', onSystemThemeChange);
                };
            }, []);

            useEffect(() => {
                document.documentElement.setAttribute('data-theme', uiTheme);
                document.body.setAttribute('data-theme', uiTheme);
                document.documentElement.style.colorScheme = uiTheme;
                const themeMeta = document.querySelector('meta[name="theme-color"]');
                if (themeMeta) themeMeta.setAttribute('content', uiTheme === 'dark' ? '#17131A' : '#FFF5F9');
            }, [uiTheme]);

            // === Gate PIN ===
            useEffect(() => {
                if (userName && userName.trim()) { setShowPinGate(false); return; }
                const t = setTimeout(() => {
                    const stored = localStorage.getItem(STORAGE_KEY_NAME);
                    if (!stored && !userName) setShowPinGate(true);
                }, 2000);
                return () => clearTimeout(t);
            }, [userName]);

            // === Wallpaper ===
            useEffect(() => {
                let active = true;
                if (!db) return;
                DATA.readDocData(db, QUALITY_VISUAL_COLLECTION, 'escaner_visual', { ttlMs: 5 * 60 * 1000 })
                    .then(doc => { if (active) setVisualConfig(doc.exists ? doc.data : null); })
                    .catch(() => {});
                return () => { active = false; };
            }, []);

            const currentWallpaper = useMemo(() => {
                if (localWallpaperOverride !== undefined) return localWallpaperOverride;
                if (!visualConfig) return null;
                const upperName = (userName || '').toUpperCase();
                return visualConfig.wallpapers?.[upperName] || visualConfig.fondoGlobal || null;
            }, [visualConfig, userName, localWallpaperOverride]);

            // === Back button ===
            useEffect(() => {
                if (!window.history.state || window.history.state.view !== 'root_calidad') window.history.replaceState({ view: 'root_calidad', sub: 'HOME' }, '');
                const handlePop = () => {
                    if (showIosInstall) { setShowIosInstall(false); window.history.pushState({ view: 'root_calidad', sub: view }, ''); return; }
                    if (showAdminPanel) { setShowAdminPanel(false); window.history.pushState({ view: 'root_calidad', sub: view }, ''); return; }
                    const now = Date.now();
                    if (view === 'HOME') {
                        if (now - lastBackPressRef.current < 2000) window.history.back();
                        else { lastBackPressRef.current = now; showToast('Presiona atrás otra vez para salir'); window.history.pushState({ view: 'root_calidad', sub: 'HOME' }, ''); }
                        return;
                    }
                    if (scanning) stopScanner();
                    setView('HOME'); setCalidadForm(null);
                    window.history.pushState({ view: 'root_calidad', sub: 'HOME' }, '');
                };
                window.addEventListener('popstate', handlePop);
                return () => window.removeEventListener('popstate', handlePop);
            }, [view, scanning, showAdminPanel, showIosInstall]);

            const navigateTo = (nv) => { window.history.pushState({ view: 'root_calidad', sub: nv }, ''); setView(nv); };

            // === Catálogo de máquinas ===
            const loadMachineCatalog = async (force = false) => {
                if (!db) return [];
                let cached = null;
                try {
                    cached = JSON.parse(localStorage.getItem('ingesa_calidad_machine_catalog_v1') || 'null');
                    if (cached && Array.isArray(cached.items)) setMachineCatalog(cached.items);
                    if (!force && cached && Array.isArray(cached.items) && Date.now() - Number(cached.savedAt || 0) < 10 * 60 * 1000) return cached.items;
                } catch (e) { cached = null; }
                if (machineCatalogRequestRef.current) return machineCatalogRequestRef.current;
                const req = db.collection('maquinas').get().then(snap => {
                    const items = snap.docs.map(d => ({ id: d.id, ...d.data() }));
                    const next = { savedAt: Date.now(), items };
                    try { localStorage.setItem('ingesa_calidad_machine_catalog_v1', JSON.stringify(next)); } catch (e) {}
                    setMachineCatalog(items);
                    return items;
                }).catch(err => { if (cached && Array.isArray(cached.items)) { setMachineCatalog(cached.items); return cached.items; } throw err; })
                .finally(() => { machineCatalogRequestRef.current = null; });
                machineCatalogRequestRef.current = req;
                return req;
            };

            const getMachineDiameter = (machine, catalog = machineCatalog) => {
                const key = String(machine || '').trim().replace(/^0+(?=\d)/, '');
                const found = catalog.find(m => String(m.numero || m.id || '').trim().replace(/^0+(?=\d)/, '') === key);
                return found?.diametro ?? '';
            };
            const getMachinesForDiameter = (diameter, catalog = machineCatalog) => {
                const key = String(diameter ?? '').trim();
                return catalog.filter(m => m.activo !== false && String(m.diametro ?? '').trim() === key).sort((a,b) => String(a.numero || a.id).localeCompare(String(b.numero || b.id), undefined, { numeric: true }));
            };

            const analyticsRows = useMemo(() => {
                const records = Array.isArray(analyticsData?.registros) ? analyticsData.registros : [];
                if (analyticsTab === 'general') {
                    return records.map((r, index) => ({
                        key: `${r.timestamp || index}_${index}`,
                        title: `${r.defectoCodigo || ''} · ${r.defectoNombre || 'Defecto'}`,
                        subtitle: `Máquina ${r.maquina || '—'} · Modelo ${r.modelo || '—'} · ${r.tejedorResponsable || 'Sin tejedor'}`,
                        cantidadLienzos: Number(r.cantidadLienzos) || 0,
                        totalRegistros: 1,
                        timestamp: Number(r.timestamp) || 0
                    })).sort((a, b) => b.timestamp - a.timestamp);
                }
                const groups = new Map();
                records.forEach((r, index) => {
                    const defect = `${r.defectoCodigo || ''} ${r.defectoNombre || 'Defecto'}`.trim();
                    let title = '', keyHead = '';
                    if (analyticsTab === 'tejedores') {
                        title = r.tejedorResponsable || 'SIN TEJEDOR ASIGNADO';
                        keyHead = r.tejedorResponsableId || title;
                    } else if (analyticsTab === 'maquinas') {
                        title = `Máquina #${r.maquina || '—'}`;
                        keyHead = r.maquina || 'SIN_MAQUINA';
                    } else {
                        title = r.modelo || 'MODELO NO INDICADO';
                        keyHead = r.modelo || 'SIN_MODELO';
                    }
                    const key = `${keyHead}__${r.defectoCodigo || defect}`;
                    const row = groups.get(key) || { key, title, detail: defect, cantidadLienzos: 0, totalRegistros: 0, timestamp: 0 };
                    row.cantidadLienzos += Number(r.cantidadLienzos) || 0;
                    row.totalRegistros += 1;
                    row.timestamp = Math.max(row.timestamp, Number(r.timestamp) || index);
                    groups.set(key, row);
                });
                return Array.from(groups.values()).sort((a, b) => b.cantidadLienzos - a.cantidadLienzos || b.totalRegistros - a.totalRegistros);
            }, [analyticsData, analyticsTab]);

            // Defectos personalizados del equipo (comparten colección con los motivos de tejedores)
            useEffect(() => {
                if (!db) return;
                let active = true;
                (async () => {
                    try {
                        const cachedRemote = readLocalJSON('ingesa_calidad_custom_defectos_remote_v1', null);
                        if (cachedRemote && Array.isArray(cachedRemote.items) && Date.now() - Number(cachedRemote.savedAt || 0) < QUALITY_READ_CACHE_TTL) {
                            if (active) setCustomDefectos(cachedRemote.items);
                            return;
                        }
                        const snap = await db.collection('motivos_maquina').where('aprobado', '==', true).limit(200).get();
                        if (!active) return;
                        const items = snap.docs.map(d => ({ id: d.id, ...d.data() }));
                        let localItems = [];
                        try { localItems = JSON.parse(localStorage.getItem('ingesa_calidad_custom_defectos_v1') || '[]'); } catch (e) {}
                        const merged = [...items, ...localItems].filter(x => String(x.tipo || '').toUpperCase() === 'DEFECTO_CALIDAD');
                        const unique = Array.from(new Map(merged.map(x => [String(x.id || x.texto), x])).values());

                    <img src={LOGO_URL} alt="INGESA" className="block pointer-events-none"

                        {/* ENCABEZADO */}

                                </div>

                            <header className="shrink-0 flex items-center gap-3 px-4 py-3 bg-white" style={{ paddingTop: 'max(.75rem, env(safe-area-inset-top))' }}>

                                    <h1 className="text-xl font-extrabold leading-6 truncate">{tituloVista}</h1>

                                </div>
                                {installBtn}
                            </header>

                            {view === 'HOME' && (
                                <div className="view-in flex flex-col gap-4">
                                    <button type="button" onClick={startScanner} className="hero-btn is-main">
                                        <span className="hero-ico"><Icon name="scan" size={36} stroke={2} /></span>
                                        <span className="flex-1 min-w-0">
                                            <span className="block text-[1.625rem] leading-7 font-extrabold">Escanear</span>
                                            <span className="block text-[1.0625rem] font-semibold" style={{ opacity: .92 }}>Etiqueta o QR de máquina</span>
                                        </span>
                                        <Icon name="chevron-right" size={28} />
                                    </button>
                                    <button type="button" onClick={() => { setMachineSearch(''); navigateTo('MACHINES'); }} className="hero-btn is-alt">
                                        <span className="hero-ico"><Icon name="grid" size={30} /></span>
                                        <span className="flex-1 min-w-0">
                                            <span className="block text-[1.375rem] leading-6 font-extrabold">Elegir máquina</span>
                                            <span className="block text-base font-semibold" style={{ color: 'var(--tinta-2)' }}>Sin etiqueta ni QR</span>
                                        </span>
                                        <Icon name="chevron-right" size={26} style={{ color: 'var(--tinta-2)' }} />
                                    </button>

                                </div>
                            )}

                            {view === 'MACHINES' && (
                                <div className="view-in flex flex-col gap-4">
                                    <div className="relative">
                                        <Icon name="search" size={22} className="absolute left-4 top-1/2 -translate-y-1/2" style={{ color: 'var(--tinta-2)' }} />

                                            className="field" style={{ paddingLeft: '3rem' }} />
                                    </div>
                                    <div className="grid grid-cols-4 gap-3">
                                        {maquinasFiltradas.map(numero => {
                                            const dia = getMachineDiameter(numero);
                                            return (
                                                <button key={numero} type="button" onClick={() => simularEscaneoMaquina(numero)} className="mtile" aria-label={`Máquina ${numero}`}>
                                                    {numero}
                                                    {dia !== '' && dia != null && <small>Ø {dia}</small>}
                                                </button>
                                            );
                                        })}
                                    </div>
                                    {maquinasFiltradas.length === 0 && (
                                        <div className="text-center text-lg font-semibold py-10" style={{ color: 'var(--tinta-2)' }}>No hay una máquina con ese número.</div>
                                    )}
                                </div>
                            )}

                            {view === 'ANALYTICS' && (
                                <div className="view-in flex flex-col gap-4">
                                    <div className="seg" role="tablist" aria-label="Agrupar por">

                                            { id: 'tejedores', label: 'Tejedor' },
                                            { id: 'maquinas', label: 'Máquina' },
                                            { id: 'modelos', label: 'Modelo' },
                                            { id: 'general', label: 'Todos' }
                                        ].map(tab => (
                                            <button key={tab.id} type="button" role="tab" onClick={() => setAnalyticsTab(tab.id)} aria-selected={analyticsTab === tab.id}>{tab.label}</button>
                                        ))}
                                    </div>

                                    {!analyticsLoading && !analyticsError && (
                                        <div className="grid grid-cols-2 gap-3">
                                            <div className="card p-4">
                                                <div className="text-[2rem] leading-9 font-extrabold" style={{ color: 'var(--rosa)' }}>{Number(analyticsData?.totalRegistros || 0)}</div>
                                                <div className="text-[.9375rem] font-bold" style={{ color: 'var(--tinta-2)' }}>reportes</div>
                                            </div>
                                            <div className="card p-4">
                                                <div className="text-[2rem] leading-9 font-extrabold">{totalLienzos}</div>
                                                <div className="text-[.9375rem] font-bold" style={{ color: 'var(--tinta-2)' }}>lienzos afectados</div>
                                            </div>
                                        </div>
                                    )}

                                    {analyticsLoading && (
                                        <div className="py-14 flex flex-col items-center gap-4 text-base font-bold" style={{ color: 'var(--tinta-2)' }}>
                                            <div className="spinner"></div>
                                            Cargando…
                                        </div>
                                    )}
                                    {!analyticsLoading && analyticsError && <div className="notice notice-warning">{analyticsError}</div>}
                                    {!analyticsLoading && !analyticsError && analyticsRows.length === 0 && (
                                        <div className="card p-8 text-center">
                                            <div className="text-xl font-extrabold">Aún no hay reportes</div>
                                            <div className="text-base font-semibold mt-1" style={{ color: 'var(--tinta-2)' }}>Cuando registres fallas, aparecerán aquí.</div>
                                        </div>
                                    )}
                                    {!analyticsLoading && !analyticsError && analyticsRows.length > 0 && (
                                        <div className="flex flex-col gap-3">
                                            {analyticsRows.map(row => (
                                                <div key={row.key} className="card p-4">
                                                    <div className="flex items-start gap-3">
                                                        <div className="min-w-0 flex-1">
                                                            <div className="text-[1.0625rem] leading-6 font-extrabold">{row.title}</div>
                                                            <div className="text-[.9375rem] font-semibold" style={{ color: 'var(--tinta-2)' }}>{row.detail || row.subtitle}</div>
                                                        </div>
                                                        <div className="text-right shrink-0">
                                                            <div className="text-[1.75rem] leading-7 font-extrabold" style={{ color: 'var(--rosa)' }}>{row.cantidadLienzos}</div>
                                                            <div className="text-[.8125rem] font-bold" style={{ color: 'var(--tinta-2)' }}>lienzos</div>
                                                        </div>
                                                    </div>
                                                    <div className="bar mt-3"><span style={{ width: `${Math.max(4, Math.round((row.cantidadLienzos / maxLienzos) * 100))}%` }}></span></div>
                                                    <div className="text-[.9375rem] font-bold mt-2" style={{ color: 'var(--tinta-2)' }}>
                                                        {analyticsTab === 'general' ? fechaCorta(row.timestamp) : `${row.totalRegistros} ${row.totalRegistros === 1 ? 'reporte' : 'reportes'}`}
                                                    </div>
                                                </div>
                                            ))}
                                        </div>
                                    )}
                                    {userRole === 'dev' && analyticsData?.batchId && (
                                        <div className="text-center text-[.8125rem] font-semibold" style={{ color: 'var(--tinta-2)' }}>
                                            Lote {analyticsData.batchId} · {Math.round(Number(analyticsData?.estimatedBytes || 0) / 1024)} KB
                                        </div>
                                    )}
                                </div>
                            )}

                            {view === 'SCAN' && (
                                <div className="view-in flex flex-col gap-5">
                                    <p className="text-center text-xl font-extrabold">Apunta la cámara al código</p>

                                        <div id="reader"></div>
                                        <div className="scan-line"></div>
                                    </div>

                                    </button>
                                    <button type="button" className="btn btn-quiet" onClick={() => { stopScanner(); navigateTo('HOME'); }}>Cancelar</button>
                                </div>

                                            <div className="grid grid-cols-2 gap-3 mt-3">
                                                <label className="lbl">Modelo

                                                </label>
                                                <label className="lbl">Talla
                                                    <input value={calidadForm.talla} onChange={e => setCalidadForm({ ...calidadForm, talla: e.target.value.toUpperCase() })} placeholder="Ej. M, 32" autoCapitalize="characters" className="field mt-1 uppercase" />
                                                </label>
                                            </div>
                                        </section>
                                    )}

                                                <dl className="grid grid-cols-2 gap-x-4 gap-y-3 mt-3">
                                                    {[['Modelo', calidadForm.modelo], ['Talla', calidadForm.talla], ['Color', calidadForm.color], ['Partida', calidadForm.partida], ['Ø de etiqueta', calidadForm.diametro || 'S/D']].map(([k, v]) => (
                                                        <div key={k} className="min-w-0">
                                                            <dt className="text-[.9375rem] font-bold" style={{ color: 'var(--tinta-2)' }}>{k}</dt>
                                                            <dd className="text-lg font-extrabold leading-6 break-words">{v || '—'}</dd>
                                                        </div>
                                                    ))}
                                                </dl>
                                            </section>

                                            <section className="card p-4">
                                                <h2 className="sec-title">¿En qué máquina se detectó?</h2>
                                                <input value={calidadForm.maquina} inputMode="text" aria-label="Número de máquina"

                                                    placeholder="Número de máquina" className="field mt-3" />

                                                    <div className="flex flex-wrap gap-2 pt-3">
                                                        {(calidadForm.diametro ? getMachinesForDiameter(calidadForm.diametro) : machineCatalog.filter(m => m.activo !== false)).slice(0, 30).map(m => {
                                                            const n = String(m.numero || m.id);
                                                            return (
                                                                <button key={m.id || n} type="button" aria-pressed={n === calidadForm.maquina}
                                                                    onClick={() => setCalidadForm({ ...calidadForm, maquina: n })} className="chip">
                                                                    {n}{m.diametro ? <small>Ø{m.diametro}</small> : null}
                                                                </button>
                                                            );
                                                        })}
                                                    </div>
                                                )}
                                            </section>
                                        </>
                                    )}

                                    {/* ===== Falla ===== */}
                                    <section className="card p-4">
                                        <h2 className="sec-title">¿Qué falla encontraste?</h2>

                                        {calidadForm.defectoCodigo && (
                                            <div className="picked mt-3">
                                                <Icon name="check" size={22} stroke={3} />
                                                <span className="min-w-0 break-words">{calidadForm.defectoCodigo !== 'CUSTOM' ? `${calidadForm.defectoCodigo} · ` : ''}{calidadForm.defectoNombre}</span>
                                            </div>
                                        )}

                                        {!qDef && defectosFrecuentes.length > 0 && (
                                            <div className="mt-3">
                                                <p className="sec-hint mb-2">Las que más usas</p>
                                                <div className="flex flex-wrap gap-2">
                                                    {defectosFrecuentes.map(d => (
                                                        <button key={d.codigo} type="button" className="chip" aria-pressed={calidadForm.defectoCodigo === d.codigo && !calidadForm.defectoCustom} onClick={() => elegirDefecto(d)}>{d.nombre}</button>
                                                    ))}
                                                </div>
                                            </div>
                                        )}

                                        <div className="relative mt-3">
                                            <Icon name="search" size={22} className="absolute left-4 top-1/2 -translate-y-1/2" style={{ color: 'var(--tinta-2)' }} />
                                            <input value={defectoBusqueda} onChange={e => setDefectoBusqueda(e.target.value)} aria-label="Buscar falla"
                                                placeholder="Buscar falla" className="field" style={{ paddingLeft: '3rem' }} />
                                        </div>

                                        <div className="mt-3 max-h-[20rem] overflow-y-auto custom-scrollbar flex flex-col gap-2 pr-1">
                                            {defectosFiltrados.map(d => {
                                                const on = calidadForm.defectoCodigo === d.codigo && !calidadForm.defectoCustom;
                                                return (
                                                    <button key={d.codigo} type="button" aria-pressed={on} className="opt" onClick={() => elegirDefecto(d)}>
                                                        <span className="code">{d.codigo}</span>
                                                        <span className="min-w-0 leading-5">{d.nombre}</span>
                                                        <span className="tick"><Icon name="check" size={16} stroke={3.4} /></span>
                                                    </button>
                                                );
                                            })}
                                            {customFiltrados.map(d => {
                                                const on = calidadForm.defectoCustom === d.texto;
                                                return (
                                                    <button key={d.id} type="button" aria-pressed={on} className="opt" onClick={() => elegirDefectoEquipo(d)}>
                                                        <span className="code"><Icon name="star" size={14} stroke={2.4} className="inline" /> Equipo</span>
                                                        <span className="min-w-0 leading-5">{d.texto}</span>
                                                        <span className="tick"><Icon name="check" size={16} stroke={3.4} /></span>
                                                    </button>
                                                );
                                            })}
                                            {defectosFiltrados.length === 0 && customFiltrados.length === 0 && (
                                                <p className="text-base font-semibold py-4 text-center" style={{ color: 'var(--tinta-2)' }}>No hay fallas con ese nombre. Puedes agregarla aquí abajo.</p>
                                            )}
                                        </div>

                                        <button type="button" onClick={() => setMostrarNuevoDefecto(v => !v)} className="btn btn-quiet mt-2" style={{ color: 'var(--rosa-hondo)' }}>
                                            <Icon name={mostrarNuevoDefecto ? 'x' : 'plus'} size={20} /> {mostrarNuevoDefecto ? 'Cancelar' : '¿No está en la lista? Agregar falla nueva'}
                                        </button>
                                        {mostrarNuevoDefecto && (
                                            <div className="mt-1">
                                                <input value={nuevoDefectoCustom} onChange={e => setNuevoDefectoCustom(e.target.value.toUpperCase())}

                                                <p className="sec-hint mt-2">Quedará disponible para todo el equipo de calidad.</p>
                                            </div>
                                        )}
                                    </section>

                                    <section className="card p-4">
                                        <h2 className="sec-title">¿Cuántos lienzos salieron mal?</h2>
                                        <div className="flex items-center gap-3 mt-3">
                                            <button type="button" className="step-btn" aria-label="Uno menos" onClick={() => ajustarLienzos(-1)}><Icon name="minus" size={30} /></button>
                                            <input type="number" min="1" inputMode="numeric" value={calidadForm.cantidadLienzos} aria-label="Cantidad de lienzos"
                                                onChange={e => setCalidadForm({ ...calidadForm, cantidadLienzos: e.target.value.replace(/[^0-9]/g, '') })}
                                                placeholder="0" className="field text-center" style={{ minHeight: 64, fontSize: '2rem', fontWeight: 800 }} />
                                            <button type="button" className="step-btn" aria-label="Uno más" onClick={() => ajustarLienzos(1)}><Icon name="plus" size={30} /></button>
                                        </div>
                                        <div className="flex flex-wrap gap-2 mt-3">
                                            {[1, 2, 3, 5, 10].map(n => (
                                                <button key={n} type="button" className="chip" aria-pressed={Number(calidadForm.cantidadLienzos) === n} onClick={() => setCalidadForm({ ...calidadForm, cantidadLienzos: String(n) })}>{n}</button>
                                            ))}
                                        </div>
                                    </section>

                                    {/* ===== Pasa a primera ===== */}
                                    <section className="card p-4">
                                        <h2 className="sec-title">¿Este lienzo pasa a primera?</h2>
                                        <div className="grid grid-cols-2 gap-3 mt-3">
                                            <button type="button" aria-pressed={calidadForm.pasaPrimera === true} className="opt is-center" onClick={() => setCalidadForm({ ...calidadForm, pasaPrimera: true })}>Sí, pasa a primera</button>
                                            <button type="button" aria-pressed={calidadForm.pasaPrimera === false} className="opt is-center" onClick={() => setCalidadForm({ ...calidadForm, pasaPrimera: false })}>No, no pasa a primera</button>
                                        </div>
                                    </section>

                                    {/* ===== Tejedor ===== */}
                                    <section className="card p-4">
                                        <div className="flex items-center justify-between gap-3">
                                            <h2 className="sec-title">¿De quién fue la falla?</h2>
                                            <span className="tag">Opcional</span>
                                        </div>
                                        {tejedoresLoading && tejedores.length === 0 && (
                                            <p className="text-base font-semibold mt-3" style={{ color: 'var(--tinta-2)' }}>Cargando tejedores…</p>
                                        )}
                                        {!tejedoresLoading && tejedores.length === 0 && (
                                            <p className="text-base font-semibold mt-3" style={{ color: 'var(--tinta-2)' }}>No se encontraron tejedores ni jefes de turno para elegir.</p>
                                        )}
                                        {tejedores.length > 0 && (
                                            <div className="mt-3 flex flex-col gap-2">
                                                {tejedores.length > 8 && (
                                                    <div className="relative">
                                                        <Icon name="search" size={22} className="absolute left-4 top-1/2 -translate-y-1/2" style={{ color: 'var(--tinta-2)' }} />
                                                        <input value={tejedorBusqueda} onChange={e => setTejedorBusqueda(e.target.value)} aria-label="Buscar tejedor" placeholder="Buscar nombre" className="field" style={{ paddingLeft: '3rem' }} />
                                                    </div>
                                                )}
                                                <div className="max-h-[17rem] overflow-y-auto custom-scrollbar flex flex-col gap-2 pr-1">
                                                    <button type="button" aria-pressed={!calidadForm.tejedorResponsableId} className="opt"
                                                        onClick={() => setCalidadForm({ ...calidadForm, tejedorResponsable: '', tejedorResponsableId: '' })}>
                                                        <span className="min-w-0">No asignar a nadie</span>
                                                        <span className="tick"><Icon name="check" size={16} stroke={3.4} /></span>
                                                    </button>
                                                    {tejedoresFiltrados.map(t => {
                                                        const on = String(calidadForm.tejedorResponsableId || '') === String(t.id);
                                                        return (
                                                            <button key={t.id} type="button" aria-pressed={on} className="opt"
                                                                onClick={() => setCalidadForm({ ...calidadForm, tejedorResponsable: on ? '' : t.name, tejedorResponsableId: on ? '' : t.id })}>
                                                                <span className="min-w-0 flex-1 leading-5">
                                                                    {t.name}
                                                                    <span className="block text-[.875rem] font-semibold" style={{ color: 'var(--tinta-2)' }}>{t.role || t.dept}</span>
                                                                </span>
                                                                <span className="tick"><Icon name="check" size={16} stroke={3.4} /></span>
                                                            </button>
                                                        );
                                                    })}
                                                    {tejedoresFiltrados.length === 0 && (
                                                        <p className="text-base font-semibold py-3 text-center" style={{ color: 'var(--tinta-2)' }}>Nadie con ese nombre.</p>
                                                    )}
                                                </div>
                                            </div>
                                        )}
                                    </section>

                                    {/* ===== Observación ===== */}
                                    <section className="card p-4">
                                        <div className="flex items-center justify-between gap-3">
                                            <h2 className="sec-title">¿Algo más que anotar?</h2>
                                            <span className="tag">Opcional</span>
                                        </div>
                                        <textarea value={calidadForm.observacion} onChange={e => setCalidadForm({ ...calidadForm, observacion: e.target.value })} rows={3}
                                            placeholder="Escribe aquí si quieres dar más detalle" aria-label="Observación" className="field mt-3" />
                                    </section>

                                    {calidadForm.origen === 'MAQUINA' && (
                                        <button type="button" onClick={startScanner} className="btn btn-outline"><Icon name="scan" size={24} /> Escanear otra máquina</button>
                                    )}
                                </div>
                            )}

                            {view === 'SUCCESS' && (
                                <div className="view-in flex flex-col items-center justify-center text-center gap-4" style={{ minHeight: '60%' }}>
                                    <div className="success-badge"><Icon name="check" size={64} stroke={3} /></div>
                                    <h2 className="text-[1.875rem] leading-9 font-extrabold">¡Listo, falla registrada!</h2>
                                    <p className="text-lg font-semibold" style={{ color: 'var(--tinta-2)' }}>Tu reporte ya quedó guardado.</p>
                                    {analyticsSyncWarning && <p className="notice notice-warning max-w-sm">{analyticsSyncWarning}</p>}
                                </div>
                            )}
                        </main>

                        {/* BARRA DE GUARDAR (formulario) */}
                        {view === 'FORM' && calidadForm && (
                            <footer className="shrink-0 px-5 pt-3 bg-white" style={{ borderTop: '1.5px solid var(--linea)', paddingBottom: 'max(1rem, env(safe-area-inset-bottom))' }}>
                                {status && <div className={`notice mb-3 ${statusType === 'success' ? 'notice-success' : statusType === 'warning' ? 'notice-warning' : 'notice-info'}`} role="status">{status}</div>}
                                {!formListo && <p className="text-center text-[.9375rem] font-bold mb-2" style={{ color: 'var(--tinta-2)' }}>Falta indicar: {faltantes.join(', ')}</p>}
                                <button type="button" onClick={guardarCalidad} disabled={calidadGuardando || !formListo} className="btn btn-primary">
                                    <Icon name="check" size={26} stroke={3} /> Guardar registro
                                </button>
                            </footer>
                        )}

                        {/* NAVEGACIÓN */}
                        {(view === 'HOME' || view === 'MACHINES' || view === 'ANALYTICS') && (
                            <nav className="shrink-0 grid grid-cols-3 gap-2 px-3 pt-2 bg-white" style={{ borderTop: '1.5px solid var(--linea)', paddingBottom: 'max(.75rem, env(safe-area-inset-bottom))' }}>
                                {[{ id: 'HOME', label: 'Inicio', icon: 'home' }, { id: 'MACHINES', label: 'Máquinas', icon: 'grid' }, { id: 'ANALYTICS', label: 'Análisis', icon: 'chart' }].map(t => (
                                    <button key={t.id} type="button" aria-current={view === t.id ? 'page' : undefined}
                                        onClick={() => { if (t.id === 'MACHINES') setMachineSearch(''); if (view !== t.id) navigateTo(t.id); }}
                                        className={`nav-btn ${view === t.id ? 'is-on' : ''}`}>
                                        <Icon name={t.icon} size={26} />
                                        {t.label}
                                    </button>
                                ))}
                            </nav>
                        )}
                    </div>

                    {toast && <div className="toast" role="status">{toast}</div>}

                    {calidadGuardando && (
                        <div className="modal-backdrop" style={{ zIndex: 500 }} role="status" aria-live="polite">
                            <div className="modal p-7 text-center" style={{ maxWidth: '20rem' }}>
                                <div className="spinner mx-auto mb-5"></div>
                                <h3 className="text-xl font-extrabold">Guardando tu reporte</h3>
                                <p className="mt-2 text-base font-semibold" style={{ color: 'var(--tinta-2)' }}>{savingStage || 'Espera un momento…'}</p>
                                <p className="mt-4 text-[.9375rem] font-semibold" style={{ color: 'var(--tinta-2)' }}>No cierres esta pantalla.</p>
                            </div>
                        </div>
                    )}

                    {showAdminPanel && (
                        <AdminPanelModal
                            onClose={() => setShowAdminPanel(false)}
                            currentUser={userName}
                            currentWallpaper={currentWallpaper}
                            onUserChanged={handleUserChanged}
                            onWallpaperSaved={(url) => setLocalWallpaperOverride(url || null)}
                            onTejedorAdded={handleTejedorAdded}
                        />
                    )}

                    {showIosInstall && <IosInstallModal onClose={() => setShowIosInstall(false)} />}

                    {showPinGate && !userName && (
                        <PinGateModal
                            onClose={() => { setShowPinGate(false); setTimeout(() => { try { window.history.back(); } catch(e) {} }, 100); }}
                            onSubmit={(name, role) => {
                                setUserName(name); setUserRole(role);
                                localStorage.setItem(STORAGE_KEY_NAME, name);
                                localStorage.setItem(STORAGE_KEY_ROLE, role);
                                setShowPinGate(false);
                            }}
                        />
                    )}
                </div>
            );
        };
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
