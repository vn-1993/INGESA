const buildKitDefinition = (pieces = [], presentationBySize = {}, kitEnabled = true, globalLabel = '') => {
  const bySize = {};
  (Array.isArray(pieces) ? pieces : []).forEach(piece => {
    const size = String(piece?.talla || 'UNI').trim() || 'UNI';
    const name = String(piece?.pieza || piece?.descripcion || '').trim().toUpperCase();
    if (!name) return;
    if (!bySize[size]) bySize[size] = new Set();
    bySize[size].add(name);
  });
  const sizes = Object.entries(bySize).map(([talla, names]) => {
    const piezas = [...names].sort();
    const previous = presentationBySize?.[talla] || {};
    const completeUnitsPerKit = Math.max(0, Math.floor(Number(previous.completeUnitsPerKit || 0)));
    const yieldPerLienzo = piezas.reduce((acc, pieceName) => {
      const configured = Number(previous.yieldPerLienzo?.[pieceName]);
      return { ...acc, [pieceName]: Number.isFinite(configured) && configured > 0 ? Math.floor(configured) : 1 };
    }, {});
    const componentLienzosPerKit = piezas.reduce((acc, pieceName) => ({ ...acc, [pieceName]: completeUnitsPerKit ? Math.ceil(completeUnitsPerKit / yieldPerLienzo[pieceName]) : 0 }), {});
    return {
      talla,
      piezas,
      cantidadPiezas: names.size,
      presentation: {
        displayLabel: String(globalLabel || previous.displayLabel || piezas[0] || '').trim().toUpperCase(),
        completeUnitsPerKit,
        yieldPerLienzo,
        componentLienzosPerKit
      }
    };
  });
  const kitSizes = sizes.filter(item => item.cantidadPiezas > 1);
  const normalizedPresentationBySize = kitSizes.reduce((acc, item) => ({ ...acc, [item.talla]: item.presentation }), {});
  return {
    kitEnabled: Boolean(kitEnabled),
    productionMode: kitEnabled && kitSizes.length ? 'KIT' : 'INDIVIDUAL',
    kitEligibleSizes: kitEnabled ? kitSizes.map(item => item.talla) : [],
    kitDefinition: { version: 4, enabled: Boolean(kitEnabled), globalLabel, sizes, presentationBySize: normalizedPresentationBySize, requiresManualGrouping: false }
  };
};

const formatTimeDisplay = (val) => {
    if (!val || isNaN(val)) return '0:00';
    const total = parseFloat(val);
    const m = Math.floor(total);
    const s = Math.round((total - m) * 60).toString().padStart(2, '0');
    return `${m}:${s}`;
};

const compressImageForStorage = (file) => new Promise((resolve, reject) => {
  const reader = new FileReader();
  reader.onload = (e) => {
    const img = new Image();
    img.onload = () => {
      const MAX_W = 500, MAX_H = 1344;
      let w = img.width, h = img.height;
      if (w > MAX_W || h > MAX_H) {
        const ratio = Math.min(MAX_W / w, MAX_H / h);
        w = Math.round(w * ratio); h = Math.round(h * ratio);
      }
      const canvas = document.createElement('canvas');
      canvas.width = w; canvas.height = h;
      canvas.getContext('2d').drawImage(img, 0, 0, w, h);
      resolve(canvas.toDataURL('image/jpeg', 0.75));
    };
    img.onerror = reject;
    img.src = e.target.result;
  };
  reader.onerror = reject;
  reader.readAsDataURL(file);
});

const ImageCropperModal = ({ src, onSave, onClose }) => {
    const canvasRef = useRef(null);
    const [scale, setScale] = useState(1);
    const [offsetX, setOffsetX] = useState(50);
    const [offsetY, setOffsetY] = useState(50);
    const [imgObj, setImgObj] = useState(null);

    useEffect(() => {
        const img = new Image();
        img.onload = () => setImgObj(img);
        img.src = src;
    }, [src]);

    useEffect(() => {
        if (!imgObj || !canvasRef.current) return;
        const ctx = canvasRef.current.getContext('2d');
        const cWidth = canvasRef.current.width;
        const cHeight = canvasRef.current.height;
        
        ctx.clearRect(0, 0, cWidth, cHeight);
        ctx.fillStyle = "#ffffff";
        ctx.fillRect(0, 0, cWidth, cHeight);

        const scaledW = imgObj.width * scale;
        const scaledH = imgObj.height * scale;
        
        const dx = (cWidth - scaledW) * (offsetX / 100);
        const dy = (cHeight - scaledH) * (offsetY / 100);

        ctx.drawImage(imgObj, dx, dy, scaledW, scaledH);
    }, [imgObj, scale, offsetX, offsetY]);

    const handleSave = () => {
        if (!canvasRef.current) return;
        const dataUrl = canvasRef.current.toDataURL('image/jpeg', 0.8);
        onSave(dataUrl);
    };

    return (
        <div className="fixed inset-0 z-[1000] bg-black/90 backdrop-blur-md flex items-center justify-center p-4 flex-col">
            <div className="app-card w-full max-w-md p-4 rounded-3xl relative flex flex-col items-center">
                <button onClick={onClose} className="absolute top-4 right-4 text-xl font-bold opacity-70 hover:opacity-100 text-red-500">❌</button>
                <h3 className="font-black mb-4 uppercase">Encuadrar Imagen</h3>
                
                <div className="border-4 border-black border-dashed overflow-hidden rounded-xl mb-4 bg-gray-200">
                    <canvas ref={canvasRef} width="300" height="300" className="max-w-full h-auto bg-white"></canvas>
                </div>
                
                <div className="w-full space-y-4 mb-4">
                    <div>
                        <label className="text-[10px] font-black uppercase opacity-70">Zoom (Escala)</label>
                        <input type="range" min="0.1" max="3" step="0.05" value={scale} onChange={e => setScale(parseFloat(e.target.value))} />
                    </div>
                    <div>
                        <label className="text-[10px] font-black uppercase opacity-70">Posición Horizontal (X)</label>
                        <input type="range" min="0" max="100" value={offsetX} onChange={e => setOffsetX(parseFloat(e.target.value))} />
                    </div>
                    <div>
                        <label className="text-[10px] font-black uppercase opacity-70">Posición Vertical (Y)</label>
                        <input type="range" min="0" max="100" value={offsetY} onChange={e => setOffsetY(parseFloat(e.target.value))} />
                    </div>
                </div>

                <button onClick={handleSave} className="w-full app-btn-primary font-black py-3 rounded-xl neo-btn">
                    Recortar y Guardar
                </button>
            </div>
        </div>
    );
};

const SmartImage = ({ codigo, className, editable = true }) => {
  const [imgSrc, setImgSrc] = useState(null);
  const [loading, setLoading] = useState(true);
  const [isShared, setIsShared] = useState(false);
  const fileInputRef = useRef(null);

  useEffect(() => {
    if (!codigo) { setLoading(false); return; }
    const unsub = db.collection('imagenes_editadas').doc(codigo).onSnapshot(doc => {
      const localImg = doc.exists ? doc.data().localImage : null;
      if (localImg) { setImgSrc(localImg); setIsShared(true); setLoading(false); return; }
      setIsShared(false);
      const base = DEFAULT_IMAGE_REPO.endsWith('/') ? DEFAULT_IMAGE_REPO : DEFAULT_IMAGE_REPO + '/';
      const extensiones = ['.jpg', '.png', '.jpeg', '.webp'];
      let index = 0;
      const probarImagen = () => {
        if (index >= extensiones.length) { setImgSrc(null); setLoading(false); return; }
        const testImg = new Image();
        testImg.onload = () => { setImgSrc(testImg.src); setLoading(false); };
        testImg.onerror = () => { index++; probarImagen(); };
        testImg.src = `${base}${codigo}${extensiones[index]}`;
      };
      probarImagen();
    });
    return () => unsub();
  }, [codigo]);

  const handleLocalUpload = async (e) => {
    const file = e.target.files[0];
    if (!file) return;
    try {
      const dataUrl = await compressImageForStorage(file);
      await db.collection('imagenes_editadas').doc(codigo).set({ localImage: dataUrl, updatedAt: FieldValue.serverTimestamp() }, { merge: true });
      setImgSrc(dataUrl); setIsShared(true);
    } catch (err) { alert('Error al subir imagen: ' + err.message); }
    e.target.value = '';
  };

  return (
    <div className="relative inline-block w-full h-full">
      {imgSrc ? (
        <img src={imgSrc} onError={() => setImgSrc(null)} className={className} alt={codigo} />
      ) : (
        <div className={`flex flex-col items-center justify-center bg-gray-200 dark:bg-gray-800 text-gray-500 ${className}`}>
          <span className="text-2xl">🚫</span>
          <span className="text-[9px] mt-1 font-bold tracking-wide uppercase">Sin Imagen</span>
        </div>
      )}
      {editable && isShared && (
        <div className="absolute top-2 left-2 bg-emerald-600 text-white text-[8px] font-black px-2 py-0.5 rounded border-2 border-black z-10 shadow-sm">
          ✅ Compartida
        </div>
      )}
      {editable && <div className="absolute bottom-0 right-0 w-11 h-11 bg-white dark:bg-gray-800 rounded-tl-2xl flex items-center justify-center z-10 border-t-3 border-l-3 neo-border">
        <input type="file" accept="image/*" onChange={handleLocalUpload} className="hidden" ref={fileInputRef} />
        <button onClick={(e) => { e.preventDefault(); e.stopPropagation(); if(codigo) fileInputRef.current.click(); else alert("Escribe un código primero"); }} type="button" className={`w-7 h-7 rounded-full flex items-center justify-center metallic-btn transition-all duration-300`}>
          <span className="text-[10px]">📤</span>
        </button>
      </div>
      }
    </div>
  );
};

const Pdf417Preview = ({ value }) => {
  const canvasRef = useRef(null);
  useEffect(() => {
    if (!canvasRef.current || !value || typeof bwipjs === 'undefined') return;
    try { bwipjs.toCanvas(canvasRef.current, { bcid: 'pdf417', text: value, scale: 2, height: 10, includetext: false }); } catch (error) { console.warn('PDF417 preview no disponible', error); }
  }, [value]);
  return <canvas ref={canvasRef} className="w-full h-auto" aria-label="Código PDF417 de vista previa" />;
};

const ExcelTableEditor = ({ data, onChange }) => {
    const addGroup = () => {
        onChange([...data, { id: generateId(), percent: '', material: '', guias: [{ id: generateId(), guia: '', sis: '' }] }]);
    };
    
    const addSubRow = (groupId) => {
        onChange(data.map(g => {
            if (g.id === groupId) {
                return { ...g, guias: [...g.guias, { id: generateId(), guia: '', sis: '' }] };
            }
            return g;
        }));
    };
    
    const updateGroup = (groupId, field, value) => {
        onChange(data.map(g => g.id === groupId ? { ...g, [field]: value } : g));
    };
    
    const updateSubRow = (groupId, subId, field, value) => {
        onChange(data.map(g => {
            if (g.id === groupId) {
                return { ...g, guias: g.guias.map(sub => sub.id === subId ? { ...sub, [field]: value } : sub) };
            }
            return g;
        }));
    };
    
    const removeSubRow = (groupId, subId) => {
        let newData = [...data];
        const groupIdx = newData.findIndex(g => g.id === groupId);
        if (groupIdx > -1) {
            const group = newData[groupIdx];
            if (group.guias.length === 1) {
                newData.splice(groupIdx, 1);
            } else {
                newData[groupIdx] = { ...group, guias: group.guias.filter(sub => sub.id !== subId) };
            }
        }
        onChange(newData);
    };

    return (
        <div className="w-full overflow-x-auto rounded border-[3px] border-black bg-white shadow-[4px_4px_0_#14181c]">
            <table className="excel-table">
                <thead>
                    <tr>
                        <th className="excel-th-percent py-2">%</th>
                        <th className="excel-th-material py-2 w-1/3">MATERIAL</th>
                        <th className="excel-th-tech py-2 w-20">G.HILO</th>
                        <th className="excel-th-tech py-2">SIS.</th>
                        <th className="bg-transparent border-0 w-16"></th>
                    </tr>
                </thead>
                <tbody>
                    {data.map((group) => (
                        <React.Fragment key={group.id}>
                            {group.guias.map((g, subIdx) => (
                                <tr key={g.id}>
                                    {subIdx === 0 && (
                                        <>
                                            <td rowSpan={group.guias.length} className="excel-td-percent">
                                                <input value={group.percent} onChange={e => updateGroup(group.id, 'percent', e.target.value)} placeholder="0" className="excel-input excel-input-percent"/>
                                            </td>
                                            <td rowSpan={group.guias.length} className="excel-td-white">
                                                <textarea value={group.material} onChange={e => updateGroup(group.id, 'material', e.target.value)} placeholder="Ej. NYLON" className="excel-input excel-input-black resize-none overflow-hidden block" rows="2"></textarea>
                                            </td>
                                        </>
                                    )}
                                    <td className="excel-td-white">
                                         <input value={g.guia} onChange={e => updateSubRow(group.id, g.id, 'guia', e.target.value)} placeholder="#2" className="excel-input excel-input-black" />
                                    </td>
                                    <td className="excel-td-white">
                                         <input value={g.sis} onChange={e => updateSubRow(group.id, g.id, 'sis', e.target.value)} placeholder="TODOS" className="excel-input excel-input-black" />
                                    </td>
                                    <td className="border-0 p-1 bg-transparent">
                                        <div className="flex flex-col gap-1 items-center justify-center">
                                            {subIdx === 0 && (
                                                <button onClick={() => addSubRow(group.id)} className="bg-blue-500/20 text-blue-600 rounded p-1 hover:bg-blue-500/40" title="Agrupar sub-fila">➕</button>
                                            )}
                                            <button onClick={() => removeSubRow(group.id, g.id)} className="bg-red-500/20 text-red-600 rounded p-1 hover:bg-red-500/40" title="Borrar">🗑️</button>
                                        </div>
                                    </td>
                                </tr>
                            ))}
                        </React.Fragment>
                    ))}
                </tbody>
            </table>
            <button onClick={addGroup} className="w-full py-2 bg-gray-100 hover:bg-gray-200 text-black font-black text-xs transition-colors flex items-center justify-center gap-2">
                ➕ Añadir Hilo Principal
            </button>
        </div>
    );
};

const emptyGlobalThread = () => ({ material: '', porcentaje: '', materialId: null });

const GlobalThreadingList = ({ threading, setThreading, inventory }) => {
  const update = (i, field, val) => { const n = [...threading]; n[i] = { ...n[i], [field]: val }; setThreading(n); };
  const selectMat = (i, item) => { const n = [...threading]; n[i] = { ...n[i], material: `${item.material} - ${item.color}`, materialId: item.id }; setThreading(n); };
  const remove = (i) => setThreading(threading.filter((_, idx) => idx !== i));
  return (
    <div className="space-y-4">
      {threading.map((h, i) => (
        <div key={i} className="app-card rounded-2xl p-4 border-2 border-black/10 dark:border-white/10 shadow-sm flex flex-col gap-3">
          <div className="flex justify-between items-center border-b-2 border-black/10 dark:border-white/10 pb-2">
             <span className="font-black text-xs bg-[#14181c] dark:bg-white dark:text-black text-white px-2 py-1 rounded">CONSUMO GLOBAL {i + 1}</span>
             <button onClick={() => remove(i)} className="text-red-500 hover:bg-red-500/10 px-2 py-1 rounded-lg transition-colors text-lg" title="Eliminar hilo">🗑️</button>
          </div>
          <div className="grid grid-cols-6 gap-3">
            <div className="col-span-4">
                <label className="text-[10px] font-black opacity-70 ml-0.5 mb-1 block uppercase">Material / Hilo</label>
                <MaterialInput value={h.material || h.hilo || ''} inventory={inventory} onChangeText={val => update(i, 'material', val)} onSelect={item => selectMat(i, item)}/>
            </div>
            <div className="col-span-2">
                <label className="text-[10px] font-black opacity-70 ml-0.5 mb-1 block uppercase">% Inventario</label>
                <input type="number" step="0.01" value={h.porcentaje} onChange={e => update(i, 'porcentaje', e.target.value)} placeholder="0" className="w-full text-center app-input rounded-xl p-2.5 text-xs font-bold outline-none text-emerald-600 dark:text-emerald-400"/>
            </div>
          </div>
        </div>
      ))}
      <button onClick={() => setThreading([...threading, emptyGlobalThread()])} className="w-full py-3 app-btn-primary rounded-xl font-bold text-xs neo-btn flex justify-center items-center gap-1.5">
        ➕ Añadir Material de Consumo
      </button>
    </div>
  );
};

const PdfTemplateManagerModal = ({ onClose, currentTemplateId, onSelectTemplate }) => {

    const [loading, setLoading] = useState(true);
    const [editingNode, setEditingNode] = useState(null);

    const defaultHtml = `<div class="w-[11cm] border-[2px] border-black flex flex-row bg-white text-black font-sans box-border" style="page-break-inside: avoid;">
   <div class="w-[2cm] border-r-[2px] border-black flex flex-col items-center justify-center py-4 relative overflow-hidden shrink-0">

       <div class="flex border-b-[2px] border-black min-h-[32px]"><div class="w-[45%] border-r-[2px] border-black p-1.5 flex items-center">ESTILO</div><div class="flex-1 p-1.5 flex items-center justify-center text-center">{{estilo}}</div></div>

   </div>
</div>`;

    useEffect(() => {
        db.collection('TEMPLATE-BETA').get().then(snap => {
            const data = [];
            snap.forEach(doc => data.push({ id: doc.id, ...doc.data() }));
            setTemplates(data);
            setLoading(false);
        });
    }, []);

    const handleSaveTemplate = async (template) => {
        if (!template.nombre.trim()) return alert("El nombre es requerido");
        try {
            if (template.id) {
                await db.collection('TEMPLATE-BETA').doc(template.id).set({ nombre: template.nombre, html: template.html }, { merge: true });
                setTemplates(templates.map(t => t.id === template.id ? template : t));
            } else {
                const res = await db.collection('TEMPLATE-BETA').add({ nombre: template.nombre, html: template.html });
                setTemplates([...templates, { id: res.id, ...template }]);
            }
            setEditingNode(null);
        } catch (e) { alert("Error guardando plantilla"); }
    };

    const handleDeleteTemplate = async (id) => {
        if(!confirm("¿Eliminar plantilla?")) return;
        try {
            await db.collection('TEMPLATE-BETA').doc(id).delete();
            setTemplates(templates.filter(t => t.id !== id));
            if (currentTemplateId === id) onSelectTemplate(null);
        } catch(e) {}

        <div className="fixed inset-0 z-[400] bg-black/90 backdrop-blur-md flex items-center justify-center p-4">

                {editingNode ? (
                    <div className="flex-1 flex flex-col min-h-0">
                        <div className="flex gap-4 mb-4">
                            <input value={editingNode.nombre} onChange={e=>setEditingNode({...editingNode, nombre: e.target.value})} placeholder="Nombre de la Variante (Ej. Etiqueta Pequeña)" className="flex-1 p-3 app-input rounded-xl font-bold"/>
                            <button onClick={() => setEditingNode({...editingNode, html: defaultHtml})} className="app-btn-secondary px-4 py-2 rounded-xl font-black text-xs neo-btn">Cargar Base</button>
                        </div>
                        <p className="text-[10px] font-bold opacity-70 mb-2">Variables disponibles: {'{{proveedor}}, {{estilo}}, {{talla}}, {{tela}}, {{composicion}}, {{muestra}}, {{fecha}}, {{logo}}'}</p>
                        <textarea 
                            value={editingNode.html} 
                            onChange={e=>setEditingNode({...editingNode, html: e.target.value})}
                            className="flex-1 w-full p-4 app-input rounded-xl font-mono text-[10px] resize-none mb-4 whitespace-pre border-2 border-black/20 dark:border-white/20 outline-none"
                            placeholder="Pega el código HTML provisto por la IA aquí..."
                        ></textarea>
                        <div className="flex gap-4">
                            <button onClick={() => handleSaveTemplate(editingNode)} className="flex-1 app-btn-primary font-black py-3 rounded-xl neo-btn">Guardar Variante</button>
                            <button onClick={() => setEditingNode(null)} className="flex-1 bg-gray-500 text-white font-black py-3 rounded-xl neo-btn">Cancelar</button>
                        </div>
                    </div>
                ) : (
                    <div className="flex-1 overflow-y-auto space-y-4">
                        <div className="flex justify-between items-center bg-emerald-500/10 p-4 rounded-xl border-2 border-emerald-500/30">
                            <span className="font-black">Plantilla por Defecto (Sistema)</span>
                            <button onClick={() => onSelectTemplate(null)} className={`px-4 py-2 rounded-xl font-black text-xs border-2 border-black neo-btn ${!currentTemplateId ? 'bg-emerald-500 text-white' : 'bg-white text-black'}`}>
                                {!currentTemplateId ? '✅ Activa' : 'Seleccionar'}
                            </button>
                        </div>
                        {loading ? <div className="text-center py-10 font-black">Cargando...</div> : templates.map(t => (
                            <div key={t.id} className="app-input p-4 rounded-xl border-2 neo-border flex flex-col sm:flex-row justify-between items-center gap-4">
                                <span className="font-black text-lg">{t.nombre}</span>
                                <div className="flex gap-3">
                                    <button onClick={() => setEditingNode(t)} className="bg-blue-500 text-white px-3 py-2 rounded-xl font-black text-xs neo-btn">Editar Código</button>
                                    <button onClick={() => handleDeleteTemplate(t.id)} className="bg-red-500 text-white px-3 py-2 rounded-xl font-black text-xs neo-btn">🗑️</button>
                                    <button onClick={() => onSelectTemplate(t.id)} className={`px-4 py-2 rounded-xl font-black text-xs border-2 border-black neo-btn ${currentTemplateId === t.id ? 'bg-emerald-500 text-white' : 'bg-white text-black dark:bg-gray-800 dark:text-white'}`}>
                                        {currentTemplateId === t.id ? '✅ Activa' : 'Seleccionar'}
                                    </button>
                                </div>
                            </div>
                        ))}
                        <button onClick={() => setEditingNode({ nombre: '', html: defaultHtml })} className="w-full border-4 border-dashed neo-border p-4 rounded-xl font-black opacity-70 hover:opacity-100 mt-4 transition-opacity">

const TimeInput = ({ value, onChange }) => {
  const [mins, setMins] = useState('');
  const [secs, setSecs] = useState('');
  useEffect(() => {
    if (value === undefined || value === '' || value === null) { setMins(''); setSecs(''); return; }
    const total = parseFloat(value);
    const m = Math.floor(total);
    const s = Math.round((total - m) * 60);
    setMins(m.toString());
    setSecs(s < 10 ? '0' + s : s.toString());
  }, [value]);
  const handle = (newM, newS) => { const m = parseInt(newM)||0; const s = parseInt(newS)||0; onChange((m + s/60).toFixed(4)); };
  return (
    <div className="flex items-center gap-1">
      <input inputMode="numeric" value={mins} placeholder="m" onChange={e=>{setMins(e.target.value); handle(e.target.value,secs);}} className="w-12 text-center rounded-lg p-2 font-mono text-xs app-input outline-none font-bold"/>
      <span className="font-black">:</span>
      <input inputMode="numeric" value={secs} placeholder="s" max="59" onChange={e=>{setSecs(e.target.value); handle(mins,e.target.value);}} className="w-12 text-center rounded-lg p-2 font-mono text-xs app-input outline-none font-bold"/>
    </div>
  );
};

const TemplateEditor = ({ template, inventory, targetSection, onClose, onSave, onDelete }) => {
  const isNew = !template.codigo;
  const [form, setForm] = useState({ 
    codigo: template.codigo || '', 
    cliente: template.cliente || '',
    estiloCliente: template.estiloCliente || '' 
  });
  const [originalCodigo] = useState(template.codigo || '');
  
  const [openCopyMenuId, setOpenCopyMenuId] = useState(null);
  const [defaultFicha, setDefaultFicha] = useState(null);

  const [pieces, setPieces] = useState(() => {
    const act = (template.activas || []).map(p => ({...p, _activa: true, id: p.id || generateId(), tablaFisica: p.tablaFisica || [] }));
    const inact = (template.inactivas || []).map(p => ({...p, _activa: false, id: p.id || generateId(), tablaFisica: p.tablaFisica || [] }));
    const allPieces = [...act, ...inact];
    return allPieces.length ? allPieces : [{ id: generateId(), pieza: '', talla: 'UNI', maquina: '', sufijo: '-A', codigoPrograma: '', peso: '', tiempo: '', _activa: true, tablaFisica: [] }];
  });

  const [expandedPieces, setExpandedPieces] = useState(() => {
      if (template.codigo === '' && pieces.length === 1) {
          return { [pieces[0].id]: true };
      }
      return {};
  });

  const [threading, setThreading] = useState(() => template.threading ? [...template.threading] : []);
  const [procesos, setProcesos] = useState(() => template.procesos ? [...template.procesos] : []);
  const [colores, setColores] = useState(() => template.colores ? [...template.colores] : []);
  const [kitPresentationBySize, setKitPresentationBySize] = useState(() => template.kitDefinition?.presentationBySize || template.kitPresentationBySize || {});
  
  const [kitEnabled, setKitEnabled] = useState(() => template.kitEnabled !== false && template.kitDefinition?.enabled !== false);
  const [globalKitLabel, setGlobalKitLabel] = useState(() => {
      if (template.kitDefinition?.globalLabel) return template.kitDefinition.globalLabel;
      const sizesObj = template.kitDefinition?.presentationBySize || template.kitPresentationBySize || {};
      const firstSize = Object.values(sizesObj)[0];
      return firstSize?.displayLabel || '';
  });

  const [saving, setSaving] = useState(false);
  const [cropperModal, setCropperModal] = useState({ open: false, src: null, colorId: null, field: null }); 
  const [formulaModal, setFormulaModal] = useState({ open: false, colorId: null, value: '' });

  useEffect(() => {
    if (targetSection) {
      setTimeout(() => {
        const el = document.getElementById(targetSection);
        if (el) {
          el.scrollIntoView({ behavior: 'smooth', block: 'start' });
        }
      }, 300);
    }
  }, [targetSection]);

  const addPiece = () => {
      const newId = generateId();
      setPieces([...pieces, { 
          id: newId, pieza: '', talla: 'UNI', maquina: '', sufijo: '-A', codigoPrograma: '', peso: '', tiempo: '', _activa: true, 
          tablaFisica: defaultFicha ? JSON.parse(JSON.stringify(defaultFicha)) : [] 
      }]);
      setExpandedPieces(prev => ({...prev, [newId]: true}));
  };
  
  const updatePiece = (id, field, value) => setPieces(pieces.map(p => p.id === id ? { ...p, [field]: value } : p));
  const duplicatePiece = (p) => {
      const newId = generateId();
      setPieces([...pieces, { ...p, id: newId, maquina: '', tablaFisica: p.tablaFisica ? JSON.parse(JSON.stringify(p.tablaFisica)) : [] }]);
      setExpandedPieces(prev => ({...prev, [newId]: true}));
  };
  const removePiece = (id) => setPieces(pieces.filter(p => p.id !== id));

  const handleCopyFicha = (sourceId, targetMode) => {
      const sourcePiece = pieces.find(p => p.id === sourceId);
      if (!sourcePiece) return;
      const copiedTabla = JSON.parse(JSON.stringify(sourcePiece.tablaFisica || []));

      if (targetMode === 'NUEVAS') {
          setDefaultFicha(copiedTabla);
          setOpenCopyMenuId(null);
          alert("Ficha establecida como predeterminada para las nuevas piezas que agregues.");
          return;
      }

      setPieces(pieces.map(p => {
          if (p.id === sourceId) return p;
          let shouldCopy = false;
          if (targetMode === 'ALL') shouldCopy = true;
          if (targetMode === 'TALLA' && p.talla === sourcePiece.talla) shouldCopy = true;
          if (targetMode === 'MAQUINA' && p.maquina === sourcePiece.maquina) shouldCopy = true;

          if (shouldCopy) {
              return { ...p, tablaFisica: JSON.parse(JSON.stringify(copiedTabla)) };
          }
          return p;
      }));
      setOpenCopyMenuId(null);
  };

  const addProceso = () => setProcesos([...procesos, { id: generateId(), nombre: '', costo: '' }]);

  const updateKitPresentation = (talla, field, value) => setKitPresentationBySize(prev => ({ ...prev, [talla]: { ...(prev[talla] || {}), [field]: value } }));

      const reader = new FileReader();

  const handleSave = async () => {
    if (!form.codigo.trim()) return alert("El Modelo (Código) es obligatorio.");
    setSaving(true);
    window.isSavingTemplate = true;
    
    try {
      const codigoUpper = form.codigo.trim().toUpperCase();
      const cliUpper = (form.cliente || 'SIN CLIENTE').toUpperCase();
      const estiloUpper = (form.estiloCliente || '').trim().toUpperCase();
      
      const activas = pieces.filter(p => p._activa).map(({_activa, id, ...rest}) => rest);
      const inactivas = pieces.filter(p => !p._activa).map(({_activa, id, ...rest}) => rest);
      
      const validHilaturas = threading.filter(h => (h.material || h.hilo)?.trim() !== '').map(h => ({
          ...h, 
          material: (h.material || h.hilo).toUpperCase(),

      const validProcesos = procesos.filter(p => p.nombre.trim() !== '' && p.costo !== '').map(p => ({ 
          id: p.id.toString(), nombre: p.nombre.toUpperCase(), costo: parseFloat(p.costo)

      const validColores = colores.map(c => ({
          id: c.id, pantoneCode: c.pantoneCode.toUpperCase(), baseName: c.baseName.toUpperCase(), clientName: c.clientName.toUpperCase(),
          pantoneImage: c.pantoneImage, fabricImage: c.fabricImage, formula: c.formula
      }));
      const kitSetup = buildKitDefinition(activas, kitPresentationBySize, kitEnabled, globalKitLabel);

      const batch = db.batch();

      if (originalCodigo && originalCodigo !== codigoUpper) {
        batch.delete(db.collection('plantillas').doc(originalCodigo));
        batch.delete(db.collection('plantillas_inactivas').doc(originalCodigo));
        batch.delete(db.collection('modelos_confeccion').doc(originalCodigo));
      }

      batch.set(db.collection('plantillas').doc(codigoUpper), { 
          codigo: codigoUpper, 
          cliente: cliUpper, 
          estiloCliente: estiloUpper,
          threading: validHilaturas, 
          subPiecesData: activas,
          colores: validColores,
          kitPresentationBySize: kitSetup.kitDefinition.presentationBySize,
          ...kitSetup,
          updatedAt: new Date().toISOString() 
      }, { merge: true });
      
      batch.set(db.collection('plantillas_inactivas').doc(codigoUpper), { 
          codigo: codigoUpper, 
          cliente: cliUpper, 
          estiloCliente: estiloUpper,
          threading: validHilaturas, 
          subPiecesData: inactivas,
          colores: validColores,
          kitPresentationBySize: kitSetup.kitDefinition.presentationBySize,
          ...kitSetup,
          updatedAt: new Date().toISOString() 
      }, { merge: true });
      
      batch.set(db.collection('modelos_confeccion').doc(codigoUpper), { procesos: validProcesos }, { merge: true });

      await batch.commit();
      onSave();
    } catch (e) { console.error(e); alert("Error al guardar"); window.isSavingTemplate = false; }
    setSaving(false);
  };

  const handleDelete = async () => {

      window.isSavingTemplate = true;

        const batch = db.batch();

const FichaTecnica = ({ modelo, logoData, onToggle, onEdit, onSelectPdfTemplate, db, hilaturasRouss }) => {
  const todasLasPiezas = [...modelo.activas.map(p => ({...p, _activa: true})), ...modelo.inactivas.map(p => ({...p, _activa: false}))];
  
  const agrupado = useMemo(() => {
    const groups = {};
    todasLasPiezas.forEach(p => {
      const talla = p.talla || 'UNI';
      if (!groups[talla]) groups[talla] = {};
      const maquina = p.maquina || 'S/M';
      if (!groups[talla][maquina]) { groups[talla][maquina] = { piezas: [], activa: false }; }
      groups[talla][maquina].piezas.push(p);
      if (p._activa) groups[talla][maquina].activa = true;
    });
    return groups;
  }, [todasLasPiezas]);

  const tallasDisponibles = useMemo(() => Array.from(new Set(todasLasPiezas.map(p => p.talla || 'UNI'))), [todasLasPiezas]);
  
  const totalMaquinas = Object.values(agrupado).reduce((acc, maquinas) => acc + Object.keys(maquinas).length, 0);
  const maquinasActivas = Object.values(agrupado).reduce((acc, maquinas) => acc + Object.values(maquinas).filter(m => m.activa).length, 0);

  const [expandedGroups, setExpandedGroups] = useState(() => {
      const initial = {};
      let totalKeys = 0;
      let lastKey = null;
      
      Object.entries(agrupado).forEach(([t, mqs]) => {
          Object.keys(mqs).forEach(mq => {
              totalKeys++;
              lastKey = `${t}-${mq}`;
          });
      });
      
      if (totalKeys === 1 && lastKey) {
          initial[lastKey] = true;
      }
      return initial;
  });

  const toggleGroup = (talla, numMaquina) => {
      const key = `${talla}-${numMaquina}`;
      setExpandedGroups(prev => ({ ...prev, [key]: !prev[key] }));
  };

  const [expandedBlocks, setExpandedBlocks] = useState({
      tejido: false,
      confeccion: false,
      colores: true,
      pdf: false
  });

  const toggleBlock = (blockName) => {
      setExpandedBlocks(prev => ({ ...prev, [blockName]: !prev[blockName] }));
  };

  const clientBg = logoData?.logoBg || '#ffffff';
  const clientSrc = logoData?.logoUrl || logoData?.logoSVG || null;
  const pdfLogoUrl = logoData?.pdfLogoUrl || null;

  const [estiloCliente, setEstiloCliente] = useState(modelo.estiloCliente || '');

  const defaultPdfConfig = {
      headerBg: '#000000',
      headerColor: '#ffffff',
      borderColor: '#000000',
      borderWidth: '2px',
      borderStyle: 'solid'
  };

  const [pdfConfig, setPdfConfig] = useState(defaultPdfConfig);

  useEffect(() => {
      let config = defaultPdfConfig;
      if (modelo.pdfConfig) {
          config = { ...defaultPdfConfig, ...modelo.pdfConfig };
      } else if (logoData?.pdfConfig) {
          config = { ...defaultPdfConfig, ...logoData.pdfConfig };
      }
      setPdfConfig(config);
  }, [modelo, logoData]);

  const savePdfConfigToModel = async () => {
      try {
          await db.collection('plantillas').doc(modelo.codigo).set({ pdfConfig }, { merge: true });
          await db.collection('plantillas_inactivas').doc(modelo.codigo).set({ pdfConfig }, { merge: true });
          alert("Estilo guardado para este modelo específico.");
      } catch(e) { alert("Error guardando estilo al modelo."); }
  };

  const savePdfConfigToClient = async () => {
      try {
          await db.collection('clientes').doc(modelo.cliente).set({ pdfConfig }, { merge: true });
          alert(`Estilo predeterminado actualizado para el cliente: ${modelo.cliente}`);
      } catch(e) { alert("Error guardando estilo al cliente."); }
  };

  useEffect(() => {
      setEstiloCliente(modelo.estiloCliente || '');
  }, [modelo]);

  const handleEstiloBlur = async () => {
      const valUpper = estiloCliente.trim().toUpperCase();
      if (valUpper !== (modelo.estiloCliente || '')) {
          try {
              await db.collection('plantillas').doc(modelo.codigo).set({ estiloCliente: valUpper }, { merge: true });
              await db.collection('plantillas_inactivas').doc(modelo.codigo).set({ estiloCliente: valUpper }, { merge: true });
              modelo.estiloCliente = valUpper;
          } catch (e) { console.error("Error al actualizar", e); }
      }
  };

  const [pdfData, setPdfData] = useState({
      proveedor: "SWETER'S LILIANA",

  const calcularComposicionAutomatica = () => {
      const threading = modelo.threading || [];
      if (threading.length === 0) {
          alert("⚠️ No hay hilos registrados en el 'Consumo Global' (Inventario) de este modelo.");
          return;
      }

      let totalConsumo = 0;
      const matAportes = {};

      threading.forEach(hilo => {
          const pjePrenda = parseFloat(hilo.porcentaje) || 0;
          if (pjePrenda <= 0) return;
          
          totalConsumo += pjePrenda;
          const estructura = hilaturasRouss.find(hr => hr.inventoryId === hilo.materialId);

          if (estructura && estructura.composicion && estructura.composicion.length > 0) {
              estructura.composicion.forEach(comp => {
                  const mat = comp.material.toUpperCase();
                  const pjeMat = parseFloat(comp.porcentaje) || 0;
                  const aporte = (pjePrenda / 100) * pjeMat;
                  matAportes[mat] = (matAportes[mat] || 0) + aporte;
              });
          } else {
              const matFallback = (hilo.material || 'DESCONOCIDO').toUpperCase();
              matAportes[matFallback] = (matAportes[matFallback] || 0) + pjePrenda;
          }
      });

      if (totalConsumo === 0) {
          alert("⚠️ Los hilos del consumo global están en 0%.");
          return;
      }

      const factor = 100 / totalConsumo;
      const composicionFinalArr = [];

      Object.entries(matAportes).forEach(([mat, valor]) => {
          const valorFinal = Math.round((valor * factor) * 10) / 10;
          if (valorFinal > 0) {
              composicionFinalArr.push({ material: mat, porcentaje: valorFinal });
          }
      });

      composicionFinalArr.sort((a, b) => b.porcentaje - a.porcentaje);
      const resultadoStr = composicionFinalArr.map(item => `${item.porcentaje}% ${item.material}`).join(', ');
      setPdfData(prev => ({ ...prev, composicion: resultadoStr }));

      }

      try {
          const canvas = await html2canvas(element, {
              scale: 3,
              useCORS: true,
              allowTaint: true,
              logging: false
          });

          const rotatedCanvas = document.createElement('canvas');
          rotatedCanvas.width = canvas.height;
          rotatedCanvas.height = canvas.width;
          const rCtx = rotatedCanvas.getContext('2d');
          rCtx.fillStyle = '#ffffff';
          rCtx.fillRect(0, 0, rotatedCanvas.width, rotatedCanvas.height);
          rCtx.translate(0, rotatedCanvas.height);
          rCtx.rotate(-Math.PI / 2);
          rCtx.drawImage(canvas, 0, 0);

          const imgData = rotatedCanvas.toDataURL('image/jpeg', 1.0);

          const { jsPDF } = window.jspdf;
          const pdf = new jsPDF({
              orientation: 'portrait',
              unit: 'cm',
              format: 'letter'
          });

          const pageWidth = 21.59;
          const pageHeight = 27.94;

          const originalWidthCm = 11;
          const originalHeightCm = (canvas.height / canvas.width) * originalWidthCm;

          const finalWidthCm = originalHeightCm;
          const finalHeightCm = originalWidthCm;

          const centerX = pageWidth / 2;
          const centerY = pageHeight - 3.5;
          const margin = 0.5;

          const x = centerX - finalWidthCm / 2;
          let y = centerY - finalHeightCm / 2;
          if (y < margin) y = margin;
          if (y + finalHeightCm > pageHeight - margin) y = Math.max(margin, pageHeight - margin - finalHeightCm);

          pdf.addImage(imgData, 'JPEG', x, y, finalWidthCm, finalHeightCm);

          pdf.save(`ETIQUETA_${modelo.codigo}.pdf`);

            onMouseLeave={cancelPdfTouch}
            onTouchStart={handlePdfTouchStart}

                <p className="text-[10px] font-bold opacity-70 mb-2 uppercase">Llene los datos manualmente para generar el formato de impresión físico.</p>
                
                <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div>
                        <label className="text-[10px] font-black uppercase ml-1 opacity-70">Proveedor</label>
                        <input value={pdfData.proveedor} onChange={e=>setPdfData({...pdfData, proveedor: e.target.value.toUpperCase()})} className="w-full p-2.5 app-input rounded-xl text-xs font-black uppercase mt-1 outline-none"/>

                    <div>
                        <label className="text-[10px] font-black uppercase ml-1 opacity-70">Estilo (Modelo Cliente)</label>

                    </div>
                    <div>
                        <label className="text-[10px] font-black uppercase ml-1 opacity-70">Talla</label>
                        <select value={pdfData.talla} onChange={e=>setPdfData({...pdfData, talla: e.target.value.toUpperCase()})} className="w-full p-2.5 app-input rounded-xl text-xs font-black uppercase mt-1 outline-none">
                            {tallasDisponibles.map(t => <option key={t} value={t}>{t}</option>)}
                        </select>
                    </div>
                    <div>
                        <label className="text-[10px] font-black uppercase ml-1 opacity-70">Tela</label>
                        <input value={pdfData.tela} onChange={e=>setPdfData({...pdfData, tela: e.target.value.toUpperCase()})} className="w-full p-2.5 app-input rounded-xl text-xs font-black uppercase mt-1 outline-none"/>
                    </div>
                    <div>
                        <label className="text-[10px] font-black uppercase ml-1 opacity-70">Número de Muestra</label>
                        <input value={pdfData.muestra} onChange={e=>setPdfData({...pdfData, muestra: e.target.value.toUpperCase()})} placeholder="Opcional" className="w-full p-2.5 app-input rounded-xl text-xs font-black uppercase mt-1 outline-none"/>
                    </div>
                    <div className="sm:col-span-2">
                        <div className="flex justify-between items-end mb-1">
                            <label className="text-[10px] font-black uppercase ml-1 opacity-70">Composición (Manual o Calculada)</label>
                            <button onClick={calcularComposicionAutomatica} type="button" className="bg-[#0f6b5c]/10 dark:bg-[#34d399]/10 text-[#0f6b5c] dark:text-[#34d399] border border-[#0f6b5c]/30 dark:border-[#34d399]/30 px-3 py-1 rounded-lg text-[9px] font-black uppercase hover:opacity-70 transition flex items-center gap-1 shadow-sm neo-btn">
                                🤖 AUTO-CALCULAR
                            </button>
                        </div>
                        <textarea value={pdfData.composicion} onChange={e=>setPdfData({...pdfData, composicion: e.target.value.toUpperCase()})} placeholder="Ej. 90% POLIAMIDA, 10% ELASTANO" rows="2" className="w-full p-2.5 app-input rounded-xl text-xs font-black uppercase outline-none resize-none"></textarea>
                    </div>
                    <div className="sm:col-span-2">
                        <label className="text-[10px] font-black uppercase ml-1 opacity-70">Fecha</label>
                        <input value={pdfData.fecha} onChange={e=>setPdfData({...pdfData, fecha: e.target.value})} className="w-full p-2.5 app-input rounded-xl text-xs font-black mt-1 outline-none"/>
                    </div>
                </div>

                <div className="mt-6 border-t-2 border-black/10 dark:border-white/10 pt-6">
                    <h4 className="text-xs font-black uppercase mb-4 opacity-70 tracking-widest text-[#0f6b5c] dark:text-[#34d399]">🎨 Estilos y Vista Previa</h4>
                    
                    <div className="flex flex-col lg:flex-row gap-6">
                        <div className="flex-1 space-y-4">
                            <div className="grid grid-cols-2 gap-4">
                                <div>
                                    <label className="text-[10px] font-black uppercase ml-1 opacity-70">Color Títulos</label>
                                    <div className="flex items-center gap-2 mt-1">
                                        <input type="color" value={pdfConfig.headerBg} onChange={(e) => setPdfConfig({...pdfConfig, headerBg: e.target.value})} className="w-10 h-10 p-1 app-input rounded-lg cursor-pointer" />
                                        <input type="text" value={pdfConfig.headerBg} onChange={(e) => setPdfConfig({...pdfConfig, headerBg: e.target.value})} className="w-full p-2.5 app-input rounded-xl text-xs font-black uppercase outline-none" />
                                    </div>
                                </div>
                                <div>
                                    <label className="text-[10px] font-black uppercase ml-1 opacity-70">Color Texto Títulos</label>
                                    <div className="flex items-center gap-2 mt-1">
                                        <input type="color" value={pdfConfig.headerColor} onChange={(e) => setPdfConfig({...pdfConfig, headerColor: e.target.value})} className="w-10 h-10 p-1 app-input rounded-lg cursor-pointer" />
                                        <input type="text" value={pdfConfig.headerColor} onChange={(e) => setPdfConfig({...pdfConfig, headerColor: e.target.value})} className="w-full p-2.5 app-input rounded-xl text-xs font-black uppercase outline-none" />
                                    </div>
                                </div>
                                <div>
                                    <label className="text-[10px] font-black uppercase ml-1 opacity-70">Color de Bordes</label>
                                    <div className="flex items-center gap-2 mt-1">
                                        <input type="color" value={pdfConfig.borderColor} onChange={(e) => setPdfConfig({...pdfConfig, borderColor: e.target.value})} className="w-10 h-10 p-1 app-input rounded-lg cursor-pointer" />
                                        <input type="text" value={pdfConfig.borderColor} onChange={(e) => setPdfConfig({...pdfConfig, borderColor: e.target.value})} className="w-full p-2.5 app-input rounded-xl text-xs font-black uppercase outline-none" />
                                    </div>
                                </div>
                                <div>
                                    <label className="text-[10px] font-black uppercase ml-1 opacity-70">Estilo de Borde</label>
                                    <select value={pdfConfig.borderStyle} onChange={(e) => setPdfConfig({...pdfConfig, borderStyle: e.target.value})} className="w-full mt-1 p-2.5 app-input rounded-xl text-xs font-black uppercase outline-none">
                                        <option value="solid">Sólido</option>
                                        <option value="dashed">Punteado largo</option>
                                        <option value="dotted">Punteado corto</option>
                                    </select>
                                </div>
                            </div>
                            
                            <div className="flex flex-col sm:flex-row gap-3 pt-2">
                                <button onClick={savePdfConfigToModel} className="flex-1 bg-blue-500/10 text-blue-600 dark:text-blue-400 border border-blue-500/30 px-4 py-2.5 rounded-xl font-black text-[10px] uppercase hover:bg-blue-500/20 transition-colors">
                                    💾 Guardar a este Modelo
                                </button>
                                <button onClick={savePdfConfigToClient} className="flex-1 bg-purple-500/10 text-purple-600 dark:text-purple-400 border border-purple-500/30 px-4 py-2.5 rounded-xl font-black text-[10px] uppercase hover:bg-purple-500/20 transition-colors">
                                    🏢 Predeterminar para Cliente
                                </button>
                            </div>
                        </div>

                        <div className="flex-1 flex flex-col items-center justify-center bg-gray-200 dark:bg-[#0a0e11] rounded-2xl p-4 border-2 border-dashed neo-border overflow-x-auto">
                            <span className="text-[10px] font-black opacity-50 mb-2 uppercase block w-full text-center">Vista Previa Real</span>
                            <div id="etiqueta-print-preview" className="bg-white shadow-[8px_8px_0_rgba(0,0,0,0.2)]">
                                {renderPdfContent()}
                            </div>
                        </div>
                    </div>

                    <div className="mt-6 flex justify-end">
                        <button onClick={generarPDFjsPDFDirecto} className="w-full sm:w-auto app-btn-secondary px-8 py-4 rounded-xl font-black text-sm neo-btn whitespace-nowrap flex items-center justify-center gap-2">
                            🖨️ Generar PDF (jsPDF Alta Calidad / Rotado)
                        </button>
                    </div>
                </div>
            </div>
        )}
    </div>

    {formulaViewModal.open && (
         <div className="fixed inset-0 z-[600] bg-black/80 backdrop-blur-sm flex items-center justify-center p-4">
             <div className="app-card w-full max-w-sm p-6 rounded-3xl relative shadow-[6px_6px_0_#14181c]">
                 <button onClick={() => setFormulaViewModal({open: false, formula: ''})} className="absolute top-4 right-4 text-xl font-bold opacity-70">❌</button>
                 <h3 className="font-black mb-4 uppercase text-blue-600 dark:text-blue-400">Receta / Fórmula</h3>
                 <div className="bg-gray-100 dark:bg-[#1a222a] p-4 rounded-xl border-2 border-dashed neo-border text-sm font-mono whitespace-pre-wrap">
                     {formulaViewModal.formula}
                 </div>
             </div>
         </div>
    )}
    </>
  );
};

const App = () => {
  const [modelos, setModelos] = useState([]);
  const [clientesData, setClientesData] = useState({});
  const [loading, setLoading] = useState(true);
  const [inventory, setInventory] = useState([]);
  const [hilaturasRouss, setHilaturasRouss] = useState([]);
  
  const [nightMode, setNightMode] = useState(() => {
    return localStorage.getItem('maes_night_mode') === 'true';
  });

  const [viewMode, setViewMode] = useState('grid');

  useEffect(() => {
    if (nightMode) {
      document.body.classList.add('night-mode');
      localStorage.setItem('maes_night_mode', 'true');
    } else {
      document.body.classList.remove('night-mode');
      localStorage.setItem('maes_night_mode', 'false');
    }
  }, [nightMode]);
  
  const [viewState, setViewState] = useState({ view: 'clients', client: null, model: null });
  
  const [editingTemplate, setEditingTemplate] = useState(null);
  
  const [pinModalOpen, setPinModalOpen] = useState(false);
  const [targetClientForEdit, setTargetClientForEdit] = useState(null);
  
  const [customizerModalOpen, setCustomizerModalOpen] = useState(false);
  const [editingClientConfig, setEditingClientConfig] = useState(null);

  useEffect(() => {
    const unsubInv = db.collection('inventory').doc('main').onSnapshot(d => {
        setInventory(d.exists && d.data().items ? d.data().items : []);
    });
    
    const unsubRouss = db.collection('hilaturas-rouss').onSnapshot(snap => {
        const arr = [];
        snap.forEach(doc => arr.push({ id: doc.id, ...doc.data() }));
        setHilaturasRouss(arr);
    });

    return () => {
        unsubInv();
        unsubRouss();
    };
  }, []);

  const fetchTodo = async () => {
    setLoading(true);
    try {
      const [activasSnap, inactivasSnap, confeccionSnap, clientesSnap] = await Promise.all([
        db.collection('plantillas').get(),
        db.collection('plantillas_inactivas').get(),
        db.collection('modelos_confeccion').get(),
        db.collection('clientes').get()
      ]);

      const cData = {};
      clientesSnap.forEach(doc => { cData[doc.id] = doc.data(); });
      setClientesData(cData);

      const procesosMap = {};
      confeccionSnap.forEach(doc => { procesosMap[doc.id] = doc.data().procesos || []; });

      const map = new Map();
      activasSnap.forEach(doc => {
        const data = doc.data();
        map.set(doc.id, { 
          codigo: doc.id, 
          cliente: data.cliente || 'SIN CLIENTE', 
          threading: data.threading || [], 
          activas: data.subPiecesData || [], 
          colores: data.colores || [],
          inactivas: [], 
          procesos: procesosMap[doc.id] || [],
          productionMode: data.productionMode || 'INDIVIDUAL',
          kitEligibleSizes: data.kitEligibleSizes || [],
          kitDefinition: data.kitDefinition || null,
          estiloCliente: data.estiloCliente || '',
          pdfTemplateId: data.pdfTemplateId || null,
          pdfConfig: data.pdfConfig || null
        });
      });

      inactivasSnap.forEach(doc => {
        const data = doc.data();
        if (map.has(doc.id)) { 
          map.get(doc.id).inactivas = data.subPiecesData || []; 
          if (!map.get(doc.id).estiloCliente && data.estiloCliente) map.get(doc.id).estiloCliente = data.estiloCliente;
          if (!map.get(doc.id).pdfTemplateId && data.pdfTemplateId) map.get(doc.id).pdfTemplateId = data.pdfTemplateId;
          if (!map.get(doc.id).pdfConfig && data.pdfConfig) map.get(doc.id).pdfConfig = data.pdfConfig;
          if (map.get(doc.id).colores.length === 0 && data.colores) map.get(doc.id).colores = data.colores;
        } 
        else { 
          map.set(doc.id, { 
            codigo: doc.id, 
            cliente: data.cliente || 'SIN CLIENTE', 
            threading: data.threading || [], 
            colores: data.colores || [],
            activas: [], 
            inactivas: data.subPiecesData || [], 
            procesos: procesosMap[doc.id] || [],
            productionMode: data.productionMode || 'INDIVIDUAL',
            kitEligibleSizes: data.kitEligibleSizes || [],
            kitDefinition: data.kitDefinition || null,
            estiloCliente: data.estiloCliente || '',
            pdfTemplateId: data.pdfTemplateId || null,
            pdfConfig: data.pdfConfig || null
          }); 
        }
      });

      setModelos(Array.from(map.values()).sort((a, b) => a.codigo.localeCompare(b.codigo)));
    } catch (error) { console.error(error); }
    setLoading(false);
  };

  useEffect(() => { fetchTodo(); }, []);

  useEffect(() => {
      if (!window.history.state) {
          window.history.replaceState({ view: 'clients' }, '');
      }

      const handlePop = (e) => {
          if (editingTemplate !== null) {
              if (!window.isSavingTemplate) {
                  const ans = window.confirm("¿Seguro que quieres salir sin guardar los cambios?");
                  if (!ans) {
                      window.history.pushState({ modal: 'edit' }, '');
                      return;
                  }
              }
              setEditingTemplate(null);
              window.isSavingTemplate = false;
              if (e.state && e.state.view) {
                  setViewState({ view: e.state.view, client: e.state.client || null, model: e.state.model || null });
              }
              return;
          }

          if (e.state && e.state.view) {
              setViewState({ view: e.state.view, client: e.state.client || null, model: e.state.model || null });
          }
      };

      window.addEventListener('popstate', handlePop);
      return () => window.removeEventListener('popstate', handlePop);
  }, [editingTemplate]);

  const navToModels = (client) => {
      window.history.pushState({ view: 'models', client }, '');
      setViewState({ view: 'models', client, model: null });
  };
  const navToFicha = (client, model) => {
      window.history.pushState({ view: 'ficha', client, model }, '');
      setViewState({ view: 'ficha', client, model });
  };
  const navToEdit = (template, targetSection = null) => {
      window.history.pushState({ modal: 'edit' }, '');
      setEditingTemplate({ template, targetSection });
  };
  const navBack = () => {
      window.history.back();
  };

  const handleDeleteClient = async (clienteTarget) => {
      if(!confirm(`¿ELIMINAR por completo TODOS los modelos de ${clienteTarget}? Esta acción es irreversible.`)) return;
      setLoading(true);
      try {
          const toDelete = modelos.filter(m => m.cliente === clienteTarget);
          const batch = db.batch();
          for(const m of toDelete) {
              batch.delete(db.collection('plantillas').doc(m.codigo));
              batch.delete(db.collection('plantillas_inactivas').doc(m.codigo));
              batch.delete(db.collection('modelos_confeccion').doc(m.codigo));
          }
          batch.delete(db.collection('clientes').doc(clienteTarget));
          await batch.commit();
          setEditingClientConfig(null);
          navBack(); 
          fetchTodo();
      } catch(e) { alert('Error eliminando cliente'); setLoading(false); }
  };

  const handleToggleMaquina = async (modelo, talla, maquina, isCurrentlyActive) => {
    const activeRef = db.collection('plantillas').doc(modelo.codigo);
    const inactiveRef = db.collection('plantillas_inactivas').doc(modelo.codigo);

    const piezasDeEstaMaquinaActivas = modelo.activas.filter(p => p.talla === talla && p.maquina === maquina);
    const piezasDeEstaMaquinaInactivas = modelo.inactivas.filter(p => p.talla === talla && p.maquina === maquina);

    let nuevasActivas = [...modelo.activas];
    let nuevasInactivas = [...modelo.inactivas];

    if (isCurrentlyActive) {
      nuevasActivas = nuevasActivas.filter(p => !(p.talla === talla && p.maquina === maquina));
      nuevasInactivas = [...nuevasInactivas, ...piezasDeEstaMaquinaActivas];
    } else {
      nuevasInactivas = nuevasInactivas.filter(p => !(p.talla === talla && p.maquina === maquina));
      nuevasActivas = [...nuevasActivas, ...piezasDeEstaMaquinaInactivas];
    }

    setModelos(prev => prev.map(m => m.codigo === modelo.codigo ? { ...m, activas: nuevasActivas, inactivas: nuevasInactivas } : m));
    
    if (viewState.view === 'ficha' && viewState.model?.codigo === modelo.codigo) {
        setViewState(prev => ({ ...prev, model: { ...prev.model, activas: nuevasActivas, inactivas: nuevasInactivas } }));
    }

    const batch = db.batch();
    const kitSetup = buildKitDefinition(nuevasActivas);
    batch.set(activeRef, { codigo: modelo.codigo, cliente: modelo.cliente, threading: modelo.threading || [], subPiecesData: nuevasActivas, ...kitSetup }, { merge: true });
    batch.set(inactiveRef, { codigo: modelo.codigo, cliente: modelo.cliente, threading: modelo.threading || [], subPiecesData: nuevasInactivas, ...kitSetup }, { merge: true });
    try { await batch.commit(); } catch (err) { alert("Error al guardar el estado."); console.error(err); }
  };

  const handleSelectPdfTemplate = async (codigo, templateId) => {
      try {
          const payload = { pdfTemplateId: templateId };
          await db.collection('plantillas').doc(codigo).set(payload, { merge: true });
          await db.collection('plantillas_inactivas').doc(codigo).set(payload, { merge: true });
          
          setModelos(prev => prev.map(m => m.codigo === codigo ? { ...m, pdfTemplateId: templateId } : m));
          if (viewState.view === 'ficha' && viewState.model?.codigo === codigo) {
              setViewState(prev => ({ ...prev, model: { ...prev.model, pdfTemplateId: templateId } }));
          }
      } catch (e) { console.error(e); alert("Error asignando plantilla PDF"); }
  };

  const themeTimer = useRef(null);
  const handleThemeTouchStart = () => {
      themeTimer.current = setTimeout(() => {
          const pin = prompt("🔐 Modo Desarrollador.\nIngrese PIN:");
          if (pin === "13524680") {
              setCustomizerModalOpen(true);
          } else if (pin) {
              alert("PIN incorrecto");
          }
      }, 5000);
  };
  const cancelThemeTouch = () => {
      if (themeTimer.current) clearTimeout(themeTimer.current);
  };

  const modelosAgrupados = useMemo(() => {
      return modelos.reduce((acc, curr) => {
          const cli = curr.cliente || 'SIN CLIENTE';
          if (!acc[cli]) acc[cli] = [];
          acc[cli].push(curr);
          return acc;
      }, {});
  }, [modelos]);

  let mainContent;
  if (loading) {
      mainContent = (
          <div className="flex flex-col items-center justify-center py-32 opacity-60">
            <div className="text-4xl animate-spin mb-4">🌀</div>
            <p className="font-black text-sm tracking-wide">Cargando base de datos...</p>
          </div>
      );
  } else if (viewState.view === 'clients') {
      mainContent = (
          <div className={
              viewMode === 'grid' ? "grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 xl:grid-cols-6 gap-6 pt-2" :
              viewMode === 'list' ? "flex flex-col gap-4 pt-2" :
              "grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-3 pt-2"
          }>
              {Object.keys(modelosAgrupados).sort((a,b)=>a.localeCompare(b)).map(cliente => (
                  <ClientCard 
                      key={cliente} 
                      cliente={cliente} 
                      logoData={clientesData[cliente]} 
                      viewMode={viewMode}
                      modelCount={modelosAgrupados[cliente].length}
                      onClick={() => navToModels(cliente)}
                      onEdit={() => {
                          setTargetClientForEdit(cliente);
                          setPinModalOpen(true);
                      }}
                  />
              ))}
              {Object.keys(modelosAgrupados).length === 0 && (
                <div className="col-span-full text-center py-12 font-black border-[3px] border-dashed neo-border rounded-[2rem] opacity-70 bg-white/50 dark:bg-black/50">
                  No se encontraron clientes. ¡Crea una plantilla nueva!
                </div>
              )}
          </div>
      );
  } else if (viewState.view === 'models') {
      const clienteStr = viewState.client;
      const mods = modelosAgrupados[clienteStr] || [];
      const clientBg = clientesData[clienteStr]?.logoBg || '#ffffff';
      const clientSrc = clientesData[clienteStr]?.logoUrl || clientesData[clienteStr]?.logoSVG || null;

      mainContent = (
          <div>
              <div className="flex items-stretch gap-0 mb-8 rounded-[2rem] overflow-hidden border-[3px] neo-border shadow-[6px_6px_0_#14181c] dark:shadow-[4px_4px_0_#000]">
                  {clientSrc ? (
                      <div className="w-24 h-24 flex items-center justify-center p-2 border-r-[3px] neo-border shrink-0 bg-white" style={{ backgroundColor: clientBg }}>
                          <img src={clientSrc} className="w-full h-full object-contain" alt={clienteStr} />
                      </div>
                  ) : (
                      <div className="w-24 h-24 bg-white dark:bg-[#1a222a] border-r-[3px] neo-border flex items-center justify-center shrink-0">
                          <span className="text-3xl font-black">{clienteStr.substring(0,2)}</span>
                      </div>
                  )}
                  <div className="flex-1 bg-[#0f6b5c] dark:bg-[#0d9488] p-4 flex flex-col justify-center text-white">
                      <h2 className="text-2xl sm:text-3xl font-black uppercase tracking-tight truncate">{clienteStr}</h2>
                      <p className="text-sm font-bold opacity-90 mt-1">{mods.length} Modelos Registrados</p>
                  </div>
              </div>
              
              <div className={
                  viewMode === 'grid' ? "grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-6 gap-5 pt-2" :
                  viewMode === 'list' ? "flex flex-col gap-4 pt-2" :
                  "grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-3 pt-2"
              }>
                  {mods.map(modelo => (
                      <ModelThumbnail key={modelo.codigo} modelo={modelo} viewMode={viewMode} onClick={() => navToFicha(clienteStr, modelo)} />
                  ))}
              </div>
          </div>
      );
  } else if (viewState.view === 'ficha') {
      mainContent = (
          <div className="flex flex-col items-center">
              <FichaTecnica 
                  modelo={viewState.model} 
                  logoData={clientesData[viewState.client]} 
                  onToggle={handleToggleMaquina} 
                  onEdit={(section) => navToEdit(viewState.model, section)} 
                  onSelectPdfTemplate={handleSelectPdfTemplate}
                  db={db}
                  hilaturasRouss={hilaturasRouss}
              />
          </div>
      );
  }

  return (
    <div className="min-h-screen pb-12">
      {editingTemplate && <TemplateEditor template={editingTemplate.template} targetSection={editingTemplate.targetSection} inventory={inventory} onClose={() => navBack()} onSave={() => { fetchTodo(); navBack(); }} onDelete={() => { navBack(); navBack(); fetchTodo(); }} />}
      {editingClientConfig && <ClientConfigModal cliente={editingClientConfig} logoData={clientesData[editingClientConfig]} onClose={() => setEditingClientConfig(null)} onSave={(c, data) => setClientesData(prev => ({...prev, [c]: data}))} onDelete={handleDeleteClient} />}
      {pinModalOpen && (
          <PinModal 
              onSuccess={() => {
                  setPinModalOpen(false);
                  setEditingClientConfig(targetClientForEdit);
                  setTargetClientForEdit(null);
              }} 
              onClose={() => {
                  setPinModalOpen(false);
                  setTargetClientForEdit(null);
              }} 
          />
      )}
      {customizerModalOpen && <CustomizerModal onClose={() => setCustomizerModalOpen(false)} />}

      {viewState.view !== 'clients' && (
          <div className="app-nav sticky top-0 z-50 flex items-center justify-between h-16 px-4 print:hidden">
            <div className="flex-1">
                <button onClick={() => navBack()} className="font-black text-xs px-3 py-1.5 rounded-xl app-card neo-btn flex items-center gap-1 w-max">
                    ⬅️ Volver
                </button>
            </div>
            <h1 className="text-sm font-black flex-1 text-center truncate uppercase tracking-wider">
                {viewState.view === 'models' ? viewState.client : 
                 viewState.view === 'ficha' ? viewState.model?.codigo : ''}
            </h1>
            <div className="flex-1 flex justify-end items-center gap-2">
                <button 
                  onClick={() => { cancelThemeTouch(); setNightMode(!nightMode); }} 
                  onMouseDown={handleThemeTouchStart}
                  onMouseUp={cancelThemeTouch}
                  onMouseLeave={cancelThemeTouch}
                  onTouchStart={handleThemeTouchStart}
                  onTouchEnd={cancelThemeTouch}
                  onTouchMove={cancelThemeTouch} 
                  onTouchCancel={cancelThemeTouch}
                  className="app-card px-2.5 py-1.5 rounded-xl text-xs font-black neo-btn select-none"
                  title="Cambiar modo"
                >
                  {nightMode ? '🌙' : '☀️'}
                </button>
                <button onClick={() => navToEdit({ codigo: '', cliente: '', activas: [], inactivas: [], procesos: [], colores: [] })} className="app-btn-primary sm:hidden px-3 py-1.5 rounded-xl font-black text-xs neo-btn">➕</button>
            </div>
          </div>
      )}

      <div className={`p-4 max-w-7xl mx-auto print:p-0 ${viewState.view === 'clients' ? 'pt-6' : 'pt-6'}`}>
        
        {(viewState.view === 'clients' || viewState.view === 'models') && (
            <div className="flex flex-col sm:flex-row justify-between items-center mb-6 gap-4">
                <button onClick={() => navToEdit({ codigo: '', cliente: '', activas: [], inactivas: [], procesos: [], colores: [] })} className="w-full sm:w-auto app-btn-primary px-6 py-3.5 rounded-[1.5rem] font-black flex items-center justify-center gap-2 neo-btn text-base">
                    ➕ Nueva Plantilla
                </button>
                <div className="flex bg-[#14181c]/10 dark:bg-white/10 p-1.5 rounded-2xl gap-1 border-[3px] border-transparent dark:border-[#2a3b4c]">
                    <button onClick={() => setViewMode('grid')} className={`p-2.5 rounded-xl transition-all ${viewMode === 'grid' ? 'bg-white dark:bg-[#1a222a] border-[3px] border-black shadow-[2px_2px_0_#14181c] dark:shadow-[2px_2px_0_#000]' : 'hover:bg-black/5 dark:hover:bg-white/5 opacity-60 hover:opacity-100 border-[3px] border-transparent'}`} title="Cuadrícula">🔲</button>
                    <button onClick={() => setViewMode('list')} className={`p-2.5 rounded-xl transition-all ${viewMode === 'list' ? 'bg-white dark:bg-[#1a222a] border-[3px] border-black shadow-[2px_2px_0_#14181c] dark:shadow-[2px_2px_0_#000]' : 'hover:bg-black/5 dark:hover:bg-white/5 opacity-60 hover:opacity-100 border-[3px] border-transparent'}`} title="Lista">📄</button>
                    <button onClick={() => setViewMode('compact')} className={`p-2.5 rounded-xl transition-all ${viewMode === 'compact' ? 'bg-white dark:bg-[#1a222a] border-[3px] border-black shadow-[2px_2px_0_#14181c] dark:shadow-[2px_2px_0_#000]' : 'hover:bg-black/5 dark:hover:bg-white/5 opacity-60 hover:opacity-100 border-[3px] border-transparent'}`} title="Compacto">🗜️</button>
                </div>
            </div>
        )}

        {mainContent}

      </div>
    </div>
  );
};

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
</script>
</body>
</html>
