const NewOrderScreen = ({ inventory }) => {
  const [form, setForm] = useState({ 
    modelo:'', nombreModeloCliente: '', cliente:'', ordenCompra: '', color:'', 
    selectedMonth: '', partidasExistentes: [], partidaCodigo:''
  });
  const [components, setComponents] = useState([emptyComp()]);
  const [threading, setThreading] = useState([emptyThread(), emptyThread()]);
  const [drafts, setDrafts] = useState(null);
  const [saving, setSaving] = useState(false);
  const [errorGenerar, setErrorGenerar] = useState('');
  
  const [plantillas, setPlantillas] = useState([]);
  const [showPlantillas, setShowPlantillas] = useState(false);
  const [busquedaPlantilla, setBusquedaPlantilla] = useState('');
  const [modelSearchOpen, setModelSearchOpen] = useState(false);
  const [remainderInfo, setRemainderInfo] = useState(false);
  
  const [plantillaSeleccionadaModal, setPlantillaSeleccionadaModal] = useState(null);
  const [showVistaPrevia, setShowVistaPrevia] = useState(false);

  const [templateViewMode, setTemplateViewMode] = useState(() => localStorage.getItem('templateViewMode') || 'mosaic');
  const [folderPath, setFolderPath] = useState([]);

  const [printModal, setPrintModal] = useState({ isOpen: false, queue: [], title: '' });
  const [isGenerating, setIsGenerating] = useState(false);
  const [progress, setProgress] = useState({ current: 0, total: 0 });
  const cancelGenerationRef = useRef(false);

  const { openScreen, closeScreen } = useBackStack();

  useEffect(() => {
      localStorage.setItem('templateViewMode', templateViewMode);
  }, [templateViewMode]);

  // Cada vez que se abre una pantalla de pantalla completa, se registra en el
  // historial. Si el usuario le da "Atrás" en el celular, se cierra sola.
  useEffect(() => { if (showPlantillas) openScreen(() => { setShowPlantillas(false); setFolderPath([]); }); }, [showPlantillas]);
  useEffect(() => { if (plantillaSeleccionadaModal) openScreen(() => setPlantillaSeleccionadaModal(null)); }, [plantillaSeleccionadaModal]);
  useEffect(() => { if (showVistaPrevia) openScreen(() => setShowVistaPrevia(false)); }, [showVistaPrevia]);
  useEffect(() => { if (printModal.isOpen) openScreen(() => setPrintModal(prev => ({ ...prev, isOpen: false }))); }, [printModal.isOpen]);
  useEffect(() => { if (remainderInfo) openScreen(() => setRemainderInfo(false)); }, [remainderInfo]);

  useEffect(() => {
    Promise.all([
      db.collection('orders').limit(150).get(),
      db.collection('plantillas').limit(100).get()
    ]).then(([ordersSnap, plantillasSnap]) => {
      const ordersList = ordersSnap.docs.map(d => d.data()).sort((a,b) => (b.id||0) - (a.id||0));
      const plantillasList = plantillasSnap.docs.map(d => d.data());
      
      const unique = {};
      ordersList.forEach(data => { if (data.codigo && !unique[data.codigo]) { unique[data.codigo] = data; } });
      plantillasList.forEach(data => { if (data.codigo) { unique[data.codigo] = data; } });

      setPlantillas(Object.values(unique));
    }).catch(e => console.log('Error fetching plantillas', e));
  }, []);

  const plantillasFiltradas = useMemo(() => {
    if (!busquedaPlantilla.trim()) return plantillas;
    const search = busquedaPlantilla.toLowerCase();
    return plantillas.filter(p => (p.codigo || '').toLowerCase().includes(search) || (p.cliente || '').toLowerCase().includes(search));
  }, [plantillas, busquedaPlantilla]);

  const plantillasAgrupadas = useMemo(() => {
    return plantillasFiltradas.reduce((acc, p) => {
      const cli = p.cliente || 'SIN CLIENTE';
      if (!acc[cli]) acc[cli] = [];
      acc[cli].push(p);
      return acc;
    }, {});
  }, [plantillasFiltradas]);

  const folderData = useMemo(() => {
      if (folderPath.length === 0) {
          return Object.keys(plantillasAgrupadas).sort().map(c => ({ type: 'folder', name: c, client: c, count: plantillasAgrupadas[c].length }));
      } else if (folderPath.length === 1) {
          const client = folderPath[0];
          const models = plantillasAgrupadas[client] || [];
          if (models.length > 50) {
              const chunks = [];
              for(let i=0; i<models.length; i+=50) {
                 chunks.push({ type: 'chunk', name: `${models[i].codigo} - ${models[Math.min(i+49, models.length-1)].codigo}`, client, chunkIndex: i, count: Math.min(50, models.length - i) });
              }
              return chunks;
          } else {
              return models.map(m => ({ type: 'model', data: m }));
          }
      } else if (folderPath.length === 2) {
          const client = folderPath[0];
          const chunkIndex = folderPath[1];
          const models = (plantillasAgrupadas[client] || []).slice(chunkIndex, chunkIndex + 50);
          return models.map(m => ({ type: 'model', data: m }));
      }
      return [];
  }, [folderPath, plantillasAgrupadas]);

  const mesesProximos = useMemo(() => {
    const now = new Date();
    const year = now.getFullYear();
    const mesesNombres = ["ENE","FEB","MAR","ABR","MAY","JUN","JUL","AGO","SEP","OCT","NOV","DIC"];
    const meses = [];
    for (let i = 0; i < 6; i++) {
      const date = new Date(year, now.getMonth() + i, 1);
      const mesIndex = date.getMonth();
      const yearSuffix = date.getFullYear().toString().slice(-2);
      meses.push({ label: `${mesesNombres[mesIndex]}${yearSuffix}`, value: `${mesesNombres[mesIndex]}${yearSuffix}` });
    }
    return meses;
  }, []);

  const tallasUnicas = useMemo(() => {
     return [...new Set(components.map(c => (c.talla || '').toUpperCase()))];
  }, [components]);

  const selectedModelKitSetup = useMemo(() => {
    const template = plantillas.find(item => String(item.codigo || '').toUpperCase() === String(form.modelo || '').toUpperCase());
    if (template?.productionMode) {
      const kitEnabled = template.kitEnabled !== false && template.kitDefinition?.enabled !== false;
      return {
        productionMode: kitEnabled ? template.productionMode : 'INDIVIDUAL',
        kitEligibleSizes: kitEnabled ? (template.kitEligibleSizes || []) : [],
        kitDefinition: template.kitDefinition || buildKitDefinition(template.subPiecesData || components, template.kitPresentationBySize || {}, kitEnabled).kitDefinition,
        kitEnabled
      };
    }
    return buildKitDefinition(components);
  }, [plantillas, form.modelo, components]);

  useEffect(() => {
    if (!form.selectedMonth) { setForm(prev => ({ ...prev, partidasExistentes: [], partidaCodigo: '' })); return; }
    const prefix = form.selectedMonth + "_";
    db.collection('orders').where('partida', '>=', prefix).where('partida', '<=', prefix + "\uf8ff").get()
      .then(snapshot => {
        const partidas = snapshot.docs.map(doc => doc.data().partida);
        const unicas = [...new Set(partidas)].sort((a, b) => {
           const numA = parseInt((a.split('_')[1]) || 0);
           const numB = parseInt((b.split('_')[1]) || 0);
           return numA - numB;
        });
        setForm(prev => ({ ...prev, partidasExistentes: unicas }));
      })
      .catch(() => setForm(prev => ({ ...prev, partidasExistentes: [] })));
  }, [form.selectedMonth]);

  const selectPlantilla = (p) => {
    if (showPlantillas) closeScreen();
    setFolderPath([]);
    setPlantillaSeleccionadaModal(p);
  };

  const handleConfirmarConfigPlantilla = (asignacionesActivas) => {
    setForm(prev => ({ ...prev, modelo: plantillaSeleccionadaModal.codigo, cliente: plantillaSeleccionadaModal.cliente || '' }));
    const kitEnabled = plantillaSeleccionadaModal.kitEnabled !== false && plantillaSeleccionadaModal.kitDefinition?.enabled !== false;

    const newComps = asignacionesActivas.map((a, i) => ({
      ...(a),
      id: generateId() + i,
      descripcion: a.descripcion,
      talla: a.talla,
      sufijo: a.sufijo || '',
      maquina: a.maquina,
      totalPiezas: a.totalPiezas,
      piezasPorPaquete: kitEnabled ? (Number(plantillaSeleccionadaModal.kitDefinition?.presentationBySize?.[String(a.talla || 'UNI').toUpperCase()]?.componentLienzosPerKit?.[String(a.descripcion || a.pieza || '').toUpperCase()]) || a.piezasPorPaquete || 100) : (a.piezasPorPaquete || 100),
      kitYieldPerLienzo: kitEnabled ? (Number(plantillaSeleccionadaModal.kitDefinition?.presentationBySize?.[String(a.talla || 'UNI').toUpperCase()]?.yieldPerLienzo?.[String(a.descripcion || a.pieza || '').toUpperCase()]) || 1) : 1,
      kitTotalOrden: kitEnabled ? (Number(a.kitTotalOrden) || 0) : 0,
      codigoPrograma: a.codigoPrograma || '',
      peso: a.peso || '',
      tiempo: a.tiempo || '',
      isNew: false
    }));

    setComponents(newComps);
    if (plantillaSeleccionadaModal.threading && plantillaSeleccionadaModal.threading.length > 0) {
      setThreading(plantillaSeleccionadaModal.threading.map(t => ({...t, porcentaje: t.porcentaje || ''})));
    }
    setPlantillaSeleccionadaModal(null);
  };

  const handleCrearNuevaPartida = () => {
    if (!form.selectedMonth) return;
    const numeros = form.partidasExistentes.map(p => p.split('_')[1]).filter(Boolean).map(Number);
    const siguiente = String((numeros.length ? Math.max(...numeros) : 0) + 1).padStart(2, '0');
    setForm(prev => ({ ...prev, partidaCodigo: `${form.selectedMonth}_${siguiente}` }));
  };

  const updateComp = (idx,field,val)=>{ const n=[...components]; n[idx]={...n[idx],[field]:val}; setComponents(n); };
  const removeComp = (idx)=>setComponents(components.filter((_,i)=>i!==idx));
  const handleAddTallaGlobal = () => { if (components.length === 0) return; const lastTalla = components[components.length - 1].talla; const piecesToDuplicate = components.filter(c => c.talla === lastTalla); const newComps = piecesToDuplicate.map(c => ({ ...c, id: generateId(), talla: '', isNew: true })); setComponents([...components, ...newComps]); };
  const handleAddMaquinaGlobal = () => { if (components.length === 0) return; const last = components[components.length - 1]; setComponents([...components, { ...last, id: generateId(), maquina: '', totalPiezas: '', isNew: true }]); };

  const handleGuardarPlantilla = async () => {
    if(!form.modelo) return alert('Por favor escribe el nombre del Modelo antes de guardar la plantilla.');
    try {
       setSaving(true);
       const modeloId = form.modelo.toUpperCase();
       const docRef = db.collection('plantillas').doc(modeloId);
       const docSnap = await docRef.get();
       let mergedSubPieces = [];
       if (docSnap.exists) { mergedSubPieces = docSnap.data().subPiecesData || []; }
       const piecesMap = new Map();
       mergedSubPieces.forEach(sp => {
           const key = `${(sp.pieza || '').toUpperCase()}_${(sp.talla || 'UNI').toUpperCase()}`;
           if (!piecesMap.has(key)) { piecesMap.set(key, sp); } else {
               const existing = piecesMap.get(key);
               const currentMachines = (existing.maquina || '').split(',').map(m => m.trim()).filter(Boolean);
               const newMachines = (sp.maquina || '').split(',').map(m => m.trim()).filter(Boolean);
               existing.maquina = [...new Set([...currentMachines, ...newMachines])].join(', ');
           }
       });
       components.forEach((c, i) => {
           if (!c.descripcion) return; 
           const key = `${c.descripcion.toUpperCase()}_${(c.talla || 'UNI').toUpperCase()}`;
           piecesMap.set(key, {
             id: Date.now() + i, pieza: c.descripcion.toUpperCase(), talla: (c.talla || 'UNI').toUpperCase(), totalPedido: c.totalPiezas || '', peso: c.peso || '', tiempo: c.tiempo || '', codigoPrograma: (c.codigoPrograma || '').toUpperCase(), maquina: c.maquina || '', sufijo: (c.sufijo || '').toUpperCase()
           });
       });
       const templatePieces = Array.from(piecesMap.values());
       const storedTemplate = docSnap.exists ? docSnap.data() : {};
       const storedKitEnabled = storedTemplate.kitEnabled !== false && storedTemplate.kitDefinition?.enabled !== false;
       const kitSetup = buildKitDefinition(templatePieces, storedTemplate.kitPresentationBySize || storedTemplate.kitDefinition?.presentationBySize || {}, storedKitEnabled);

       const templateData = {
         codigo: modeloId, cliente: (form.cliente || '').toUpperCase(), subPiecesData: templatePieces, threading: threading,
         ...kitSetup,
         updatedAt: new Date().toISOString()
       };
       if (!docSnap.exists) { templateData.createdAt = templateData.updatedAt; }
       await docRef.set(templateData, { merge: true });
       setSaving(false);
       alert('¡Plantilla actualizada correctamente!');
    } catch(err) { console.error(err); alert('Error al guardar la plantilla.'); setSaving(false); }
  };

  const checkGenerar = () => {
    setErrorGenerar('');
    if(!form.partidaCodigo||!form.cliente||!form.modelo) return alert('Faltan datos generales (partida, cliente, modelo).');
    const invalidComp = components.find(c => c.descripcion && c.maquina && (isNaN(Number(c.totalPiezas)) || Number(c.totalPiezas) <= 0));
    if (invalidComp) return alert(`La pieza "${invalidComp.descripcion}" (Talla: ${invalidComp.talla || 'UNI'}) debe tener un "Total Piezas" mayor a 0.`);
    const hasRemainder = components.some(c => c.piezasPorPaquete > 0 && (Number(c.totalPiezas) % Number(c.piezasPorPaquete) !== 0));
    if (hasRemainder) { setRemainderInfo(true); } else { executeGenerar('LAST'); }
  };

  const executeGenerar = (strategy) => {
    try{
      const generatedDrafts = [];
      const kitSetup = selectedModelKitSetup;
      components.forEach(comp => {
        if(!comp.descripcion || !comp.maquina) return;
        const maquinasArray = String(comp.maquina).split(',').map(m => m.trim()).filter(Boolean);
        const numMachines = maquinasArray.length;
        if(numMachines === 0) return;
        
        maquinasArray.forEach((maqKey, index) => {
            const totalOriginal = Number(comp.totalPiezas);
            let totalPiezas = totalOriginal;
            if (numMachines > 1) {
                const base = Math.floor(totalOriginal / numMachines);
                const extra = (totalOriginal % numMachines) > index ? 1 : 0;
                totalPiezas = base + extra;
            }
            const pzp = Number(comp.piezasPorPaquete);
            const subPiecesData = [{ id: Date.now() + Math.random(), pieza: comp.descripcion.toUpperCase(), talla: comp.talla || 'UNI', totalPedido: totalPiezas, peso: comp.peso || '', tiempo: comp.tiempo || '', codigoPrograma: (comp.codigoPrograma || '').toUpperCase(), yieldPerLienzo: Number(comp.kitYieldPerLienzo) || 1, kitTotalOrden: Number(comp.kitTotalOrden) || 0 }];
            
            let paquetes = [];
            if (pzp > 0 && totalPiezas > 0) {
                if (strategy === 'LAST') {
                   const numPaq = Math.ceil(totalPiezas / pzp);
                   for(let i=1; i<=numPaq; i++) { const rem = totalPiezas % pzp; paquetes.push((i === numPaq && rem !== 0) ? rem : pzp); }
                } else if (strategy === 'EQUAL') {
                   const numPaq = Math.ceil(totalPiezas / pzp);
                   const base = Math.floor(totalPiezas / numPaq);
                   let extras = totalPiezas % numPaq;
                   for(let i=1; i<=numPaq; i++) { paquetes.push(base + (extras > 0 ? 1 : 0)); extras--; }
                } else if (strategy === 'REDUCE') {
                   let numPaq = Math.floor(totalPiezas / pzp);
                   if (numPaq === 0) numPaq = 1;
                   const base = Math.floor(totalPiezas / numPaq);
                   let extras = totalPiezas % numPaq;
                   for(let i=1; i<=numPaq; i++) { paquetes.push(base + (extras > 0 ? 1 : 0)); extras--; }
                }
            }

            const predefinedPackages = [];
            paquetes.forEach((qty, idx) => {
                const i = idx + 1;
                const numPaq = paquetes.length;
                const baseCodigo = `${form.partidaCodigo}${comp.sufijo||'_A'}_${i}_${numPaq}`;
                predefinedPackages.push({ 
                    id: Date.now() + Math.random() + i, piezaNombre: comp.descripcion.toUpperCase(), cantidad: qty, 
                    paqueteNum: i, paquetesDePieza: numPaq, talla: String(comp.talla || 'UNI').toUpperCase(), baseCodigo, codigoUnico: buildCodigoUnico(baseCodigo, form.color), 
                    codigoPrograma: (comp.codigoPrograma || '').toUpperCase(),
                    kitEligible: kitSetup.productionMode === 'KIT' && kitSetup.kitEligibleSizes.includes(String(comp.talla || 'UNI').toUpperCase()),
                    kitDisplayLabel: kitSetup.kitDefinition?.presentationBySize?.[String(comp.talla || 'UNI').toUpperCase()]?.displayLabel || '',
                    kitCompleteUnits: Number(kitSetup.kitDefinition?.presentationBySize?.[String(comp.talla || 'UNI').toUpperCase()]?.completeUnitsPerKit || 0),
                    finished: false, tejedor: '', fecha: '', defectos: '', agujas: '' 
                });
            });

            generatedDrafts.push({
                codigo: form.modelo.toUpperCase(), nombreModeloCliente: form.nombreModeloCliente.toUpperCase(),
                cliente: form.cliente.toUpperCase(), ordenCompra: form.ordenCompra.toUpperCase(), color: (form.color||'').toUpperCase(),
                maquina: maqKey, partida: form.partidaCodigo.toUpperCase(), subPiecesData, predefinedPackages,
                ...kitSetup,
                createdAt: new Date().toLocaleString('es-MX'), threading: threading.length ? threading : [emptyThread(), emptyThread()]
            });
        });
      });
      setDrafts(generatedDrafts);
      setShowVistaPrevia(true);
    } catch(err){ console.error(err); setErrorGenerar('Error al generar borradores: ' + (err && err.message ? err.message : String(err))); }
  };

  const handleCancelGeneration = () => { cancelGenerationRef.current = true; };

  const handleGeneratePDF = async () => {
      if (printModal.queue.length === 0) return;
      if (typeof window.jspdf === 'undefined') { alert('El generador de PDF no está disponible. Verifica tu conexión.'); return; }
      cancelGenerationRef.current = false; setIsGenerating(true);
      const pkgs = printModal.queue; setProgress({ current: 0, total: pkgs.length });
      const yieldToUI = () => new Promise(r => setTimeout(r, 0));

      try {
          await Promise.all([document.fonts.load('700 20px "Oswald"'), document.fonts.load('700 48px "Oswald"'), document.fonts.load('700 20px "Roboto Condensed"'), document.fonts.ready]).catch(() => {});
          const { jsPDF } = window.jspdf; let pdf = null; let failedCount = 0;
          for (let i = 0; i < pkgs.length; i++) {
              if (cancelGenerationRef.current) { alert(`Generación cancelada. Procesadas ${i} de ${pkgs.length}.`); break; }
              const pkg = pkgs[i];
              try {
                  const rawUrl = await fetchImageForPrint(pkg.codigo);
                  const printImgSrc = await processImageForPrint(rawUrl, 'grayscale', PRINT_IMG_BOX_W, PRINT_IMG_BOX_H, 4);
                  const canvas = pkg.jobType === 'KIT' ? await renderKitLabelToCanvas(pkg, printImgSrc) : await renderLabelToCanvas(pkg, printImgSrc);
                  const imgData = canvas.toDataURL('image/jpeg', 0.92); canvas.width = 0; canvas.height = 0;
                  if (!pdf) pdf = new jsPDF({ unit: 'in', format: [6, 4], orientation: 'landscape' }); else pdf.addPage([6, 4], 'landscape');
                  pdf.addImage(imgData, 'JPEG', 0, 0, 6, 4);
              } catch (pkgErr) { failedCount++; console.error('Falló la etiqueta:', pkgErr); }
              setProgress({ current: i + 1, total: pkgs.length }); await yieldToUI();
          }
          if (!cancelGenerationRef.current) {
              if (!pdf) { alert('No se generó ninguna etiqueta: todas fallaron.'); } else {
                  const safeTitle = printModal.title.replace(/[^a-z0-9]/gi, '_').toLowerCase();
                  pdf.save(`Etiquetas_${safeTitle}_${pkgs.length}pqt.pdf`);
                  if (failedCount > 0) alert(`PDF generado, pero ${failedCount} fallaron y se omitieron.`);
              }
          }
      } catch (err) { console.error(err); alert('Error al generar el PDF: ' + err.message);
      } finally { setIsGenerating(false); setProgress({ current: 0, total: 0 }); cancelGenerationRef.current = false; }
  };

  const saveAllDrafts = async (draftList = drafts) => {
    if (!Array.isArray(draftList) || draftList.length === 0) draftList = drafts;
    if (!Array.isArray(draftList) || draftList.length === 0) return;
    setSaving(true);
    try {
      const batch = db.batch();
      const preparedOrders = draftList.map((finalDraft, index) => {
        const newId = `${Date.now()}_${index}_${Math.random().toString(36).slice(2, 7)}`;
        return {
          id: newId, ref: db.collection('orders').doc(newId), finalDraft,
          displayId: generateSmartID(finalDraft.partida, finalDraft.subPiecesData, finalDraft.maquina),
          totalPedido: finalDraft.subPiecesData.reduce((a, b) => a + Number(b.totalPedido), 0),
          progreso: (finalDraft.predefinedPackages || []).map(pkg => ({ ...pkg }))
        };
      });

      const kitCandidates = {};
      preparedOrders.forEach(order => {
        order.progreso.forEach((pkg, packageIndex) => {
          if (!pkg.kitEligible) return;
          const talla = String(pkg.talla || 'UNI').toUpperCase();
          const presentation = order.finalDraft.kitDefinition?.presentationBySize?.[talla];
          if (!presentation) return;
          const key = [order.finalDraft.codigo, order.finalDraft.partida, talla, pkg.paqueteNum, pkg.paquetesDePieza].join('|');
          if (!kitCandidates[key]) kitCandidates[key] = { key, modelo: order.finalDraft.codigo, partida: order.finalDraft.partida, cliente: order.finalDraft.cliente, color: order.finalDraft.color, talla, presentation, members: [] };
          kitCandidates[key].members.push({ order, packageIndex, pkg });
        });
      });

      const autoKits = [];
      Object.values(kitCandidates).forEach(candidate => {
        const expectedPieces = Object.values(preparedOrders)
          .flatMap(order => order.finalDraft.kitDefinition?.sizes || [])
          .find(size => size.talla === candidate.talla)?.piezas || [];
        const selectedByPiece = {};
        candidate.members.forEach(member => {
          const pieceName = String(member.pkg.piezaNombre || '').toUpperCase();
          if (expectedPieces.includes(pieceName) && !selectedByPiece[pieceName]) selectedByPiece[pieceName] = member;
        });
        if (!expectedPieces.length || !expectedPieces.every(piece => selectedByPiece[piece])) return;
        const members = expectedPieces.map(piece => selectedByPiece[piece]);
        const referenceMember = members[0];
        const kitId = `KIT_${candidate.partida}_${candidate.talla}_${referenceMember.pkg.paqueteNum}_${Math.random().toString(36).slice(2, 7)}`.replace(/[^A-Z0-9_]/gi, '').toUpperCase();
        const kitNumber = kitId.replace(/^KIT_/, '');
        const refPieceData = referenceMember.order.finalDraft.subPiecesData.find(piece => String(piece.pieza || '').toUpperCase() === String(referenceMember.pkg.piezaNombre || '').toUpperCase()) || {};
        // "X {LABEL} COMPLETAS" = referencia del modelo (lo que trae cada KIT/paquete, según Modelos).
        const completeUnitsPerKit = Number(candidate.presentation.completeUnitsPerKit || 0);
        // "TOTAL ORDEN" = el valor real que se escribió en "Productos Completos" al configurar, guardado tal cual (no recalculado).
        const totalOrdenReal = Number(refPieceData.kitTotalOrden) || completeUnitsPerKit;
        const kitPackageNumber = Math.max(1, Number(referenceMember.pkg.paqueteNum || 1) || 1);
        const kitPackageTotal = Math.max(kitPackageNumber, Number(referenceMember.pkg.paquetesDePieza || kitPackageNumber) || kitPackageNumber);
        const componentDetails = members.map(member => {
          const pieceData = member.order.finalDraft.subPiecesData.find(piece => String(piece.pieza || '').toUpperCase() === String(member.pkg.piezaNombre || '').toUpperCase()) || {};
          const unitWeightGrams = Number(String(pieceData.peso || 0).replace(',', '.')) || 0;
          return { member, unitWeightGrams, packageWeightGrams: unitWeightGrams * Number(member.pkg.cantidad || 0) };
        });
        const kitWeightGrams = componentDetails.reduce((sum, detail) => sum + detail.packageWeightGrams, 0);
        members.forEach((member, memberIndex) => {
          member.order.progreso[member.packageIndex] = {
            ...member.order.progreso[member.packageIndex],
            agrupado: true,
            kitRef: kitId,
            kitCode: kitNumber,
            kitStatus: 'LISTO_CONFECCION',
            kitDisplayLabel: candidate.presentation.displayLabel,
            kitCompleteUnits: completeUnitsPerKit,
            kitPackageNumber,
            kitPackageTotal,
            kitPrimaryRecord: memberIndex === 0
          };
        });
        autoKits.push({ kitId, kitNumber, ...candidate, members, componentDetails, kitWeightGrams, completeUnitsPerKit, totalOrdenReal, kitPackageNumber, kitPackageTotal });
      });

      preparedOrders.forEach(order => {
        batch.set(order.ref, {
          ...order.finalDraft,
          id: order.id,
          displayId: order.displayId,
          progreso: order.progreso,
          status: 'EN PROCESO',
          totalPedido: order.totalPedido,
          kitRefs: order.progreso.filter(pkg => pkg.kitRef).map(pkg => pkg.kitRef)
        });
      });

      autoKits.forEach(kit => {
        batch.set(db.collection('kits_datos').doc(kit.kitId), {
          kitId: kit.kitId,
          kitNumber: kit.kitNumber,
          modelo: kit.modelo,
          partida: kit.partida,
          cliente: kit.cliente,
          color: kit.color,
          talla: kit.talla,
          status: 'LISTO_CONFECCION',
          requiresManualGrouping: false,
          componentCount: kit.members.length,
          componentPackageCodes: kit.members.map(member => member.pkg.codigoUnico),
          orderIds: [...new Set(kit.members.map(member => member.order.id))],
          displayLabel: kit.presentation.displayLabel,
          completeUnitsPerKit: kit.completeUnitsPerKit,
          displayQuantity: kit.completeUnitsPerKit,
          totalOrdenReal: kit.totalOrdenReal,
          packageNumber: kit.kitPackageNumber,
          packageTotal: kit.kitPackageTotal,
          kitWeightGrams: kit.kitWeightGrams,
          twoPackageWeightGrams: kit.kitWeightGrams * 2,
          piezas: kit.componentDetails.map((detail, index) => ({ codigoUnico: detail.member.pkg.codigoUnico, paqueteNum: detail.member.pkg.paqueteNum, cantidad: detail.member.pkg.cantidad, piezaNombre: detail.member.pkg.piezaNombre, codigoPrograma: detail.member.pkg.codigoPrograma || detail.member.order.finalDraft.subPiecesData.find(piece => String(piece.pieza || '').toUpperCase() === String(detail.member.pkg.piezaNombre || '').toUpperCase())?.codigoPrograma || '', orderId: detail.member.order.id, maquinaOriginal: detail.member.order.finalDraft.maquina, unitWeightGrams: detail.unitWeightGrams, packageWeightGrams: detail.packageWeightGrams, isPrimaryRecord: index === 0 })),
          createdAt: FieldValue.serverTimestamp(),
          createdAtISO: new Date().toISOString()
        });
      });

      await batch.commit();

      const kitPackageCodes = new Set(autoKits.flatMap(kit => kit.members.map(member => member.pkg.codigoUnico)));
      const printQueue = autoKits.map(kit => ({
        jobType: 'KIT',
        packageCode: kit.kitNumber,
        codigo: kit.modelo,
        cliente: kit.cliente,
        partida: kit.partida,
        color: kit.color,
        talla: kit.talla,
        displayLabel: kit.presentation.displayLabel,
        displayQuantity: kit.completeUnitsPerKit,
        totalOrder: kit.totalOrdenReal || kit.members[0]?.order?.totalPedido || 0,
        packageNumber: kit.kitPackageNumber,
        packageTotal: kit.kitPackageTotal,
        kitWeightGrams: kit.kitWeightGrams,
        twoPackageWeightGrams: kit.kitWeightGrams * 2,
        components: kit.componentDetails.map(detail => ({ piezaNombre: detail.member.pkg.piezaNombre, cantidad: detail.member.pkg.cantidad, maquina: detail.member.order.finalDraft.maquina, codigoPrograma: detail.member.pkg.codigoPrograma || detail.member.order.finalDraft.subPiecesData.find(piece => String(piece.pieza || '').toUpperCase() === String(detail.member.pkg.piezaNombre || '').toUpperCase())?.codigoPrograma || '', packageWeightGrams: detail.packageWeightGrams }))
      }));
      preparedOrders.forEach(order => order.progreso.filter(pkg => !kitPackageCodes.has(pkg.codigoUnico)).forEach(pkg => {
        printQueue.push({ jobType: 'STANDARD', ...pkg, codigo: order.finalDraft.codigo, cliente: order.finalDraft.cliente, partida: order.finalDraft.partida, color: order.finalDraft.color, maquina: order.finalDraft.maquina, totalPedido: order.totalPedido, tiempo: order.finalDraft.subPiecesData.find(sp => sp.pieza === pkg.piezaNombre)?.tiempo || 0, peso: order.finalDraft.subPiecesData.find(sp => sp.pieza === pkg.piezaNombre)?.peso || '-', talla: pkg.talla || 'U', piecesInPackage: pkg.cantidad, displayPackageId: `${pkg.paqueteNum}/${pkg.paquetesDePieza}`, packageCode: pkg.codigoUnico, productionMode: order.finalDraft.productionMode, kitEligible: Boolean(pkg.kitEligible) });
      }));

      closeScreen();
      setPrintModal({ isOpen: true, queue: printQueue, title: form.partidaCodigo });
    } catch(e) { console.error(e); alert('Error al guardar órdenes: ' + (e && e.message ? e.message : String(e))); }
    setSaving(false);
  };

  return (
    <div className="p-3 lg:p-4 w-full mx-auto relative flex flex-col h-full">
      
      {plantillaSeleccionadaModal && (
        <PlantillaConfigModal plantilla={plantillaSeleccionadaModal} onClose={closeScreen} onConfirm={(...args) => { closeScreen(); handleConfirmarConfigPlantilla(...args); }} />
      )}

      {showVistaPrevia && drafts && (
        <VistaPreviaModal drafts={drafts} onClose={closeScreen} onSaveAll={saveAllDrafts} />
      )}

      {printModal.isOpen && (
        <PrintModalComponent printModal={printModal} isGenerating={isGenerating} progress={progress} handleGeneratePDF={handleGeneratePDF} handleCancelGeneration={handleCancelGeneration} closeFull={() => window.location.reload()} />
      )}

      {remainderInfo && (
        <div className="fixed inset-0 bg-black/80 z-[100] flex items-center justify-center p-4 backdrop-blur-sm">
           <div className="bg-ios-card w-full max-w-sm rounded-[2rem] border border-ios-border p-6 shadow-2xl">
              <div className="flex justify-center mb-4 text-[#ff9f0a]"><Icon name="alert-triangle" size={40} /></div>
              <h3 className="text-xl font-bold text-white text-center mb-2">Residuo de Paquetes</h3>
              <p className="text-sm text-ios-muted text-center mb-6">Algunas piezas no se dividen exactamente. ¿Cómo deseas ajustar el residuo en los paquetes?</p>
              <div className="space-y-3">
                   <button onClick={() => { closeScreen(); executeGenerar('LAST'); }} className="w-full text-left p-4 rounded-xl bg-ios-input hover:bg-[#38383a] border border-ios-border"><div className="font-bold text-white text-sm">Asignar al último paquete</div><div className="text-xs text-ios-muted mt-1">Ej: 100, 100, 9 <span className="float-right text-ios-blue">Por defecto</span></div></button>
                   <button onClick={() => { closeScreen(); executeGenerar('EQUAL'); }} className="w-full text-left p-4 rounded-xl bg-ios-input hover:bg-[#38383a] border border-ios-border"><div className="font-bold text-white text-sm">Repartir en todos</div><div className="text-xs text-ios-muted mt-1">Ej: 70, 70, 69</div></button>
                   <button onClick={() => { closeScreen(); executeGenerar('REDUCE'); }} className="w-full text-left p-4 rounded-xl bg-ios-input hover:bg-[#38383a] border border-ios-border"><div className="font-bold text-white text-sm">Eliminar último y repartir</div><div className="text-xs text-ios-muted mt-1">Ej: 105, 104</div></button>
                   <button onClick={closeScreen} className="w-full text-center p-4 rounded-xl text-ios-red font-bold mt-2 hover:bg-ios-red/10 transition-colors">Cancelar</button>
              </div>
           </div>
        </div>
      )}

      {showPlantillas && (
        <div className="fixed inset-0 bg-black/80 z-[100] flex flex-col backdrop-blur-md">
          <div className="p-4 flex flex-col gap-3 border-b border-ios-border bg-ios-bg safe-top">
            <div className="flex justify-between items-center">
              <div className="flex items-center gap-2">
                <Icon name="folder" size={20} className="text-ios-blue"/> 
                <h2 className="text-lg font-bold text-white">Directorio de Modelos</h2>
              </div>
              <button onClick={closeScreen} className="text-ios-blue font-bold px-3 py-1 bg-ios-blue/10 rounded-full">Cerrar</button>
            </div>
            
            <div className="flex flex-col sm:flex-row gap-2 items-center">
                <div className="relative flex-1 w-full">
                  <div className="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-ios-muted"><Icon name="search" size={14}/></div>
                  <input type="text" value={busquedaPlantilla} onChange={e => { setBusquedaPlantilla(e.target.value); setFolderPath([]); }} placeholder="Buscar por modelo o cliente en toda la base..." className="w-full pl-9 pr-4 py-2 bg-ios-input rounded-xl text-sm text-white border border-ios-border outline-none focus:border-ios-blue transition-colors" />
                </div>
                <div className="flex bg-black rounded-lg p-1 border border-ios-border shrink-0 w-full sm:w-auto">
                    <button onClick={() => setTemplateViewMode('list')} className={`flex-1 sm:flex-none p-1.5 rounded-md flex items-center justify-center ${templateViewMode === 'list' ? 'bg-[#38383a] text-white' : 'text-ios-muted hover:text-white'}`}><Icon name="list" size={16}/></button>
                    <button onClick={() => setTemplateViewMode('grid')} className={`flex-1 sm:flex-none p-1.5 rounded-md flex items-center justify-center ${templateViewMode === 'grid' ? 'bg-[#38383a] text-white' : 'text-ios-muted hover:text-white'}`}><Icon name="grid-10" size={16}/></button>
                    <button onClick={() => setTemplateViewMode('mosaic')} className={`flex-1 sm:flex-none p-1.5 rounded-md flex items-center justify-center ${templateViewMode === 'mosaic' ? 'bg-[#38383a] text-white' : 'text-ios-muted hover:text-white'}`}><Icon name="layout-grid" size={16}/></button>
                </div>
            </div>

            {!busquedaPlantilla && (
                <div className="flex items-center gap-1 text-xs font-bold text-ios-muted py-1 overflow-x-auto hide-scrollbar whitespace-nowrap">
                    <button onClick={() => setFolderPath([])} className="hover:text-white transition flex items-center gap-1"><Icon name="folder" size={12}/> Raíz</button>
                    {folderPath.map((segment, index) => (
                        <div key={index} className="flex items-center gap-1">
                            <span className="mx-1">/</span>
                            <button onClick={() => setFolderPath(folderPath.slice(0, index + 1))} className={`hover:text-white transition ${index === folderPath.length - 1 ? 'text-ios-blue' : ''}`}>{segment}</button>
                        </div>
                    ))}
                </div>
            )}
          </div>

          <div className="flex-1 overflow-y-auto p-4 pb-10 safe-bottom">
             {busquedaPlantilla ? (
                 <div className="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 xl:grid-cols-6 gap-3">
                     {plantillasFiltradas.length === 0 ? <div className="col-span-full text-center text-ios-muted mt-10">Sin resultados</div> : plantillasFiltradas.map(p => (
                         <div key={p.codigo} onClick={() => selectPlantilla(p)} className="bg-ios-card rounded-2xl overflow-hidden border border-ios-border cursor-pointer flex flex-col active:scale-95 transition-transform hover:border-ios-blue shadow-lg">
                            <div className="aspect-[3/4] bg-black w-full border-b border-ios-border relative"><SmartImage codigo={p.codigo} className="w-full h-full object-cover absolute inset-0" /></div>
                            <div className="p-2.5 bg-[#1c1c1e]"><div className="font-black text-white text-xs truncate uppercase">{p.codigo}</div><div className="text-[9px] text-ios-muted truncate">{p.cliente}</div></div>
                         </div>
                     ))}
                 </div>
             ) : (
                 <>
                     {folderPath.length === 0 || folderPath.length === 1 && folderData[0]?.type === 'chunk' ? (
                         <div className="grid grid-cols-2 sm:grid-cols-4 md:grid-cols-6 lg:grid-cols-8 gap-4">
                             {folderPath.length > 0 && <button onClick={() => setFolderPath(folderPath.slice(0, -1))} className="bg-black/50 rounded-2xl p-4 border border-ios-border flex flex-col items-center justify-center hover:bg-[#1c1c1e] transition-colors"><Icon name="chevron-left" size={32} className="text-ios-muted mb-2"/><span className="text-xs font-bold text-white">Volver</span></button>}
                             {folderData.map((f, i) => (
                                 <div key={i} onClick={() => setFolderPath([...folderPath, f.type === 'folder' ? f.name : f.chunkIndex])} className="bg-ios-card rounded-2xl p-4 border border-ios-border flex flex-col items-center justify-center cursor-pointer hover:border-ios-blue transition-colors text-center active:scale-95">
                                     <Icon name="folder" size={40} className="text-ios-blue mb-2 drop-shadow-md"/>
                                     <span className="text-xs font-black text-white truncate w-full">{f.name}</span>
                                     <span className="text-[10px] text-ios-muted mt-1">{f.count} modelos</span>
                                 </div>
                             ))}
                         </div>
                     ) : (
                         <div>
                             {folderPath.length > 0 && <button onClick={() => setFolderPath(folderPath.slice(0, -1))} className="mb-4 text-xs font-bold bg-ios-input px-4 py-2 rounded-xl text-white border border-ios-border hover:border-ios-blue transition flex items-center gap-2 w-max"><Icon name="chevron-left" size={14}/> Volver</button>}
                             
                             {templateViewMode === 'list' && (
                                 <div className="space-y-2">
                                     {folderData.map((m, i) => (
                                         <div key={i} onClick={() => selectPlantilla(m.data)} className="bg-ios-card rounded-xl p-3 border border-ios-border flex items-center justify-between cursor-pointer hover:border-ios-blue transition-colors">
                                             <div className="flex flex-col">
                                                 <span className="font-black text-white">{m.data.codigo}</span>
                                                 <span className="text-xs text-ios-muted">{m.data.cliente}</span>
                                             </div>
                                             <span className="text-xs bg-ios-input px-2 py-1 rounded-md text-ios-muted font-mono">{m.data.subPiecesData?.length || 0} pzs</span>
                                         </div>
                                     ))}
                                 </div>
                             )}

                             {templateViewMode === 'grid' && (
                                 <div className="grid grid-cols-5 md:grid-cols-10 gap-2">
                                     {folderData.map((m, i) => (
                                         <div key={i} onClick={() => selectPlantilla(m.data)} className="bg-ios-card rounded-xl overflow-hidden border border-ios-border cursor-pointer active:scale-95 transition-transform hover:border-ios-blue">
                                            <div className="aspect-[3/4] bg-black w-full relative"><SmartImage codigo={m.data.codigo} className="w-full h-full object-cover absolute inset-0" /></div>
                                            <div className="p-1 bg-[#1c1c1e] text-center"><div className="font-black text-white text-[9px] truncate">{m.data.codigo}</div></div>
                                         </div>
                                     ))}
                                 </div>
                             )}

                             {templateViewMode === 'mosaic' && (
                                 <div className="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 xl:grid-cols-6 gap-3">
                                     {folderData.map((m, i) => (
                                         <div key={i} onClick={() => selectPlantilla(m.data)} className="bg-ios-card rounded-2xl overflow-hidden border border-ios-border cursor-pointer flex flex-col active:scale-95 transition-transform hover:border-ios-blue shadow-lg">
                                            <div className="aspect-[3/4] bg-black w-full border-b border-ios-border relative"><SmartImage codigo={m.data.codigo} className="w-full h-full object-cover absolute inset-0" /></div>
                                            <div className="p-2.5 bg-[#1c1c1e]"><div className="font-black text-white text-xs truncate uppercase">{m.data.codigo}</div><div className="text-[9px] text-ios-muted truncate">{m.data.cliente}</div></div>
                                         </div>
                                     ))}
                                 </div>
                             )}
                         </div>
                     )}
                 </>
             )}
          </div>
        </div>
      )}

      <div className="flex flex-col lg:flex-row gap-4 lg:gap-6 items-start w-full">
        <div className="w-full lg:w-[280px] xl:w-[320px] shrink-0 flex flex-col gap-4 lg:gap-5 lg:sticky lg:top-16 z-10">
          <div className="bg-ios-card rounded-2xl border border-ios-border p-4 shadow-xl">
            <SectionHeader title="Datos Generales" />
            
            <div className="space-y-3">
              <div className="relative">
                <label className="text-[9px] font-semibold text-ios-muted ml-0.5 mb-1 flex justify-between items-center uppercase tracking-wide">
                  <span>Modelo</span>
                  <button onClick={() => setShowPlantillas(true)} className="text-ios-blue normal-case flex items-center gap-1 bg-ios-blue/10 px-1.5 py-0.5 rounded"><Icon name="folder" size={10}/> Ver Plantillas</button>
                </label>
                <input value={form.modelo} onChange={e=>{ setForm({...form,modelo:e.target.value.toUpperCase()}); setModelSearchOpen(e.target.value.length>1); }} onFocus={()=>form.modelo.length>1 && setModelSearchOpen(true)} className="w-full p-2 rounded-xl font-bold uppercase text-sm" placeholder="Ej. O900" />
                {modelSearchOpen && plantillas.filter(p => p.codigo.includes(form.modelo)).length > 0 && (
                   <div className="absolute z-50 bg-ios-input border border-ios-border shadow-2xl w-full max-h-48 overflow-y-auto mt-1 rounded-xl">
                     {plantillas.filter(p => p.codigo.includes(form.modelo)).map(p => (
                       <div key={p.codigo} onClick={() => { selectPlantilla(p); setModelSearchOpen(false); }} className="p-2 hover:bg-white/5 cursor-pointer border-b border-ios-border/50 flex items-center gap-2">
                          <div className="w-8 h-8 bg-black rounded overflow-hidden shrink-0 border border-[#38383a] relative"><SmartImage codigo={p.codigo} className="w-full h-full object-cover absolute inset-0" /></div>
                          <div><div className="font-bold text-white text-[11px]">{p.codigo}</div><div className="text-[9px] text-ios-muted">{p.cliente}</div></div>
                       </div>
                     ))}
                   </div>
                )}
              </div>
              
              {form.modelo && (
                <div className="bg-ios-input border border-ios-border rounded-xl p-2">
                  <label className="text-[9px] font-semibold text-ios-muted mb-1.5 flex items-center gap-1 uppercase">Referencia Visual</label>
                  <div className="h-32 bg-[#000000] rounded-lg overflow-hidden border border-ios-border relative">
                    <SmartImage codigo={form.modelo} className="h-full w-full object-cover absolute inset-0"/>
                  </div>
                </div>
              )}

              <div className="grid grid-cols-1 gap-2.5">
                <div><label className="text-[9px] font-semibold text-ios-muted ml-0.5 mb-1 block uppercase tracking-wide">Nombre del Modelo (Cliente)</label><input value={form.nombreModeloCliente} onChange={e=>setForm({...form,nombreModeloCliente:e.target.value.toUpperCase()})} placeholder="Opcional" className="w-full p-2 rounded-xl font-bold uppercase text-white text-xs bg-black-20-override border-ios-border"/></div>
                <div><label className="text-[9px] font-semibold text-ios-muted ml-0.5 mb-1 block uppercase tracking-wide">Cliente</label><input value={form.cliente} onChange={e=>setForm({...form,cliente:e.target.value.toUpperCase()})} className="w-full p-2 rounded-xl font-bold uppercase text-white text-xs"/></div>
                <div><label className="text-[9px] font-semibold text-ios-blue ml-0.5 mb-1 block uppercase tracking-wide">Orden de Compra (OC)</label><input value={form.ordenCompra} onChange={e=>setForm({...form,ordenCompra:e.target.value.toUpperCase()})} placeholder="Ej. PO-9821" className="w-full p-2 border-ios-blue/30 focus:border-ios-blue bg-ios-blue/5 rounded-xl font-bold uppercase text-white text-xs"/></div>
                <div><label className="text-[9px] font-semibold text-ios-blue ml-0.5 mb-1 block uppercase tracking-wide">Color Producción</label><input value={form.color} onChange={e=>setForm({...form,color:e.target.value.toUpperCase()})} placeholder="Ej. ROJO" className="w-full p-2 border-ios-blue/30 focus:border-ios-blue bg-ios-blue/5 rounded-xl font-bold uppercase text-white text-xs"/></div>
              </div>

              <div className="pt-3 border-t border-ios-border mt-1">
                <label className="text-[9px] font-semibold text-ios-muted ml-0.5 mb-1 block uppercase tracking-wide">Asignación de Partida</label>
                <div className="flex flex-col gap-2 items-start">
                  <select value={form.selectedMonth} onChange={(e) => setForm(prev=>({...prev, selectedMonth:e.target.value, partidaCodigo:''}))} className="w-full p-2 rounded-xl font-bold text-xs">
                    <option value="">-- Mes --</option>
                    {mesesProximos.map(mes => (<option key={mes.value} value={mes.value}>{mes.label}</option>))}
                  </select>
                  {form.selectedMonth && (
                    <div className="flex-1 flex flex-col items-center gap-2 w-full bg-ios-input p-2 rounded-xl border border-ios-border">
                      <div className="flex-1 flex flex-wrap gap-1.5 items-center w-full">
                        <span className="text-[8px] text-ios-muted uppercase font-bold mr-0.5 w-full">Disponibles / Ocupadas:</span>
                        {form.partidasExistentes.length === 0 ? <span className="text-[9px] text-ios-muted block w-full text-center my-1">Ninguna en este mes</span> : form.partidasExistentes.map(p => (<button key={p} onClick={() => setForm(prev => ({...prev, partidaCodigo: p}))} className={`text-[9px] px-1.5 py-1 rounded font-mono transition-colors border ${form.partidaCodigo === p ? 'bg-ios-blue text-white border-ios-blue' : 'bg-[#38383a] text-white border-[#38383a] hover:border-ios-blue/50'}`} title="Clic para añadir complementos a esta partida">{p}</button>))}
                      </div>
                      <button onClick={handleCrearNuevaPartida} className="w-full py-1.5 px-2 mt-1 rounded-lg bg-ios-blue text-white font-bold text-[10px] flex justify-center items-center gap-1"><Icon name="plus" size={12}/> Generar Siguiente Nueva</button>
                    </div>
                  )}
                </div>
                {form.partidaCodigo && (<div className="mt-2 p-1.5 bg-ios-green/10 border border-ios-green/30 rounded-lg text-center flex flex-col"><span className="text-[10px] text-ios-green font-medium">Partida Seleccionada: <strong className="font-mono text-xs ml-0.5">{form.partidaCodigo}</strong></span></div>)}
              </div>
            </div>
          </div>

          <div className="bg-ios-card rounded-2xl border border-ios-border p-4 shadow-xl hidden lg:block">
            <SectionHeader title="Enhebrado Base (Global)" />
            <ThreadingList threading={threading} setThreading={setThreading} inventory={inventory}/>
          </div>
        </div>

        <div className="flex-1 w-full min-w-0 flex flex-col relative">
          <SectionHeader title="Configuración de Piezas" />
          
          <div className="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 2xl:grid-cols-4 gap-4 items-start w-full">
            {components.map((item, idx) => {
              const upperTalla = (item.talla || '').toUpperCase();
              const colorIdx = tallasUnicas.indexOf(upperTalla);
              const bgTone = colorIdx === -1 ? bgColors[0] : bgColors[colorIdx % bgColors.length];
              const lockQty = selectedModelKitSetup.productionMode === 'KIT' && selectedModelKitSetup.kitEligibleSizes.includes(upperTalla);
              return <PieceCard key={item.id} comp={item} idx={idx} onChange={updateComp} onRemove={removeComp} bgTone={bgTone} lockQty={lockQty} />
            })}
          </div>
          {selectedModelKitSetup.productionMode === 'KIT' && components.some(c => selectedModelKitSetup.kitEligibleSizes.includes((c.talla || '').toUpperCase())) && (
            <div className="text-[10px] text-ios-green/80 font-bold flex items-center gap-1.5 -mt-2 mb-2"><Icon name="check-circle" size={12}/> Cantidades bloqueadas: ya se definieron por talla al configurar el KIT.</div>
          )}

          <div className="bg-ios-card rounded-2xl border border-ios-border p-4 shadow-xl mt-6 lg:hidden">
            <SectionHeader title="Enhebrado Base (Global)" />
            <ThreadingList threading={threading} setThreading={setThreading} inventory={inventory}/>
          </div>
          
          <div className="h-40 pointer-events-none w-full shrink-0"></div>

          {errorGenerar && (
            <div className="fixed bottom-28 z-40 left-4 right-4 lg:left-auto lg:right-6 lg:w-[calc(100%-320px-3.5rem)] bg-ios-red/15 border border-ios-red/50 text-ios-red text-xs font-bold p-3 rounded-2xl flex items-start justify-between gap-3 shadow-xl">
              <span className="flex items-start gap-2"><Icon name="alert-triangle" size={16} className="shrink-0 mt-0.5"/> {errorGenerar}</span>
              <button onClick={() => setErrorGenerar('')} className="shrink-0 text-ios-red/70 hover:text-ios-red"><Icon name="x" size={14}/></button>
            </div>
          )}

          <div className="fixed bottom-4 z-40 left-4 right-4 lg:left-auto lg:right-6 lg:w-[calc(100%-320px-3.5rem)] flex flex-col lg:flex-row justify-between gap-3 bg-ios-bg/90 backdrop-blur-xl rounded-[1.2rem] border border-ios-border/60 p-3 shadow-[0_15px_40px_-10px_rgba(0,0,0,0.8)]">
            <div className="flex gap-2 w-full lg:w-auto overflow-x-auto hide-scrollbar">
                <button onClick={()=>setComponents([...components, emptyComp()])} className="shrink-0 px-4 py-3 bg-[#2c2c2e]/90 text-white border border-ios-border border-dashed rounded-xl font-bold text-[11px] lg:text-xs hover:bg-[#38383a] transition-colors flex justify-center items-center gap-1.5"><Icon name="plus" size={14}/> Pieza individual</button>
                <button onClick={handleAddTallaGlobal} className="shrink-0 px-4 py-3 bg-ios-blue/10 text-ios-blue border border-ios-blue/30 rounded-xl font-bold text-[11px] lg:text-xs hover:bg-ios-blue/20 transition-colors flex justify-center items-center gap-1.5"><Icon name="plus" size={14}/> Nueva Talla</button>
                <button onClick={handleAddMaquinaGlobal} className="shrink-0 px-4 py-3 bg-ios-green/10 text-ios-green border border-ios-green/30 rounded-xl font-bold text-[11px] lg:text-xs hover:bg-ios-green/20 transition-colors flex justify-center items-center gap-1.5"><Icon name="plus" size={14}/> Añadir Máquina</button>
            </div>
            <div className="flex gap-2 w-full lg:w-auto shrink-0 pt-2 lg:pt-0 border-t lg:border-t-0 border-ios-border/50 lg:border-none">
                <button disabled={saving} onClick={handleGuardarPlantilla} className="w-[125px] lg:w-[130px] shrink-0 py-3 bg-[#2c2c2e]/90 hover:bg-[#38383a] text-ios-blue rounded-xl font-bold text-[10px] lg:text-xs transition-transform active:scale-[0.98] border border-ios-border shadow-md flex flex-col justify-center items-center disabled:opacity-50"><Icon name="save" size={16} className="mb-0.5" /> Guardar Plantilla</button>
                <button disabled={saving} onClick={checkGenerar} className="flex-1 lg:w-[180px] py-3 bg-ios-blue/90 hover:bg-[#0070e0] text-white rounded-xl font-bold text-sm transition-transform active:scale-[0.98] border border-white/20 shadow-md flex justify-center items-center disabled:opacity-50">Generar Borradores</button>
            </div>
          </div>
        </div>
      </div>
    </div>
  );
};

const App = () => {
  const [inventory, setInventory] = useState([]);
  useEffect(() => { const u = db.collection('inventory').doc('main').onSnapshot(d => setInventory(d.exists && d.data().items ? d.data().items : [])); return () => u(); }, []);
  return (
    <div className="min-h-screen flex flex-col overflow-hidden">
      <div className="app-nav safe-top shrink-0"><div className="flex items-center justify-between h-10 lg:h-12 px-4"><div className="w-16"></div><h1 className="text-sm lg:text-base">Nueva Orden</h1><div className="w-16"></div></div></div>
      <div className="flex-1 overflow-y-auto"><NewOrderScreen inventory={inventory} /></div>
    </div>
  );
};

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
</script>
</body>
</html>
