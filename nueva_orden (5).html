const DEFAULT_IMAGE_REPO = 'https://raw.githubusercontent.com/sweaters-liliana/MAES2O26/refs/heads/main/IMAGENES/';

// Constantes Etiquetas
const SHIFT_HOURS = 12;

const PRINT_IMG_BOX_H = 336;

(function(){
  const manifest = {
    name: "Cirineo · Nueva Orden", short_name: "Nueva Orden",

// Iconos mapeados y actualizados
const Icon = ({ name, size = 18, className = '' }) => {
    const emojiMap = { 
        'alert-triangle':'⚠️', 'check':'✓', 'check-circle':'✅', 'cpu':'🧠', 'eye':'👁️',

        'trash-2':'🗑️', 'upload-cloud':'☁️', 'x':'✕', 'folder':'📁', 'list':'📄',

    return <span className={`inline-flex items-center justify-center select-none ${className || ''}`} style={{ fontSize: `${size}px`, lineHeight: 1 }}>{emojiMap[name] || '•'}</span>;

const Spinner = ({ size = 5 }) => (
    <div className={`w-${size} h-${size} border-2 border-slate-300 border-t-indigo-600 rounded-full animate-spin inline-block`}></div>
);

// Utilidades impresión
const withTimeout = (promise, ms, fallbackValue = null) => {
    return new Promise((resolve) => {
        let settled = false;
        const timer = setTimeout(() => {
            if (!settled) { settled = true; resolve(fallbackValue); }
        }, ms);
        promise.then((v) => {
            if (!settled) { settled = true; clearTimeout(timer); resolve(v); }
        }).catch(() => {
            if (!settled) { settled = true; clearTimeout(timer); resolve(fallbackValue); }
        });
    });
};

const probeImageUrl = (baseUrl, codigo, ext) => withTimeout(new Promise((resolve) => {
    const url = `${baseUrl}${codigo}${ext}`;
    const img = new Image();
    img.onload = () => resolve(url);
    img.onerror = () => resolve(null);
    img.src = url;
}), IMAGE_FETCH_TIMEOUT_MS, null);

const fetchImageForPrint = async (codigo) => {
    if (!codigo) return null;
    try {
        const doc = await withTimeout(db.collection('imagenes_editadas').doc(codigo).get(), IMAGE_FETCH_TIMEOUT_MS, null);
        if (doc && doc.exists && doc.data().localImage) return doc.data().localImage;
    } catch (e) { }
    
    const base = DEFAULT_IMAGE_REPO.endsWith('/') ? DEFAULT_IMAGE_REPO : DEFAULT_IMAGE_REPO + '/';
    const exts = ['.jpg', '.png', '.jpeg', '.webp'];
    for (const ext of exts) {
        const url = await probeImageUrl(base, codigo, ext);
        if (url) return url;
    }
    return null;
};

const processImageForPrint = (url, mode, boxW, boxH, scale = 3) => withTimeout(new Promise((resolve) => {
    if (!url) return resolve(null);
    const img = new Image();
    img.crossOrigin = 'anonymous';
    img.onload = () => {
        let canvas = null;
        try {
            canvas = document.createElement('canvas');
            const imgW = Math.round(boxW * scale);
            const imgH = Math.round(boxH * scale);
            canvas.width = imgW;
            canvas.height = imgH;
            const ctx = canvas.getContext('2d', { willReadFrequently: true });
            const boxRatio = imgW / imgH, natRatio = img.naturalWidth / img.naturalHeight;
            let sw = img.naturalWidth, sh = img.naturalHeight;
            if (natRatio > boxRatio) { sw = img.naturalHeight * boxRatio; } else { sh = img.naturalWidth / boxRatio; }
            const sx = (img.naturalWidth - sw) / 2, sy = (img.naturalHeight - sh) / 2;
            ctx.drawImage(img, sx, sy, sw, sh, 0, 0, imgW, imgH);
            let result;
            if (mode === 'color') {
                result = canvas.toDataURL('image/jpeg', 0.92);
            } else {
                const imageData = ctx.getImageData(0, 0, imgW, imgH);
                const data = imageData.data;
                for (let i = 0; i < data.length; i += 4) {
                    const gray = 0.299 * data[i] + 0.587 * data[i + 1] + 0.114 * data[i + 2];
                    let val = mode === 'threshold' ? (gray < 128 ? 0 : 255) : gray;
                    data[i] = val; data[i + 1] = val; data[i + 2] = val;
                }
                ctx.putImageData(imageData, 0, 0);
                result = canvas.toDataURL('image/jpeg', 0.92);
            }
            resolve(result);
        } catch (e) { resolve(null); } finally { if (canvas) { canvas.width = 0; canvas.height = 0; } }
    };
    img.onerror = () => resolve(null);
    img.src = url;
}), IMAGE_FETCH_TIMEOUT_MS, null);

// =================== LOGICA DE ETIQUETAS INDIVIDUALES Y KITS (CANVAS) =================== //

const renderLabelToCanvas = async (p, processImgSrc) => {
    const truncateToWidth = (ctx, text, maxWidth) => { 
        text = String(text ?? ''); 
        if (ctx.measureText(text).width <= maxWidth) return text; 
        let lo = 0, hi = text.length; 
        while (lo < hi) { 
            const mid = Math.ceil((lo + hi) / 2); 
            const candidate = text.slice(0, mid) + '…'; 
            if (ctx.measureText(candidate).width <= maxWidth) lo = mid; else hi = mid - 1; 
        } 
        return text.slice(0, lo) + '…'; 
    };
    const drawLabelCell = (ctx, { x, y, w, h, title, value, titleColor = '#555555', titleSize = 40, valueFont, valueColor = '#000000', valueSize = 56, align = 'left', truncate = false, padX = 16 }) => {
        const innerX = x + padX, innerW = Math.max(0, w - padX * 2);
        ctx.textBaseline = 'alphabetic';
        const titleH = title ? titleSize * 1.15 : 0, gap = title ? titleSize * 0.25 : 0, valueH = valueSize * 1.05;
        let cursorY = y + (h - (titleH + gap + valueH)) / 2; if (cursorY < y) cursorY = y;
        const tx = align === 'center' ? x + w / 2 : innerX;
        ctx.textAlign = align === 'center' ? 'center' : 'left';
        if (title) { 
            ctx.font = `700 ${titleSize}px "Roboto Condensed", sans-serif`;
            ctx.fillStyle = titleColor;
            ctx.fillText(String(title).toUpperCase(), tx, cursorY + titleSize * 0.85);
            cursorY += titleH + gap; 
        }
        ctx.font = valueFont || `700 ${valueSize}px "Roboto Condensed", sans-serif`;
        ctx.fillStyle = valueColor;
        let text = value === undefined || value === null || value === '' ? '' : String(value);
        if (truncate) text = truncateToWidth(ctx, text, innerW);
        ctx.fillText(text, tx, cursorY + valueSize * 0.85);
    };
    const SCALE = 4;
    const W = Math.round(6 * 96 * SCALE), H = Math.round(4 * 96 * SCALE);
    const canvas = document.createElement('canvas');
    canvas.width = W; canvas.height = H;
    const ctx = canvas.getContext('2d');
    ctx.fillStyle = '#ffffff'; ctx.fillRect(0, 0, W, H);
    ctx.strokeStyle = '#dddddd'; ctx.lineWidth = 1 * SCALE;
    ctx.strokeRect(0.5 * SCALE, 0.5 * SCALE, W - SCALE, H - SCALE);
    const PAD = 0.25 * 96 * SCALE;
    const cX = PAD, cY = PAD, cW = W - 2 * PAD, cH = H - 2 * PAD;
    const colImgW = cW * 0.25, colDataW = cW * 0.60, colBarW = cW * 0.15;
    const colImgX = cX, colDataX = cX + colImgW, colBarX = colDataX + colDataW;
    const BORDER = 2 * SCALE;
    if (processImgSrc) {
        try { 
            const img = new Image();
            img.crossOrigin = 'anonymous'; 
            await new Promise(r => { img.onload = r; img.onerror = r; img.src = processImgSrc; });
            ctx.drawImage(img, colImgX, cY, colImgW - 5 * SCALE, cH); 
        } catch (e) {}
    }
    ctx.strokeStyle = '#000000'; ctx.lineWidth = BORDER;
    [colDataX, colBarX].forEach(sx => { ctx.beginPath(); ctx.moveTo(sx, cY); ctx.lineTo(sx, cY + cH); ctx.stroke(); });
    const rowPx = [0.15, 0.15, 0.24, 0.24, 0.11].map(pct => cH * pct);
    rowPx.push(cH - rowPx.reduce((a, b) => a + b, 0));
    let rowY = cY;
    const h1 = rowPx[0], w1A = colDataW * 0.65, w1B = colDataW * 0.35;
    drawLabelCell(ctx, { x: colDataX, y: rowY, w: w1A, h: h1, title: 'MODELO', value: p.codigo || 'S/N', titleSize: 10 * SCALE, valueFont: `700 ${32 * SCALE}px "Oswald", sans-serif`, valueSize: 32 * SCALE });
    drawLabelCell(ctx, { x: colDataX + w1A, y: rowY, w: w1B, h: h1, title: 'TOTAL ORDEN', value: p.totalPedido || 0, titleSize: 10 * SCALE, valueFont: `700 ${20 * SCALE}px "Oswald", sans-serif`, valueSize: 20 * SCALE });
    ctx.strokeStyle = '#000'; ctx.lineWidth = BORDER;
    ctx.beginPath(); ctx.moveTo(colDataX + w1A, rowY); ctx.lineTo(colDataX + w1A, rowY + h1); ctx.stroke();
    rowY += h1;
    ctx.beginPath(); ctx.moveTo(colDataX, rowY); ctx.lineTo(colDataX + colDataW, rowY); ctx.stroke();
    const h2 = rowPx[1], w2A = colDataW * 0.27, w2B = colDataW * 0.27, w2C = colDataW * 0.46;
    drawLabelCell(ctx, { x: colDataX, y: rowY, w: w2A, h: h2, title: 'CLIENTE', value: p.cliente || '---', titleSize: 10 * SCALE, valueSize: 14 * SCALE, truncate: true });
    drawLabelCell(ctx, { x: colDataX + w2A, y: rowY, w: w2B, h: h2, title: 'PARTIDA', value: p.partida || '-', titleSize: 10 * SCALE, valueSize: 14 * SCALE, truncate: true });
    drawLabelCell(ctx, { x: colDataX + w2A + w2B, y: rowY, w: w2C, h: h2, title: 'PIEZA', value: p.piezaNombre || 'ESTANDAR', titleSize: 10 * SCALE, valueSize: 14 * SCALE, truncate: true });
    ctx.strokeStyle = '#000'; ctx.lineWidth = BORDER;
    [w2A, w2A + w2B].forEach(off => { ctx.beginPath(); ctx.moveTo(colDataX + off, rowY); ctx.lineTo(colDataX + off, rowY + h2); ctx.stroke(); });
    rowY += h2;
    ctx.beginPath(); ctx.moveTo(colDataX, rowY); ctx.lineTo(colDataX + colDataW, rowY); ctx.stroke();
    const h3 = rowPx[2], textoCentral = p.color || 'N/A';
    ctx.fillStyle = '#000000'; ctx.fillRect(colDataX, rowY, colDataW, h3);
    ctx.fillStyle = '#ffffff'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    let fs = (textoCentral.length <= 6 ? 64 : textoCentral.length <= 10 ? 52 : 38) * SCALE;
    ctx.font = `700 ${fs}px "Oswald", sans-serif`;
    while (ctx.measureText(textoCentral).width > (colDataW - 24 * SCALE) && fs > 14 * SCALE) { fs -= 2 * SCALE; ctx.font = `700 ${fs}px "Oswald", sans-serif`; }
    ctx.fillText(textoCentral, colDataX + colDataW / 2, rowY + h3 / 2 + fs * 0.03);
    rowY += h3;
    ctx.strokeStyle = '#000'; ctx.lineWidth = BORDER;
    ctx.beginPath(); ctx.moveTo(colDataX, rowY); ctx.lineTo(colDataX + colDataW, rowY); ctx.stroke();
    const h4 = rowPx[3], w4A = colDataW * 0.33, w4B = colDataW * 0.34, w4C = colDataW * 0.33;
    ctx.fillStyle = '#eeeeee'; ctx.fillRect(colDataX + w4A, rowY, w4B, h4);
    ctx.fillStyle = '#000000'; ctx.fillRect(colDataX + w4A + w4B, rowY, w4C, h4);
    drawLabelCell(ctx, { x: colDataX, y: rowY, w: w4A, h: h4, title: 'PAQUETE', value: p.displayPackageId, titleSize: 10 * SCALE, valueFont: `700 ${36 * SCALE}px "Oswald", sans-serif`, valueSize: 36 * SCALE, align: 'center' });
    drawLabelCell(ctx, { x: colDataX + w4A, y: rowY, w: w4B, h: h4, title: 'CANTIDAD', value: p.piecesInPackage, titleSize: 10 * SCALE, valueFont: `700 ${36 * SCALE}px "Oswald", sans-serif`, valueSize: 36 * SCALE, align: 'center' });
    drawLabelCell(ctx, { x: colDataX + w4A + w4B, y: rowY, w: w4C, h: h4, title: 'MAQUINA', value: p.maquina || '0', titleColor: '#cccccc', valueColor: '#ffffff', titleSize: 10 * SCALE, valueFont: `700 ${48 * SCALE}px "Oswald", sans-serif`, valueSize: 48 * SCALE, align: 'center' });
    ctx.strokeStyle = '#000'; ctx.lineWidth = BORDER;
    [w4A, w4A + w4B].forEach(off => { ctx.beginPath(); ctx.moveTo(colDataX + off, rowY); ctx.lineTo(colDataX + off, rowY + h4); ctx.stroke(); });
    rowY += h4;
    ctx.beginPath(); ctx.moveTo(colDataX, rowY); ctx.lineTo(colDataX + colDataW, rowY); ctx.stroke();
    const h5 = rowPx[4], w5 = colDataW / 4;
    const pzas1hr = parseFloat(p.tiempo) > 0 ? Math.round(60 / parseFloat(p.tiempo)) : '-';
    const pzasShift = parseFloat(p.tiempo) > 0 ? Math.round((SHIFT_HOURS * 60) / parseFloat(p.tiempo)) : '-';
    const cells = [
        { title: 'TALLA', value: p.talla || 'U', font: `700 ${16 * SCALE}px "Oswald", sans-serif`, size: 16 * SCALE },
        { title: 'PESO(g)', value: p.peso || '-', font: `700 ${14 * SCALE}px "Roboto Condensed", sans-serif`, size: 14 * SCALE },
        { title: 'PZS/HR', value: pzas1hr, font: `700 ${16 * SCALE}px "Roboto Condensed", sans-serif`, size: 16 * SCALE },
        { title: `${SHIFT_HOURS} HRS`, value: pzasShift, font: `700 ${16 * SCALE}px "Roboto Condensed", sans-serif`, size: 16 * SCALE }
    ];
    cells.forEach((c, i) => drawLabelCell(ctx, { x: colDataX + w5 * i, y: rowY, w: w5, h: h5, title: c.title, value: c.value, titleSize: 9 * SCALE, valueFont: c.font, valueSize: c.size, truncate: true }));
    ctx.strokeStyle = '#000'; ctx.lineWidth = BORDER;
    [1, 2, 3].forEach(i => { ctx.beginPath(); ctx.moveTo(colDataX + w5 * i, rowY); ctx.lineTo(colDataX + w5 * i, rowY + h5); ctx.stroke(); });
    rowY += h5;
    const h6 = rowPx[5], fechaEntrega = p.fechaEntrega || new Date(Date.now() + 7 * 24 * 60 * 60 * 1000).toLocaleDateString('es-MX');
    ctx.fillStyle = '#000000'; ctx.font = `700 ${9 * SCALE}px "Roboto Condensed", sans-serif`;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(`ENTREGA: ${fechaEntrega}`, colDataX + colDataW / 2, rowY + h6 / 2);
    let barcodeCanvas = null;
    try {
        if (typeof bwipjs === 'undefined') throw new Error('bwipjs no disponible');
        barcodeCanvas = document.createElement('canvas');
        bwipjs.toCanvas(barcodeCanvas, { bcid: 'pdf417', text: p.packageCode || '000000', scale: 3, height: 10, includetext: false });
        const drawW = cH * 0.72, drawH = Math.min(colBarW * 0.8, barcodeCanvas.height * (drawW / barcodeCanvas.width));
        ctx.save();
        ctx.translate(colBarX + colBarW / 2, cY + cH / 2); ctx.rotate(Math.PI / 2);
        ctx.drawImage(barcodeCanvas, -drawW / 2, -drawH / 2, drawW, drawH);
        ctx.restore();
    } catch (e) {
        ctx.save(); ctx.translate(colBarX + colBarW / 2, cY + cH / 2); ctx.rotate(Math.PI / 2);
        ctx.fillStyle = '#000'; ctx.font = `700 ${10 * SCALE}px "Roboto Condensed", sans-serif`;
        ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.fillText(String(p.packageCode || 'SIN CÓDIGO'), 0, 0);
        ctx.restore();
    } finally { if (barcodeCanvas) { barcodeCanvas.width = 0; barcodeCanvas.height = 0; } }
    return canvas;
};

const renderKitLabelToCanvas = async (kit, processImgSrc) => {
    const SCALE = 4, W = 6 * 96 * SCALE, H = 4 * 96 * SCALE, BORDER = 3 * SCALE;
    const canvas = document.createElement('canvas'); canvas.width = W; canvas.height = H;
    const ctx = canvas.getContext('2d'); ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, W, H);
    ctx.strokeStyle = '#000'; ctx.lineWidth = BORDER; ctx.strokeRect(BORDER / 2, BORDER / 2, W - BORDER, H - BORDER);
    const imageW = W * 0.24, dataW = W * 0.58, codeW = W - imageW - dataW, dataX = imageW, codeX = imageW + dataW;
    const drawLine = (x1, y1, x2, y2) => { ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke(); };
    const drawCover = (img, x, y, w, h) => { const scale = Math.max(w / img.width, h / img.height), dw = img.width * scale, dh = img.height * scale; ctx.save(); ctx.beginPath(); ctx.rect(x, y, w, h); ctx.clip(); ctx.drawImage(img, x + (w - dw) / 2, y + (h - dh) / 2, dw, dh); ctx.restore(); };
    if (processImgSrc) { try { const img = new Image(); img.crossOrigin = 'anonymous'; await new Promise(resolve => { img.onload = resolve; img.onerror = resolve; img.src = processImgSrc; }); if (img.width) drawCover(img, 0, 0, imageW, H); } catch (_) {} }
    drawLine(dataX, 0, dataX, H); drawLine(codeX, 0, codeX, H);
    const headerH = H * 0.18, brandH = H * 0.115, footerH = H * 0.20, rowsH = H - headerH - brandH - footerH;
    const text = (value, x, y, max, size, font = 'Roboto Condensed', align = 'left') => { ctx.fillStyle = '#000'; ctx.font = `700 ${size}px "${font}", sans-serif`; ctx.textAlign = align; let result = String(value || ''); while (ctx.measureText(result).width > max && result.length > 1) result = result.slice(0, -1); ctx.fillText(result, x, y); };
    const headerCell = (label, value, x, width, valueSize) => { ctx.fillStyle = '#4b5563'; ctx.font = `700 ${8 * SCALE}px "Roboto Condensed", sans-serif`; ctx.textAlign = 'left'; ctx.fillText(label, x + 11 * SCALE, headerH * 0.27); text(value, x + 11 * SCALE, headerH * 0.73, width - 22 * SCALE, valueSize, 'Oswald'); };
    const modelText = String(kit.codigo || 'S/N').trim().toUpperCase();
    const clientText = String(kit.cliente || 'SIN CLIENTE').trim().toUpperCase();
    let modelW = dataW * 0.32;
    let clientW = dataW * 0.30;
    let partidaW = dataW - modelW - clientW;
    const partidaFloor = dataW * 0.16;
    ctx.font = `700 ${25 * SCALE}px "Oswald", sans-serif`;
    // Paso 1: MODELO nunca se trunca; si no cabe, se recorta PARTIDA -y si no alcanza, CLIENTE- para dárselo a MODELO.
    const modelNeed = ctx.measureText(modelText).width + 22 * SCALE;
    if (modelNeed > modelW) {
        let deficit = modelNeed - modelW;
        const fromPartida = Math.min(deficit, Math.max(0, partidaW - partidaFloor));
        modelW += fromPartida; partidaW -= fromPartida; deficit -= fromPartida;
        if (deficit > 0) {
            const fromClient = Math.min(deficit, Math.max(0, clientW - dataW * 0.18));
            modelW += fromClient; clientW -= fromClient;
        }
    }
    // Paso 2: con MODELO ya resuelto, si CLIENTE no cabe se le quita a PARTIDA (nunca a MODELO).
    const clientNeed = ctx.measureText(clientText).width + 22 * SCALE;
    if (clientNeed > clientW) {
        const movedRight = Math.min(clientNeed - clientW, Math.max(0, partidaW - partidaFloor));
        clientW += movedRight;
        partidaW -= movedRight;
    }
    drawLine(dataX + modelW, 0, dataX + modelW, headerH);
    drawLine(dataX + modelW + clientW, 0, dataX + modelW + clientW, headerH);
    drawLine(dataX, headerH, codeX, headerH);
    headerCell('MODELO', modelText, dataX, modelW, 25 * SCALE);
    headerCell('CLIENTE', clientText, dataX + modelW, clientW, 25 * SCALE);
    headerCell('PARTIDA', kit.partida, dataX + modelW + clientW, partidaW, 21 * SCALE);
    const rawColor = String(kit.color || '').trim();
    const hasSpecificColor = rawColor && !['SIN COLOR', 'N/A', '---', '-', 'NO ESPECIFICADO'].includes(rawColor.toUpperCase());
    const colorLabel = rawColor.toUpperCase();
    ctx.fillStyle = '#000';
    ctx.fillRect(dataX, headerH, dataW, brandH);
    ctx.fillStyle = '#fff';
    ctx.font = `700 ${10 * SCALE}px "Roboto Condensed", sans-serif`;
    ctx.textAlign = 'left';
    ctx.fillText('COLOR', dataX + 13 * SCALE, headerH + brandH * 0.25);
    if (hasSpecificColor) {
        ctx.font = `700 ${31 * SCALE}px "Oswald", sans-serif`;
        ctx.textAlign = 'center';
        let visibleColor = colorLabel;
        while (ctx.measureText(visibleColor).width > dataW - 28 * SCALE && visibleColor.length > 1) visibleColor = visibleColor.slice(0, -1);
        ctx.fillText(visibleColor, dataX + dataW / 2, headerH + brandH * 0.78);
    } else {
        const squareCount = 8;
        const squareGap = 5 * SCALE;
        const squareX = dataX + dataW * 0.19;
        const squareY = headerH + brandH * 0.32;
        const squareH = brandH * 0.50;
        const availableW = dataW * 0.77;
        const squareW = (availableW - squareGap * (squareCount - 1)) / squareCount;
        for (let i = 0; i < squareCount; i++) {
            const x = squareX + i * (squareW + squareGap);
            ctx.fillStyle = '#fff';
            ctx.fillRect(x, squareY, squareW, squareH);
            ctx.strokeStyle = '#fff';
            ctx.lineWidth = 1.2 * SCALE;
            ctx.strokeRect(x, squareY, squareW, squareH);
        }
    }
    const machineW = dataW * 0.18;
    drawLine(codeX - machineW, headerH + brandH, codeX - machineW, H - footerH);
    let rowY = headerH + brandH;
    const components = kit.components || [];
    const rowH = rowsH / Math.max(components.length, 1);
    components.forEach(component => {
        drawLine(dataX, rowY, codeX, rowY);
        const qtyText = String(component.cantidad ?? '');
        let qtyFont = 38 * SCALE;
        const qtyMaxW = dataW * 0.33;
        ctx.font = `700 ${qtyFont}px "Oswald", sans-serif`;
        while (ctx.measureText(qtyText).width + 32 * SCALE > qtyMaxW && qtyFont > 22 * SCALE) {
            qtyFont -= 2 * SCALE;
            ctx.font = `700 ${qtyFont}px "Oswald", sans-serif`;
        }
        const qtyW = Math.max(dataW * 0.18, Math.min(qtyMaxW, ctx.measureText(qtyText).width + 32 * SCALE));
        const pieceX = dataX + qtyW + 16 * SCALE;
        const pieceW = dataW - qtyW - machineW - 30 * SCALE;
        const program = String(component.codigoPrograma || component.codigoProg || component.programa || '').trim().toUpperCase();
        ctx.fillStyle = '#000';
        ctx.textAlign = 'left';
        ctx.fillText(qtyText, dataX + 14 * SCALE, rowY + rowH * 0.63);
        text(component.piezaNombre, pieceX, rowY + rowH * 0.48, pieceW, 20 * SCALE);
        ctx.fillStyle = '#4b5563';
        ctx.font = `700 ${9 * SCALE}px "Roboto Condensed", sans-serif`;
        ctx.textAlign = 'left';
        ctx.fillText(`PROG. ${program || '—'}`, pieceX, rowY + rowH * 0.74);
        const maqLabelSize = Math.max(6 * SCALE, Math.min(8 * SCALE, rowH * 0.11));
        const maqValueSize = Math.max(16 * SCALE, Math.min(32 * SCALE, rowH * 0.40));
        ctx.fillStyle = '#4b5563';
        ctx.font = `700 ${maqLabelSize}px "Roboto Condensed", sans-serif`;
        ctx.textAlign = 'center';
        ctx.fillText('MAQ.', codeX - machineW / 2, rowY + maqLabelSize * 1.4);
        text(component.maquina, codeX - machineW / 2, rowY + rowH - maqValueSize * 0.32, machineW - 20 * SCALE, maqValueSize, 'Oswald', 'center');
        rowY += rowH;
    });
    const footerTopH = footerH * 0.32, footerBottomH = footerH - footerTopH;
    drawLine(dataX, H - footerH, codeX, H - footerH);
    ctx.fillStyle = '#f4f4f4'; ctx.fillRect(dataX, H - footerH, dataW, footerTopH);
    ctx.fillStyle = '#000'; ctx.textAlign = 'center'; ctx.font = `700 ${11 * SCALE}px "Roboto Condensed", sans-serif`;
    ctx.fillText(`TOTAL ORDEN: ${Number(kit.totalOrder || 0) || '—'}`, dataX + dataW / 2, H - footerH + footerTopH * 0.65);
    ctx.fillStyle = '#000'; ctx.fillRect(dataX, H - footerBottomH, dataW, footerBottomH);
    ctx.fillStyle = '#fff'; ctx.font = `700 ${27 * SCALE}px "Oswald", sans-serif`;
    ctx.fillText(`${kit.displayQuantity || 0} ${kit.displayLabel || 'KIT'} COMPLETAS`, dataX + dataW / 2, H - footerBottomH / 2 + 9 * SCALE);
    const packageNumber = Math.max(1, Number(kit.packageNumber || kit.kitPackageNumber || 1) || 1);
    const packageTotal = Math.max(packageNumber, Number(kit.packageTotal || kit.kitPackageTotal || packageNumber) || packageNumber);
    const codeHeaderH = H * 0.19;
    const codeAreaH = H - codeHeaderH;
    ctx.fillStyle = '#000';
    ctx.fillRect(codeX, 0, codeW, codeHeaderH);
    drawLine(codeX, codeHeaderH, W, codeHeaderH);
    ctx.fillStyle = '#fff';
    ctx.textAlign = 'center';
    ctx.font = `700 ${27 * SCALE}px "Oswald", sans-serif`;
    ctx.fillText(`${packageNumber} DE ${packageTotal}`, codeX + codeW / 2, codeHeaderH * 0.66);
    try {
        const barcode = document.createElement('canvas');
        bwipjs.toCanvas(barcode, { bcid: 'pdf417', text: kit.packageCode, scale: 3, height: 10, includetext: false });
        const drawW = codeAreaH * 0.72;
        const drawH = Math.min(codeW * 0.78, barcode.height * (drawW / barcode.width));
        ctx.save();
        ctx.translate(codeX + codeW / 2, codeHeaderH + codeAreaH * 0.57);
        ctx.rotate(Math.PI / 2);
        ctx.drawImage(barcode, -drawW / 2, -drawH / 2, drawW, drawH);
        ctx.restore();
        barcode.width = 0;
        barcode.height = 0;
    } catch (error) { console.warn('PDF417 KIT no disponible', error); }
    return canvas;
};

const getColorCode = (color) => {
  if (!color) return 'XX';
  const clean = color.trim().toUpperCase().replace(/[^A-ZÁÉÍÓÚÑ ]/g, '');
  const firstWord = clean.split(/\s+/)[0] || '';
  if (firstWord.length === 0) return 'XX';
  if (firstWord.length === 1) return (firstWord + 'X');
  return firstWord.substring(0, 2);
};
const buildCodigoUnico = (baseCodigo, color) => `${baseCodigo}${getColorCode(color)}`;
const generateSmartID = (partida, pieces, maquina) => {

  return `${partida}-${piecePrefixes}-M${maquina}`;
};

const buildKitDefinition = (pieces = [], presentationBySize = {}, kitEnabled = true) => {
  const bySize = {};
  (Array.isArray(pieces) ? pieces : []).forEach(piece => {
    const size = String(piece?.talla || 'UNI').trim().toUpperCase() || 'UNI';
    const name = String(piece?.pieza || piece?.descripcion || '').trim().toUpperCase();
    if (!name) return;
    if (!bySize[size]) bySize[size] = new Set();
    bySize[size].add(name);
  });
  const sizes = Object.entries(bySize).map(([talla, names]) => {
    const piezas = [...names].sort();
    const previous = presentationBySize?.[talla] || {};
    const completeUnitsPerKit = Math.max(0, Math.floor(Number(previous.completeUnitsPerKit || 0)));
    const yieldPerLienzo = piezas.reduce((acc, pieceName) => {
      const configured = Number(previous.yieldPerLienzo?.[pieceName]);
      return { ...acc, [pieceName]: Number.isFinite(configured) && configured > 0 ? Math.floor(configured) : 1 };
    }, {});
    const componentLienzosPerKit = piezas.reduce((acc, pieceName) => ({ ...acc, [pieceName]: completeUnitsPerKit ? Math.ceil(completeUnitsPerKit / yieldPerLienzo[pieceName]) : 0 }), {});
    return { talla, piezas, cantidadPiezas: names.size, presentation: { displayLabel: String(previous.displayLabel || piezas[0] || '').trim().toUpperCase(), completeUnitsPerKit, yieldPerLienzo, componentLienzosPerKit } };
  });
  const allKitEligibleSizes = sizes.filter(item => item.cantidadPiezas > 1).map(item => item.talla);
  const kitEligibleSizes = kitEnabled ? allKitEligibleSizes : [];
  const normalizedPresentationBySize = sizes.filter(item => item.cantidadPiezas > 1).reduce((acc, item) => ({ ...acc, [item.talla]: item.presentation }), {});
  return { kitEnabled: Boolean(kitEnabled), productionMode: kitEligibleSizes.length ? 'KIT' : 'INDIVIDUAL', kitEligibleSizes, kitDefinition: { version: 4, enabled: Boolean(kitEnabled), sizes, presentationBySize: normalizedPresentationBySize, requiresManualGrouping: false } };
};

// =================== HISTORIAL DE NAVEGACIÓN (BOTÓN ATRÁS MÓVIL) =================== //
// Cada pantalla/modal que se abre "empuja" una entrada al historial del navegador.
// Al presionar Atrás (hardware o gesto), en vez de salir de la app, se cierra
// solo la pantalla más reciente y el resto del estado permanece intacto.
const useBackStack = () => {
  const stackRef = useRef([]);
  const skipNextPopRef = useRef(false);

  useEffect(() => {
    const handler = () => {
      if (skipNextPopRef.current) { skipNextPopRef.current = false; return; }
      const closeFn = stackRef.current.pop();
      if (closeFn) closeFn();
    };
    window.addEventListener('popstate', handler);
    return () => window.removeEventListener('popstate', handler);
  }, []);

  const openScreen = useCallback((closeFn) => {
    stackRef.current.push(closeFn);
    window.history.pushState({ maesScreenDepth: stackRef.current.length }, '');
  }, []);

  const closeScreen = useCallback(() => {
    if (stackRef.current.length === 0) return;
    const fn = stackRef.current.pop();
    skipNextPopRef.current = true;
    window.history.back();
    if (fn) fn();
  }, []);

  return { openScreen, closeScreen };
};

const SmartImage = ({ codigo, className }) => {
  const [imgSrc, setImgSrc] = useState(null);
  const [loading, setLoading] = useState(true);
  const [isShared, setIsShared] = useState(false);
  const fileInputRef = useRef(null);

  useEffect(() => {
    if (!codigo) { setLoading(false); return; }
    
    const unsub = db.collection('imagenes_editadas').doc(codigo).onSnapshot(doc => {
      const localImg = doc.exists ? doc.data().localImage : null;
      if (localImg) { 
        setImgSrc(localImg); 
        setIsShared(true); 
        setLoading(false); 
        return; 
      }
      
      setIsShared(false);
      
      const base = DEFAULT_IMAGE_REPO.endsWith('/') ? DEFAULT_IMAGE_REPO : DEFAULT_IMAGE_REPO + '/';
      const extensiones = ['.jpg', '.png', '.jpeg', '.webp'];
      let index = 0;

      const probarImagen = () => {
        if (index >= extensiones.length) {
          setImgSrc(null); 
          setLoading(false);
          return;
        }
        const testImg = new Image();
        testImg.onload = () => {
          setImgSrc(testImg.src);
          setLoading(false);
        };
        testImg.onerror = () => {
          index++;
          probarImagen(); 
        };
        testImg.src = `${base}${codigo}${extensiones[index]}`;
      };

      probarImagen();
    });
    
    return () => unsub();
  }, [codigo]);

  const handleError = () => setImgSrc(null);

  return (
    <div className="relative inline-block w-full h-full">
      {imgSrc ? (
        <img src={imgSrc} onError={handleError} className={className} alt={codigo} />
      ) : (
        <div className={`flex flex-col items-center justify-center bg-ios-input text-ios-muted ${className}`}>
          <Icon name="image-off" size={24} /><span className="text-[9px] mt-1 font-medium tracking-wide uppercase">Sin Imagen</span>
        </div>
      )}
    </div>
  );
};

const Pdf417Preview = ({ value }) => {
  const canvasRef = useRef(null);
  useEffect(() => {
    if (!canvasRef.current || !value || typeof bwipjs === 'undefined') return;
    try { bwipjs.toCanvas(canvasRef.current, { bcid: 'pdf417', text: value, scale: 2, height: 10, includetext: false }); } catch (error) { console.warn('PDF417 preview no disponible', error); }
  }, [value]);
  return <canvas ref={canvasRef} className="w-full h-auto" aria-label="Código PDF417 de vista previa" />;
};

const TimeInput = ({ value, onChange, isBlinking }) => {
  const [mins, setMins] = useState('');
  const [secs, setSecs] = useState('');
  useEffect(() => {
    if (value === undefined || value === '' || value === null) { setMins(''); setSecs(''); return; }
    const total = parseFloat(value);
    const m = Math.floor(total);
    const s = Math.round((total - m) * 60);
    setMins(m.toString());
    setSecs(s < 10 ? '0' + s : s.toString());
  }, [value]);
  const handle = (newM, newS) => { const m = parseInt(newM)||0; const s = parseInt(newS)||0; onChange((m + s/60).toFixed(4)); };
  const blinkClass = isBlinking ? 'animate-blink' : '';
  return (
    <div className="flex items-center gap-1 w-full">
      <input inputMode="numeric" value={mins} placeholder="m" onChange={e=>{setMins(e.target.value); handle(e.target.value,secs);}} className={`bg-black-20-override bg-black-20-override-orange flex-1 min-w-0 text-center rounded-lg p-2 font-mono text-xs font-semibold text-[#ff9f0a] ${blinkClass}`}/>
      <span className="font-bold text-white/30 text-[10px]">:</span>
      <input inputMode="numeric" value={secs} placeholder="s" max="59" onChange={e=>{setSecs(e.target.value); handle(mins,e.target.value);}} className={`bg-black-20-override bg-black-20-override-orange flex-1 min-w-0 text-center rounded-lg p-2 font-mono text-xs font-semibold text-[#ff9f0a] ${blinkClass}`}/>
    </div>
  );
};

const PlantillaConfigModal = ({ plantilla, onClose, onConfirm }) => {
  const tallasDisponibles = useMemo(() => {
    const set = new Set();
    (plantilla.subPiecesData || []).forEach(sp => { if (sp.talla) set.add(sp.talla); });
    return Array.from(set);
  }, [plantilla]);

  const [tallaSeleccionada, setTallaSeleccionada] = useState(tallasDisponibles[0] || 'UNI');
  const [nuevaMaquina, setNuevaMaquina] = useState('');
  const kitEnabledForTemplate = plantilla.kitEnabled !== false && plantilla.kitDefinition?.enabled !== false;
  const getKitPresentation = (talla) => kitEnabledForTemplate ? (plantilla.kitDefinition?.presentationBySize?.[String(talla || 'UNI').toUpperCase()] || plantilla.kitPresentationBySize?.[String(talla || 'UNI').toUpperCase()] || null) : null;
  const getKitPlan = (talla, requestedCompleteUnits) => {
    const presentation = getKitPresentation(talla);
    const completeUnitsPerKit = Number(presentation?.completeUnitsPerKit || 0);
    const requested = Math.max(0, Number(requestedCompleteUnits || 0));
    const kitCount = completeUnitsPerKit > 0 ? Math.ceil(requested / completeUnitsPerKit) : 0;
    const capacity = kitCount * completeUnitsPerKit;
    return { presentation, completeUnitsPerKit, requested, kitCount, capacity, excessCompleteUnits: Math.max(0, capacity - requested) };
  };

  const [asignaciones, setAsignaciones] = useState(() => {
    const uniqueMap = new Map();
    (plantilla.subPiecesData || []).forEach((sp, idx) => {
      const key = `${(sp.pieza || '').toUpperCase()}_${(sp.talla || 'UNI').toUpperCase()}`;
      if (!uniqueMap.has(key)) {
        const talla = sp.talla || 'UNI';
        const presentation = getKitPresentation(talla);
        const requestedCompleteUnits = Number(sp.totalPedido) || 100;
        const completeUnitsPerKit = Number(presentation?.completeUnitsPerKit || 0);
        const yieldPerLienzo = Math.max(1, Number(presentation?.yieldPerLienzo?.[String(sp.pieza || '').toUpperCase()] || 1));
        const kitCount = completeUnitsPerKit > 0 ? Math.ceil(requestedCompleteUnits / completeUnitsPerKit) : 0;
        const lienzosPerKit = completeUnitsPerKit > 0 ? Math.ceil(completeUnitsPerKit / yieldPerLienzo) : 100;
        uniqueMap.set(key, {
          id: generateId() + idx,
          talla,
          maquina: sp.maquina ? String(sp.maquina) : '',
          descripcion: sp.pieza || '',
          totalPiezas: completeUnitsPerKit > 0 ? kitCount * lienzosPerKit : (sp.totalPedido || 100),
          piezasPorPaquete: lienzosPerKit,
          sufijo: sp.sufijo || '',
          codigoPrograma: sp.codigoPrograma || '',
          peso: sp.peso || '',
          tiempo: sp.tiempo || '',
          activo: true
        });
      } else {
        const existing = uniqueMap.get(key);
        const currentMachines = existing.maquina.split(',').map(m => m.trim()).filter(Boolean);
        const newMachines = (sp.maquina ? String(sp.maquina) : '').split(',').map(m => m.trim()).filter(Boolean);
        existing.maquina = [...new Set([...currentMachines, ...newMachines])].join(', ');
        if (Number(sp.totalPedido) > Number(existing.totalPiezas)) {
            existing.totalPiezas = Number(sp.totalPedido);
        }
      }
    });
    return Array.from(uniqueMap.values());
  });

  const [tallaConfigs, setTallaConfigs] = useState(() => {
    const configs = {};
    tallasDisponibles.forEach(t => {
      const sumaInicial = Array.from(new Set(
        (plantilla.subPiecesData || []).filter(sp => sp.talla === t).map(sp => Number(sp.totalPedido) || 0)
      ))[0] || 100;
      const plan = getKitPlan(t, sumaInicial || 0);
      configs[t] = { modo: plan.completeUnitsPerKit > 0 ? 'kit' : 'manual', totalGlobal: sumaInicial || plan.completeUnitsPerKit || 100 };
    });
    return configs;
  });

  const recalcularReparto = (talla, config, currentAsignaciones) => {
    if (config.modo === 'manual') return currentAsignaciones;
    if (config.modo === 'kit') {
      const plan = getKitPlan(talla, config.totalGlobal);
      if (!plan.completeUnitsPerKit) return currentAsignaciones;
      return currentAsignaciones.map(a => {
        if (a.talla !== talla || !a.activo) return a;
        const pieceName = String(a.descripcion || '').toUpperCase();
        const yieldPerLienzo = Math.max(1, Number(plan.presentation?.yieldPerLienzo?.[pieceName] || 1));
        const lienzosPerKit = Math.ceil(plan.completeUnitsPerKit / yieldPerLienzo);
        return { ...a, totalPiezas: plan.kitCount * lienzosPerKit, piezasPorPaquete: lienzosPerKit };
      });
    }
    return currentAsignaciones.map(a => {
      if (a.talla === talla && a.activo) {
        return { ...a, totalPiezas: config.totalGlobal };
      }
      return a;
    });
  };

  const updateTallaConfig = (talla, field, value) => {
    const newConfig = { ...tallaConfigs[talla], [field]: value };
    setTallaConfigs(prev => ({ ...prev, [talla]: newConfig }));
    setAsignaciones(prev => recalcularReparto(talla, newConfig, prev));
  };

  const agregarMaquinaATalla = () => {
    if (!nuevaMaquina.trim()) return alert('Escribe el número de la máquina');
    setAsignaciones(prev => {
      return prev.map(a => {
        if (a.talla === tallaSeleccionada) {
          const m = new Set([...a.maquina.split(',').map(x=>x.trim()).filter(Boolean), nuevaMaquina.trim()]);
          return { ...a, maquina: Array.from(m).join(', ') };
        }
        return a;
      });
    });
    setNuevaMaquina('');
  };

  const toggleActivo = (id) => {
    setAsignaciones(prev => {
      const next = prev.map(a => a.id === id ? { ...a, activo: !a.activo } : a);
      const target = next.find(a => a.id === id);
      if (target && ['igual', 'kit'].includes(tallaConfigs[target.talla]?.modo)) {
        return recalcularReparto(target.talla, tallaConfigs[target.talla], next);
      }
      return next;
    });
  };

  const updateAsignacion = (id, field, val) => {
    setAsignaciones(asignaciones.map(a => a.id === id ? { ...a, [field]: val } : a));
  };

  const handleConfirmar = () => {
    const activos = asignaciones.filter(a => a.activo).map(a => ({ ...a, kitTotalOrden: Number(tallaConfigs[a.talla]?.totalGlobal) || 0 }));
    if (activos.length === 0) return alert('Debes tener al menos una pieza activa.');
    onConfirm(activos);
  };

  const groupedByTalla = useMemo(() => {
    const map = {};
    asignaciones.forEach(a => {
      if (!map[a.talla]) map[a.talla] = [];
      map[a.talla].push(a);
    });
    return map;
  }, [asignaciones]);

  return (
    <div className="fixed inset-0 bg-black/85 z-[120] flex flex-col backdrop-blur-md">
      <div className="p-4 flex justify-between items-center border-b border-ios-border bg-ios-bg safe-top">
        <div>
          <h2 className="text-lg font-bold text-white">Configurar Producción: {plantilla.codigo}</h2>
          <p className="text-xs text-ios-muted">Asigna cantidades y máquinas para cada talla</p>
        </div>
        <button onClick={onClose} className="text-ios-red font-bold">Cancelar</button>
      </div>

      <div className="flex-1 overflow-y-auto p-4 space-y-6 max-w-7xl mx-auto w-full pb-20">
        <div className="bg-ios-card rounded-2xl p-4 border border-ios-border flex flex-col sm:flex-row gap-3 items-center">
          <div className="w-full sm:w-1/3">
            <label className="text-[10px] font-bold text-ios-muted block mb-1 uppercase">Seleccionar Talla</label>
            <select value={tallaSeleccionada} onChange={e => setTallaSeleccionada(e.target.value)} className="w-full p-2.5 rounded-xl font-bold text-sm">
              {tallasDisponibles.map(t => <option key={t} value={t}>Talla: {t}</option>)}
            </select>
          </div>
          <div className="w-full sm:w-1/3">
            <label className="text-[10px] font-bold text-ios-muted block mb-1 uppercase">Agregar Máquina a Talla</label>

          </div>
          <div className="w-full sm:w-1/3 pt-4 sm:pt-0">
            <button onClick={agregarMaquinaATalla} className="w-full py-2.5 bg-ios-blue text-white rounded-xl font-bold text-xs flex justify-center items-center gap-1.5"><Icon name="plus" size={14}/> Añadir Máquina</button>
          </div>
        </div>

        <div className="grid grid-cols-1 xl:grid-cols-2 gap-4 items-start">
        {Object.entries(groupedByTalla).map(([talla, items]) => {
          const config = tallaConfigs[talla] || { modo: 'manual', totalGlobal: 0 };
          const activesCount = items.filter(i => i.activo).length;
          const kitPlan = getKitPlan(talla, config.totalGlobal);
          const isKitAuto = config.modo === 'kit' && kitPlan.completeUnitsPerKit > 0;
          const componentExcesses = isKitAuto ? items.filter(item => item.activo).map(item => {
            const yieldPerLienzo = Math.max(1, Number(kitPlan.presentation?.yieldPerLienzo?.[String(item.descripcion || '').toUpperCase()] || 1));
            const lienzos = kitPlan.kitCount * Math.ceil(kitPlan.completeUnitsPerKit / yieldPerLienzo);
            const produced = lienzos * yieldPerLienzo;
            return { descripcion: item.descripcion, yieldPerLienzo, lienzos, produced, exceso: Math.max(0, produced - kitPlan.requested) };
          }).filter(item => item.exceso > 0) : [];

          return (
            <div key={talla} className="bg-ios-card rounded-2xl border border-ios-border p-4 shadow-lg">
              <div className="flex flex-col sm:flex-row justify-between items-start sm:items-center mb-4 pb-4 border-b border-ios-border gap-4">
                <div>
                  <span className="text-xl font-black text-white tracking-wider uppercase block">Talla: {talla}</span>
                  <span className="text-xs text-ios-muted font-bold mt-1">{activesCount} piezas activas</span>
                </div>

                <div className="w-full sm:w-auto flex flex-col items-end gap-2">
                  <div className="flex bg-ios-input rounded-xl p-1 w-full sm:w-auto border border-ios-border/50">
                    {getKitPresentation(talla)?.completeUnitsPerKit > 0 && <button
                      onClick={() => updateTallaConfig(talla, 'modo', 'kit')}
                      className={`flex-1 sm:flex-none px-4 py-2 rounded-lg text-xs font-bold transition-all ${config.modo === 'kit' ? 'bg-emerald-600 text-white shadow-md' : 'text-ios-muted hover:text-white'}`}
                    >
                      KIT automático
                    </button>}
                    <button
                      onClick={() => updateTallaConfig(talla, 'modo', 'igual')}
                      className={`flex-1 sm:flex-none px-4 py-2 rounded-lg text-xs font-bold transition-all ${config.modo === 'igual' ? 'bg-ios-blue text-white shadow-md' : 'text-ios-muted hover:text-white'}`}
                    >
                      Repartir Iguales
                    </button>
                    <button
                      onClick={() => updateTallaConfig(talla, 'modo', 'manual')}
                      className={`flex-1 sm:flex-none px-4 py-2 rounded-lg text-xs font-bold transition-all ${config.modo === 'manual' ? 'bg-ios-blue text-white shadow-md' : 'text-ios-muted hover:text-white'}`}
                    >
                      Manual
                    </button>
                  </div>

                  {(config.modo === 'igual' || config.modo === 'kit') && (
                    <div className="flex items-center gap-2 w-full sm:w-auto justify-end bg-ios-blue/10 p-2 rounded-xl border border-ios-blue/30">
                      <span className="text-xs font-bold text-ios-blue uppercase">{config.modo === 'kit' ? 'Productos completos:' : 'Total Producción:'}</span>
                      <input
                        type="number"
                        value={config.totalGlobal || ''}
                        onChange={(e) => updateTallaConfig(talla, 'totalGlobal', parseInt(e.target.value) || 0)}
                        className="w-24 p-1.5 rounded-lg bg-[#1c1c1e] text-white font-black text-center text-sm border border-ios-blue/50 focus:border-ios-blue"
                      />
                    </div>
                  )}
                </div>
              </div>

              {isKitAuto && <div className={`mb-4 rounded-xl border p-3 ${kitPlan.excessCompleteUnits ? 'bg-amber-500/10 border-amber-500/40' : 'bg-emerald-500/10 border-emerald-500/40'}`}><div className="flex flex-wrap justify-between gap-2"><div><div className="text-xs font-black uppercase text-white">KIT: {kitPlan.completeUnitsPerKit} {kitPlan.presentation.displayLabel || 'PRODUCTOS'} completas</div><div className="text-[10px] font-bold text-ios-muted mt-1">Pedido: {kitPlan.requested} · {kitPlan.kitCount} KIT{kitPlan.kitCount === 1 ? '' : 'S'} · Capacidad: {kitPlan.capacity}</div></div><div className={`text-right text-sm font-black ${kitPlan.excessCompleteUnits ? 'text-amber-300' : 'text-emerald-300'}`}>{kitPlan.excessCompleteUnits ? `+${kitPlan.excessCompleteUnits} inevitables` : 'Múltiplo exacto'}</div></div>{componentExcesses.length > 0 && <div className="mt-2 pt-2 border-t border-white/10 text-[10px] font-bold text-amber-200">Excedentes por rendimiento: {componentExcesses.map(item => `${item.descripcion} +${item.exceso} (${item.lienzos} lienzos × ${item.yieldPerLienzo})`).join(' · ')}</div>}</div>}

              <div className="space-y-3">
                {items.map(item => (
                  <div key={item.id} className={`p-3 rounded-xl border transition-all ${item.activo ? 'bg-[#2c2c2e]/60 border-[#38383a]' : 'bg-black/40 border-transparent opacity-50'}`}>
                    <div className="flex items-center justify-between mb-2">
                      <div className="flex items-center gap-3">
                        <input type="checkbox" checked={item.activo} onChange={() => toggleActivo(item.id)} className="w-5 h-5 accent-ios-blue rounded cursor-pointer" />
                        <div>
                          <span className="font-black text-white text-base">Máq. {item.maquina || 'S/M'}</span>
                          <span className="text-xs font-bold text-ios-muted ml-2 uppercase">({item.descripcion})</span>
                        </div>
                      </div>
                      <button onClick={() => setAsignaciones(asignaciones.filter(a => a.id !== item.id))} className="text-ios-red p-2 hover:bg-ios-red/10 rounded-full transition-colors"><Icon name="trash-2" size={16}/></button>
                    </div>

                    {item.activo && (
                      <div className="grid grid-cols-1 sm:grid-cols-2 gap-4 mt-3 pt-3 border-t border-ios-border/50">
                        <div className="relative">
                          <label className={`text-[10px] font-bold uppercase block mb-1.5 ${['igual', 'kit'].includes(config.modo) ? 'text-ios-blue' : 'text-ios-muted'}`}>{isKitAuto ? 'Total de Lienzos' : 'Total de Piezas'}</label>
                          <input
                            inputMode="numeric"
                            value={item.totalPiezas}
                            onChange={e => updateAsignacion(item.id, 'totalPiezas', Number(e.target.value))}
                            disabled={['igual', 'kit'].includes(config.modo)}
                            className={`w-full p-2.5 rounded-xl font-black text-center text-lg transition-colors ${['igual', 'kit'].includes(config.modo) ? 'bg-ios-blue/10 text-ios-blue border-ios-blue/50' : 'bg-ios-input text-white border-transparent'}`}
                          />
                          {['igual', 'kit'].includes(config.modo) && <div className="absolute top-8 right-3 text-ios-blue opacity-50"><Icon name="cpu" size={14}/></div>}
                        </div>
                        <div>
                          <label className="text-[10px] text-ios-muted font-bold uppercase block mb-1.5">{isKitAuto ? 'Lienzos por KIT' : 'Piezas por Paquete'}</label>
                          <input
                            inputMode="numeric"
                            value={item.piezasPorPaquete}
                            onChange={e => updateAsignacion(item.id, 'piezasPorPaquete', Number(e.target.value))}
                            disabled={isKitAuto}
                            className={`w-full p-2.5 rounded-xl text-center font-bold border-transparent focus:border-ios-blue ${isKitAuto ? 'bg-ios-blue/10 text-ios-blue' : 'bg-ios-input text-white'}`}
                          />
                        </div>
                      </div>
                    )}
                  </div>
                ))}
              </div>
            </div>
          )
        })}
        </div>
      </div>

      <div className="p-4 bg-ios-card border-t border-ios-border safe-bottom flex gap-3">
        <button onClick={onClose} className="flex-1 py-4 bg-ios-input text-white rounded-2xl font-bold text-base hover:bg-[#38383a]">Cancelar</button>
        <button onClick={handleConfirmar} className="flex-1 py-4 bg-ios-blue text-white rounded-2xl font-bold text-base shadow-lg shadow-ios-blue/30">Generar Órdenes</button>
      </div>
    </div>
  );
};
