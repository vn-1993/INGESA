	    const renderMeliConfeccionChecklist = item => item.processTrace.length ? <div className="mt-2 space-y-2"><div className="text-[10px] font-black uppercase tracking-wider text-orange-300">Confirmación por proceso</div>{item.processTrace.map(process => {
	        const key = meliProcessKeyFor(item, process);
	        const confirmation = meliProcessConfirmations[key];
	        const selected = meliSelectedProcessKey === key;
	        return <div key={process.id} className={`rounded-lg border p-2 ${confirmation ? 'border-fuchsia-700 bg-fuchsia-950/30' : selected ? 'border-fuchsia-500 bg-fuchsia-950/20' : 'border-slate-700 bg-slate-950/60'}`}><button type="button" disabled={Boolean(confirmation)} onClick={() => setMeliSelectedProcessKey(selected ? null : key)} className="min-h-11 w-full text-left disabled:cursor-default"><div className="flex items-center justify-between gap-2"><span className="font-black text-slate-100">{process.nombre}</span><span className={confirmation ? 'font-black text-fuchsia-300' : process.complete ? 'font-black text-green-400' : process.pieces > 0 ? 'font-black text-orange-400' : 'text-slate-400'}>{confirmation ? 'MELI confirmó' : `${process.pieces}/${item.qty}`}</span></div><div className="mt-1 text-[9px] text-slate-500">{confirmation ? formatTraceDate(confirmation.confirmedAt) : process.firstAt ? `Registrado: ${formatTraceDate(process.firstAt)}` : 'Sin registro de producción.'}</div></button>{selected && !confirmation && <button type="button" disabled={meliSaving} onClick={() => saveMeliProcessConfirmation(item, process)} className="mt-2 min-h-10 w-full rounded-md bg-fuchsia-700 px-3 text-xs font-black text-white disabled:opacity-60">{meliSaving ? 'Guardando…' : `Confirmar ${process.nombre} · segundo toque`}</button>}</div>;
	    })}</div> : <div className="mt-2 rounded-lg border border-slate-700 bg-slate-950/60 p-3 text-xs text-slate-400">Este paquete no tiene procesos de Confección configurados.</div>;
	    const beginMeliSwipe = event => {
		        const touch = event.touches?.[0];
		        if (touch) meliSwipeStartRef.current = { x: touch.clientX, y: touch.clientY };
		    };
		    const finishMeliSwipe = event => {
		        const start = meliSwipeStartRef.current;
		        const touch = event.changedTouches?.[0];
		        meliSwipeStartRef.current = null;
		        if (!start || !touch) return;
		        const dx = touch.clientX - start.x;
		        const dy = touch.clientY - start.y;
		        if (Math.abs(dy) > Math.abs(dx)) {
		            if (dy > 70) closeMeliPicker();
		            return;
		        }
		        if (Math.abs(dx) < 45) return;
		        moveMeliPicker(dx < 0 ? 1 : -1);
		    };

		    const renderPackage = item => {
		        const packageState = selectedArea === 'tejido' ? (item.pkg.finished === true ? 'terminado' : 'sin-iniciar') : item.state;
		        const style = stateStyle[packageState];
		        const open = expandedPkg === item.code;
		        const baseStateClass = selectedArea === 'tejido' ? (packageState === 'terminado' ? 'graph-state-tejido-done' : 'graph-state-pending') : (packageState === 'terminado' ? 'graph-state-confeccion-done' : packageState === 'proceso' ? 'graph-state-confeccion-progress' : 'graph-state-pending');
		        const discrepancyClass = item.discrepancy ? (packageState === 'terminado' ? 'graph-discrepancy-finished' : 'graph-discrepancy-process') : '';
		        return <div key={item.code} className="graph-package-card rounded-lg border border-slate-700 bg-slate-950/80 p-2 shadow-sm">
		            <button type="button" onClick={() => openPackage(item)} className={`graph-package-trigger ${baseStateClass} ${discrepancyClass} min-h-11 w-full text-left`} aria-label={`Consultar paquete ${item.code}, talla ${item.piece.talla || item.pkg.talla || 'sin talla'}${item.discrepancy ? ', con discrepancia registrada' : ''}`}>
		                <div className="graph-package-checkbox-row flex items-center gap-2">
		                    <span aria-hidden="true" className="graph-package-checkbox">{item.discrepancy ? '!' : packageState === 'terminado' ? '✓' : ''}</span>
		                    <span className="truncate text-[10px] font-black text-white">{item.code}</span>
		                </div>
		                <div className="graph-package-summary mt-1 flex items-center justify-between gap-1 text-[9px] text-slate-400">
		                    <span>{item.qty} pzs</span><span className={item.discrepancy ? 'font-black text-red-300' : style.text}>{item.discrepancy ? 'DISCREPANCIA' : packageState === 'terminado' ? 'VER DETALLE' : style.label}</span>
	                </div>
	            </button>
	            {open && <div className="graph-package-details mt-2 border-t border-slate-800 pt-2 text-[9px] space-y-1">{renderPackageDetails(item)}</div>}
	        </div>;
	    };

    return (
        <div className="p-4 pb-8 space-y-4">
            <div className="rounded-xl border border-slate-800 bg-slate-900 p-4 card-shadow">
                <div className="flex flex-col gap-1 mb-3"><div className="text-lg font-black text-white flex items-center gap-2"><Icon name="bar-chart-3" size={20} className="text-rose-400"/> Gráfica de avance</div><div className="text-[10px] uppercase tracking-wider text-slate-500 font-bold">Una combinación específica de Modelo + Partida</div></div>
	                <div className="grid grid-cols-1 md:grid-cols-3 gap-3">
	                    <label className="text-[10px] uppercase font-black tracking-wider text-slate-500">Modelo<select value={selectedModel} onChange={e => { setSelectedModel(e.target.value); setSelectedPartida(''); }} className="mt-1 w-full rounded-lg border border-slate-700 bg-slate-950 p-2.5 text-sm font-bold text-white"><option value="">Selecciona modelo</option>{modelOptions.map(model => <option key={model} value={model}>{model}</option>)}</select></label>
	                    <label className="text-[10px] uppercase font-black tracking-wider text-slate-500">Partida + color<select value={selectedPartida} onChange={e => setSelectedPartida(e.target.value)} className="mt-1 w-full rounded-lg border border-slate-700 bg-slate-950 p-2.5 text-sm font-bold text-white"><option value="">Selecciona partida</option>{partidaOptions.map(partida => <option key={partida.id} value={partida.id}>{partida.id} · {partida.colors.join(' / ') || 'SIN COLOR'}</option>)}</select></label>
	                    <label className="text-[10px] uppercase font-black tracking-wider text-slate-500">Área<select value={selectedArea} onChange={e => setSelectedArea(e.target.value)} className="mt-1 w-full rounded-lg border border-slate-700 bg-slate-950 p-2.5 text-sm font-bold text-white"><option value="tejido">Tejido</option><option value="confeccion">Confección</option></select></label>
	                </div>
	                <div className="mt-3 flex items-center gap-2 rounded-lg border border-slate-800 bg-slate-950/70 p-2"><span className="text-[10px] font-black uppercase tracking-wider text-slate-500">Gráfica de consulta</span><span className="rounded-md bg-blue-700 px-3 py-2 text-xs font-black text-white">AME/MAES <span className="text-[9px] opacity-75">· Observador</span></span></div>
            </div>

            <div className="fixed right-4 bottom-5 z-[120] flex flex-col gap-2"><button type="button" onClick={() => changeGraphZoom(0.1)} className="h-11 w-11 rounded-full border border-rose-400/60 bg-slate-900/95 text-xl font-black text-rose-300 shadow-xl" aria-label="Aumentar zoom">+</button><button type="button" onClick={() => changeGraphZoom(-0.1)} className="h-11 w-11 rounded-full border border-slate-600 bg-slate-900/95 text-xl font-black text-slate-200 shadow-xl" aria-label="Reducir zoom">−</button><span className="rounded-full bg-slate-900/95 px-2 py-1 text-center text-[9px] font-black text-slate-400 shadow">{Math.round(graphZoom * 100)}%</span></div>

            {!selectedPartida ? <div className="rounded-xl border border-dashed border-slate-700 p-10 text-center text-sm font-bold text-slate-500">Selecciona un Modelo y una Partida para consultar el avance.</div> : (
                <div style={{ zoom: graphZoom }}>
                <>
                    <div className="rounded-xl border border-slate-800 bg-slate-900 p-4 card-shadow" onPointerDown={beginGraphLongPress} onPointerUp={cancelGraphLongPress} onPointerLeave={cancelGraphLongPress} onPointerCancel={cancelGraphLongPress} onContextMenu={e => e.preventDefault()}>
                        <div className="flex items-center justify-between gap-3 mb-4"><div><div className="text-sm font-black text-white">{selectedModel} · {selectedPartida} · {selectedColors.join(' / ') || 'SIN COLOR'}</div><div className="text-[10px] text-slate-500 font-bold uppercase">Avance por talla · {selectedArea === 'tejido' ? 'Tejido' : 'Confección'}</div></div><div className="text-right text-[10px] text-slate-400">{selectedPackages.length} paquetes · {tallaRows.reduce((s, r) => s + r.piezas, 0)} piezas</div></div>
                        <div className="space-y-4">
                            {tallaRows.length === 0 ? <div className="text-center text-sm text-slate-500 py-6">No hay paquetes para esta combinación.</div> : (
                                <>
                                    <div className="flex flex-wrap gap-3 text-[10px] font-bold text-slate-400 mb-2">
                                        <span><i className="inline-block w-2 h-2 rounded-sm bg-blue-600 mr-1"/>Tejido</span>
                                        <span><i className="inline-block w-2 h-2 rounded-sm bg-orange-500 mr-1"/>Confección en proceso</span>
		                                        <span><i className="inline-block w-2 h-2 rounded-sm bg-green-600 mr-1"/>Confección terminada</span>
		                                        <span><i className="inline-block w-2 h-2 rounded-sm bg-slate-700 mr-1"/>Pendiente</span>
		                                        <span><i className="inline-block w-2 h-2 rounded-sm bg-red-600 mr-1"/>Discrepancia activa</span>
                                    </div>
	                                    <div className="graph-columns-scroll overflow-x-auto pb-3">
	                                        <div className="graph-talla-grid min-w-[760px] flex items-start gap-3 px-2" style={{ '--graph-talla-columns': Math.min(5, Math.max(1, orderedTallaRows.length)) }}>
	                                            {orderedTallaRows.map(row => {
	                                                const soloTejido = selectedArea === 'tejido' ? Math.min(row.tejido, row.piezas) : 0;
                                                const enConfeccion = selectedArea === 'confeccion' ? Math.max(0, row.confeccion - row.terminadas) : 0;
                                                const terminadas = selectedArea === 'confeccion' ? Math.min(row.terminadas, row.piezas) : 0;
                                                const pendientes = selectedArea === 'tejido' ? Math.max(0, row.piezas - row.tejido) : Math.max(0, row.piezas - row.terminadas);
                                                const total = Math.max(1, row.piezas);
                                                const rowPackages = selectedPackages.filter(item => String(item.piece.talla || item.pkg.talla || 'S/T') === String(row.talla));
                                                return (
	                                                    <div key={row.talla} className="graph-talla-column flex-1 min-w-[132px] flex flex-col items-center">
	                                                        <div className="graph-talla-piece-total w-full text-center text-[10px] font-black text-slate-300 mb-1"><span className="graph-talla-mobile-name">TALLA {row.talla}</span>{row.piezas} pzs</div>
	                                                        <div className="graph-talla-bar w-[78px] h-60 flex flex-col justify-end rounded-t-lg overflow-hidden border border-slate-700 bg-slate-950" title={`Talla ${row.talla}`}>
                                                            <div className="bg-slate-700" style={{ height: `${(pendientes / total) * 100}%` }} />
                                                            <div className="bg-blue-600" style={{ height: `${(soloTejido / total) * 100}%` }} />
                                                            <div className="bg-orange-500" style={{ height: `${(enConfeccion / total) * 100}%` }} />
                                                            <div className="bg-green-600" style={{ height: `${(terminadas / total) * 100}%` }} />
                                                        </div>
	                                                        <div className="graph-talla-name mt-2 text-xs font-black text-white">TALLA {row.talla}</div>
	                                                        <div className="graph-talla-summary text-[9px] text-slate-500 text-center mb-2">{rowPackages.length} paquetes · {Math.max(0, row.piezas - (selectedArea === 'tejido' ? row.tejido : row.terminadas))} pend.</div>
	                                                        <div className="graph-package-list w-full flex flex-col gap-2">{rowPackages.map(renderPackage)}</div>
	                                                    </div>
                                                );
	                                            })}
	                                        </div>
		                                        {expandedPackage && graphProfile !== 'meli' && <div className="graph-mobile-package-details mt-3 rounded-lg border border-slate-700 bg-slate-950/90 p-3 text-[10px] space-y-2"><div className="font-black text-white">Paquete seleccionado · {expandedPackage.code}</div>{renderPackageDetails(expandedPackage)}</div>}
	                                    </div>
	                                    <div className="grid grid-cols-2 md:grid-cols-4 gap-2 text-[10px] font-bold">
                                        <div className="rounded-lg bg-blue-950/40 border border-blue-800/50 p-2 text-blue-300">Tejido: {tallaRows.reduce((s, r) => s + Math.max(0, r.tejido - r.confeccion), 0)} pzs</div>
                                        <div className="rounded-lg bg-orange-950/40 border border-orange-800/50 p-2 text-orange-300">En confección: {tallaRows.reduce((s, r) => s + Math.max(0, r.confeccion - r.terminadas), 0)} pzs</div>
                                        <div className="rounded-lg bg-green-950/40 border border-green-800/50 p-2 text-green-300">Terminadas: {tallaRows.reduce((s, r) => s + r.terminadas, 0)} pzs</div>
                                        <div className="rounded-lg bg-slate-950 border border-slate-800 p-2 text-slate-400">Pendientes: {tallaRows.reduce((s, r) => s + (selectedArea === 'tejido' ? Math.max(0, r.piezas - r.tejido) : Math.max(0, r.piezas - r.terminadas)), 0)} pzs</div>
                                    </div>
                                </>
                            )}
                        </div>
                    </div>

                </>
                </div>
            )}

            {pinModal && <div className="fixed inset-0 z-[220] bg-slate-950/85 backdrop-blur-sm flex items-center justify-center p-4" onClick={() => setPinModal(false)}><div className="w-full max-w-sm rounded-2xl border border-slate-700 bg-slate-900 p-5 shadow-2xl" onClick={e => e.stopPropagation()}><div className="flex items-center gap-2 mb-2"><Icon name="lock" className="text-amber-400" size={20}/><h3 className="font-black text-white">Orden protegido</h3></div><p className="text-xs text-slate-400 mb-4">Introduce el PIN de administración para organizar las tallas.</p><input autoFocus type="password" inputMode="numeric" maxLength={8} value={pinValue} onChange={e => { setPinValue(e.target.value); setPinError(''); }} onKeyDown={e => { if (e.key === 'Enter') openTallaOrganizer(e); }} className="w-full rounded-lg border border-slate-700 bg-slate-950 p-3 text-center tracking-[0.4em] text-white" placeholder="••••••••"/><div className="min-h-5 mt-2 text-center text-xs font-bold text-red-400">{pinError}</div><div className="flex gap-2 mt-3"><button type="button" onClick={() => setPinModal(false)} className="flex-1 rounded-lg border border-slate-700 bg-slate-800 p-2.5 text-xs font-black text-slate-300">Cancelar</button><button type="button" onClick={openTallaOrganizer} className="flex-1 rounded-lg bg-amber-600 p-2.5 text-xs font-black text-white">Continuar</button></div></div></div>}

	            {orderModal && <div className="fixed inset-0 z-[220] bg-slate-950/85 backdrop-blur-sm flex items-center justify-center p-4" onClick={() => setOrderModal(false)}><div className="w-full max-w-md rounded-2xl border border-slate-700 bg-slate-900 p-5 shadow-2xl" onClick={e => e.stopPropagation()}><div className="flex items-center gap-2 mb-1"><Icon name="move-vertical" className="text-rose-400" size={20}/><h3 className="font-black text-white">Orden de tallas</h3></div><p className="text-xs text-slate-400 mb-4">Arrastra con los botones o usa las flechas. Este orden será visible para todos los usuarios.</p><div className="space-y-2 max-h-72 overflow-y-auto">{draftTallaOrder.map((talla, index) => <div key={talla} className="flex items-center gap-2 rounded-lg border border-slate-700 bg-slate-950 p-2"><span className="w-7 text-center text-xs font-black text-slate-500">{index + 1}</span><span className="flex-1 text-sm font-black text-white">TALLA {talla}</span><button type="button" disabled={index === 0} onClick={() => setDraftTallaOrder(current => { const next = [...current]; [next[index - 1], next[index]] = [next[index], next[index - 1]]; return next; })} className="rounded bg-slate-800 px-2 py-1 text-xs text-white disabled:opacity-30">↑</button><button type="button" disabled={index === draftTallaOrder.length - 1} onClick={() => setDraftTallaOrder(current => { const next = [...current]; [next[index], next[index + 1]] = [next[index + 1], next[index]]; return next; })} className="rounded bg-slate-800 px-2 py-1 text-xs text-white disabled:opacity-30">↓</button></div>)}</div><div className="flex gap-2 mt-4"><button type="button" onClick={() => setOrderModal(false)} className="flex-1 rounded-lg border border-slate-700 bg-slate-800 p-2.5 text-xs font-black text-slate-300">Cancelar</button><button type="button" onClick={saveTallaOrder} className="flex-1 rounded-lg bg-rose-600 p-2.5 text-xs font-black text-white">Guardar para todos</button></div></div></div>}

	            {graphProfile === 'meli' && meliScannerOpen && <div className="fixed inset-0 z-[250] flex items-center justify-center bg-slate-950/85 p-4" onClick={closeMeliScanner}><div className="w-full max-w-md rounded-2xl border border-fuchsia-600 bg-slate-900 p-4 shadow-2xl" onClick={event => event.stopPropagation()}><div className="mb-3 flex items-center justify-between gap-3"><div><div className="text-[10px] font-black uppercase tracking-wider text-fuchsia-300">MELI · escáner de paquete</div><div className="text-sm font-black text-white">Apunta al código del paquete</div></div><button type="button" onClick={closeMeliScanner} className="h-10 w-10 rounded-lg border border-rose-700 bg-rose-950/70 text-xl font-black text-rose-200">×</button></div><div className="relative overflow-hidden rounded-xl border border-slate-700"><video ref={meliScannerVideoRef} className="graph-meli-camera-video" autoPlay muted playsInline/><div className="pointer-events-none absolute inset-5 rounded-lg border-2 border-fuchsia-300/90"><span className="absolute -top-5 left-1/2 -translate-x-1/2 whitespace-nowrap rounded bg-fuchsia-700 px-2 py-1 text-[9px] font-black text-white">CÓDIGO DEL PAQUETE</span></div></div><p className="mt-3 text-center text-xs font-bold text-slate-300">{meliScannerMessage || 'Preparando cámara…'}</p><div className="mt-3 flex gap-2"><button type="button" onClick={closeMeliScanner} className="flex-1 rounded-lg border border-slate-600 bg-slate-800 p-2.5 text-xs font-black text-slate-200">Cerrar cámara</button><button type="button" onClick={() => { closeMeliScanner(); setTimeout(openMeliScanner, 80); }} className="flex-1 rounded-lg bg-fuchsia-700 p-2.5 text-xs font-black text-white">Reintentar</button></div></div></div>}

	            {graphProfile !== 'meli' && observerModalItem && <div className="fixed inset-0 z-[230] flex items-center justify-center bg-slate-950/55 p-4" onClick={closeObserverModal}><div className="max-h-[82vh] w-full max-w-md overflow-y-auto rounded-2xl border border-blue-700 bg-slate-900 p-4 shadow-2xl" onClick={event => event.stopPropagation()}><div className="mb-3 flex items-center justify-between gap-3 border-b border-slate-700 pb-2"><div><div className="text-[10px] font-black uppercase tracking-wider text-blue-300">Detalle de paquete · observador</div><div className="text-sm font-black text-white">{observerModalItem.code}</div></div><button type="button" onClick={closeObserverModal} className="h-10 w-10 rounded-lg border border-rose-700 bg-rose-950/70 text-xl font-black text-rose-200">×</button></div><div className="text-[10px] space-y-2">{renderPackageDetails(observerModalItem)}</div></div></div>}

	            {graphProfile === 'meli' && meliPickerItem && <div className="fixed inset-0 z-[230] flex items-end justify-center bg-slate-950/45 p-3" onClick={closeMeliPicker}><div className="graph-meli-dialog w-full max-w-md rounded-2xl border border-fuchsia-700/80 bg-slate-900 p-3 shadow-2xl" onClick={event => event.stopPropagation()}><div className="mb-3 flex items-center gap-2 border-b border-slate-700 pb-2" onTouchStart={beginMeliSwipe} onTouchEnd={finishMeliSwipe}><button type="button" onClick={() => moveMeliPicker(-1)} className="h-10 w-10 shrink-0 rounded-lg border border-slate-600 bg-slate-800 text-lg font-black text-slate-100" aria-label="Paquete anterior">←</button><div className="min-w-0 flex-1 text-center"><div className="text-[9px] font-black uppercase tracking-wider text-fuchsia-300">MELI · revisión {meliPickerIndex + 1}/{selectedPackages.length}</div><div className="truncate text-xs font-black text-white">{meliPickerItem.code}</div><div className="text-[9px] text-slate-400">Talla {meliPickerItem.piece.talla || meliPickerItem.pkg.talla || 'S/T'} · {meliPickerItem.qty} pzs</div></div><button type="button" onClick={() => moveMeliPicker(1)} className="h-10 w-10 shrink-0 rounded-lg border border-slate-600 bg-slate-800 text-lg font-black text-slate-100" aria-label="Siguiente paquete">→</button><button type="button" onClick={closeMeliPicker} className="h-10 w-10 shrink-0 rounded-lg border border-rose-700 bg-rose-950/70 text-xl font-black text-rose-200" aria-label="Cerrar revisión">×</button></div><div className="grid grid-cols-3 gap-2 rounded-lg border border-slate-800 bg-slate-950/60 p-2 text-center text-[10px]"><div><div className="text-slate-500">Tejido</div><div className={meliPickerItem.pkg.finished ? 'font-black text-green-400' : 'font-black text-slate-300'}>{meliPickerItem.pkg.finished ? 'Terminado' : 'Pendiente'}</div></div><div><div className="text-slate-500">Confección</div><div className={meliPickerItem.state === 'terminado' ? 'font-black text-green-400' : meliPickerItem.state === 'proceso' ? 'font-black text-orange-400' : 'font-black text-slate-300'}>{meliPickerItem.state === 'terminado' ? 'Terminada' : meliPickerItem.state === 'proceso' ? 'Proceso' : 'Sin iniciar'}</div></div><button type="button" onClick={() => actions.onViewDetails(meliPickerItem.order)} className="rounded-md bg-blue-950/70 px-1 font-black text-blue-300">Ver orden</button></div><p className="mt-2 text-center text-[9px] text-slate-500">Desliza la cabecera hacia abajo para cerrar o hacia los lados para cambiar de paquete.</p>{selectedArea === 'confeccion' ? renderMeliConfeccionChecklist(meliPickerItem) : meliPackageConfirmations[meliPickerItem.code] ? <div className="mt-2 rounded-lg border border-fuchsia-700 bg-fuchsia-950/50 p-2 text-center text-[10px] font-black text-fuchsia-200">MELI confirmó este paquete · {formatTraceDate(meliPackageConfirmations[meliPickerItem.code].confirmedAt)}</div> : <button type="button" disabled={meliSaving} onClick={() => saveMeliConfirmation(meliPickerItem)} className="mt-2 min-h-11 w-full rounded-lg bg-fuchsia-700 px-3 text-xs font-black text-white shadow disabled:opacity-60">{meliSaving ? 'Guardando…' : 'Confirmar · segundo toque'}</button>}</div></div>}
	        </div>
    );
};

const PlantaScreen = ({ orders, actions }) => {
  const [expandedMachine, setExpandedMachine] = useState(null);
  const [expandedOC, setExpandedOC] = useState(null);
  const [expandedModel, setExpandedModel] = useState(null);
  const [query, setQuery] = useState('');
  
  const [columns, setColumns] = useState(1);
  const [machineOrder, setMachineOrder] = useState([]);
  const [draggedItem, setDraggedItem] = useState(null);
  
  const [statusTab, setStatusTab] = useState('pendientes');
  const [groupMode, setGroupMode] = useState('maquina');
  const [stageFilter, setStageFilter] = useState('todas');

  useEffect(() => {
      const unsub = db.collection('settings').doc('planta_view').onSnapshot(doc => {
          if (doc.exists) {
              const data = doc.data();
              if (data.columns) setColumns(data.columns);
              if (data.machineOrder) setMachineOrder(data.machineOrder);
              if (data.statusTab) setStatusTab(data.statusTab);
              if (data.groupMode) setGroupMode(data.groupMode);
              if (data.stageFilter) setStageFilter(data.stageFilter);
              // Compatibilidad con la configuración anterior.
              if (!data.groupMode && data.viewMode && data.viewMode !== 'terminadas') setGroupMode(data.viewMode);
              if (!data.statusTab && data.viewMode === 'terminadas') setStatusTab('terminadas');
          }
      });
      return () => unsub();
  }, []);

  const activeOrders = useMemo(() => orders.filter(o => o.status !== 'ARCHIVADO'), [orders]);

  const pendingOrders = useMemo(() => activeOrders.filter(o => {
      const total = o.progreso?.length || 0;
      const finished = o.progreso?.filter(p => p.finished).length || 0;
      return total === 0 || finished < total;
  }), [activeOrders]);

  const finishedOrders = useMemo(() => activeOrders.filter(o => {
      const total = o.progreso?.length || 0;
      const finished = o.progreso?.filter(p => p.finished).length || 0;
      return total > 0 && finished === total;
  }), [activeOrders]);

  const baseOrders = statusTab === 'terminadas' ? finishedOrders : statusTab === 'todas' ? activeOrders : pendingOrders;
  const stageOrders = useMemo(() => baseOrders.filter(order => orderMatchesStage(order, stageFilter)), [baseOrders, stageFilter]);

  const filteredForGrouping = useMemo(() => {
    if (!query) return stageOrders;
    const q = query.toUpperCase();
    return stageOrders.filter(o => {
      const packageText = (o.progreso || o.paquetes || o.lotes || []).flatMap(p => [p.codigoUnico, p.codigo, p.shortCode, p.baseCodigo, p.codigoBase]).filter(Boolean).join(' ').toUpperCase();
      return String(o.partida||'').toUpperCase().includes(q) || String(o.codigo||o.modelo||'').toUpperCase().includes(q) || String(o.cliente||'').toUpperCase().includes(q) || String(o.maquina).includes(q) || String(o.ordenCompra||'').toUpperCase().includes(q) || String(o.nombreModeloCliente||'').toUpperCase().includes(q) || packageText.includes(q);
    });
  }, [stageOrders, query]);

  const machineGroups = useMemo(() => {
    const groups = {};
    filteredForGrouping.forEach(o => { if (!groups[o.maquina]) groups[o.maquina] = []; groups[o.maquina].push(o); });
    return Object.keys(groups).sort((a, b) => parseInt(a) - parseInt(b)).map(k => ({ id: k, orders: groups[k] }));
  }, [filteredForGrouping]);

  const ocGroups = useMemo(() => {
    const groups = {};
    filteredForGrouping.forEach(o => {
      const ocKey = o.ordenCompra ? String(o.ordenCompra).toUpperCase() : o.partida;
      if (!groups[ocKey]) {
        groups[ocKey] = { id: ocKey, orders: [], partidas: {} };
      }
      groups[ocKey].orders.push(o);
      
      const pcKey = `${o.partida} · ${o.color || 'S/C'}`;
      if (!groups[ocKey].partidas[pcKey]) {
        groups[ocKey].partidas[pcKey] = { id: pcKey, orders: [] };
      }
      groups[ocKey].partidas[pcKey].orders.push(o);
    });
    return Object.values(groups).sort((a, b) => a.id.localeCompare(b.id));
  }, [filteredForGrouping]);

  const modelGroups = useMemo(() => {
      const groups = {};
      filteredForGrouping.forEach(o => {
          const modKey = o.codigo || 'S/M';
          if(!groups[modKey]) {
              groups[modKey] = { id: modKey, modelName: modKey, orders: [] };
          }
          groups[modKey].orders.push(o);
      });
      
      return Object.values(groups).map(mg => {
          mg.orders.sort((a, b) => getPartidaDateValue(a.partida) - getPartidaDateValue(b.partida));
          return mg;
      }).sort((a, b) => a.modelName.localeCompare(b.modelName));
  }, [filteredForGrouping]);

  const summary = useMemo(() => {
    let pendientes = 0;
    pendingOrders.forEach(o => { pendientes += (o.progreso?.filter(p => !p.finished).length || 0); });
    
    const mqs = new Set();
    const ocs = new Set();
    pendingOrders.forEach(o => {
       mqs.add(o.maquina);
       const ocKey = o.ordenCompra ? String(o.ordenCompra).toUpperCase() : o.partida;
       ocs.add(ocKey);
    });
    
    return { maquinas: mqs.size, pendientes, ordenes: ocs.size };
  }, [pendingOrders]);

  const stageSummary = useMemo(() => {
      const countPackages = list => list.reduce((sum, order) => sum + getOrderPackages(order).filter(pkg => orderMatchesStage({ ...order, progreso: [pkg] }, stageFilter)).length, 0);
      const countMachines = list => new Set(list.filter(order => orderMatchesStage(order, stageFilter)).map(order => order.maquina || 'S/M')).size;
      return {
          pendientes: countPackages(pendingOrders),
          terminadas: countPackages(finishedOrders),
          maquinas: countMachines([...pendingOrders, ...finishedOrders])
      };
  }, [pendingOrders, finishedOrders, stageFilter]);

  const orderedGroups = useMemo(() => {
    if (groupMode === 'oc') return ocGroups;
    if (groupMode === 'modelo') return modelGroups;
    // Máquina y PARTIDAS parten de la misma separación por máquina;
    // PARTIDAS usa un acordeón que expone cada paquete individualmente.
    const groups = [...machineGroups];
    if (machineOrder.length > 0) {
        groups.sort((a, b) => {
            const idxA = machineOrder.indexOf(a.id);
            const idxB = machineOrder.indexOf(b.id);
            if (idxA !== -1 && idxB !== -1) return idxA - idxB;
            if (idxA !== -1) return -1;
            if (idxB !== -1) return 1;
            return 0;
        });
    }
    return groups;
  }, [machineGroups, ocGroups, modelGroups, machineOrder, groupMode]);

  const visibleGroups = useMemo(() => {
     if (groupMode === 'maquina' || groupMode === 'partidas') return expandedMachine ? orderedGroups.filter(g => g.id === expandedMachine) : orderedGroups;
     if (groupMode === 'oc') return expandedOC ? orderedGroups.filter(g => g.id === expandedOC) : orderedGroups;
     return expandedModel ? orderedGroups.filter(g => g.id === expandedModel) : orderedGroups;
  }, [groupMode, orderedGroups, expandedMachine, expandedOC, expandedModel]);

  let gridClass = 'grid-cols-1';
  if (columns === 2) gridClass = 'grid-cols-1 md:grid-cols-2';
  if (columns === 3) gridClass = 'grid-cols-1 md:grid-cols-2 lg:grid-cols-3';

  const handleDragStart = (e, id) => {
    if (groupMode !== 'maquina') return;
    setDraggedItem(id);
    e.dataTransfer.effectAllowed = 'move';
    e.dataTransfer.setData('text/plain', id);
  };
  const handleDragOver = (e) => { e.preventDefault(); e.dataTransfer.dropEffect = 'move'; };
  const handleDrop = (e, targetId) => {
    e.preventDefault();
    if (groupMode !== 'maquina') return;
    if (!draggedItem || draggedItem === targetId) return;
    const newOrder = orderedGroups.map(g => g.id);
    const draggedIdx = newOrder.indexOf(draggedItem);
    const targetIdx = newOrder.indexOf(targetId);
    newOrder.splice(draggedIdx, 1);
    newOrder.splice(targetIdx, 0, draggedItem);
    
    db.collection('settings').doc('planta_view').set({ machineOrder: newOrder }, { merge: true });
    setDraggedItem(null);
  };

  const updateColumns = (cols) => db.collection('settings').doc('planta_view').set({ columns: cols }, { merge: true });
  
  const updateGroupMode = (mode) => {
      setGroupMode(mode);
      db.collection('settings').doc('planta_view').set({ groupMode: mode }, { merge: true });
      setExpandedMachine(null); setExpandedOC(null); setExpandedModel(null);
  };

  const updateStatusTab = (tab) => {
      setStatusTab(tab);
      db.collection('settings').doc('planta_view').set({ statusTab: tab }, { merge: true });
      setExpandedMachine(null); setExpandedOC(null); setExpandedModel(null);
  };

  const updateStageFilter = (stage) => {
      setStageFilter(stage);
      db.collection('settings').doc('planta_view').set({ stageFilter: stage }, { merge: true });
      setExpandedMachine(null); setExpandedOC(null); setExpandedModel(null);
  };

  const generateGlobalPDF = () => {
      const doc = new window.jspdf.jsPDF('landscape');
      doc.setFontSize(14);
      doc.text("Reporte Global de Producción (Pendiente)", 14, 15);
      doc.setFontSize(10);
      doc.text(`Fecha: ${new Date().toLocaleString('es-MX')}`, 14, 22);

      const tableData = [];
      const byModel = {};
      pendingOrders.forEach(o => {
         const mod = o.codigo || 'S/M';
         if(!byModel[mod]) byModel[mod] = [];
         byModel[mod].push(o);
      });

      Object.keys(byModel).sort().forEach(mod => {
         byModel[mod].sort((a,b) => getPartidaDateValue(a.partida) - getPartidaDateValue(b.partida)).forEach(o => {
            const pkgs = o.progreso||[];
            const finished = pkgs.filter(p=>p.finished).length;
            const total = pkgs.length;
            const pct = total ? Math.round((finished/total)*100) : 0;
            tableData.push([
               mod,
               o.partida,
               o.cliente,
               o.maquina,
               `${finished}/${total} (${pct}%)`,
               o.ordenCompra || '-'
            ]);
         });
      });

      doc.autoTable({
         startY: 28,
         head: [['Modelo', 'Partida', 'Cliente', 'Máquina', 'Avance', 'Orden de Compra']],
         body: tableData,
         theme: 'grid',
         headStyles: { fillColor: [30, 41, 59] }
      });

      doc.save(`Produccion_Pendiente_${new Date().toISOString().split('T')[0]}.pdf`);
  };

  return (
    <div className="p-4 pb-4">
      <div className="bg-slate-900 text-white rounded-xl p-3 mb-4 flex flex-col md:flex-row justify-between items-center border border-slate-800 card-shadow gap-3">
        <div className="flex justify-around text-center w-full md:w-auto md:gap-8">
            <div><div className="text-2xl font-black text-blue-400">{summary.pendientes}</div><div className="text-[10px] text-slate-400 font-bold">PAQUETES PENDIENTES</div></div>
            <div><div className="text-2xl font-black">{summary.maquinas}</div><div className="text-[10px] text-slate-400 font-bold">MÁQUINAS</div></div>
            <div className="hidden sm:block"><div className="text-2xl font-black">{summary.ordenes}</div><div className="text-[10px] text-slate-400 font-bold">ÓRDENES C.</div></div>
        </div>

        <div className="rounded-xl border border-slate-800 bg-slate-950/80 px-3 py-2 text-left min-w-[180px] md:max-w-[230px]">
            <div className="text-[10px] font-black uppercase tracking-wider text-slate-500">Control de área</div>
            <div className="mt-1 text-sm font-black text-white">{stageFilter === 'todas' ? 'Todas las áreas' : stageFilter.replace('-', ' ').toUpperCase()}</div>
            <div className="mt-2 grid grid-cols-3 gap-2 text-[10px]">
                <div><div className="text-amber-400 font-black">{stageSummary.pendientes}</div><div className="text-slate-500">Pend.</div></div>
                <div><div className="text-emerald-400 font-black">{stageSummary.terminadas}</div><div className="text-slate-500">Term.</div></div>
                <div><div className="text-blue-400 font-black">{stageSummary.maquinas}</div><div className="text-slate-500">Máq.</div></div>
            </div>
        </div>
        
        <div className="flex flex-col gap-2 w-full md:w-auto">
           <div className="flex items-center gap-2 overflow-x-auto hide-scrollbar">
             <span className="text-[10px] font-black uppercase tracking-wider text-slate-500 shrink-0">Estado</span>
             <div className="flex bg-slate-950 p-1 rounded-lg border border-slate-800 items-center shrink-0">
                <button onClick={() => updateStatusTab('pendientes')} className={`px-3 py-1.5 rounded text-xs font-black transition-colors ${statusTab === 'pendientes' ? 'bg-amber-600 text-white shadow' : 'text-slate-400 hover:text-white'}`}>Pendientes</button>
                <button onClick={() => updateStatusTab('todas')} className={`px-3 py-1.5 rounded text-xs font-black transition-colors ${statusTab === 'todas' ? 'bg-slate-700 text-white shadow' : 'text-slate-400 hover:text-white'}`}>Todas</button>
                <button onClick={() => updateStatusTab('terminadas')} className={`px-3 py-1.5 rounded text-xs font-black transition-colors ${statusTab === 'terminadas' ? 'bg-emerald-600 text-white shadow' : 'text-slate-400 hover:text-white'}`}>Terminadas</button>
             </div>
           </div>
           <div className="flex items-center gap-2 overflow-x-auto hide-scrollbar">
             <span className="text-[10px] font-black uppercase tracking-wider text-slate-500 shrink-0">Área</span>
             <div className="flex bg-slate-950 p-1 rounded-lg border border-slate-800 items-center shrink-0">
                <button onClick={() => updateStageFilter('tejido')} className={`px-3 py-1.5 rounded text-xs font-black transition-colors ${stageFilter === 'tejido' ? 'bg-blue-600 text-white shadow' : 'text-slate-400 hover:text-white'}`}>Tejido</button>
                <button onClick={() => updateStageFilter('post-tejido')} className={`px-3 py-1.5 rounded text-xs font-black transition-colors ${stageFilter === 'post-tejido' ? 'bg-emerald-600 text-white shadow' : 'text-slate-400 hover:text-white'}`}>Post-Tejido</button>
                <button onClick={() => updateStageFilter('post-teñido')} className={`px-3 py-1.5 rounded text-xs font-black transition-colors ${stageFilter === 'post-teñido' ? 'bg-green-700 text-white shadow' : 'text-slate-400 hover:text-white'}`}>Post-Teñido</button>
                <button onClick={() => updateStageFilter('confeccion')} className={`px-3 py-1.5 rounded text-xs font-black transition-colors ${stageFilter === 'confeccion' ? 'bg-rose-700 text-white shadow' : 'text-slate-400 hover:text-white'}`}>Confección</button>
                <button onClick={() => updateStageFilter('todas')} className={`px-3 py-1.5 rounded text-xs font-black transition-colors ${stageFilter === 'todas' ? 'bg-slate-700 text-white shadow' : 'text-slate-400 hover:text-white'}`}>Todas</button>
             </div>
           </div>
           <div className="flex items-center gap-2 overflow-x-auto hide-scrollbar">
             <span className="text-[10px] font-black uppercase tracking-wider text-slate-500 shrink-0">Agrupar</span>
             <div className="flex bg-slate-950 p-1 rounded-lg border border-slate-800 items-center shrink-0">
                <button onClick={() => updateGroupMode('maquina')} className={`px-3 py-1.5 rounded text-xs font-black transition-colors ${groupMode === 'maquina' ? 'bg-blue-600 text-white shadow' : 'text-slate-400 hover:text-white'}`}>Máquina</button>
                <button onClick={() => updateGroupMode('oc')} className={`px-3 py-1.5 rounded text-xs font-black transition-colors ${groupMode === 'oc' ? 'bg-blue-600 text-white shadow' : 'text-slate-400 hover:text-white'}`}>O.C.</button>
                <button onClick={() => updateGroupMode('modelo')} className={`px-3 py-1.5 rounded text-xs font-black transition-colors ${groupMode === 'modelo' ? 'bg-blue-600 text-white shadow' : 'text-slate-400 hover:text-white'}`}>Modelo</button>
             </div>
             <button onClick={() => updateGroupMode('partidas')} className={`shrink-0 px-3 py-1.5 rounded-lg border text-xs font-black transition-colors flex items-center gap-1 ${groupMode === 'partidas' ? 'bg-rose-700 border-rose-500 text-white shadow' : 'bg-slate-950 border-slate-800 text-rose-300 hover:text-white'}`}><Icon name="package" size={14}/> PARTIDAS</button>
             <button onClick={generateGlobalPDF} className="shrink-0 bg-rose-600 hover:bg-rose-500 text-white px-3 py-1.5 rounded-lg text-xs font-bold transition-colors flex items-center gap-1 shadow"><Icon name="file-text" size={14}/> PDF Global</button>
             <div className="hidden lg:flex gap-1 bg-slate-950 p-1.5 rounded-lg border border-slate-800 shrink-0">
                <button onClick={() => updateColumns(1)} className={`p-1.5 rounded transition-colors ${columns === 1 ? 'bg-blue-600 text-white' : 'text-slate-400 hover:text-white'}`}><Icon name="align-justify" size={16}/></button>
                <button onClick={() => updateColumns(2)} className={`p-1.5 rounded transition-colors ${columns === 2 ? 'bg-blue-600 text-white' : 'text-slate-400 hover:text-white'}`}><Icon name="layout-grid" size={16}/></button>
                <button onClick={() => updateColumns(3)} className={`p-1.5 rounded transition-colors ${columns === 3 ? 'bg-blue-600 text-white' : 'text-slate-400 hover:text-white'}`}><Icon name="columns" size={16}/></button>
             </div>
           </div>
        </div>
      </div>

      <div className="relative mb-4">
        <input value={query} onChange={e=>setQuery(e.target.value)} placeholder="Buscar por OC, partida, modelo, cliente..." className="w-full p-3 pl-10 bg-slate-900 border border-slate-800 text-slate-100 placeholder-slate-500 rounded-xl shadow-sm focus:outline-none focus:border-blue-500"/>
        <Icon name="search" size={18} className="absolute left-3 top-3.5 text-slate-500"/>
      </div>
      
      {orderedGroups.length === 0 && <div className="text-center text-slate-500 py-10">{statusTab === 'terminadas' ? 'No hay órdenes listas para archivar.' : statusTab === 'todas' ? 'No hay órdenes activas.' : 'Sin producción activa.'}</div>}
      
      <div className={`grid gap-4 ${gridClass}`}>
        {visibleGroups.map(g => (
          <div 
            key={g.id} 
            draggable={groupMode === 'maquina' && !query && !expandedMachine} 
            onDragStart={(e) => handleDragStart(e, g.id)}
            onDragOver={handleDragOver}
            onDrop={(e) => handleDrop(e, g.id)}
            onDragEnd={() => setDraggedItem(null)}

const queryValues = value => {
    const values = [value];
    if (value !== null && value !== undefined && value !== '') {
        const numeric = Number(value);
        if (!Number.isNaN(numeric) && String(numeric) === String(value)) values.push(numeric);
        values.push(String(value));
    }
    return [...new Set(values.map(v => String(v)))].map(v => (typeof value === 'number' && v === String(value)) ? value : v);
};
const findTraceDocs = async (collectionName, fields, values) => {
    const found = new Map();
    for (const field of fields) for (const value of values.filter(v => v !== undefined && v !== null && v !== '').flatMap(queryValues)) {
        try { const snap = await db.collection(collectionName).where(field, '==', value).get(); snap.forEach(doc => found.set(doc.ref.path, doc)); }
        catch (error) { console.warn(`No se pudo consultar ${collectionName}.${field}`, error); }
    }
    return [...found.values()];
};
const deleteDocsInChunks = async docs => {
    for (let i = 0; i < docs.length; i += 400) { const batch = db.batch(); docs.slice(i, i + 400).forEach(doc => batch.delete(doc.ref)); await batch.commit(); }
};
const waitForPurgeCommand = (commandId, timeoutMs = 30000) => new Promise((resolve, reject) => {
    const ref = db.collection('purga_pruebas').doc(commandId);
    let finished = false;
    let unsubscribe = () => {};
    const timer = setTimeout(() => { if (!finished) { finished = true; unsubscribe(); reject(new Error('HILATURAS no confirmó la purga. No se eliminó la orden ni su bitácora.')); } }, timeoutMs);
    unsubscribe = ref.onSnapshot(doc => {
        const data = doc.data() || {};
        if (data.estado === 'PROCESADO') { finished = true; clearTimeout(timer); unsubscribe(); resolve(data); }
        if (data.estado === 'ERROR') { finished = true; clearTimeout(timer); unsubscribe(); reject(new Error(data.error || 'HILATURAS rechazó la purga.')); }
    }, error => { if (!finished) { finished = true; clearTimeout(timer); unsubscribe(); reject(error); } });
});
const purgeTestOrder = async order => {
    const orderId = String(order.id);
    const packageIds = (order.progreso || []).map(pkg => pkg.id).filter(Boolean);
    const codes = (order.progreso || []).flatMap(pkg => [pkg.codigoUnico, pkg.codigo, pkg.codigo_paquete]).filter(Boolean);
    const values = [order.id, orderId, order.partida, ...packageIds, ...codes].filter(Boolean);
    const historyDocs = await findTraceDocs('consumo_hilo_historial', ['orderId', 'pkgId', 'codigoUnico'], values);
    const restoreByMaterial = {};
    historyDocs.forEach(doc => { const data = doc.data() || {}; const materialId = data.materialId; const kilos = Number(data.kilos) || 0; if (materialId && kilos > 0) restoreByMaterial[materialId] = (restoreByMaterial[materialId] || 0) + kilos; });
    const commandRef = db.collection('purga_pruebas').doc();
    await commandRef.set({ tipo:'PURGE_TEST', estado:'PENDIENTE', orderId, partida:order.partida || '', packageIds, codes, restaurarPorMaterial:restoreByMaterial, solicitadoEn:FieldValue.serverTimestamp(), solicitadoDesde:'PLANTA' });
    const commandData = await waitForPurgeCommand(commandRef.id);
    const movementIds = commandData.movementIds || [];
    const traceTargets = [
        ['registro_produccion', ['orderId', 'codigo_paquete', 'codigoUnico']], ['paquetes_historial', ['orderId', 'pkgId', 'codigoUnico', 'codigo']], ['consumo_hilo_historial', ['orderId', 'pkgId', 'codigoUnico']], ['inventory_movements', ['purgaCommandId', 'orderId', 'pkgId']], ['produccion_movimientos', ['orderId', 'codigoUnico', 'packageId']], ['alertas_admin', ['orderId', 'codigoUnico', 'packageId']], ['alertas_reposicion', ['orderId', 'codigoUnico', 'packageId']], ['reportes_operadores', ['orderId', 'codigoUnico', 'codigo_paquete']], ['calidad_casos', ['orderId', 'codigoUnico', 'packageId']], ['reportes_calidad', ['orderId', 'codigoUnico', 'packageId']], ['alertas_historial', ['orderId', 'codigoUnico', 'packageId']], ['libreta_defectos', ['orderId', 'codigoUnico', 'packageId']]
    ];
    const traceDocs = new Map();
    for (const [collectionName, fields] of traceTargets) (await findTraceDocs(collectionName, fields, values)).forEach(doc => traceDocs.set(doc.ref.path, doc));
    for (const movementId of movementIds) traceDocs.set(`inventory_movements/${movementId}`, { ref:db.collection('inventory_movements').doc(movementId) });
    historyDocs.forEach(doc => traceDocs.set(doc.ref.path, doc));
    await deleteDocsInChunks([...traceDocs.values()]);
    await db.collection('orders').doc(orderId).delete();
    await commandRef.delete();
    return { deleted:traceDocs.size, restored:commandData.restauradoPorMaterial || {} };
};

const App = () => {
  const [orders, setOrders] = useState([]);
  const [inventory, setInventory] = useState([]);
  const [logs, setLogs] = useState([]);
  const [schedules, setSchedules] = useState(defaultSchedule);
  
  const [editingOrder, setEditingOrder] = useState(null);
  const [printingOrder, setPrintingOrder] = useState(null);
  const [detailedOrder, setDetailedOrder] = useState(null);
  const [archivingOrder, setArchivingOrder] = useState(null);
  const [msg, setMsg] = useState('');
  const [confeccionRecords, setConfeccionRecords] = useState([]);
  const [confeccionModels, setConfeccionModels] = useState({});
  const [showMeliNotebook, setShowMeliNotebook] = useState(false);
  const [meliDiscrepancyCount, setMeliDiscrepancyCount] = useState(0);
  const [meliDiscrepancyAlerts, setMeliDiscrepancyAlerts] = useState({});

  const [activeModule, setActiveModule] = useState(() => localStorage.getItem('planta.lastModule') || 'planta');
  const [drawerOpen, setDrawerOpen] = useState(false);
  useEffect(() => { localStorage.setItem('planta.lastModule', activeModule); }, [activeModule]);

  useEffect(() => {
    const u1 = db.collection('orders').onSnapshot(s => setOrders(s.docs.map(d => ({...d.data(), id: d.id}))));
    const u2 = db.collection('inventory').doc('main').onSnapshot(d => setInventory(d.exists && d.data().items ? d.data().items : []));
    const u3 = db.collection('paquetes_historial').orderBy('timestamp', 'desc').onSnapshot(s => setLogs(s.docs.map(d => ({id: d.id, ...d.data()}))));
    const u4 = db.collection('settings').doc('schedules').onSnapshot(d => { if (d.exists) setSchedules(d.data()); });
    const u5 = db.collection('registros_confeccion').orderBy('fecha', 'desc').onSnapshot(s => {
      setConfeccionRecords(s.docs.map(d => ({ id: d.id, ...d.data() })));
    }, error => { console.warn('No se pudieron leer registros_confeccion:', error); setConfeccionRecords([]); });
    const u6 = db.collection('modelos_confeccion').onSnapshot(s => {
      const models = {};
      s.docs.forEach(d => { const data = d.data() || {}; models[String(d.id)] = Array.isArray(data.procesos) ? data.procesos : []; });
      setConfeccionModels(models);
    }, error => { console.warn('No se pudieron leer modelos_confeccion:', error); setConfeccionModels({}); });
    const u7 = db.collection('alertas_discrepancias_meli').onSnapshot(s => {
      const rows = s.docs.map(d => ({ id: d.id, ...d.data() }));
      const active = rows.filter(alert => alert.status === 'activa');
      const indexed = {};
      rows.forEach(alert => {
        const code = String(alert.packageCode || alert.codigoUnico || '').trim().toUpperCase();
        if (!code) return;
        if (!indexed[code]) indexed[code] = { active: null, latest: null, hasHistory: false };
        const entry = indexed[code];
        entry.latest = alert;
        if (alert.status === 'activa') entry.active = alert;
        if (alert.status === 'historial') entry.hasHistory = true;
      });
      setMeliDiscrepancyCount(active.length);
      setMeliDiscrepancyAlerts(indexed);
    }, error => { console.warn('No se pudieron leer discrepancias MELI:', error); setMeliDiscrepancyCount(0); setMeliDiscrepancyAlerts({}); });
    
    return () => { u1(); u2(); u3(); u4(); u5(); u6(); u7(); };
  }, []);

  const flash = (m) => { setMsg(m); setTimeout(() => setMsg(''), 4000); };

  const onEdit = (order) => setEditingOrder(order);
  const onPrint = (order) => setPrintingOrder(order);
  const onViewDetails = (order) => setDetailedOrder(order);
  const onArchiveIntent = (order) => setArchivingOrder(order);

  const onSaveEdit = async (updated) => {
    try {
      const packages = updated.progreso || updated.predefinedPackages || [];
      await db.collection('orders').doc(String(updated.id)).update({
        cliente: updated.cliente, color: updated.color, maquina: updated.maquina,
        ordenCompra: updated.ordenCompra || '', nombreModeloCliente: updated.nombreModeloCliente || '',
        threading: updated.threading, subPiecesData: updated.subPiecesData, progreso: packages,
        imagenSeleccionada: updated.imagenSeleccionada || null
      });
      setEditingOrder(null);
      flash('Orden actualizada.');
    } catch (err) { console.error(err); alert('Error al guardar.'); }
  };

  const handleArchiveConfirm = async (actionType) => {
      const order = archivingOrder;
      if (!order) return;
      if (actionType === 'DELETE' && (order.progreso || []).some(p => p.finished)) { alert('Esta orden ya tiene escaneos. Para una prueba usa la limpieza oculta manteniendo ARCHIVAR 3 segundos.'); return; }
      setArchivingOrder(null);
      if (detailedOrder && detailedOrder.id === order.id) setDetailedOrder(null);
      try {
          const orderRef = db.collection('orders').doc(String(order.id));
          if (actionType === 'ARCHIVE') { await orderRef.update({ status:'ARCHIVADO', archivedAt:FieldValue.serverTimestamp(), archivedFrom:'PLANTA' }); flash('Orden archivada. No se modificó el inventario.'); }
          else if (actionType === 'DELETE') { await orderRef.delete(); flash('Orden eliminada. No se modificó el inventario.'); }
          else if (actionType === 'PURGE_TEST') { const result = await purgeTestOrder(order); flash(`Prueba eliminada. ${result.deleted} registros limpiados y el hilo escaneado fue reintegrado por HILATURAS.`); }
      } catch (err) { console.error(err); alert(err.message || 'Ocurrió un error al procesar la prueba.'); }
  };

  const togglePackageState = async (orderId, pkgId, stage) => {
      const order = orders.find(o => o.id === orderId);
      if (!order) return;
      const pkg = order.progreso.find(p => p.id === pkgId);
      if (!pkg) return;

      if (stage === 'tejido') {
          const willBeFinished = !pkg.finished;
          const pieceData = order.subPiecesData.find(sp => sp.pieza === pkg.piezaNombre);
          const pesoGramos = pieceData ? (Number(pieceData.peso) || 0) : 0;
          const packageKg = (pkg.cantidad * pesoGramos) / 1000;

          const materialUpdates = [];
          if (packageKg > 0 && order.threading) {
              order.threading.forEach(t => {
                  if (t.materialId && Number(t.porcentaje) > 0) {
                      materialUpdates.push({
                          id: t.materialId,
                          name: t.material,
                          kg: packageKg * (Number(t.porcentaje) / 100)
                      });
                  }
              });
          }

          const now = new Date();
          const dateStr = willBeFinished ? now.toLocaleString('es-MX', { dateStyle: 'short', timeStyle: 'short' }) : '';

          const newProgreso = order.progreso.map(p => {
              if (p.id === pkgId) {
                  return { 
                      ...p, 
                      finished: willBeFinished, 
                      tejedor: willBeFinished ? 'PLANTA' : '', 
                      fecha: dateStr, 
                      defectos: '', 
                      agujas: '',
                      tenidoFinished: willBeFinished ? p.tenidoFinished : false
                  };
              }
              return p;
          });

          if(detailedOrder && detailedOrder.id === orderId) {
              setDetailedOrder({...detailedOrder, progreso: newProgreso});
          }

          try {
              await db.runTransaction(async (transaction) => {
                  const invRef = db.collection('inventory').doc('main');
                  const invDoc = await transaction.get(invRef);
                  let items = invDoc.exists ? (invDoc.data().items || []) : [];

                  if (materialUpdates.length > 0) {
                      items = items.map(item => {
                          const update = materialUpdates.find(u => u.id === item.id);
                          if (update) {
                              const change = willBeFinished ? -update.kg : update.kg;
                              item.stock = parseFloat((parseFloat(item.stock || 0) + change).toFixed(3));
                          }
                          return item;
                      });
                      transaction.update(invRef, { items });
                  }

                  const orderRef = db.collection('orders').doc(String(orderId));
                  transaction.update(orderRef, { progreso: newProgreso });
              });

              if (willBeFinished) {
                  for (const mu of materialUpdates) {
                      await db.collection('consumo_hilo_historial').add({
                          pkgId: pkg.id,
                          orderId: order.id,
                          ordenCompra: order.ordenCompra || '',
                          partida: order.partida,
                          pieza: pkg.piezaNombre,
                          talla: pieceData ? pieceData.talla : '',
                          maquina: order.maquina,
                          materialId: mu.id,
                          materialName: mu.name,
                          kilos: mu.kg,
                          timestamp: Date.now()
                      });
                  }
              } else {
                  const historySnap = await db.collection('consumo_hilo_historial').where('pkgId', '==', pkg.id).get();
                  const batch = db.batch();
                  historySnap.forEach(doc => batch.delete(doc.ref));
                  await batch.commit();
                  flash('Check removido. Hilo reintegrado a Hilaturas y bitácora eliminada.');
              }

          } catch (err) {
              console.error("Fallo transaccional:", err);
              alert("Error al procesar el paquete y modificar inventario: " + err.message);
          }
      } 
      else if (stage === 'tenido') {
          const willBeTenido = !pkg.tenidoFinished;
          const newProgreso = order.progreso.map(p => {
              if (p.id === pkgId) return { ...p, tenidoFinished: willBeTenido };
              return p;
          });
          if(detailedOrder && detailedOrder.id === orderId) setDetailedOrder({...detailedOrder, progreso: newProgreso});
          await db.collection('orders').doc(String(orderId)).update({ progreso: newProgreso });
      }
      else if (stage === 'post_tejido') {
          const willBePT = !(pkg.estadoQC === 'revisado_tejido' || pkg.estadoQC === 'revisado_tenido' || pkg.estadoQC === 'confeccion');
          const newProgreso = order.progreso.map(p => {
              if (p.id === pkgId) return { ...p, estadoQC: willBePT ? 'revisado_tejido' : 'pendiente', fase: willBePT ? 'Post-Tejido' : '' };
              return p;
          });
          if(detailedOrder && detailedOrder.id === orderId) setDetailedOrder({...detailedOrder, progreso: newProgreso});
          await db.collection('orders').doc(String(orderId)).update({ progreso: newProgreso });
      }
      else if (stage === 'confeccion') {
          const willBeConf = pkg.estadoQC !== 'confeccion' && pkg.estadoQC !== 'revisado_tenido';
          const newProgreso = order.progreso.map(p => {
              if (p.id === pkgId) return { ...p, estadoQC: willBeConf ? 'confeccion' : 'revisado_tejido', fase: willBeConf ? 'Confección' : 'Post-Tejido' };
              return p;
          });
          if(detailedOrder && detailedOrder.id === orderId) setDetailedOrder({...detailedOrder, progreso: newProgreso});
          await db.collection('orders').doc(String(orderId)).update({ progreso: newProgreso });
      } 
      else if (stage === 'post_tenido') {
          const willBePTN = pkg.estadoQC !== 'revisado_tenido';
          const newProgreso = order.progreso.map(p => {
              if (p.id === pkgId) return { ...p, estadoQC: willBePTN ? 'revisado_tenido' : 'confeccion', fase: willBePTN ? 'Post-Teñido' : 'Confección' };
              return p;
          });
          if(detailedOrder && detailedOrder.id === orderId) setDetailedOrder({...detailedOrder, progreso: newProgreso});
          await db.collection('orders').doc(String(orderId)).update({ progreso: newProgreso });
      }
  };

  const ordersWithConfeccion = useMemo(() => orders.map(order => {
      const packageField = Array.isArray(order.progreso) ? 'progreso' : (Array.isArray(order.paquetes) ? 'paquetes' : 'lotes');
      const sourcePackages = Array.isArray(order[packageField]) ? order[packageField] : [];
      const normalizedPackages = sourcePackages.map(pkg => {
          const packageCode = String(pkg.codigoUnico || pkg.codigo || pkg.shortCode || pkg.codigo_paquete || '').trim();
          const packageRecords = packageCode ? confeccionRecords.filter(record => String(record.paquete_codigo || record.codigoUnico || '').trim() === packageCode) : [];
          if (packageRecords.length === 0) return pkg;
          const registeredPieces = packageRecords.reduce((sum, record) => sum + (Number(record.piezas) || 0), 0);
          return { ...pkg, estadoQC: 'confeccion', fase: 'Confección', confeccionRegistrado: true, confeccionPiezas: registeredPieces };
      });
      return { ...order, progreso: normalizedPackages };
  }), [orders, confeccionRecords]);

  const actions = { onEdit, onPrint, onArchiveIntent, onViewDetails };

  const validLogs = useMemo(() => {
      return logs.filter(log => {
          const order = orders.find(o => o.id === log.orderId || o.codigo === log.codigo);
          if (!order || order.status === 'ARCHIVADO') return false;
          const pkg = order.progreso?.find(p => p.id === log.pkgId || p.codigoUnico === log.codigoUnico);
          if (!pkg) return false;
          return pkg.finished === true || pkg.tenidoFinished === true || pkg.estadoQC === 'revisado_tejido' || pkg.estadoQC === 'confeccion' || pkg.estadoQC === 'revisado_tenido';
      });
  }, [logs, orders]);

  if (printingOrder) return <PrintOrder order={printingOrder} onBack={() => setPrintingOrder(null)} />;
  if (editingOrder) return <OrderEditor draft={editingOrder} inventory={inventory} isExisting={true} onCancel={() => setEditingOrder(null)} onSave={onSaveEdit} />;

  const modulesConfig = [
        { id: 'planta', name: 'Control de Planta', icon: 'layers', desc: 'Monitoreo de Máquinas y OC', color: 'text-indigo-400' },
        { id: 'graph', name: 'Gráfica de Avance', icon: 'bar-chart-3', desc: 'Modelo + Partida por talla', color: 'text-rose-400' },
        { id: 'calendar', name: 'Calendario & Historial', icon: 'calendar', desc: 'Paquetes de Producción', color: 'text-blue-400' },
        { id: 'reports', name: 'Reportes', icon: 'file-text', desc: 'Auditoría por Turno', color: 'text-emerald-400' },
        { id: 'schedules', name: 'Horarios', icon: 'clock', desc: 'Turnos y Calentamiento', color: 'text-purple-400' },
  ];

  return (
    <div className="flex flex-col h-screen bg-slate-950 text-slate-100 overflow-hidden relative">
      {showMeliNotebook && <LibretaDiscrepanciasPlanta onClose={() => setShowMeliNotebook(false)} />}
      {msg && (
        <div className="absolute top-0 left-0 right-0 z-[200] bg-emerald-950 text-emerald-300 border-b border-emerald-800 text-sm font-bold p-3 text-center shadow-lg animate-bounce">
          {msg}
        </div>
      )}

      <header className="bg-slate-900 border-b border-slate-800 p-4 sticky top-0 z-50 flex items-center justify-between no-print shadow-sm">
        <div className="flex items-center gap-3">
            <button 
                onClick={() => setDrawerOpen(!drawerOpen)} 
                className="p-2.5 bg-slate-800 hover:bg-slate-700 border border-slate-700 rounded-xl text-white transition-colors flex items-center justify-center shadow-sm"
            >
                <Icon name={drawerOpen ? "x" : "menu"} size={22} />
            </button>
            <div>
                <h1 className="text-lg font-black text-white tracking-tight flex items-center gap-2 leading-none">
                    <Icon name="layers" className="text-indigo-500" size={20}/> SISTEMA PLANTA
                </h1>
                <span className="text-[10px] text-slate-400 font-bold uppercase tracking-wider">
                    {modulesConfig.find(m=>m.id===activeModule)?.name}
                </span>
            </div>
        </div>

        <div className="flex items-center gap-2">
            <button onClick={() => setShowMeliNotebook(true)} className="relative p-2.5 bg-slate-800 hover:bg-slate-700 border border-slate-700 rounded-xl text-rose-200 transition-colors flex items-center justify-center shadow-sm" title="Libreta de discrepancias MELI">
                <Icon name="book-open" size={20} />
                {meliDiscrepancyCount > 0 && <span className="absolute -top-2 -right-2 min-w-[18px] h-[18px] px-1 rounded-full bg-red-600 text-white border-2 border-slate-950 text-[9px] font-black flex items-center justify-center">{meliDiscrepancyCount}</span>}
            </button>
            <span className="bg-slate-800 border border-slate-700 text-slate-300 text-xs px-3 py-1.5 rounded-lg font-bold shadow-inner">
                {orders.filter(o=>o.status!=='ARCHIVADO').length} Activas
            </span>
        </div>
      </header>

      {drawerOpen && (
          <div className="fixed inset-0 z-[140] bg-slate-950/85 backdrop-blur-sm flex justify-start no-print" onClick={() => setDrawerOpen(false)}>
              <div className="w-80 bg-slate-900 border-r border-slate-800 h-full p-4 flex flex-col drawer-slide shadow-2xl" onClick={e=>e.stopPropagation()}>
                  <div className="flex items-center justify-between pb-4 mb-4 border-b border-slate-800">
                      <h2 className="font-black text-white text-base uppercase tracking-wider flex items-center gap-2">
                          <Icon name="menu" className="text-indigo-500"/> Menú Principal
                      </h2>
                      <button onClick={() => setDrawerOpen(false)} className="p-2 text-slate-400 hover:text-white"><Icon name="x"/></button>
                  </div>

                  <div className="space-y-2 flex-1 overflow-y-auto">
                      {modulesConfig.map(mod => {
                          const isActive = activeModule === mod.id;
                          return (
                              <button
                                  key={mod.id}
                                  onClick={() => { setActiveModule(mod.id); localStorage.setItem('planta.lastModule', mod.id); setDrawerOpen(false); }}
                                  className={`w-full p-3.5 rounded-xl border text-left transition-all flex items-start gap-3 ${isActive ? 'bg-indigo-600/25 border-indigo-500 shadow-md' : 'bg-slate-800/40 border-slate-800 hover:bg-slate-800'}`}
                              >
                                  <div className={`p-2 rounded-lg bg-slate-950 ${mod.color}`}>
                                      <Icon name={mod.icon} size={20} />
                                  </div>
                                  <div>
                                      <div className={`font-bold text-sm ${isActive ? 'text-white' : 'text-slate-200'}`}>{mod.name}</div>
                                      <div className="text-[10px] text-slate-400 mt-0.5">{mod.desc}</div>
                                  </div>
                              </button>
                          );
                      })}
                  </div>

                  <div className="mt-auto pt-4 border-t border-slate-800 text-[10px] text-slate-500 text-center font-mono">
                      Planta Unified System &middot; 2026
                  </div>
              </div>
          </div>
      )}

      <main className="flex-1 overflow-y-auto relative">
          {activeModule === 'planta' && <PlantaScreen orders={ordersWithConfeccion} actions={actions} />}
	          {activeModule === 'graph' && <ProgressGraphView orders={ordersWithConfeccion} confeccionRecords={confeccionRecords} confeccionModels={confeccionModels} productionLogs={logs} discrepancyAlerts={meliDiscrepancyAlerts} actions={actions} />}
          {activeModule === 'calendar' && <CalendarSubView logs={logs} orders={orders} schedules={schedules} />}
          {activeModule === 'reports' && <ReportsSubView logs={validLogs} />}
          {activeModule === 'schedules' && <ScheduleConfigSubView schedules={schedules} />}
      </main>

      {detailedOrder && (
        <OrderDetailModal 
            order={detailedOrder} 
            confeccionRecords={confeccionRecords}
            actions={actions}
            onClose={() => setDetailedOrder(null)} 
            togglePackageState={togglePackageState} 
        />
      )}

      {archivingOrder && (
        <ArchiveRecoveryModal 
          order={archivingOrder} 
          onClose={() => setArchivingOrder(null)} 
          onConfirm={handleArchiveConfirm} 
        />
      )}
    </div>
  );
};

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
</script>
</body>
</html>
