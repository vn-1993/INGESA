const palabrasLibreta = texto => String(texto || '').trim().split(/\s+/).filter(Boolean).length;
const LibretaDiscrepanciasPlanta = ({ onClose }) => {
  const [entries, setEntries] = useState([]), [view, setView] = useState('activa'), [config, setConfig] = useState({ minWords: 12 }), [drafts, setDrafts] = useState({}), [busy, setBusy] = useState(''), [error, setError] = useState('');
  useEffect(() => { const u1=db.collection('alertas_discrepancias_meli').onSnapshot(s=>{const next=s.docs.map(d=>({id:d.id,...d.data()}));next.sort((a,b)=>((b.updatedAt||b.createdAt)?.seconds||0)-((a.updatedAt||a.createdAt)?.seconds||0));setEntries(next);}); const u2=db.collection('settings').doc('discrepancy_notebook').onSnapshot(s=>{if(s.exists)setConfig(prev=>({...prev,...s.data()}));}); return()=>{u1();u2();}; },[]);
  const active=entries.filter(e=>e.status==='activa'), history=entries.filter(e=>e.status==='historial'), shown=view==='activa'?active:history, minWords=Math.max(1,Number(config.minWords)||12);
  const archive=async entry=>{const text=String(drafts[entry.id]||'').trim(), words=palabrasLibreta(text);if(words<minWords){setError(`La aclaración necesita ${minWords} palabras. Lleva ${words}.`);return;}setBusy(entry.id);setError('');try{await db.collection('alertas_discrepancias_meli').doc(entry.id).update({status:'historial',aclaracion:text,aclaracionPalabras:words,aclaradaPor:'PLANTA',historyAt:FieldValue.serverTimestamp(),updatedAt:FieldValue.serverTimestamp()});}catch(e){setError(`No se pudo archivar: ${e.message}`);}finally{setBusy('');}};
  return <div className="fixed inset-0 z-[300] bg-black/85 backdrop-blur-sm p-3 sm:p-6 flex items-center justify-center"><div className="plant-notebook-cover relative w-full max-w-4xl h-[90vh] rounded-[18px] p-3 sm:p-5"><div className="plant-notebook-rings">{Array.from({length:10}).map((_,i)=><span key={i} className="plant-notebook-ring"/>)}</div><div className="plant-notebook-paper relative h-full rounded-[10px] border-2 border-[#bcae98] overflow-hidden flex flex-col"><div className="relative z-10 ml-12 mr-4 mt-4 pb-3 border-b-2 border-[#6f6255] flex justify-between gap-3"><div><div className="text-2xl sm:text-3xl font-black tracking-wide text-[#4a1017]">LIBRETA DE DISCREPANCIAS</div><div className="text-[10px] font-bold uppercase tracking-widest text-[#6f6255]">MELI · Piezas pendientes de aclaración</div></div><button onClick={onClose} className="w-10 h-10 rounded-full bg-[#4a1017] text-white border-2 border-[#27060a] text-xl font-black">×</button></div><div className="relative z-10 ml-12 mr-4 mt-3 flex gap-2 border-b border-[#bcae98] pb-3"><button onClick={()=>setView('activa')} className={`px-3 py-2 text-[10px] font-black border-2 ${view==='activa'?'bg-[#4a1017] text-white border-[#27060a]':'bg-[#fffdf6] text-[#4a1017] border-[#bcae98]'}`}>ACTIVAS · {active.length}</button><button onClick={()=>setView('historial')} className={`px-3 py-2 text-[10px] font-black border-2 ${view==='historial'?'bg-[#4a1017] text-white border-[#27060a]':'bg-[#fffdf6] text-[#4a1017] border-[#bcae98]'}`}>HISTORIAL · {history.length}</button>{view==='activa'&&<span className="ml-auto self-center text-[9px] font-bold text-[#6f6255]">Mínimo: {minWords} palabras</span>}</div><div className="relative z-10 flex-1 overflow-y-auto ml-12 mr-4 py-4 pr-1 space-y-4">{error&&<div className="plant-notebook-entry p-3 text-xs font-bold text-red-700">{error}</div>}{shown.map(entry=>{const label=entry.diferenciaPiezas<0?`FALTAN ${Math.abs(entry.diferenciaPiezas)} PZS`:`SOBRAN +${entry.diferenciaPiezas} PZS`;return <div key={entry.id} className="plant-notebook-entry p-3 sm:p-4"><div className="flex flex-wrap justify-between gap-2"><div><div className="font-black text-[#4a1017]">{label}</div><div className="font-mono text-[11px] text-[#51483e] break-all">{entry.packageCode||'SIN CÓDIGO'}</div></div><span className="border border-[#bcae98] bg-[#fffdf6] px-2 py-1 text-[9px] font-black text-[#51483e]">{entry.partida||'SIN PARTIDA'} · {entry.talla||'S/T'}</span></div><div className="mt-3 grid grid-cols-3 gap-2 text-center"><div><div className="text-[9px] text-[#6f6255]">ESPERADAS</div><div className="font-black">{entry.piezasEsperadas}</div></div><div><div className="text-[9px] text-[#6f6255]">REALES</div><div className="font-black">{entry.piezasReales}</div></div><div><div className="text-[9px] text-[#6f6255]">MODELO</div><div className="font-black truncate">{entry.modelo||'S/M'}</div></div></div>{view==='activa'?<div className="mt-4"><textarea value={drafts[entry.id]||''} onChange={e=>setDrafts(prev=>({...prev,[entry.id]:e.target.value}))} placeholder={`Aclaración para enviar al historial (${minWords} palabras mínimo)…`} className="w-full min-h-[90px] resize-y border-2 border-[#bcae98] bg-[#fffdf6] p-3 text-xs text-[#24211d] outline-none"/><div className="mt-2 flex justify-between gap-2"><span className="text-[10px] font-bold text-[#6f6255]">{palabrasLibreta(drafts[entry.id])}/{minWords} palabras</span><button disabled={busy===entry.id} onClick={()=>archive(entry)} className="bg-[#4a1017] border-2 border-[#27060a] px-3 py-2 text-[10px] font-black text-white disabled:opacity-50">{busy===entry.id?'MOVIENDO…':'ACLARAR Y ARCHIVAR'}</button></div></div>:<div className="mt-4 border-t border-[#bcae98] pt-3"><div className="text-[9px] font-black text-[#6f6255]">ACLARACIÓN · {entry.aclaradaPor||'SIN USUARIO'}</div><p className="mt-1 text-xs leading-5 text-[#24211d] whitespace-pre-wrap">{entry.aclaracion||'Sin aclaración registrada.'}</p></div>}</div>;})}{!shown.length&&<div className="py-16 text-center text-sm font-bold text-[#6f6255]">{view==='activa'?'No hay discrepancias activas.':'El historial está vacío.'}</div>}</div></div></div></div>;
};

const ICON_EMOJIS = {
    'pencil': '✏️', 'search': '🔍', 'trash-2': '🗑️', 'printer': '🖨️', 'archive': '📁',

    'book-open': '📕', 'move-vertical': '↕️'
};
const Icon = ({ name, size = 18, className = '' }) => (
    <span aria-hidden="true" className={`inline-flex shrink-0 items-center justify-center leading-none ${className || ''}`} style={{ width: size, height: size, fontSize: Math.max(12, size - 1) }}>
        {ICON_EMOJIS[name] || '•'}
    </span>

const getColorCode = (color) => {
  if (!color) return 'XX';
  const clean = color.trim().toUpperCase().replace(/[^A-ZÁÉÍÓÚÑ ]/g, '');
  const firstWord = clean.split(/\s+/)[0] || '';
  if (firstWord.length === 0) return 'XX';
  if (firstWord.length === 1) return (firstWord + 'X');
  return firstWord.substring(0, 2);
};
const buildCodigoUnico = (baseCodigo, color) => `${baseCodigo}${getColorCode(color)}`;
const getBaseCodigo = (pkg) => pkg.baseCodigo || pkg.codigoUnico || '';
const emptyThread = (guia) => ({ guia, material: '', porcentaje: '', materialId: null });

const getPartidaDateValue = (partidaStr) => {
   if(!partidaStr) return 0;
   const months = { 'ENE':1, 'FEB':2, 'MAR':3, 'ABR':4, 'MAY':5, 'JUN':6, 'JUL':7, 'AGO':8, 'SEP':9, 'OCT':10, 'NOV':11, 'DIC':12 };
   const parts = partidaStr.split('_');
   const prefix = parts[0]; 
   if(prefix && prefix.length >= 5) {
      const m = prefix.substring(0,3).toUpperCase();
      const y = prefix.substring(3);
      const monthNum = months[m] || 0;
      const yearNum = parseInt(y) || 0;
      return (2000 + yearNum) * 100 + monthNum;
   }
   return 0;
};

const HoldArchiveButton = ({ onArchive, onReveal }) => {
    const timerRef = useRef(null);
    const heldRef = useRef(false);
    const clearTimer = () => { if (timerRef.current) clearTimeout(timerRef.current); timerRef.current = null; };
    const beginHold = () => {
        heldRef.current = false;
        clearTimer();
        timerRef.current = setTimeout(() => { heldRef.current = true; onReveal(); }, 3000);
    };
    const finishHold = () => { clearTimer(); if (!heldRef.current) onArchive(); };
    return (
        <button
            type="button"
            onPointerDown={beginHold}
            onPointerUp={finishHold}
            onPointerCancel={finishHold}
            onPointerLeave={finishHold}
            onContextMenu={event => event.preventDefault()}
            className="w-full py-3 bg-amber-600 hover:bg-amber-500 text-white rounded-lg font-bold flex items-center justify-center gap-2 select-none touch-none"
            title="Toca para archivar. Mantén presionado 3 segundos para mostrar la limpieza de prueba."
        >
            <Icon name="archive" size={18} /> Archivar Orden
        </button>
    );
};

const ArchiveRecoveryModal = ({ order, onClose, onConfirm }) => {
    const totalPkgs = order.progreso?.length || 0;
    const finishedPkgs = order.progreso?.filter(pkg => pkg.finished).length || 0;
    const unfinishedPkgs = totalPkgs - finishedPkgs;
    const isComplete = totalPkgs > 0 && unfinishedPkgs === 0;
    const canDeleteNormally = finishedPkgs === 0;
    const [showPurge, setShowPurge] = useState(false);

    return (
        <div className="fixed inset-0 bg-slate-900/90 z-[160] flex items-center justify-center p-4 backdrop-blur-sm">
            <div className="bg-slate-800 rounded-2xl border border-slate-600 shadow-2xl w-full max-w-md overflow-hidden text-slate-200">
                <div className={`p-4 border-b flex items-center gap-3 ${isComplete ? 'bg-blue-900/50 border-blue-800/50 text-blue-300' : 'bg-amber-900/50 border-amber-800/50 text-amber-400'}`}>
                    <Icon name={isComplete ? 'archive' : 'alert-triangle'} size={24} />
                    <h2 className="font-bold text-lg">{isComplete ? 'Archivar Orden Completada' : 'Orden Incompleta - Decisión'}</h2>
                </div>
                <div className="p-5">
                    <div className="flex justify-between text-sm mb-4 bg-slate-900 p-3 rounded-lg border border-slate-700">
                        <div><span className="text-slate-500 block text-xs font-bold uppercase">Partida</span><span className="font-black text-white">{order.partida} (MQ {order.maquina})</span></div>
                        <div className="text-right"><span className="text-slate-500 block text-xs font-bold uppercase">Progreso</span><span className={`font-black ${isComplete ? 'text-green-400' : 'text-amber-400'}`}>{finishedPkgs} de {totalPkgs} pqs</span></div>
                    </div>
                    <p className="text-sm text-slate-300 mb-4 leading-relaxed">
                        {isComplete ? 'La orden se tejió en su totalidad. Puedes archivarla sin modificar el inventario.' : <>La orden tiene <strong className="text-white">{unfinishedPkgs} paquetes pendientes</strong>. Archivar no devuelve material, no modifica el inventario y no elimina el consumo real registrado por el escáner.</>}
                    </p>
                    <div className="bg-slate-900/80 border border-slate-700 rounded-lg p-3 text-xs text-slate-400 mb-4"><strong className="text-slate-200">Regla de operación:</strong> el hilo se descuenta únicamente cuando el escáner registra un paquete. PLANTA no hará devoluciones automáticas al archivar ni al eliminar normalmente.</div>
                    {!canDeleteNormally && <div className="bg-rose-900/20 border border-rose-800/50 p-3 rounded-lg mb-4 text-xs text-rose-300">Esta orden ya tiene paquetes escaneados. Eliminarla normalmente está bloqueado; usa la limpieza secreta de prueba solo si esta orden pertenece a una prueba.</div>}

const ConfeccionProcessPanel = ({ order, pkg, open, onToggle }) => {
    const [processes, setProcesses] = useState([]);
    const [records, setRecords] = useState([]);

    useEffect(() => {
        if (!open) return undefined;
        const modelId = order.codigo || order.modelo;
        if (!modelId || !pkg.codigoUnico) {
            setProcesses([]);
            setRecords([]);
            return undefined;
        }

        const unsubModel = db.collection('modelos_confeccion').doc(String(modelId)).onSnapshot(doc => {
            setProcesses(doc.exists && Array.isArray(doc.data().procesos) ? doc.data().procesos : []);
        }, () => setProcesses([]));

        const unsubRecords = db.collection('registros_confeccion').where('paquete_codigo', '==', String(pkg.codigoUnico)).onSnapshot(snap => {
            setRecords(snap.docs.map(d => ({ id: d.id, ...d.data() })));
        }, () => setRecords([]));

        return () => { unsubModel(); unsubRecords(); };
    }, [open, order.codigo, order.modelo, pkg.codigoUnico]);

    const totalPieces = Number(pkg.cantidad) || 0;
    const getProcessRecords = (processId) => records.filter(r => String(r.proceso_id) === String(processId));

    return (
        <div className="mt-2 ml-2 border-l-2 border-amber-500/60 pl-3">
            <button
                type="button"
                onClick={onToggle}
                className="w-full flex items-center justify-between gap-2 rounded-lg border border-amber-800/70 bg-amber-950/30 px-3 py-2 text-left hover:bg-amber-950/60 transition-colors"
            >
                <span className="flex items-center gap-2 text-[11px] font-black uppercase tracking-wider text-amber-300">
                    <Icon name="layers" size={14}/> Confección · procesos del paquete
                </span>
                <span className="flex items-center gap-1 text-[10px] font-bold text-amber-400">
                    {open ? 'Ocultar' : 'Abrir'} <Icon name={open ? 'chevron-up' : 'chevron-down'} size={14}/>
                </span>
            </button>

            {open && (
                <div className="mt-2 rounded-lg border border-amber-900/70 bg-slate-950/80 p-2">
                    {processes.length === 0 ? (
                        <div className="p-3 text-center text-[11px] text-slate-500">Este modelo aún no tiene procesos configurados en modelos_confeccion.</div>
                    ) : (
                        <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-2">
                            {processes.map((process, index) => {
                                const processRecords = getProcessRecords(process.id);
                                const registered = processRecords.reduce((sum, record) => sum + (Number(record.piezas) || 0), 0);
                                const remaining = Math.max(0, totalPieces - registered);
                                const isComplete = totalPieces > 0 && remaining === 0;
                                const latest = processRecords.slice().sort((a, b) => String(b.fecha_local || '').localeCompare(String(a.fecha_local || '')))[0];
                                return (
                                    <div key={String(process.id || index)} className={`rounded-lg border p-2.5 ${isComplete ? 'border-green-800/70 bg-green-950/20' : 'border-slate-800 bg-slate-900/80'}`}>
                                        <div className="flex items-start gap-2">
                                            <span className={`flex h-6 w-6 shrink-0 items-center justify-center rounded-full text-[10px] font-black ${isComplete ? 'bg-green-600 text-white' : 'bg-amber-600 text-white'}`}>{index + 1}</span>
                                            <div className="min-w-0 flex-1">
                                                <div className={`truncate text-[11px] font-black uppercase ${isComplete ? 'text-green-300' : 'text-slate-200'}`}>{process.nombre || `Proceso ${index + 1}`}</div>
                                                <div className="mt-1 text-[10px] text-slate-500">{registered} / {totalPieces} piezas</div>
                                            </div>
                                        </div>
                                        <div className="mt-2 flex items-center justify-between gap-2 text-[10px]">
                                            <span className={remaining === 0 ? 'text-green-400 font-bold' : 'text-amber-400 font-bold'}>{remaining === 0 ? 'Completo' : `Faltan ${remaining}`}</span>
                                            <span className="truncate text-slate-500">{latest?.empleado_nombre || 'Sin registro'}</span>
                                        </div>
                                    </div>
                                );
                            })}
                        </div>
                    )}
                </div>
            )}
        </div>
    );
};

const SmartImage = ({ codigo, className, onSelectVariant, selectedVariant, hideOptionsButton = false }) => {
  const [imgSrc, setImgSrc] = useState(null);
  const [variants, setVariants] = useState([]);
  const [showSelector, setShowSelector] = useState(false);
  const [loading, setLoading] = useState(true);
  const [showOptions, setShowOptions] = useState(false);
  const [showGallery, setShowGallery] = useState(false);
  const [galleryImages, setGalleryImages] = useState([]);
  const [loadingGallery, setLoadingGallery] = useState(false);
  const DEFAULT_IMAGE_REPO = 'https://raw.githubusercontent.com/sweaters-liliana/MAES2O26/refs/heads/main/IMAGENES/';

  useEffect(() => {
    if (!codigo) { setLoading(false); return; }
    const unsub = db.collection('imagenes_editadas').doc(codigo).onSnapshot(doc => {
      const localImg = doc.exists ? doc.data().localImage : null;
      if (localImg) { setImgSrc(localImg); setLoading(false); return; }
      if (selectedVariant && selectedVariant.url) { setImgSrc(selectedVariant.url); setLoading(false); return; }
      fetchVariants();
    });
    return () => unsub();
  }, [codigo, selectedVariant]);

  const fetchVariants = async () => {
    const allVariants = [];
    try {
      const regex = /https:\/\/raw\.githubusercontent\.com\/([^/]+)\/([^/]+)\/([^/]+)\/(.*)/;
      const match = DEFAULT_IMAGE_REPO.match(regex);
      if (match) {
        const [, user, repo, branch, path] = match;
        const apiUrl = `https://api.github.com/repos/${user}/${repo}/contents/${path}?ref=${branch}`;
        const res = await fetch(apiUrl);
        if (res.ok) {
          const files = await res.json();
          if (Array.isArray(files)) {
            const matching = files.filter(f => f.type === 'file' && f.name.toUpperCase().startsWith(codigo.toUpperCase()) && /\.(jpg|jpeg|png)$/i.test(f.name));
            matching.forEach(f => allVariants.push({ name: f.name, url: f.download_url }));
          }
        }
      }
    } catch (e) {}
    setVariants(allVariants);
    if (allVariants.length > 0) { setImgSrc(allVariants[0].url); }
    else { const base = DEFAULT_IMAGE_REPO.endsWith('/') ? DEFAULT_IMAGE_REPO : DEFAULT_IMAGE_REPO + '/'; setImgSrc(`${base}${codigo}.jpg`); }
    setLoading(false);
  };

  const handleError = () => {
    if (variants.length > 0) return;
    if (imgSrc && imgSrc.endsWith('.jpg')) setImgSrc(imgSrc.replace('.jpg', '.png'));
    else setImgSrc(null);
  };

  const handleVariantSelect = (variant) => {
    if (onSelectVariant) onSelectVariant(variant);
    setImgSrc(variant.url);
    setShowSelector(false);
  };

  const openGallery = async () => {
    setLoadingGallery(true);
    setShowGallery(true);
    try {
      const regex = /https:\/\/raw\.githubusercontent\.com\/([^/]+)\/([^/]+)\/([^/]+)\/(.*)/;
      const match = DEFAULT_IMAGE_REPO.match(regex);
      if (match) {
        const [, user, repo, branch, path] = match;
        const apiUrl = `https://api.github.com/repos/${user}/${repo}/contents/${path}?ref=${branch}`;
        const res = await fetch(apiUrl);
        if (res.ok) {
          const files = await res.json();
          if (Array.isArray(files)) {
            const images = files.filter(f => f.type === 'file' && /\.(jpg|jpeg|png)$/i.test(f.name));
            setGalleryImages(images.map(f => ({ name: f.name, url: f.download_url })));
          }
        }
      }
    } catch (e) {}
    setLoadingGallery(false);
  };

  const compressForStorage = (file) => new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = (e) => {
      const img = new Image();
      img.onload = () => {
        const MAX_W = 500, MAX_H = 1344;
        let w = img.width, h = img.height;
        if (w > MAX_W || h > MAX_H) { const ratio = Math.min(MAX_W / w, MAX_H / h); w = Math.round(w * ratio); h = Math.round(h * ratio); }
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
        resolve(canvas.toDataURL('image/jpeg', 0.75));
      };
      img.onerror = reject;
      img.src = e.target.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });

  const handleLocalUpload = async (e) => {
    const file = e.target.files[0];
    if (!file) return;
    try {
      const dataUrl = await compressForStorage(file);
      await db.collection('imagenes_editadas').doc(codigo).set({ localImage: dataUrl, updatedAt: FieldValue.serverTimestamp() }, { merge: true });
      setImgSrc(dataUrl);
      if (onSelectVariant) onSelectVariant({ name: 'Local', url: dataUrl });
      setShowOptions(false);
    } catch (err) { alert('Error al subir imagen: ' + err.message); }
  };

  if (loading) return <div className={`bg-slate-900 flex items-center justify-center text-slate-500 ${className}`}>Cargando...</div>;
  return (
    <div className="relative inline-block w-full h-full">
      {imgSrc ? (
        <img src={imgSrc} onError={handleError} className={className} alt={codigo} onClick={() => !hideOptionsButton && setShowOptions(true)} />
      ) : (
        hideOptionsButton ? (
          <div className={`placeholder-img bg-slate-900 text-slate-400 ${className}`}>SIN IMAGEN</div>
        ) : (
          <div className={`flex flex-col items-center justify-center bg-slate-900 text-slate-500 ${className}`} onClick={() => setShowOptions(true)}>

          </div>
        )
      )}
      {!hideOptionsButton && (
        <button onClick={(e) => { e.stopPropagation(); setShowOptions(true); }} className="absolute bottom-1 right-1 bg-slate-800/90 rounded-full p-1 shadow text-white" title="Cambiar imagen">

      )}

              </button>

                <Icon name="upload-cloud" size={14} /> Subir imagen local

        <div className="fixed inset-0 bg-black/80 z-[200] flex items-center justify-center text-white" onClick={(e)=>e.stopPropagation()}>
          <div className="bg-slate-800 border border-slate-700 rounded-xl w-full max-w-md p-4 max-h-[80vh] flex flex-col">
            <div className="flex justify-between items-center mb-3">
              <h3 className="font-bold text-sm">Galería del repositorio</h3>
              <button onClick={() => setShowGallery(false)}><Icon name="x" size={18} /></button>
            </div>
            <div className="flex-1 overflow-y-auto">
              {loadingGallery ? (
                <div className="text-center py-10 text-slate-400">Cargando imágenes...</div>
              ) : (
                <div className="grid grid-cols-2 gap-2">
                  {galleryImages.map((img, i) => (
                    <div key={i} className="border border-slate-700 bg-slate-900 rounded p-1 cursor-pointer hover:border-indigo-500" onClick={() => { handleVariantSelect(img); setShowGallery(false); }}>
                      <img src={img.url} alt={img.name} className="w-full h-20 object-contain bg-slate-950" />
                      <div className="text-[10px] font-bold text-center truncate mt-1 text-slate-300">{img.name}</div>
                    </div>
                  ))}
                  {galleryImages.length === 0 && !loadingGallery && (
                    <div className="col-span-2 text-center py-10 text-slate-400">No se encontraron imágenes.</div>

const TimeInput = ({ value, onChange }) => {
  const [mins, setMins] = useState('');
  const [secs, setSecs] = useState('');
  useEffect(() => {
    if (value === undefined || value === '' || value === null) { setMins(''); setSecs(''); return; }
    const total = parseFloat(value);
    const m = Math.floor(total);
    const s = Math.round((total - m) * 60);
    setMins(m.toString());
    setSecs(s < 10 ? '0' + s : s.toString());
  }, [value]);
  const handle = (newM, newS) => { const m = parseInt(newM)||0; const s = parseInt(newS)||0; onChange((m + s/60).toFixed(4)); };
  return (
    <div className="flex items-center gap-0.5">
      <input inputMode="numeric" value={mins} placeholder="m" onChange={e=>{setMins(e.target.value); handle(e.target.value,secs);}} className="w-12 text-center border border-slate-700 rounded p-1.5 font-mono text-xs bg-slate-900 text-white"/>
      <span className="font-bold text-slate-500">:</span>
      <input inputMode="numeric" value={secs} placeholder="s" max="59" onChange={e=>{setSecs(e.target.value); handle(mins,e.target.value);}} className="w-12 text-center border border-slate-700 rounded p-1.5 font-mono text-xs bg-slate-900 text-white"/>
    </div>
  );
};

const MaterialInput = ({ value, onSelect, onChangeText, inventory }) => {
  const [suggestions, setSuggestions] = useState([]);
  const [open, setOpen] = useState(false);
  const handleInput = (val) => { onChangeText(val); if(val.length>1){ setSuggestions(inventory.filter(i=>`${i.material} ${i.color}`.toLowerCase().includes(val.toLowerCase()))); setOpen(true); } else setOpen(false); };
  return (<div className="relative"><input value={value} onChange={e=>handleInput(e.target.value)} onFocus={()=>value.length>1 && setOpen(true)} placeholder="Buscar material..." className="w-full border border-slate-700 rounded-lg p-2 bg-slate-900 text-white"/>{open && suggestions.length>0 && (<div className="absolute z-30 bg-slate-800 border border-slate-700 shadow-xl w-full max-h-52 overflow-y-auto mt-1 rounded-lg">{suggestions.map(item=>(<div key={item.id} onClick={()=>{onSelect(item); setOpen(false);}} className="p-3 hover:bg-slate-700 active:bg-slate-600 cursor-pointer border-b border-slate-700 flex justify-between items-center text-white"><div><span className="font-bold text-slate-200">{item.material}</span><span className="text-slate-400 ml-1">- {item.color}</span></div><span className="bg-green-900/50 border border-green-700 text-green-300 px-2 py-0.5 rounded text-[10px] font-bold shrink-0 ml-2">{item.stock||0}kg</span></div>))}</div>)}</div>);
};

const OrderEditor = ({ draft, inventory, isExisting, onSave, onCancel }) => {
  const [local, setLocal] = useState(draft);
  const [showColorHint, setShowColorHint] = useState(false);
  const [selectedImage, setSelectedImage] = useState(draft.imagenSeleccionada || null);

  const regenerarColorCodes = () => {
    const packages = local.progreso || local.predefinedPackages || [];
    const updated = packages.map(p => { const base = getBaseCodigo(p); return { ...p, baseCodigo: base, codigoUnico: buildCodigoUnico(base, local.color) }; });
    if(local.progreso) setLocal({...local, progreso: updated});
    else setLocal({...local, predefinedPackages: updated});
    setShowColorHint(false);
  };
  const updateThread = (i,field,val)=>{ const n=[...(local.threading||[])]; n[i]={...n[i],[field]:val}; setLocal({...local, threading:n}); };
  const selectMat = (i,item)=>{ const n=[...local.threading]; n[i]={...n[i], material:`${item.material} - ${item.color}`, materialId:item.id}; setLocal({...local, threading:n}); };
  const removeThread = (i)=>setLocal({...local, threading: local.threading.filter((_,idx)=>idx!==i)});
  const addThread = ()=>setLocal({...local, threading:[...(local.threading||[]), emptyThread((local.threading?.length||0)+1)]});
  const updatePiece = (i,field,val)=>{ const n=[...local.subPiecesData]; n[i]={...n[i],[field]:val}; setLocal({...local, subPiecesData:n}); };

  const packages = local.progreso || local.predefinedPackages || [];
  const setPackages = (newPkgs)=>{ if(local.progreso) setLocal({...local, progreso:newPkgs}); else setLocal({...local, predefinedPackages:newPkgs}); };
  
  const autoSyncTotals = (pkgs) => {
    const counts = {};
    pkgs.forEach(p => { const key = p.piezaNombre || 'default'; counts[key] = (counts[key] || 0) + 1; });
    return pkgs.map(p => ({ ...p, paquetesDePieza: counts[p.piezaNombre || 'default'] }));
  };

  const updatePkg = (i, field, val) => {
    let n = [...packages];
    n[i] = { ...n[i], [field]: val };
    if (field === 'piezaNombre') n = autoSyncTotals(n);
    setPackages(n);
  };
  
  const removePkg = (i) => {
    const n = packages.filter((_, idx) => idx !== i);
    setPackages(autoSyncTotals(n));
  };
  
  const addPkg = () => {
    const base = getBaseCodigo(packages[packages.length-1]||{}) || `${local.partida}_1_1`;
    const pNombre = local.subPiecesData[0]?.pieza || '';
    const existing = packages.filter(p => p.piezaNombre === pNombre).length;
    const n = [...packages, {
      id: Date.now() + Math.random(),
      piezaNombre: pNombre,
      cantidad: 0,
      paqueteNum: existing + 1,
      paquetesDePieza: existing + 1,
      baseCodigo: base,
      codigoUnico: buildCodigoUnico(base, local.color),
      finished: false
    }];
    setPackages(autoSyncTotals(n));
  };

  const handleSave = () => { onSave({...local, imagenSeleccionada:selectedImage}); };

  return (
    <div className="fixed inset-0 bg-slate-950 text-slate-100 z-[90] flex flex-col">
      <div className="bg-indigo-600 text-white p-4 flex justify-between items-center shrink-0 shadow"><div><h2 className="font-bold text-lg flex items-center gap-2"><Icon name="edit-3"/> Máquina {local.maquina}</h2><div className="text-xs text-indigo-200">{local.cliente} · {local.partida}</div></div><button onClick={onCancel}><Icon name="x"/></button></div>
      <div className="p-4 overflow-y-auto flex-grow space-y-5 pb-4">
        
        <div className="bg-slate-900 border border-slate-800 rounded-xl p-3 grid grid-cols-2 sm:grid-cols-3 gap-3 card-shadow">
          <div className="col-span-2 sm:col-span-3"><label className="text-[11px] font-bold text-slate-400">Cliente</label><input value={local.cliente} onChange={e=>setLocal({...local,cliente:e.target.value.toUpperCase()})} className="w-full p-2.5 border border-slate-700 bg-slate-950 text-white rounded-lg font-bold uppercase"/></div>
          
          <div>
              <label className="text-[11px] font-bold text-slate-400">Orden de Compra</label>
              <input value={local.ordenCompra || ''} onChange={e=>setLocal({...local, ordenCompra: e.target.value.toUpperCase()})} className="w-full p-2.5 border border-slate-700 bg-slate-950 text-white rounded-lg font-bold uppercase placeholder-slate-600" placeholder="Opcional"/>
          </div>
          <div className="col-span-2 sm:col-span-1">
              <label className="text-[11px] font-bold text-slate-400">Modelo Cliente</label>
              <input value={local.nombreModeloCliente || ''} onChange={e=>setLocal({...local, nombreModeloCliente: e.target.value.toUpperCase()})} className="w-full p-2.5 border border-slate-700 bg-slate-950 text-white rounded-lg font-bold uppercase placeholder-slate-600" placeholder="Opcional"/>
          </div>

          <div>
              <label className="text-[11px] font-bold text-slate-400">Máquina</label>
              <input value={local.maquina} onChange={e=>setLocal({...local,maquina:e.target.value})} className="w-full p-2.5 border border-slate-700 bg-slate-950 text-white rounded-lg font-black text-xl"/>
          </div>
          <div className="col-span-2 sm:col-span-1"><label className="text-[11px] font-bold text-purple-400">Color</label><input value={local.color||''} onChange={e=>{ setLocal({...local,color:e.target.value.toUpperCase()}); if(isExisting) setShowColorHint(true); }} className="w-full p-2.5 border border-purple-800 rounded-lg font-bold uppercase bg-purple-950/40 text-white"/></div>
          
          {local.color && (<div className="col-span-2 sm:col-span-3 text-xs bg-purple-950/60 border border-purple-800 text-purple-300 rounded-lg p-2"><span>Código de color: <b>{getColorCode(local.color)}</b></span></div>)}
          {isExisting && showColorHint && (<div className="col-span-2 sm:col-span-3 bg-yellow-950/60 border border-yellow-700 rounded-lg p-2 flex justify-between items-center gap-2"><span className="text-xs text-yellow-300">Cambiaste el color. Actualiza los códigos de los paquetes.</span><button onClick={regenerarColorCodes} className="bg-yellow-600 text-white text-xs font-bold px-2 py-1.5 rounded shrink-0">Actualizar</button></div>)}
        </div>
        
        <div><h3 className="font-bold text-sm text-slate-300 mb-2">Imagen del modelo</h3><div className="h-40 bg-slate-900 rounded-lg border border-slate-800 overflow-hidden"><SmartImage codigo={local.codigo} className="h-full w-full object-contain" selectedVariant={selectedImage} onSelectVariant={(v)=>setSelectedImage(v)}/></div></div>
        <div><h3 className="font-bold text-sm text-slate-300 mb-2 flex items-center gap-2"><Icon name="spool" size={16}/> Enhebrado</h3>{(local.threading||[]).map((h,i)=>(<div key={i} className="bg-slate-900 border border-slate-800 rounded-xl p-3 mb-2 flex gap-2 items-start card-shadow"><div className="w-9 shrink-0"><label className="text-[10px] font-bold text-slate-500">Guía</label><input value={h.guia} onChange={e=>updateThread(i,'guia',e.target.value)} className="w-full text-center border border-slate-700 bg-slate-950 text-white rounded p-2"/></div><div className="flex-grow"><label className="text-[10px] font-bold text-slate-500">Material</label><MaterialInput value={h.material} inventory={inventory} onChangeText={val=>updateThread(i,'material',val)} onSelect={item=>selectMat(i,item)}/></div><div className="w-14 shrink-0"><label className="text-[10px] font-bold text-slate-500">%</label><input inputMode="decimal" value={h.porcentaje} onChange={e=>updateThread(i,'porcentaje',e.target.value)} className="w-full text-center border border-slate-700 bg-slate-950 text-white rounded p-2"/></div><button onClick={()=>removeThread(i)} className="mt-4 text-red-400"><Icon name="x" size={16}/></button></div>))}<button onClick={addThread} className="w-full py-2 bg-indigo-950 border border-indigo-800 text-indigo-300 rounded-lg font-bold text-xs">+ Hilo</button></div>
        
        <div>
          <h3 className="font-bold text-sm text-slate-300 mb-2">Piezas</h3>
          {local.subPiecesData.map((p,idx)=>(
            <div key={idx} className="bg-slate-900 border border-slate-800 rounded-xl p-3 mb-2 card-shadow">
              <div className="font-bold text-indigo-400 mb-2 text-sm">{p.pieza}</div>
              <div className="grid grid-cols-12 gap-1.5 items-end">
                <div className="col-span-2"><label className="text-[9px] font-bold text-slate-500">Talla</label><input value={p.talla} onChange={e=>updatePiece(idx,'talla',e.target.value)} className="w-full border border-slate-700 bg-slate-950 text-white p-1.5 rounded text-xs font-bold"/></div>
                <div className="col-span-3">
                    <label className="text-[9px] font-bold text-slate-500">Programa</label>
                    <input value={p.codigoPrograma||''} onChange={e=>updatePiece(idx,'codigoPrograma',e.target.value.toUpperCase())} className="w-full border border-slate-700 bg-slate-950 text-white p-1.5 rounded text-[10px] font-bold uppercase" placeholder="OPCIONAL"/>
                </div>
                <div className="col-span-2"><label className="text-[9px] font-bold text-slate-500">Peso(g)</label><input inputMode="decimal" value={p.peso} onChange={e=>updatePiece(idx,'peso',e.target.value)} className="w-full border border-slate-700 bg-slate-950 text-white p-1.5 rounded text-xs"/></div>
                <div className="col-span-3"><label className="text-[9px] font-bold text-slate-500 block mb-1">Tiempo</label><TimeInput value={p.tiempo} onChange={val=>updatePiece(idx,'tiempo',val)}/></div>
                <div className="col-span-2"><label className="text-[9px] font-bold text-slate-500">Cant.</label><input value={p.totalPedido} disabled className="w-full border border-slate-800 p-1.5 rounded text-xs bg-slate-950 text-slate-400 text-center"/></div>
              </div>
            </div>
          ))}
        </div>

        {isExisting && (<div><h3 className="font-bold text-sm text-slate-300 mb-2 flex items-center gap-2"><Icon name="package" size={16}/> Paquetes</h3>{packages.map((pk,i)=>(<div key={pk.id||i} className="bg-slate-900 border border-slate-800 rounded-xl p-3 mb-2 card-shadow"><div className="flex justify-between items-start mb-2"><span className="font-mono text-[11px] text-slate-400">{pk.codigoUnico}</span><div className="flex items-center gap-2"><label className="flex items-center gap-1 text-[11px] font-bold"><input type="checkbox" checked={!!pk.finished} onChange={e=>updatePkg(i,'finished',e.target.checked)}/> Terminado</label><button onClick={()=>removePkg(i)} className="text-red-400"><Icon name="trash-2" size={15}/></button></div></div><div className="grid grid-cols-3 gap-2"><div className="col-span-3"><label className="text-[10px] font-bold text-slate-500">Pieza</label><select value={pk.piezaNombre} onChange={e=>updatePkg(i,'piezaNombre',e.target.value)} className="w-full border border-slate-700 bg-slate-950 text-white p-2 rounded text-xs font-bold">{local.subPiecesData.map((p,pi)=><option key={pi} value={p.pieza}>{p.pieza}</option>)}</select></div><div><label className="text-[10px] font-bold text-slate-500">Cant.</label><input inputMode="numeric" value={pk.cantidad} onChange={e=>updatePkg(i,'cantidad',Number(e.target.value))} className="w-full border border-slate-700 bg-slate-950 text-white p-2 rounded text-xs text-center font-bold"/></div><div><label className="text-[10px] font-bold text-slate-500">Paq #</label><input inputMode="numeric" value={pk.paqueteNum} onChange={e=>updatePkg(i,'paqueteNum',Number(e.target.value))} className="w-full border border-slate-700 bg-slate-950 text-white p-2 rounded text-xs text-center"/></div><div><label className="text-[10px] font-bold text-slate-500">De</label><input inputMode="numeric" value={pk.paquetesDePieza} onChange={e=>updatePkg(i,'paquetesDePieza',Number(e.target.value))} className="w-full border border-slate-700 bg-slate-950 text-white p-2 rounded text-xs text-center"/></div></div></div>))}<button onClick={addPkg} className="w-full py-2 bg-blue-950 border border-blue-800 text-blue-300 rounded-lg font-bold text-xs">+ Agregar paquete</button></div>)}
      </div>
      <div className="p-4 bg-slate-900 border-t border-slate-800 shrink-0 flex gap-3 safe-bottom"><button onClick={onCancel} className="flex-1 py-3 rounded-lg text-slate-300 font-bold bg-slate-800">Cancelar</button><button onClick={handleSave} className="flex-1 py-3 rounded-lg bg-green-600 text-white font-bold flex items-center justify-center gap-2"><Icon name="check-circle" size={18}/> Guardar</button></div>
    </div>
  );
};

const PrintOrder = ({ order, onBack }) => {
  const minutosPorPrenda = order.subPiecesData.reduce((acc, curr) => acc + (Number(curr.tiempo) || 0), 0);
  const piezasPorHora = minutosPorPrenda > 0 ? (60 / minutosPorPrenda).toFixed(0) : 0;
  const piezasPorTurno = minutosPorPrenda > 0 ? ((60 / minutosPorPrenda) * 12).toFixed(0) : 0;
  const [selectedImage, setSelectedImage] = useState(order.imagenSeleccionada || null);

  const packages = order.progreso || [];
  const chunkSize = 20; 
  const chunks = [];
  for (let i = 0; i < packages.length; i += chunkSize) {
    chunks.push(packages.slice(i, i + chunkSize));
  }

  return (
    <div className="fixed inset-0 bg-white text-black z-[100] flex flex-col overflow-y-auto">
      <div className="p-4 flex justify-between items-center bg-slate-900 text-white shrink-0 no-print">
        <h2 className="font-bold">Vista previa de impresión</h2>
        <div className="flex gap-2">
          <button onClick={() => window.print()} className="bg-green-600 px-4 py-2 rounded font-bold"><Icon name="printer" className="inline mr-1"/> Imprimir</button>
          <button onClick={onBack} className="bg-slate-600 px-4 py-2 rounded font-bold">Volver</button>
        </div>
      </div>

      <div className="print-container p-4">
        {chunks.map((chunk, chunkIndex) => (
          <div key={chunkIndex} className={chunkIndex < chunks.length - 1 ? 'page-break' : ''}>
            {chunkIndex === 0 ? (
              <React.Fragment>
                <div className="flex justify-between items-start mb-2 border-b-4 border-black pb-2">
                  <div className="w-8/12">
                    <h1 className="font-black uppercase tracking-tighter text-4xl mb-1 leading-none">{order.cliente}</h1>
                    <div className="text-3xl font-black uppercase text-slate-800 leading-tight flex items-center gap-2">
                      MOD: {order.codigo}
                      {order.nombreModeloCliente && <span className="text-xl text-gray-500">({order.nombreModeloCliente})</span>}
                    </div>
                    {order.ordenCompra && <div className="text-xl font-bold uppercase text-blue-800 mt-0.5 tracking-tight">OC: {order.ordenCompra}</div>}
                    {order.color && <div className="text-2xl font-black uppercase text-rose-700 leading-tight mt-0.5">COLOR: {order.color}</div>}
                  </div>
                  <div className="w-4/12 text-right flex flex-col items-end justify-start">
                    <div className="text-sm font-bold bg-black text-white px-2 inline-block mb-1">MÁQUINA</div>
                    <div className="machine-number-val font-black">{order.maquina}</div>
                    <div className="text-xl font-black uppercase mt-1 tracking-tight">PARTIDA: {order.partida}</div>
                  </div>
                </div>
                <div className="flex gap-2 mb-2">
                  <div className="w-7/12 flex flex-col gap-2">
                    <table className="mb-0">
                      <thead>
                        <tr><th className="text-left">PIEZA</th><th className="w-16">TALLA</th><th className="w-16">TOTAL</th></tr>
                      </thead>
                      <tbody>
                        {order.subPiecesData.map((p,i)=>(
                          <tr key={i}>
                            <td className="truncate">{p.pieza}{p.codigoPrograma ? ` / ${p.codigoPrograma}` : ''}</td>
                            <td className="text-center">{p.talla}</td>
                            <td className="text-center font-black">{p.totalPedido}</td>
                          </tr>
                        ))}
                      </tbody>
                    </table>
                    <table className="mb-0">
                      <thead>
                        <tr><th colSpan="2" className="bg-black text-white py-1 text-sm">ENHEBRADO</th></tr>
                        <tr><th className="text-left">Material</th><th className="w-16">%</th></tr>
                      </thead>
                      <tbody>
                        {order.threading && order.threading.map((row, i)=>(
                          <tr key={i}>
                            <td className="truncate font-bold text-sm">{row.material}</td>
                            <td className="text-center font-bold">{row.porcentaje}</td>
                          </tr>
                        ))}
                      </tbody>
                    </table>
                    <div className="flex gap-2 mt-1">
                      <div className="w-1/2 border-2 border-black p-2 text-center">
                        <div className="text-sm font-bold uppercase border-b-2 border-black mb-1">PZS/HR</div>
                        <div className="text-3xl font-black">{piezasPorHora}</div>
                      </div>
                      <div className="w-1/2 border-2 border-black p-2 text-center">
                        <div className="text-sm font-bold uppercase border-b-2 border-black mb-1">PZS/12H</div>
                        <div className="text-3xl font-black">{piezasPorTurno}</div>
                      </div>
                    </div>
                  </div>
                  <div className="w-5/12 border-2 border-black flex items-center justify-center p-2 bg-slate-50 h-full">
                    <SmartImage codigo={order.codigo} className="max-h-52 w-full object-contain" selectedVariant={selectedImage} hideOptionsButton={true} />

              </React.Fragment>
            ) : (
              <div className="flex justify-between items-end mb-4 border-b-4 border-black pb-2">

                  <div className="text-xl font-black uppercase">{order.cliente} · PARTIDA: {order.partida} · MOD: {order.codigo}</div>

const getOrderPackages = (order) => order.progreso || order.paquetes || order.lotes || [];
const orderMatchesStage = (order, stage) => {
    if (stage === 'todas') return true;
    const packages = getOrderPackages(order);
    if (packages.length === 0) return false;
    return packages.some(pkg => {
        const qc = String(pkg.estadoQC || '').toLowerCase();
        if (stage === 'tejido') return !qc || qc === 'pendiente' || qc === 'tejido' || qc === 'revisado_tejido' && !pkg.etapaActual;
        if (stage === 'post-tejido') return qc === 'revisado_tejido' || String(pkg.fase || '').toLowerCase() === 'post-tejido';
        if (stage === 'post-teñido') return qc === 'revisado_tenido' || String(pkg.fase || '').toLowerCase() === 'post-teñido';
        if (stage === 'confeccion') return qc === 'confeccion' || pkg.confeccionRegistrado === true || order.confeccionRegistrado === true;
        return true;
    });
};

	            if (updated) transaction.update(orderRef, { [packageField]: packages, ultimoTejidoConfirmadoPor: 'MELI', ultimoTejidoConfirmadoAt: FieldValue.serverTimestamp(), updatedAt: FieldValue.serverTimestamp() });
	        });
	        return updated;
	    };
	    const saveMeliConfirmation = async item => {
	        if (!item || meliSaving || meliPackageConfirmations[item.code]) return;
	        setMeliSaving(true);
	        try {
	            await markMeliTejidoInOrder(item);
	            const confirmationId = String(item.code).replaceAll('/', '_');
		            await db.collection('graph_meli_confirmations').doc(confirmationId).set({
		                packageCode: item.code,
		                orderId: item.order.id || null,
		                packageId: item.pkg.id || null,
		                model: String(item.order.codigo || item.order.modelo || '').trim(),
		                partida: String(item.order.partida || '').trim(),
		                talla: String(item.piece.talla || item.pkg.talla || 'S/T'),
		                areaAtConfirmation: selectedArea,
		                confirmedBy: 'MELI',
		                confirmationType: 'doble_confirmacion_grafica',
		                confirmedAt: FieldValue.serverTimestamp()
		            }, { merge: true });
		        } catch (error) {
		            console.error('No se pudo guardar la confirmación de MELI:', error);
		            alert('No se pudo guardar la confirmación. Revisa la conexión e inténtalo de nuevo.');
		        } finally {
	            setMeliSaving(false);
	        }
	    };
	    const saveMeliProcessConfirmation = async (item, process) => {
	        const confirmationKey = meliProcessKeyFor(item, process);
	        if (!item || !process || meliSaving || meliProcessConfirmations[confirmationKey]) return;
	        setMeliSaving(true);
	        try {
	            const safePackage = String(item.code).replace(/[^a-zA-Z0-9_-]/g, '_');
	            const safeProcess = String(process.id).replace(/[^a-zA-Z0-9_-]/g, '_');
	            await db.collection('graph_meli_confirmations').doc(`process_${safePackage}_${safeProcess}`).set({
	                packageCode: item.code,
	                orderId: item.order.id || null,
	                packageId: item.pkg.id || null,
	                model: String(item.order.codigo || item.order.modelo || '').trim(),
	                partida: String(item.order.partida || '').trim(),
	                talla: String(item.piece.talla || item.pkg.talla || 'S/T'),
	                areaAtConfirmation: 'confeccion',
	                confirmationTarget: 'process',
	                processId: String(process.id),
	                processName: process.nombre,
	                confirmedBy: 'MELI',
	                confirmationType: 'doble_confirmacion_proceso_confeccion',
	                confirmedAt: FieldValue.serverTimestamp()

	            setMeliSelectedProcessKey(null);
	        } catch (error) {

	            alert('No se pudo guardar la confirmación del proceso. Revisa la conexión e inténtalo de nuevo.');
	        } finally {
	            setMeliSaving(false);
	        }
	    };
		    const openPackage = item => {
		        setExpandedPkg(item.code);
		        setExpandedTraceProcess(null);
		        setObserverModalCode(item.code);

	    const closeMeliPicker = () => {

	        setExpandedTraceProcess(null);
	        setMeliSelectedProcessKey(null);
